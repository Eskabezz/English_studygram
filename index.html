"note":"Короткие — односложные (cheap, big) и двусложные на -y (easy, busy). Длинные — остальные двусложные и больше: modern, useful, expensive. Некоторые двусложные допускают оба варианта: quieter / more quiet, simpler / more simple."},{"type":"table","title":"Правила написания","head":["Прилагательное","Что делаем","Пример"],"rows":[["почти любое короткое","+ er / + est","cheap → [[cheaper]] → [[the cheapest]]"],["на -e","+ r / + st","large → [[larger]] → [[the largest]]"],["одна гласная + одна согласная","согласная удваивается","big → [[bigger]] → [[the biggest]], hot → [[hotter]]"],["согласная + y","y → ier / iest","easy → [[easier]] → [[the easiest]]"],["два слога и больше (не на -y)","more / most","modern → [[more modern]] → [[the most modern]]"],["наречие на -ly","more / most","carefully → [[more carefully]]"]]},{"type":"table","title":"Неправильные формы","head":["Слово","Сравнительная","Превосходная"],"rows":[["good / well","[[better]]","[[the best]]"],["bad / badly","[[worse]]","[[the worst]]"],["far","[[further]] / [[farther]]","[[the furthest]] / [[the farthest]]"],["much / many","[[more]]","[[the most]]"],["little","[[less]]","[[the least]]"]],"note":"О расстоянии годятся обе формы: further и farther. Но только further значит «дальнейший, дополнительный»: [[further]] information — дополнительные сведения."},{"type":"points","title":"Как сравнивать","items":[{"label":"than — «чем»","text":"После than в речи — me / him / her; официальнее — than I am.","en":"My brother is [[older]] {{than}} me.","ru":"Мой брат старше меня.","examples":[{"en":"The new bridge is [[longer]] {{than}} the old one.","ru":"Новый мост длиннее старого."}]},{"label":"the + превосходная + in / of","text":"in — с местом и группой (in the city, in our group), of — с периодом и «из всех» (of the year, of all).","en":"Ivan is [[the best]] student in our group.","ru":"Иван — лучший студент в нашей группе.","examples":[{"en":"It was [[the hottest]] day of the summer.","ru":"Это был самый жаркий день лета."}]},{"label":"as … as — такой же, как","en":"The new model is [[as reliable as]] the old one.","ru":"Новая модель такая же надёжная, как старая.","examples":[{"en":"He works [[as hard as]] his father.","ru":"Он работает так же много, как его отец."}]},{"label":"not as / not so … as — не такой, как","en":"The exam was [[not as difficult as]] I expected.","ru":"Экзамен оказался не таким трудным, как я ожидал."},{"label":"the …, the … — чем …, тем …","en":"[[The more]] you practise, [[the better]] you speak.","ru":"Чем больше практикуешься, тем лучше говоришь.","examples":[{"en":"[[The sooner]], [[the better]].","ru":"Чем скорее, тем лучше."}]},{"label":"-er and -er — всё …","text":"Показывает, что что-то постоянно растёт или меняется.","en":"Prices are getting [[higher and higher]].","ru":"Цены становятся всё выше и выше.","examples":[{"en":"The texts are becoming [[more and more difficult]].","ru":"Тексты становятся всё сложнее."}]}]},{"type":"markers","title":"Насколько больше: усилители","groups":[{"label":"Намного","chips":["much|намного","far|гораздо","a lot|намного (разг.)"]},{"label":"Немного","chips":["a bit|чуть-чуть (разг.)","a little|немного","slightly|слегка"]},{"label":"Ещё","chips":["even|ещё (лучше, больше)"]}],
"note":"Со сравнительной степенью very не ставим: ~~very cheaper~~ → {{much}} [[cheaper]].","en":"The new road is {{much}} [[shorter]].","ru":"Новая дорога намного короче."},{"type":"note","kind":"tip","title":"Наречия тоже сравниваются","text":"Наречия на -ly — через more / most. Короткие fast, hard, early, late — через -er: [[faster]], [[harder]], [[earlier]].","en":"Could you speak [[more slowly]], please?","ru":"Не могли бы вы говорить помедленнее?"},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"My flat is ~~more bigger~~ than yours.","right":"My flat is [[bigger]] than yours.","why":"Либо -er, либо more — вместе никогда."},{"wrong":"He is ~~very older~~ than me.","right":"He is {{much}} [[older]] than me.","why":"Со сравнительной степенью — much / far / a bit, а не very."},{"wrong":"She is taller ~~then~~ me.","right":"She is [[taller]] {{than}} me.","why":"«Чем» — than; then — «потом, тогда»."},{"wrong":"It's the tallest building ~~of~~ the city.","right":"It's [[the tallest]] building {{in}} the city.","why":"С местом и группой — in: in the city, in our group."},{"wrong":"It was the ~~worse~~ day of my life.","right":"It was [[the worst]] day of my life.","why":"worse — «хуже», the worst — «самый плохой»."}]},{"type":"quiz","items":[{"q":"This suitcase is ___ (heavy) than mine.","a":"heavier","why":"Согласная + y → ier."},{"q":"Moscow is ___ (big) city in Russia.","a":"the biggest","why":"Превосходная: the + -est; g удваивается."},{"q":"Our new office is ___ (modern) than the old one.","a":"more modern","why":"Двусложное прилагательное (не на -y) — через more."},{"q":"Anna is ___ (good) student in our group.","a":"the best","why":"good → better → the best."},{"q":"The bus is ___ the metro.","options":["not as fast as","not as fast than","not so faster as"],"a":"not as fast as","why":"not as + прилагательное + as."},{"q":"The traffic is getting ___.","options":["worse and worse","more and more bad","the worse"],"a":"worse and worse","why":"Нарастание: сравнительная + and + сравнительная; bad → worse."},{"q":"___ you practise, ___ you speak. (much / good)","a":["The more","the better"],"why":"Чем…, тем…: the + сравнительная, the + сравнительная."},{"q":"He is ___ older than his sister.","options":["very","much","more"],"a":"much","why":"Перед сравнительной степенью — much, а не very."}]},{"type":"summary","points":["Короткие: [[cheaper]], [[the cheapest]]; длинные: [[more modern]], [[the most modern]].","good → [[better]] → [[the best]]; bad → [[worse]] → [[the worst]]; far → [[further]].","than = чем; [[as … as]] = такой же, как; [[not as … as]] = не такой, как.","Усиливаем much / far / a bit, но не very: {{much}} [[cheaper]].","[[The more]]…, [[the better]]… = чем больше…, тем лучше…"]}]},{"id":"too-enough-so-such","title":"Too, Enough, So, Such","subtitle":"Слишком, достаточно, так, такой","level":"A2–B1","tagline":"Как сказать, что чего-то слишком много, не хватает или «так много, что…».","blocks":[{"type":"formula","title":"Too и enough: как строится","rows":[{"sign":"слишком","formula":"[[too]] + adj / adv","en":"This bag is [[too]] heavy.","ru":"Эта сумка слишком тяжёлая."},{"sign":"достаточно","formula":"adj / adv + [[enough]]","en":"The room is big [[enough]].","ru":"Комната достаточно большая."},{"sign":"недостаточно","formula":"not + adj + [[enough]]","en":"It's [[not]] warm [[enough]] to swim.","ru":"Недостаточно тепло, чтобы купаться."},{"sign":"хватает","formula":"[[enough]] + noun","en":"We have [[enough]] time.","ru":"У нас достаточно времени."},{"sign":"слишком много","formula":"[[too much / too many]] + noun","en":"There are [[too many]] cars in the city centre.","ru":"В центре города слишком много машин."}],
"note":"Запомни порядок: enough стоит ПОСЛЕ прилагательного (big [[enough]]), но ПЕРЕД существительным ([[enough]] money).","noteKind":"warn"},{"type":"compare","title":"Too или very?","left":{"title":"too","sub":"слишком — больше, чем нужно","points":["Есть проблема: из-за этого что-то нельзя сделать.","Усилить: much too / far too — «уж слишком»."],"examples":[{"en":"This flat is [[too]] expensive. We can't buy it.","ru":"Эта квартира слишком дорогая. Мы не можем её купить."}]},"right":{"title":"very","sub":"очень — просто много","points":["Никакой проблемы, просто сильная степень."],"examples":[{"en":"This flat is [[very]] expensive, but we can buy it.","ru":"Эта квартира очень дорогая, но мы можем её купить."}]},"note":"Если проблемы нет, too не ставим: «Суп очень вкусный» — The soup is [[very]] tasty, а не ~~too tasty~~."},{"type":"points","title":"Для кого и для чего: for и to V","items":[{"label":"too + adj + to V — слишком …, чтобы","en":"This text is [[too]] difficult [[to translate]] without a dictionary.","ru":"Этот текст слишком сложный, чтобы переводить его без словаря."},{"label":"adj + enough + to V — достаточно …, чтобы","en":"He is old [[enough to drive]].","ru":"Он достаточно взрослый, чтобы водить машину."},{"label":"for + кто — если действует кто-то конкретный","text":"Кто выполняет действие, показываем через for me / him / them.","en":"The box was [[too]] heavy [[for me to lift]].","ru":"Ящик был слишком тяжёлым, чтобы я мог его поднять.","examples":[{"en":"Is the room big [[enough for]] ten people?","ru":"Комната достаточно большая для десяти человек?"}]}]},{"type":"table","title":"Слишком много или недостаточно: сводка","head":["С чем","Слишком много","Мало / недостаточно"],"rows":[["исчисляемые: cars, people","[[too many]] cars","[[too few]] cars / [[not enough]] cars"],["неисчисляемые: time, money","[[too much]] time","[[too little]] time / [[not enough]] time"],["прилагательное","[[too]] big","[[not]] big [[enough]] / [[too]] small"],["глагол","sleep [[too much]]","[[don't]] sleep [[enough]]"]],"note":"В разговоре not enough звучит естественнее, чем too few / too little."},{"type":"compare","title":"So или such?","left":{"title":"so","sub":"перед прилагательным или наречием","points":["so + adj: so cold, so good","so + adv: so fast","so much / so many + существительное"],"examples":[{"en":"The film was [[so]] good!","ru":"Фильм был такой хороший!"},{"en":"She speaks [[so]] fast!","ru":"Она так быстро говорит!"}]},"right":{"title":"such","sub":"перед существительным","points":["such a / an + (adj) + noun в ед. ч.","such + (adj) + noun во мн. ч. или неисчисляемое","such a lot of = so much / so many"],"examples":[{"en":"It was [[such a]] good film!","ru":"Это был такой хороший фильм!"},{"en":"They are [[such]] nice people.","ru":"Они такие приятные люди."}]},"note":"Проверка: в конце есть существительное — such, нет — so. Артикль идёт ПОСЛЕ such: [[such a]] long day, а не ~~a such long day~~.","noteKind":"warn"},{"type":"formula","title":"So … that, such … that — «так …, что»","rows":[{"sign":"so","formula":"[[so]] + adj / adv + [[that]] + S + V","en":"It was [[so]] cold [[that]] we stopped work.","ru":"Было так холодно, что мы прекратили работу."},{"sign":"such","formula":"[[such a]] + adj + noun + [[that]] + S + V","en":"It was [[such a]] cold day [[that]] we stopped work.","ru":"День был такой холодный, что мы прекратили работу."},{"sign":"много","formula":"[[so many / so much]] + noun + [[that]] + S + V","en":"There were [[so many]] people [[that]] we couldn't get in.","ru":"Было столько народу, что мы не смогли войти."}],
"note":"В разговоре that часто опускают: It was so cold we stopped work."},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"This flat is ~~too much expensive~~.","right":"This flat is [[too]] expensive.","why":"Перед прилагательным — просто too; too much — с неисчисляемым существительным или после глагола."},{"wrong":"We don't have ~~money enough~~.","right":"We don't have [[enough]] money.","why":"С существительным enough стоит ПЕРЕД ним."},{"wrong":"He isn't ~~enough old~~ to drive.","right":"He isn't old [[enough]] to drive.","why":"С прилагательным enough стоит ПОСЛЕ него."},{"wrong":"It was ~~so interesting lecture~~.","right":"It was [[such an]] interesting lecture.","why":"Перед существительным — such a / an, а не so."},{"wrong":"The tea is too hot to drink ~~it~~.","right":"The tea is [[too]] hot [[to drink]].","why":"Чай и есть то, что пьём, — it в конце лишнее."}]},{"type":"quiz","items":[{"q":"This box is ___ heavy for me to lift.","options":["too","very","so"],"a":"too","why":"too … for me to V — слишком тяжёлый, чтобы я мог поднять."},{"q":"Is your English good ___ to read this article?","a":"enough","why":"enough — после прилагательного."},{"q":"There isn't ___ in the car for all of us. (enough / space)","a":"enough space","why":"enough — перед существительным."},{"q":"It was ___ nice weather that we went to the beach.","options":["so","such","such a"],"a":"such","why":"weather — неисчисляемое: such без a."},{"q":"The lecture was ___ boring that I fell asleep.","a":"so","why":"Дальше прилагательное без существительного — so."},{"q":"There were ___ (слишком много) mistakes in the report.","a":"too many","why":"mistakes — исчисляемое во мн. ч.: too many."},{"q":"She is ___ good engineer that everyone asks her for advice.","options":["so","such","such a"],"a":"such a","why":"Исчисляемое в ед. ч.: such a + adj + noun."},{"q":"The text was too difficult ___ me to understand.","a":"for","why":"Кто делает — через for: too … for me to V."}]},{"type":"summary","points":["[[too]] + adj = слишком (есть проблема); [[very]] = просто очень.","adj + [[enough]] (big enough), но [[enough]] + noun (enough money).","[[too many]] + исчисляемые, [[too much]] + неисчисляемые.","[[so]] + adj / adv; [[such (a)]] + adj + noun.","too … [[for me to]] V; so / such … [[that]] = так / такой …, что."]}]}]},{"id":"clauses","roman":"XII","title":"Сложные предложения и функции слов","chapters":[{"id":"relative-clauses","title":"Relative Clauses","subtitle":"Определительные придаточные: who, which, that, whose, where","level":"B1","tagline":"Как сказать «человек, который…», «город, где…» и «то, что…».","formula":"noun + [[who / which / that]] + …","blocks":[{"type":"table","title":"Какое слово выбрать","head":["Слово","Про что","Пример","Перевод"],"rows":[["who","люди","the man [[who]] called","человек, который звонил"],["which","предметы, животные","the map [[which]] I need","карта, которая мне нужна"],["that","люди и предметы (без запятых)","the car [[that]] broke down","машина, которая сломалась"],["whose","чей, у которого","the student [[whose]] bag was lost","студент, чью сумку потеряли"],["where","место","the town [[where]] I grew up","город, где я вырос"],["when","время","the day [[when]] we met","день, когда мы познакомились"]],"note":"В официальном стиле встречается whom — это who в роли дополнения: the person [[whom]] we interviewed. В речи вместо него — who, that или ничего."},{"type":"points","title":"Когда слово можно опустить","items":[{"label":"Сразу за ним глагол — опускать нельзя","text":"who / which / that здесь — подлежащее придаточного.","en":"The man [[who]] lives next door is a surveyor.","ru":"Мужчина, который живёт по соседству, — геодезист."},{"label":"За ним новое подлежащее — можно опустить","text":"who / which / that здесь — дополнение. В речи его обычно опускают.","en":"The book ([[that]]) I bought is very useful.","ru":"Книга, которую я купил, очень полезная.","examples":[{"en":"The measurements ([[which]]) we took were accurate.","ru":"Измерения, которые мы провели, оказались точными."}]},{"label":"Предлог — в конце","text":"В разговорной речи предлог уходит в конец, а who / which обычно опускают.","en":"The man I spoke [[to]] was very helpful.","ru":"Человек, с которым я говорил, очень мне помог.","examples":[{"en":"Is this the file you were looking [[for]]?","ru":"Это тот файл, который ты искал?"}]}],
"note":"В официальном и научном стиле предлог ставят перед which / whom: the method [[on which]] the calculation is based — метод, на котором основан расчёт. После предлога that нельзя."},{"type":"compare","title":"С запятыми или без?","left":{"title":"Определяющее","sub":"без запятых — какой именно?","points":["Без него непонятно, о ком или о чём речь.","Можно that.","Слово-дополнение можно опустить."],"examples":[{"en":"The students [[who]] finished the test can go home.","ru":"Студенты, которые закончили тест, могут идти домой."}]},"right":{"title":"Неопределяющее","sub":"с запятыми — дополнительная информация","points":["Предмет и так понятен; придаточное можно убрать.","that нельзя — только who / which.","Слово опускать нельзя."],"examples":[{"en":"My brother, [[who]] lives in Omsk, is an engineer.","ru":"Мой брат, который живёт в Омске, — инженер."},{"en":"The old bridge, [[which]] was built in 1965, needs repairs.","ru":"Старый мост, который построили в 1965 году, нуждается в ремонте."}]},"note":"Запятые меняют смысл. My sister [[who]] lives in Kazan is a teacher — сестёр несколько, речь о той, что в Казани. My sister, [[who]] lives in Kazan, is a teacher — сестра одна.","noteKind":"warn"},{"type":"points","title":"whose, where, when и «что» про всё предложение","items":[{"label":"whose — чей, у которого","text":"Обычно про людей; в книжном стиле и про предметы.","en":"This is the student [[whose]] project won the prize.","ru":"Это студент, чей проект получил премию.","examples":[{"en":"It's a building [[whose]] roof is made of glass.","ru":"Это здание, у которого стеклянная крыша."}]},{"label":"where — где (= in which)","en":"This is the village [[where]] my grandparents live.","ru":"Это деревня, где живут мои бабушка и дедушка."},{"label":"when — когда","text":"when можно опустить: the day we met.","en":"I remember the day [[when]] we started the project.","ru":"Я помню день, когда мы начали проект."},{"label":"which — про всё предложение","text":"Относится ко всей ситуации, а не к одному слову. Всегда после запятой; what и that здесь нельзя.","en":"He passed all his exams, [[which]] surprised everyone.","ru":"Он сдал все экзамены, что всех удивило."},{"label":"what — то, что","text":"Перед what нет существительного: what = the thing that.","en":"[[What]] I need is a good calculator.","ru":"То, что мне нужно, — это хороший калькулятор."}]},{"type":"note","kind":"tip","title":"«Который» без который","text":"В технических текстах придаточное часто сокращают до причастия: the bridge [[built]] in 1990 = the bridge which was built in 1990. Подробнее — в главе о причастиях.","en":"The method [[used]] in this study is simple.","ru":"Метод, используемый в этом исследовании, прост."},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"This is the house ~~which we bought it~~.","right":"This is the house [[which]] we bought.","why":"which уже заменило it — второй раз it не нужен."},{"wrong":"The man ~~which~~ lives next door is a builder.","right":"The man [[who]] lives next door is a builder.","why":"О людях — who (или that), а не which."},{"wrong":"My father, ~~that~~ works at a bank, is fifty.","right":"My father, [[who]] works at a bank, is fifty.","why":"С запятыми that нельзя — только who / which."},{"wrong":"He passed the exam, ~~what~~ surprised us.","right":"He passed the exam, [[which]] surprised us.","why":"«…, что нас удивило» — про всё предложение: which."},{"wrong":"~~That~~ you said is true.","right":"[[What]] you said is true.","why":"«То, что» без существительного — what."}]},{"type":"quiz","items":[{"q":"The engineer ___ designed this bridge is very famous.","options":["who","which","whose"],"a":"who","why":"Про человека — who."},{"q":"The map ___ (который) we used was very old.","a":"that","alt":["which"],"why":"Про предмет без запятых — that или which; здесь слово можно и опустить."},{"q":"My grandfather, ___ was a builder, built this house himself.","options":["who","that","which"],"a":"who","why":"С запятыми that нельзя; про человека — who."},{"q":"Is this the student ___ laptop was stolen?","a":"whose","why":"«Чей ноутбук» — whose."},{"q":"This is the village ___ my parents live.","a":"where","alt":["in which"],"why":"Место — where (= in which)."},{"q":"He passed all his exams, ___ surprised his teachers.","options":["what","which","that"],"a":"which","why":"Про всё предложение после запятой — which."},{"q":"___ I need now is a cup of coffee.","a":"What","why":"«То, что» — what."},{"q":"В каком предложении у говорящего одна сестра?","options":["My sister who lives in Kazan is a teacher.","My sister, who lives in Kazan, is a teacher."],"a":"My sister, who lives in Kazan, is a teacher.","why":"Запятые = дополнительная информация: и так ясно, о какой сестре речь."}]},{"type":"summary","points":["[[who]] — люди, [[which]] — предметы, [[that]] — и те и другие (только без запятых).","[[whose]] = чей, [[where]] = где, [[when]] = когда.","Без запятых — «какой именно»; с запятыми — доп. информация, that нельзя.","Слово-дополнение можно опустить: the book I bought; предлог — в конец: the man I spoke to.","Про всё предложение — [[which]]; «то, что» — [[what]]."]}]},{"id":"linking-words","title":"Linking Words","subtitle":"Связки: although, despite, however, because of, so that","level":"B1–B2","tagline":"Слова, которые связывают мысли: «хотя», «несмотря на», «из-за», «поэтому», «чтобы».","blocks":[{"type":"table","title":"Главное: что идёт после связки","head":["Смысл","+ предложение (S + V)","+ существительное / V-ing"],"rows":[["хотя / несмотря на","[[although]] it rained","[[despite]] the rain"],["потому что / из-за","[[because]] it rained","[[because of]] the rain"],["пока / во время","[[while]] we were working","[[during]] the work"]],"note":"Спроси себя: после связки есть глагол со своим подлежащим? Есть — although / because / while. Нет — despite / because of / during."},{"type":"compare","title":"Although или despite?","left":{"title":"although / though / even though","sub":"+ предложение","points":["although — «хотя», нейтрально.","though — то же, разговорнее; в конце фразы = «впрочем»: It was cold, though.","even though — «хотя и, даже несмотря на то что», сильнее."],"examples":[{"en":"[[Although]] the soil was wet, they continued digging.","ru":"Хотя грунт был мокрым, они продолжали копать."},{"en":"[[Even though]] I was tired, I finished the report.","ru":"Хотя я и устал, я закончил отчёт."}]},"right":{"title":"despite / in spite of","sub":"+ существительное или V-ing","points":["despite — без of.","in spite of — с of.","Перед предложением: despite the fact that + S + V."],"examples":[{"en":"[[Despite]] the rain, they continued digging.","ru":"Несмотря на дождь, они продолжали копать."},{"en":"[[In spite of]] being tired, I finished the report.","ru":"Несмотря на усталость, я закончил отчёт."}]},"note":"~~Despite of~~ не бывает: либо [[despite]], либо [[in spite of]].","noteKind":"warn"},{"type":"points","title":"Противопоставление: but, however, whereas","items":[{"label":"but — но","text":"Соединяет две части одного предложения.","en":"The plan is good, [[but]] it's too expensive.","ru":"План хороший, но слишком дорогой."},{"label":"however — однако","text":"Обычно начинает новое предложение; после него — запятая.","en":"The plan is good. [[However]], it's too expensive.","ru":"План хороший. Однако он слишком дорогой.","examples":[{"en":"The results were good. The costs, [[however]], were high.","ru":"Результаты были хорошими. Затраты, однако, оказались высокими."}]},{"label":"whereas / while — а, тогда как","text":"Сравниваем два разных факта.","en":"My brother likes maths, [[whereas]] I prefer languages.","ru":"Мой брат любит математику, а я больше люблю языки.","examples":[{"en":"Some students work in the lab, [[while]] others work on site.","ru":"Одни студенты работают в лаборатории, а другие — на объекте."}]}],
"note":"while бывает и «пока»: While I was working, … Какой смысл — подскажет контекст."},{"type":"points","title":"Причина и следствие","items":[{"label":"because — потому что + предложение","en":"We stopped [[because]] it was getting dark.","ru":"Мы остановились, потому что темнело."},{"label":"because of / due to — из-за + существительное","text":"due to — чаще в официальном и техническом стиле.","en":"The road is closed [[because of]] roadworks.","ru":"Дорога закрыта из-за ремонта.","examples":[{"en":"The delay was [[due to]] bad weather.","ru":"Задержка произошла из-за плохой погоды."}]},{"label":"so — поэтому, так что","text":"Внутри предложения, обычно после запятой.","en":"It was getting dark, [[so]] we stopped.","ru":"Темнело, поэтому мы остановились."},{"label":"therefore / as a result — следовательно, в результате","text":"Книжный стиль: обычно начинают новое предложение, после них — запятая.","en":"The soil is unstable. [[Therefore]], a deep foundation is needed.","ru":"Грунт неустойчив. Следовательно, нужен глубокий фундамент.","examples":[{"en":"Prices rose. [[As a result]], the project became more expensive.","ru":"Цены выросли. В результате проект подорожал."}]}],
"note":"В текстах вместо because часто стоят as и since = «так как»: [[Since]] the soil is wet, work has been stopped. Не путай с since = «с тех пор как»."},{"type":"formula","title":"Цель: «чтобы»","rows":[{"sign":"чтобы","formula":"[[to]] + V","en":"He went to the office [[to get]] the documents.","ru":"Он пошёл в офис за документами."},{"sign":"официально","formula":"[[in order to / so as to]] + V","en":"We use GPS [[in order to]] measure the area accurately.","ru":"Мы используем GPS, чтобы точно измерить площадь."},{"sign":"чтобы не","formula":"[[so as not to / in order not to]] + V","en":"Speak quietly [[so as not to]] wake the baby.","ru":"Говори тихо, чтобы не разбудить ребёнка."},{"sign":"другое S","formula":"[[so that]] + S + can / could / will / would + V","en":"I'll explain it again [[so that]] everyone can understand.","ru":"Я объясню ещё раз, чтобы все поняли."}],
"note":"«Чтобы» + глагол — это to, а не for: I came [[to study]], не ~~for study~~. С for идёт существительное: I came [[for]] the exam.","noteKind":"warn"},{"type":"markers","title":"Добавление: также, кроме того","groups":[{"label":"В середине или в конце","chips":["also|также","too|тоже","as well|тоже, также"]},{"label":"В начале предложения (книжн.)","chips":["moreover|более того","in addition|кроме того","furthermore|к тому же"]},{"label":"+ существительное / V-ing","chips":["in addition to|в дополнение к","as well as|а также, наряду с"]}],
"note":"also — перед смысловым глаголом, но после am / is / are; too и as well — в конце. Moreover и in addition начинают новое предложение и отделяются запятой.","en":"She [[also]] speaks German. = She speaks German [[too]].","ru":"Она также говорит по-немецки."},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"~~Despite of~~ the rain, we worked outside.","right":"[[Despite]] the rain, we worked outside.","why":"despite — без of (или in spite of)."},{"wrong":"~~Although~~ the bad weather, we started work.","right":"[[Despite]] the bad weather, we started work.","why":"После although нужно предложение (S + V); перед существительным — despite."},{"wrong":"We stayed at home ~~because~~ the rain.","right":"We stayed at home [[because of]] the rain.","why":"because + предложение; перед существительным — because of."},{"wrong":"I went to the library ~~for to find~~ this book.","right":"I went to the library [[to find]] this book.","why":"Цель — просто to + V."},{"wrong":"Although it was late, ~~but~~ we continued.","right":"[[Although]] it was late, we continued.","why":"«Хотя…, но…» — калька: although и but вместе не ставим."}]},{"type":"quiz","items":[{"q":"___ (несмотря на) the heavy rain, the builders continued working.","a":"Despite","alt":["In spite of"],"why":"Перед существительным — despite / in spite of."},{"q":"___ he was ill, he came to the lecture.","options":["Despite","Although","In spite of"],"a":"Although","why":"Дальше целое предложение (he was ill) — although."},{"q":"The flight was cancelled ___ (из-за) fog.","a":"because of","alt":["due to","owing to"],"why":"Перед существительным — because of / due to."},{"q":"The results were good. ___, the costs were too high.","options":["However","Although","Despite"],"a":"However","why":"Новое предложение, после связки запятая — however."},{"q":"I'm saving money ___ buy a car.","a":"to","alt":["in order to","so as to"],"why":"Цель — to + V."},{"q":"Write the number down ___ you don't forget it.","a":"so that","alt":["so"],"why":"Цель со своим подлежащим (you) — so that + S + V."},{"q":"It was very late, ___ we took a taxi.","options":["so","because","although"],"a":"so","why":"Следствие — so (поэтому)."},{"q":"My sister is good at maths, ___ I am good at languages.","options":["whereas","despite","so that"],"a":"whereas","why":"Сравниваем два факта — whereas (а, тогда как)."}]},{"type":"summary","points":["[[although]] / [[even though]] + S + V; [[despite]] / [[in spite of]] + noun / V-ing.","[[because]] + S + V; [[because of]] / [[due to]] + noun.","[[However]], … — новое предложение и запятая.","Цель: [[to]] / [[in order to]] + V; со своим подлежащим — [[so that]] + S + can / could.","Although и but в одном предложении не ставим."]}]},{"id":"it-one-that","title":"It, One, That","subtitle":"Многофункциональные слова: как распознать и перевести","level":"B1–B2","tagline":"У одного слова несколько ролей. Роль выдаёт то, что стоит рядом, — от неё зависит перевод.","blocks":[{"type":"uses","title":"IT: признак → роль → перевод","items":[{"label":"Личное местоимение: он, она, оно","text":"Признак: заменяет существительное из предыдущей фразы. Род берём по русскому слову.","en":"Look at this theodolite. [[It]] is very old.","ru":"Посмотри на этот теодолит. Он очень старый.","examples":[{"en":"Where is the map? — [[It]]'s on the table.","ru":"Где карта? — Она на столе."}]},{"label":"Указательное: это","text":"Признак: It is / was + существительное — указываем на предмет или ситуацию.","en":"What's this? — [[It]]'s a GPS receiver.","ru":"Что это? — Это GPS-приёмник."},{"label":"Формальное подлежащее: погода, время, расстояние","text":"Признак: It is + погода / время / расстояние. It не переводим — по-русски безличное предложение.","en":"[[It]] is raining.","ru":"Идёт дождь.","examples":[{"en":"[[It]] is ten o'clock.","ru":"Сейчас десять часов."},{"en":"[[It]] is five kilometres to the site.","ru":"До объекта пять километров."}]},{"label":"Вводное подлежащее: It is important to…","text":"Признак: It is + прилагательное / V3 + to V или that… Настоящее подлежащее — дальше. It не переводим.","en":"[[It]] is necessary to check all measurements twice.","ru":"Все измерения необходимо проверять дважды.","examples":[{"en":"[[It]] is known that steel expands when heated.","ru":"Известно, что сталь при нагревании расширяется."}]},{"label":"Усилительная конструкция: It is … that / who","text":"Признак: It is / was + выделенное слово + that / who + остальное. Переводим «именно»; it и that не переводим.","en":"[[It was]] Smith [[who]] designed this bridge.","ru":"Именно Смит спроектировал этот мост.","examples":[{"en":"[[It is]] this method [[that]] we use in our work.","ru":"Именно этот метод мы используем в работе."}]},{"label":"Формальное дополнение: make it possible to…","text":"Признак: make / find / consider + it + прилагательное + to V. It не переводим.","en":"GPS makes [[it]] possible to measure coordinates quickly.","ru":"GPS позволяет быстро определять координаты."}]},{"type":"compare","title":"It is … that: вводное или усилительное?","left":{"title":"Вводное it","sub":"It is + прилагательное + that / to V","points":["Убери It is и that — предложение развалится.","Перевод: «ясно, что…», «важно, чтобы…»."],"examples":[{"en":"[[It]] is clear [[that]] the project will be late.","ru":"Ясно, что проект задержится."}]},"right":{"title":"Усилительное it","sub":"It is + выделенное слово + that / who","points":["Убери It is и that — останется полное предложение.","Выделяют лицо, предмет, время, место или причину.","Перевод: «именно»."],"examples":[{"en":"[[It is]] the foundation [[that]] needs repair.","ru":"Именно фундамент нуждается в ремонте."}]},"note":"Если после It is стоит a / an + существительное (It is a method that is widely used), это обычно не усиление, а «Это метод, который широко используется»."},{"type":"uses","title":"ONE: признак → роль → перевод","items":[{"label":"Числительное: один","text":"Признак: one + существительное в ед. ч.; рядом часто числа или more.","en":"We need [[one]] more surveyor.","ru":"Нам нужен ещё один геодезист."},{"label":"One of … — один из","text":"Признак: one of + the / my / these + существительное во мн. ч. Сказуемое — в ед. ч.","en":"[[One of]] them is a land use planner.","ru":"Один из них — специалист по землеустройству.","examples":[{"en":"[[One of]] the oldest building materials is stone.","ru":"Один из древнейших строительных материалов — камень."}]},{"label":"Слово-заменитель: this one, new ones","text":"Признак: this / that / the / a + (прилагательное) + one(s). Заменяет уже названное существительное. Переводим повтором слова или опускаем.","en":"This map is old. We need a new [[one]].","ru":"Эта карта старая. Нам нужна новая.","examples":[{"en":"Cadastral maps are used for many purposes besides the original [[one]].","ru":"Кадастровые карты используют для многих целей, помимо первоначальной."},{"en":"I don't like the red chairs. I prefer the black [[ones]].","ru":"Мне не нравятся красные стулья. Мне больше нравятся чёрные."}]},{"label":"Неопределённо-личное подлежащее: One should…","text":"Признак: one стоит перед сказуемым, чаще с should / must / can. Значит «любой человек». Переводим безлично: «нужно», «следует», «можно».","en":"[[One]] should know all these rules.","ru":"Нужно знать все эти правила.","examples":[{"en":"[[One]] must be careful on a building site.","ru":"На стройке нужно быть осторожным."},{"en":"From the tower [[one]] can see the whole city.","ru":"С башни виден весь город."}]},{"label":"one's — свой","text":"Притяжательная форма: «свой» (у любого человека).","en":"[[One]] should keep [[one's]] word.","ru":"Нужно держать своё слово."}],
"note":"В обычной речи вместо one-подлежащего чаще говорят you: You should know the rules. Такое you тоже переводим безлично: «Нужно знать правила»."},{"type":"uses","title":"THAT: признак → роль → перевод","items":[{"label":"Указательное: тот, та, то (это)","text":"Признак: that + существительное в ед. ч. (мн. ч. — those) или that вместо существительного.","en":"[[That]] bridge was built in 1965.","ru":"Тот мост построили в 1965 году.","examples":[{"en":"[[That]]'s a good idea.","ru":"Это хорошая идея."}]},{"label":"Союз: что","text":"Признак: после глаголов say, know, think, show, find; за that — целое предложение (S + V). Часто опускается.","en":"The engineer said [[that]] the wall had cracks.","ru":"Инженер сказал, что в стене трещины.","examples":[{"en":"Tests show [[that]] the soil is stable.","ru":"Испытания показывают, что грунт устойчив."}]},{"label":"Союзное слово: который","text":"Признак: that стоит сразу после существительного, и его можно заменить на which / who. Подробнее — в главе об определительных придаточных.","en":"The method [[that]] we use is very accurate.","ru":"Метод, который мы используем, очень точный.","examples":[{"en":"This is the road [[that]] leads to the site.","ru":"Это дорога, которая ведёт к объекту."}]},{"label":"Заменитель существительного: that of, those of","text":"Признак: that of / those of, часто после than или as. Заменяет названное существительное (ед. ч. — that, мн. ч. — those). Переводим повтором слова.","en":"The length of this bridge is greater than [[that of]] the old one.","ru":"Длина этого моста больше длины старого.","examples":[{"en":"The properties of steel differ from [[those of]] concrete.","ru":"Свойства стали отличаются от свойств бетона."}]},{"label":"Часть усилительной конструкции","text":"Признак: It is / was + слово + that. Переводим «именно», that не переводим.","en":"[[It was]] in 1990 [[that]] the bridge was built.","ru":"Мост был построен именно в 1990 году."}],
"note":"Быстрая проверка: that можно заменить на which / who — это «который»; стоит после глагола и перед целым предложением — «что»."},{"type":"table","title":"Шпаргалка: смотри на соседей","head":["Что видишь","Роль","Как переводить"],"rows":[["[[It]] is + погода / время / расстояние","формальное подлежащее","не переводим"],["[[It]] is + прилаг. + to V / that","вводное подлежащее","не переводим: «важно…», «известно…»"],["[[It is]] + слово + [[that / who]]","усиление","«именно»"],["make / find + [[it]] + прилаг. + to V","формальное дополнение","не переводим"],["[[one]] + сущ. / [[one of]] + мн. ч.","числительное","«один», «один из»"],["this / a new + [[one(s)]]","заменитель","повтор слова или пропуск"],["[[One]] + should / must / can + V","неопределённо-личное подлежащее","«нужно», «можно»"],["[[that]] + сущ. в ед. ч.","указательное","«тот», «это»"],["глагол + [[that]] + S + V","союз","«что»"],["сущ. + [[that]] + V или S + V","союзное слово","«который»"],["[[that of]] / [[those of]]","заменитель","повтор существительного"]]},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"~~Is~~ important to check the data.","right":"[[It]] is important to check the data.","why":"В английском подлежащее обязательно — ставим формальное it, хотя по-русски его нет."},{"wrong":"This map is old. I need ~~a new~~.","right":"This map is old. I need a new [[one]].","why":"Прилагательное не остаётся без существительного — ставим one (мн. ч. — ones)."},{"wrong":"One of the ~~student~~ ~~are~~ late.","right":"[[One of the students]] is late.","why":"После one of — мн. ч., но подлежащее — one, поэтому сказуемое в ед. ч."},{"wrong":"One should know the rules. → ~~Один должен знать правила.~~","right":"[[One]] should know the rules. → Нужно знать правила.","why":"One перед should / must — «любой человек»: переводим безлично."},{"wrong":"It was Smith who designed it. → ~~Это был Смит, который его спроектировал.~~","right":"[[It was]] Smith [[who]] designed it. → Именно Смит его спроектировал.","why":"It was … who — усиление: переводим словом «именно», а не «это был… который»."}]},{"type":"quiz","items":[{"q":"Look at this bridge. It was built in 1965. — Как перевести it?","options":["«он»","«это»","не переводится"],"a":"«он»","why":"it заменяет bridge — «мост», мужской род."},{"q":"It was the surveyor who found the mistake. — Выбери перевод.","options":["Именно геодезист нашёл ошибку.","Геодезист нашёл его ошибку.","Это геодезист, и он нашёл ошибку."],"a":"Именно геодезист нашёл ошибку.","why":"It was … who — усилительная конструкция: «именно»."},{"q":"One should always check the instrument before work. — Как перевести one?","options":["«один человек»","«нужно» (безлично)","«этот»"],"a":"«нужно» (безлично)","why":"One + should — неопределённо-личное подлежащее."},{"q":"These boots are too small. I need bigger ___.","a":"ones","why":"Заменяем существительное во мн. ч. (boots) — ones."},{"q":"The climate of Omsk is colder than ___ of Sochi.","a":"that","why":"that of заменяет the climate (ед. ч.)."},{"q":"The walls of this house are thicker than ___ of our old house.","options":["that","those","ones"],"a":"those","why":"Заменяем walls (мн. ч.) — those of."},{"q":"The method that we use is new. — Что значит that?","options":["«тот»","«что» (союз)","«который»"],"a":"«который»","why":"that стоит сразу после существительного, его можно заменить на which."},{"q":"___ is important to know these rules.","a":"It","why":"Нужно формальное подлежащее it — оно не переводится."}]},{"type":"summary","points":["[[It]]: «он / она / оно», «это»; в It is raining и It is important to… — не переводим.","[[It is]] … [[that / who]] = «именно».","[[One]]: «один», one of = «один из», this one / new ones — заменитель, One should… = «нужно».","[[That]]: «тот», «что» (после say, show), «который» (после существительного), that of = повтор существительного.","Роль слова выдают соседи: посмотри, что стоит до и после."]}]},{"id":"be-have","title":"To Be and To Have","subtitle":"Функции глаголов to be и to have: как распознать и перевести","level":"B1","tagline":"Что стоит после be или have — такая у них и роль. От роли зависит перевод.","blocks":[{"type":"uses","title":"TO BE: признак → роль → перевод","items":[{"label":"Смысловой: быть, находиться","text":"Признак: после be — место или время (at, in, on, here). Переводим «находиться», «быть» или опускаем.","en":"The engineer [[is]] at the site now.","ru":"Инженер сейчас на объекте.","examples":[{"en":"The office [[is]] on the third floor.","ru":"Офис находится на третьем этаже."}]},{"label":"Связка","text":"Признак: после be — существительное или прилагательное. В настоящем времени переводим «является», тире или опускаем.","en":"The soil [[is]] wet.","ru":"Грунт влажный.","examples":[{"en":"A cadastre [[is]] an official register of land.","ru":"Кадастр — это официальный реестр земель."}]},{"label":"Вспомогательный: Continuous","text":"Признак: be + V-ing. Отдельно не переводим — вместе с V-ing это процесс.","en":"They [[are building]] a new school.","ru":"Они строят новую школу."},{"label":"Вспомогательный: пассив","text":"Признак: be + V3. Переводим «был построен», глаголом на -ся или «построили».","en":"The bridge [[was built]] in 1990.","ru":"Мост построили в 1990 году.","examples":[{"en":"All documents [[are checked]] by a lawyer.","ru":"Все документы проверяет юрист."}]},{"label":"Модальный: be to + V","text":"Признак: be + to + V. Значит «должен» по плану или договорённости. Переводим «должен», «предстоит».","en":"The work [[is to be finished]] by May.","ru":"Работы должны быть закончены к маю.","examples":[{"en":"We [[were to meet]] the client at 10.","ru":"Мы должны были встретиться с заказчиком в 10."}]}]},{"type":"uses","title":"TO HAVE: признак → роль → перевод","items":[{"label":"Смысловой: иметь","text":"Признак: после have — существительное (что есть у кого-то). Переводим «у … есть», «иметь». В британской речи также have got.","en":"Each city [[has]] cadastral maps.","ru":"В каждом городе есть кадастровые карты.","examples":[{"en":"I [[have got]] two brothers.","ru":"У меня два брата."}]},{"label":"Вспомогательный: Perfect","text":"Признак: have / has / had + V3. Отдельно не переводим; обычно переводим прошедшим временем.","en":"European countries [[have understood]] the importance of the cadastre.","ru":"Европейские страны поняли важность кадастра.","examples":[{"en":"The engineers [[have been trained]] to use the new system.","ru":"Инженеров обучили работать с новой системой."}]},{"label":"Модальный: have to + V","text":"Признак: have + to + V. Значит «приходится, нужно» из-за обстоятельств. Вопрос и отрицание — через do.","en":"You [[have to know]] everything about cadastral data.","ru":"Нужно знать всё о кадастровых данных.","examples":[{"en":"We [[had to stop]] work because of the rain.","ru":"Из-за дождя нам пришлось прекратить работу."}]},{"label":"Устойчивые сочетания: действие","text":"have lunch, have a shower, have a rest, have a look, have a good time. Это не «иметь», а действие: бывает в Continuous, вопрос — через do.","en":"I usually [[have]] lunch at one.","ru":"Я обычно обедаю в час.","examples":[{"en":"[[Did]] you [[have]] a good time?","ru":"Ты хорошо провёл время?"},{"en":"We [[are having]] a break now.","ru":"У нас сейчас перерыв."}]},{"label":"Каузатив: have something done","text":"Признак: have + предмет + V3. Делаем не сами — нам делают. Подробнее — в главе о пассиве.","en":"I [[had]] my laptop [[repaired]].","ru":"Мне починили ноутбук."}],
"note":"Сравни: I [[have repaired]] my laptop — я починил ноутбук (сам). I [[had]] my laptop [[repaired]] — мне починили ноутбук. I [[have to repair]] my laptop — мне нужно починить ноутбук.","noteKind":"warn"},{"type":"compare","title":"have = иметь или have = действие?","left":{"title":"have = иметь","sub":"состояние","points":["Не бывает в Continuous.","В британской речи — have got: I've got a car.","Вопрос: Do you have…? или Have you got…?"],"examples":[{"en":"[[Have]] you [[got]] a pen? = [[Do]] you [[have]] a pen?","ru":"У тебя есть ручка?"}]},"right":{"title":"have = действие","sub":"есть, пить, проводить время","points":["have breakfast / a shower / a rest / a look","Бывает в Continuous: I'm having lunch.","have got с ними не используем; вопрос — только через do."],"examples":[{"en":"I [[am having]] lunch — can I call you back?","ru":"Я обедаю — можно я перезвоню?"}]},"note":"have got — только в настоящем времени. В прошедшем — просто had: I [[had]] a car. В американском английском чаще Do you have…?, чем Have you got…?"},{"type":"compare","title":"be to или have to: оба «должен»","left":{"title":"be to + V","sub":"по плану, расписанию, договорённости","points":["Часто в официальных и технических текстах.","Переводим «должен», «предстоит», «планируется»."],"examples":[{"en":"The new bridge [[is to open]] in May.","ru":"Новый мост должны открыть в мае."}]},"right":{"title":"have to + V","sub":"вынуждают обстоятельства или правила","points":["Переводим «приходится», «нужно», «должен».","Есть во всех временах: had to, will have to."],"examples":[{"en":"The road is closed, so we [[have to go]] round.","ru":"Дорога закрыта, поэтому нам приходится ехать в объезд."}]},"note":"Подробнее о значениях «должен» — в главе про must и have to."},{"type":"table","title":"Шпаргалка: что стоит после","head":["Что после","Роль","Как переводить"],"rows":[["[[be]] + место / время","смысловой","«находиться» или опускаем"],["[[be]] + сущ. / прилаг.","связка","«является», тире или ую линию метро должны открыть в следующем году.","why":"be + to V — «должен» по плану."},{"q":"Each city has cadastral maps. — Какая роль у has?","options":["смысловой: «иметь»","вспомогательный: Perfect","модальный: «должен»"],"a":"смысловой: «иметь»","why":"После has — существительное (maps)."},{"q":"You have to know all these rules. — Выбери перевод.","options":["Ты знаешь все эти правила.","Нужно знать все эти правила.","У тебя есть все эти правила."],"a":"Нужно знать все эти правила.","why":"have + to V — «нужно, должен»."},{"q":"The surveyors ___ just ___ (finish) the work. Now they are writing the report.","a":["have","finished"],"why":"Результат к настоящему — have + V3 (Perfect)."},{"q":"The documents ___ (check) every month.","a":"are checked","alt":["get checked"],"why":"Документы проверяют — пассив: be + V3."},{"q":"What time ___ you ___ (have) breakfast yesterday?","a":["did","have"],"why":"have breakfast — действие: вопрос через did."},{"q":"We ___ meet the client at 3 p.m. — так договорились.","options":["are to","are","have"],"a":"are to","why":"be to + V — «должны» по договорённости."}]},{"type":"summary","points":["Роль be / have выдаёт то, что стоит после.","be + V-ing — Continuous, be + V3 — пассив, [[be to]] + V — «должен (по плану)».","have + сущ. — «иметь», have + V3 — Perfect, [[have to]] + V — «приходится, нужно».","have lunch / a look / a rest — действие: вопрос через do, Continuous возможен.","Связку be не пропускаем: The soil [[is]] wet."]}]}]},{"id":"words","roman":"XIII","title":"Предлоги и словообразование","chapters":[{"id":"prepositions-time","title":"Prepositions of Time","subtitle":"Предлоги времени","level":"A2–B1","tagline":"Как сказать «в понедельник», «через час», «к пятнице» и «три года назад» — и не перенести русский предлог.","formula":"[[at / on / in]] + время","blocks":[{"type":"uses","title":"at, on, in: от точки к периоду","items":[{"label":"AT — точка во времени","text":"Время по часам и короткие моменты: at 5 o'clock, at noon, at night, at the moment.","en":"The meeting starts [[at]] 10 o'clock.","ru":"Совещание начинается в 10 часов.","examples":[{"en":"I often work [[at]] night.","ru":"Я часто работаю по ночам."}]},{"label":"ON — день и дата","text":"Дни недели, даты, конкретные дни. Если назван день, то и с частью дня — on: on Monday morning.","en":"The exam is [[on]] 15 June.","ru":"Экзамен 15 июня.","examples":[{"en":"We don't have lectures [[on]] Saturdays.","ru":"По субботам у нас нет лекций."}]},{"label":"IN — период длиннее дня","text":"Месяцы, годы, времена года, века — и части дня: in the morning, in the afternoon, in the evening.","en":"The station was built [[in]] 1935.","ru":"Вокзал построили в 1935 году.","examples":[{"en":"Our fieldwork starts [[in]] July.","ru":"Полевые работы у нас начинаются в июле."}]}],

"note":"С this / next / last / every предлог не ставится: ~~on next Monday~~ → next Monday, ~~in last summer~~ → last summer. С today / tomorrow / yesterday предлог тоже не нужен как обстоятельство времени: I'll call you tomorrow. Без next / last предлог возвращается: [[on]] Monday, [[in]] summer.","noteKind":"warn","en":"We have a test {{next Monday}}.","ru":"У нас контрольная в следующий понедельник."},{"type":"uses","title":"for, since, during, while","items":[{"label":"FOR — как долго","text":"После for — отрезок времени: for two hours, for ten years. Подходит к любому времени глагола.","en":"The surveyors worked [[for]] six hours without a break.","ru":"Геодезисты работали шесть часов без перерыва.","examples":[{"en":"I've lived here [[for]] five years.","ru":"Я живу здесь пять лет."}]},{"label":"SINCE — с какого момента","text":"После since — точка начала: since 2019, since Monday, since I was a child. Обычно с Present Perfect.","en":"I've known him [[since]] school.","ru":"Я знаю его со школы."},{"label":"DURING — во время чего","text":"После during — существительное, событие: during the lecture, during the war.","en":"Please don't use your phones [[during]] the exam.","ru":"Пожалуйста, не пользуйтесь телефонами во время экзамена."},{"label":"WHILE — пока, в то время как","text":"while — союз: после него целое предложение (подлежащее + глагол).","en":"He called [[while]] I was having dinner.","ru":"Он позвонил, пока я ужинал."}],
