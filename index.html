k by Friday. — Какое это время?","options":["Future Simple","Future Continuous","Future Perfect","Present Perfect"],"a":"Future Perfect","why":"will have + V3: будет сделано к моменту в будущем."},{"q":"«Я сейчас пишу отчёт» — как сказать?","options":["I write a report now.","I am writing a report now.","I wrote a report now."],"a":"I am writing a report now.","why":"Процесс прямо сейчас — Present Continuous."},{"q":"«Я живу в этом городе с 2019 года» — как сказать?","options":["I live in this city since 2019.","I am living in this city since 2019.","I have lived in this city since 2019."],"a":"I have lived in this city since 2019.","why":"Длится с 2019 года до сих пор — Present Perfect."},{"q":"«Когда я пришёл, они ужинали» — как сказать?","options":["When I arrived, they had dinner.","When I arrived, they were having dinner.","When I arrived, they have had dinner."],"a":"When I arrived, they were having dinner.","why":"«Ужинали» в тот момент — процесс: Past Continuous."}]},{"type":"summary","points":["12 времён = 3 времени (Present / Past / Future) × 4 вида.","Simple — факт; Continuous — процесс; Perfect — результат к моменту; Perfect Continuous — как долго до момента.","Время видно по первому вспомогательному: [[do / did / will]], [[am / was / will be]], [[have / had / will have]].","Русский вид ≠ английский: выбирай по смыслу, а не по русской форме.","Начни с пяти: Present Simple, Present Continuous, Past Simple, Present Perfect, will / going to."]}]},{"id":"present-simple","title":"Present Simple","subtitle":"Настоящее простое время","level":"A1–A2","tagline":"То, что происходит вообще, регулярно или всегда, — а не прямо сейчас.","formula":"S + [[V / V-s]]","blocks":[{"type":"timeline","title":"Как это выглядит на оси времени","events":[{"kind":"dots","at":[-0.85,-0.55,-0.25,0.05,0.35,0.65],"label":"каждое утро"}],
"caption":"Действие повторяется снова и снова — в прошлом, сейчас и дальше. Нас интересует сам факт, а не момент речи.","en":"I [[drink]] coffee {{every morning}}.","ru":"Я пью кофе каждое утро."},{"type":"formula","title":"Как строится","rows":[{"sign":"+","formula":"I / you / we / they + [[V]]","en":"They [[work]] in Moscow.","ru":"Они работают в Москве."},{"sign":"+","formula":"he / she / it + [[V-s]]","en":"She [[works]] in Moscow.","ru":"Она работает в Москве."},{"sign":"-","formula":"S + [[don't / doesn't]] + V","en":"He [[doesn't drive]] to work.","ru":"Он не ездит на работу на машине."},{"sign":"?","formula":"[[Do / Does]] + S + V + ?","en":"[[Does]] she [[speak]] English? — Yes, she does.","ru":"Она говорит по-английски? — Да."}],
"note":"В отрицании и вопросе окончание -s «переезжает» в does, а глагол остаётся голым: she [[doesn't work]], [[does]] she [[work]]?"},{"type":"table","title":"Окончание -s у he / she / it","head":["Глагол оканчивается на","Что делаем","Пример"],"rows":[["все остальные буквы","+ s","work → [[works]], read → [[reads]]"],["-s, -ss, -sh, -ch, -x, -o","+ es","watch → [[watches]], go → [[goes]], fix → [[fixes]]"],["согласная + y","y → ies","study → [[studies]], try → [[tries]]"],["гласная + y","+ s","play → [[plays]], buy → [[buys]]"],["have","особая форма","have → [[has]]"]]},{"type":"uses","title":"Когда используем","items":[{"label":"Привычки и регулярные действия","en":"I [[get up]] at 7 {{every day}}.","ru":"Я встаю в 7 каждый день."},{"label":"Факты и общие истины","en":"Water [[boils]] at 100 degrees Celsius.","ru":"Вода кипит при 100 градусах Цельсия."},{"label":"Постоянные состояния","text":"Где живём, где работаем, что любим — то, что не меняется каждый день.","en":"My parents [[live]] in Kazan.","ru":"Мои родители живут в Казани."},{"label":"Расписания — даже про будущее","text":"Поезда, занятия, фильмы: то, что стоит в расписании.","en":"The train [[leaves]] at 6:30 {{tomorrow}}.","ru":"Поезд отходит завтра в 6:30."},{"label":"Инструкции и рассказ по шагам","en":"You [[measure]] the angle, then you [[write]] it down.","ru":"Измеряешь угол, потом записываешь."}]},{"type":"markers","title":"Слова-подсказки","groups":[{"label":"Как часто","chips":["always|всегда","usually|обычно","often|часто","sometimes|иногда","rarely|редко","never|никогда"]},{"label":"Регулярность","chips":["every day|каждый день","on Mondays|по понедельникам","once a week|раз в неделю","twice a year|дважды в год"]}],
"note":"Наречия частоты (always, often, never…) ставим ПЕРЕД смысловым глаголом, но ПОСЛЕ am / is / are.","en":"She {{often}} [[works]] late. — She [[is]] {{often}} tired.","ru":"Она часто работает допоздна. — Она часто устаёт."},{"type":"formula","title":"Особый случай: глагол to be","rows":[{"sign":"+","formula":"S + [[am / is / are]]","en":"I [[am]] a student. It [[is]] cold.","ru":"Я студент. Холодно."},{"sign":"-","formula":"S + [[am / is / are]] + not","en":"They [[aren't]] at home.","ru":"Их нет дома."},{"sign":"?","formula":"[[Am / Is / Are]] + S + ?","en":"[[Are]] you ready?","ru":"Ты готов?"}],
"note":"С to be НЕ нужен do: ~~Do you are ready?~~ → [[Are]] you ready?","noteKind":"warn"},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"He ~~go~~ to work by bus.","right":"He [[goes]] to work by bus.","why":"he / she / it — нужно окончание -s."},{"wrong":"She ~~doesn't likes~~ coffee.","right":"She [[doesn't like]] coffee.","why":"После does / doesn't глагол без -s: окончание уже «в does»."},{"wrong":"~~Do~~ he play tennis?","right":"[[Does]] he [[play]] tennis?","why":"С he / she / it вопрос строится через does."},{"wrong":"I ~~am agree~~ with you.","right":"I [[agree]] with you.","why":"agree — обычный глагол, am перед ним не нужен."},{"wrong":"I ~~am working~~ here every summer.","right":"I [[work]] here {{every summer}}.","why":"Регулярное действие (every summer) — Present Simple, а не Continuous."}]},{"type":"quiz","items":[{"q":"My brother ___ (play) football on Saturdays.","a":"plays","why":"he → окончание -s."},{"q":"___ your sister speak French?","a":"Does","why":"she → вопрос через does."},{"q":"They ___ (not / eat) meat.","a":"don't eat","why":"they → don't + голый глагол."},{"q":"The lecture ___ (start) at 9:40 tomorrow.","a":"starts","why":"Расписание — Present Simple даже про завтра."},{"q":"She ___ (study) at a technical university.","a":"studies","why":"согласная + y → ies."},{"q":"Water ___ at 100 degrees Celsius.","options":["boil","boils","is boiling"],"a":"boils","why":"Общий факт — Present Simple, it → -s."},{"q":"He ___ late for classes.","options":["never is","is never","never does"],"a":"is never","why":"Наречие частоты стоит ПОСЛЕ is."},{"q":"What time ___ the shop ___ (close)?","a":["does","close"],"why":"Вопрос с what: what + does + S + V."}]},{"type":"summary","points":["Present Simple — регулярно, всегда, по расписанию, общие факты.","he / she / it → [[V-s]]; остальные → [[V]].","Отрицание и вопрос — через [[do / does]], глагол без -s.","С to be do не нужен: [[Are]] you…? I [[am not]]…","Маркеры: {{always, usually, often, never, every day}}."]}]},{"id":"present-continuous","title":"Present Continuous","subtitle":"Настоящее длительное время","level":"A1–A2","tagline":"Действие в процессе: идёт прямо сейчас или в этот период.","formula":"S + [[am / is / are]] + [[V-ing]]","blocks":[{"type":"timeline","title":"Как это выглядит на оси времени","events":[{"kind":"span","from":-0.15,"to":0.15,"label":"прямо сейчас"}],
"caption":"Действие уже началось, ещё не закончилось и идёт в момент речи. Волнистая линия — процесс.","en":"Sorry, I can't talk — I[['m driving]].","ru":"Извини, не могу говорить — я за рулём."},{"type":"formula","title":"Как строится","rows":[{"sign":"+","formula":"I + [[am]] + [[V-ing]]","en":"I [[am waiting]] for the bus.","ru":"Я жду автобус."},{"sign":"+","formula":"he / she / it + [[is]] + [[V-ing]]","en":"It [[is raining]].","ru":"Идёт дождь."},{"sign":"+","formula":"you / we / they + [[are]] + [[V-ing]]","en":"They [[are building]] a new bridge.","ru":"Они строят новый мост."},{"sign":"-","formula":"S + [[am not / isn't / aren't]] + [[V-ing]]","en":"He [[isn't listening]].","ru":"Он не слушает."},{"sign":"?","formula":"[[Am / Is / Are]] + S + [[V-ing]] + ?","en":"[[Is]] it [[raining]]? — No, it isn't.","ru":"Дождь идёт? — Нет."},{"sign":"?","formula":"Wh- + [[am / is / are]] + S + [[V-ing]] + ?","en":"What [[are]] you [[doing]]?","ru":"Что ты делаешь?"}],
"note":"В речи — короткие формы: I'm, he's, she's, it's, we're, they're; isn't, aren't. Формы «amn't» в стандартном английском нет — только I'm not."},{"type":"table","title":"Как добавить -ing","head":["Глагол","Что делаем","Пример"],"rows":[["почти любой","+ ing","work → [[working]], read → [[reading]]"],["на немую -e","e убираем","make → [[making]], write → [[writing]]"],["на -ee; be","e остаётся","see → [[seeing]], agree → [[agreeing]], be → [[being]]"],["на -ie","ie → y","lie → [[lying]], die → [[dying]], tie → [[tying]]"],["ударный слог: 1 гласная + 1 согласная","удваиваем согласную","run → [[running]], stop → [[stopping]], begin → [[beginning]]"],["безударный последний слог","не удваиваем","visit → [[visiting]], open → [[opening]]"],["на -w, -x, -y","не удваиваем","snow → [[snowing]], fix → [[fixing]], play → [[playing]]"]],"note":"В британском английском -l после одной гласной удваивается и без ударения: travel → [[travelling]], cancel → [[cancelling]] (в американском — traveling)."},{"type":"uses","title":"Когда используем","items":[{"label":"Прямо сейчас, в момент речи","en":"Be quiet! The baby [[is sleeping]].","ru":"Тише! Ребёнок спит.","examples":[{"en":"{{Look}}! The crane [[is lifting]] the steel beams.","ru":"Смотри! Кран поднимает стальные балки."}]},{"label":"В этот период, не обязательно в эту секунду","text":"Действие идёт в последнее время, даже если прямо сейчас ты им не занят.","en":"I[['m reading]] a great book about bridges {{at the moment}}.","ru":"Сейчас я читаю отличную книгу о мостах."},{"label":"Временная ситуация","text":"Обычно не так, но сейчас, на этой неделе — так.","en":"I {{usually}} drive, but {{this week}} I[['m taking]] the bus.","ru":"Обычно я езжу на машине, но на этой неделе езжу на автобусе.","examples":[{"en":"Anna [[is living]] with friends until she finds a flat.","ru":"Анна живёт у друзей, пока не найдёт квартиру."}]},{"label":"Изменения и развитие","text":"Что-то меняется в эти дни: get, become, change, grow, rise, improve.","en":"Your English [[is getting]] better.","ru":"Твой английский становится всё лучше.","examples":[{"en":"The city [[is growing]] fast.","ru":"Город быстро растёт."}]},{"label":"Договорённости на будущее","text":"Уже договорились: есть время и место. Подробнее — в главе про будущее.","en":"I[['m meeting]] my supervisor at 10 {{tomorrow}}.","ru":"Завтра в 10 я встречаюсь с научным руководителем."},{"label":"always — «вечно он…»","text":"always / constantly + Continuous: действие повторяется слишком часто и раздражает.","en":"He[['s]] {{always}} [[losing]] his keys!","ru":"Он вечно теряет ключи!"}]},{"type":"markers","title":"Слова-подсказки","groups":[{"label":"Прямо сейчас","chips":["now|сейчас","right now|прямо сейчас","at the moment|в данный момент","Look!|Смотри!","Listen!|Послушай!"]},{"label":"В этот период","chips":["today|сегодня","this week|на этой неделе","this term|в этом семестре","these days|в последнее время","currently|в настоящее время"]}],
"note":"currently часто встречается в деловых и технических текстах; обычно стоит между am / is / are и V-ing: The company [[is]] {{currently}} [[designing]] a new bridge.","en":"{{Listen}}! Someone [[is playing]] the piano.","ru":"Послушай! Кто-то играет на пианино."},{"type":"note","kind":"warn","title":"Не все глаголы бывают в Continuous","text":"Глаголы состояния — know, want, need, like, understand, believe и др. — обычно не ставим в Continuous, даже если речь о «прямо сейчас»: не ~~I'm needing~~, а I need. Список и исключения — в следующей главе.","en":"I [[need]] your help {{right now}}.","ru":"Мне нужна твоя помощь прямо сейчас."},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"I ~~reading~~ a book now.","right":"I[['m reading]] a book {{now}}.","why":"Без am / is / are Continuous не бывает."},{"wrong":"Look! It ~~rains~~!","right":"Look! It[['s raining]]!","why":"Прямо сейчас, в момент речи, — Continuous, а не Simple."},{"wrong":"Where ~~you are going~~?","right":"Where [[are]] you [[going]]?","why":"В вопросе am / is / are встаёт перед подлежащим."},{"wrong":"I ~~am knowing~~ the answer.","right":"I [[know]] the answer.","why":"know — глагол состояния, в Continuous обычно не ставится."},{"wrong":"She is ~~writeing~~ a letter.","right":"She [[is writing]] a letter.","why":"Немая -e перед -ing исчезает: write → writing."}]},{"type":"quiz","items":[{"q":"Be quiet! The students ___ (write) an essay.","a":"are writing","why":"Действие идёт прямо сейчас; write → writing."},{"q":"Look! The workers ___ (put) up the scaffolding.","a":"are putting","why":"Look! — сейчас; put → putting (удвоение)."},{"q":"I ___ (not / work) this week — I'm on holiday.","a":"am not working","why":"Временная ситуация: this week."},{"q":"Where's Anna? — She ___ (lie) on the beach.","a":"is lying","why":"Сейчас; lie → lying."},{"q":"Your English ___ (get) better and better!","a":"is getting","why":"Изменение, которое идёт сейчас; get → getting."},{"q":"He ___ my pen without asking — it's so annoying!","options":["is always taking","always is taking","is taking always"],"a":"is always taking","why":"always — между is и V-ing; «вечно берёт» с раздражением."},{"q":"I ___ Oleg at 6 tomorrow — it's all arranged.","options":["meet","am meeting","meeting"],"a":"am meeting","why":"Договорённость на будущее — Present Continuous."},{"q":"What ___ you ___ (do)? — I ___ (wait) for Tom.","a":["are","doing","am waiting"],"why":"Вопрос: are + you + V-ing; ответ — тоже процесс сейчас."}]},{"type":"summary","points":["Present Continuous — действие в процессе: сейчас или в этот период.","Формула: [[am / is / are]] + [[V-ing]]; в вопросе am / is / are — перед подлежащим.","Ещё: временные ситуации, изменения (is getting better), договорённости (I'm meeting…).","always + Continuous — «вечно он…», с раздражением.","Маркеры: {{now, at the moment, currently, Look!, Listen!, this week}}."]}]},{"id":"simple-vs-continuous","title":"Present Simple vs Continuous","subtitle":"Как выбрать настоящее время","level":"A2–B1","tagline":"«Вообще и всегда» или «сейчас и пока» — главный выбор в настоящем времени.","blocks":[{"type":"compare","title":"Главная разница","left":{"title":"Present Simple","sub":"вообще, регулярно, постоянно","points":["привычки и повторяющиеся действия","факты и общие истины","постоянные ситуации","расписания"],"examples":[{"en":"I [[work]] in an office.","ru":"Я работаю в офисе."},{"en":"The Oka [[flows]] into the Volga.","ru":"Ока впадает в Волгу."}]},"right":{"title":"Present Continuous","sub":"сейчас, в процессе, временно","points":["действие в момент речи","временная ситуация (this week, these days)","изменения (is getting better)","договорённости на будущее"],"examples":[{"en":"I[['m working]] from home {{this week}}.","ru":"На этой неделе я работаю из дома."},{"en":"The river [[is flowing]] very fast {{today}}.","ru":"Сегодня река течёт очень быстро."}]},"note":"Спроси себя: это «вообще, всегда» — или «сейчас, пока, в этот период»?"},{"type":"timeline","title":"Как это выглядит на оси времени","events":[{"kind":"dots","at":[-0.85,-0.6,-0.35,0.35,0.6,0.85],"label":"обычно: на машине"},{"kind":"span","from":-0.12,"to":0.12,"label":"сегодня: пешком"}],
"caption":"Точки — привычка, которая повторяется (Simple). Волнистый отрезок — то, что происходит сейчас и временно (Continuous).","en":"He {{usually}} [[drives]] to work, but {{today}} he[['s walking]].","ru":"Обычно он ездит на работу на машине, но сегодня идёт пешком."},{"type":"points","title":"Пары для сравнения","items":[{"label":"Постоянно или временно","en":"I [[live]] in Moscow.","ru":"Я живу в Москве.","examples":[{"en":"I[['m living]] with friends until I find a flat.","ru":"Я живу у друзей, пока не найду квартиру."}]},{"label":"Профессия или занятие прямо сейчас","en":"What [[do]] you [[do]]? — I'm an engineer.","ru":"Кем ты работаешь? — Я инженер.","examples":[{"en":"What [[are]] you [[doing]]? — I'm checking the drawings.","ru":"Что ты делаешь? — Проверяю чертежи."}]},{"label":"Умеет или делает сейчас","en":"He [[speaks]] three languages.","ru":"Он говорит на трёх языках.","examples":[{"en":"{{Listen}}, he[['s speaking]] German on the phone.","ru":"Послушай, он говорит по телефону по-немецки."}]},{"label":"always: факт или раздражение","text":"always + Simple — просто так всегда; always + Continuous — «вечно он…».","en":"I {{always}} [[get up]] at 7.","ru":"Я всегда встаю в 7.","examples":[{"en":"He[['s]] {{always}} [[complaining]]!","ru":"Он вечно жалуется!"}]}]},{"type":"note","kind":"tip","title":"Быстрая проверка","text":"Подставь по-русски «в данный момент», «пока», «в эти дни». Звучит естественно — скорее всего Continuous. Подходит «вообще», «обычно», «всегда» — Simple. Исключение — глаголы состояния (ниже)."},{"type":"table","title":"Глаголы состояния: обычно только Simple","head":["Группа","Глаголы","Пример"],"rows":[["знание и мнение","know, understand, believe, remember, mean","I [[don't understand]] this rule."],["желания и чувства","want, need, like, love, hate, prefer","She [[needs]] a new laptop."],["принадлежность","own, belong, have (= иметь)","This plot [[belongs]] to the city."],["впечатление","seem","The task [[seems]] easy."],["свойства","consist, contain, cost, depend","Concrete [[consists]] of cement, water, sand and gravel."]],"note":"Даже «прямо сейчас» с ними — Simple: {{Now}} I [[understand]]! (а не ~~I'm understanding~~). Рекламное I'm loving it — игра слов, сам так не пиши.","noteKind":"warn"},{"type":"points","title":"Глаголы с двумя смыслами","items":[{"label":"think","text":"считать, полагать → Simple; обдумывать, думать над чем-то → Continuous.","en":"I [[think]] you're right.","ru":"Я думаю (считаю), что ты прав.","examples":[{"en":"I[['m thinking]] about the project.","ru":"Я думаю над проектом."}]},{"label":"have","text":"иметь → Simple; есть, пить, проводить время → Continuous.","en":"She [[has]] two brothers.","ru":"У неё два брата.","examples":[{"en":"We[['re having]] lunch — can I call you back?","ru":"Мы обедаем — можно я перезвоню?"}]},{"label":"see","text":"видеть, понимать → Simple; встречаться с кем-то → Continuous.","en":"I [[see]] what you mean.","ru":"Понимаю, о чём ты.","examples":[{"en":"I[['m seeing]] the dean {{tomorrow}}.","ru":"Завтра я встречаюсь с деканом."}]},{"label":"taste, smell","text":"имеет вкус / запах → Simple; пробовать, нюхать → Continuous.","en":"The room [[smells]] of paint.","ru":"В комнате пахнет краской.","examples":[{"en":"Why [[are]] you [[smelling]] the milk? Is it off?","ru":"Зачем ты нюхаешь молоко? Оно прокисло?"}]},{"label":"be","text":"обычное состояние → Simple; is being + прилагательное — «ведёт себя так сейчас» → Continuous.","en":"He [[is]] {{usually}} very polite.","ru":"Обычно он очень вежливый.","examples":[{"en":"Why [[is]] he [[being]] so rude {{today}}?","ru":"Почему он сегодня так грубо себя ведёт?"}]}],
"note":"feel в значении «чувствовать себя» бывает в обеих формах без разницы в смысле: How [[do]] you [[feel]]? = How [[are]] you [[feeling]]?"},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"Sorry, I ~~am not understanding~~.","right":"Sorry, I [[don't understand]].","why":"understand — глагол состояния: только Simple."},{"wrong":"~~Are you wanting~~ some tea?","right":"[[Do]] you [[want]] some tea?","why":"want — глагол состояния: вопрос через do."},{"wrong":"I ~~am thinking~~ it's a good idea.","right":"I [[think]] it's a good idea.","why":"think = «считаю» — Simple."},{"wrong":"Where's Tom? — He ~~has~~ lunch.","right":"Where's Tom? — He[['s having]] lunch.","why":"have = «есть, обедать», и это прямо сейчас — Continuous."},{"wrong":"I ~~work~~ from home this week.","right":"I[['m working]] from home {{this week}}.","why":"Временная ситуация (this week) — Continuous."}]},{"type":"quiz","items":[{"q":"Sorry, I ___ what you mean.","options":["don't understand","am not understanding"],"a":"don't understand","why":"understand — глагол состояния."},{"q":"Where's Max? — He ___ a shower.","options":["has","is having"],"a":"is having","why":"have = «принимать (душ)», действие идёт сейчас."},{"q":"My parents ___ in Kazan. It's their home town.","options":["live","are living"],"a":"live","why":"Постоянная ситуация — Simple."},{"q":"I ___ with friends until I find a flat.","options":["stay","am staying"],"a":"am staying","why":"Временная ситуация — Continuous."},{"q":"This coffee ___ strange. What's in it?","options":["tastes","is tasting"],"a":"tastes","why":"taste = «имеет вкус» — состояние, Simple."},{"q":"___ you ___ (think) this plan will work?","a":["Do","think"],"why":"think = «считать» — Simple, вопрос через do."},{"q":"Listen! Somebody ___ (sing) in the next room.","a":"is singing","why":"Listen! — действие идёт прямо сейчас."},{"q":"What ___ your father ___ (do)? — He's a surveyor.","a":["does","do"],"why":"Вопрос о профессии — Simple: What does he do?"}]},{"type":"summary","points":["Simple — вообще, регулярно, постоянно; Continuous — сейчас, в процессе, временно.","What [[do]] you [[do]]? — профессия; What [[are]] you [[doing]]? — чем занят сейчас.","Глаголы состояния (know, want, need, like, belong…) — Simple даже «прямо сейчас».","think, have, see, taste, smell, be — два смысла: состояние → Simple, действие → Continuous."]}]}]},{"id":"past","roman":"III","title":"Прошедшее и перфект","chapters":[{"id":"past-simple","title":"Past Simple","subtitle":"Прошедшее простое время","level":"A1–A2","tagline":"Действие случилось и закончилось в прошлом: вчера, в 2019 году, пять минут назад.","formula":"S + [[V-ed / V2]]","blocks":[{"type":"timeline","title":"Как это выглядит на оси времени","events":[{"kind":"dot","at":-0.5,"label":"два дня назад"}],
"caption":"Действие случилось в определённый момент прошлого и закончилось. Важно «когда», а не связь с настоящим.","en":"We [[finished]] the survey {{two days ago}}.","ru":"Мы закончили съёмку два дня назад."},{"type":"formula","title":"Как строится","rows":[{"sign":"+","formula":"S + [[V-ed]]","en":"We [[worked]] late {{yesterday}}.","ru":"Вчера мы работали допоздна."},{"sign":"+","formula":"S + [[V2]]","en":"She [[went]] to Kazan {{last summer}}.","ru":"Прошлым летом она ездила в Казань."},{"sign":"-","formula":"S + [[didn't]] + V","en":"I [[didn't see]] your email.","ru":"Я не видел твоё письмо."},{"sign":"?","formula":"[[Did]] + S + V + ?","en":"[[Did]] you [[pass]] the exam? — Yes, I did.","ru":"Ты сдал экзамен? — Да."},{"sign":"be","formula":"I / he / she / it + [[was]]","en":"It [[was]] cold {{yesterday}}.","ru":"Вчера было холодно."},{"sign":"be","formula":"you / we / they + [[were]]","en":"We [[were]] at the site all day.","ru":"Мы весь день были на объекте."},{"sign":"?","formula":"[[Was / Were]] + S + ?","en":"[[Were]] you at home {{last night}}? — No, I wasn't.","ru":"Ты был дома вчера вечером? — Нет."}],
"note":"Прошедшее время «сидит» в did, поэтому после did / didn't — начальная форма: ~~Did you went?~~ → [[Did]] you [[go]]? С was / were did не нужен: [[Were]] you…?, I [[wasn't]]…"},{"type":"table","title":"Правильные глаголы: как пишется -ed","head":["Глагол","Что делаем","Пример"],"rows":[["почти любой","+ ed","work → [[worked]], watch → [[watched]]"],["на -e","+ d","live → [[lived]], close → [[closed]]"],["согласная + y","y → ied","study → [[studied]], try → [[tried]]"],["гласная + y","+ ed","play → [[played]], stay → [[stayed]]"],["ударный слог: 1 гласная + 1 согласная","удваиваем согласную","stop → [[stopped]], plan → [[planned]], prefer → [[preferred]]"],["безударный последний слог","не удваиваем","visit → [[visited]], open → [[opened]]"],["на -w, -x","не удваиваем","fix → [[fixed]], allow → [[allowed]]"],["на -l после одной гласной","BrE: удваиваем l","travel → [[travelled]] (AmE traveled)"]],"note":"Как читается -ed (смотри на последний ЗВУК, а не букву): [t] — после глухого согласного звука: worked, stopped, watched, laughed, passed, fixed, wished; [d] — после гласного или звонкого согласного звука: lived, played, opened, allowed; [ɪd] — только после звуков [t] и [d]: wanted, needed. Важно: смотри на звук, а не на букву — danced читается [dɑːnst], потому что последний звук глухой [s]. Лишний слог появляется только после [t] / [d]."},{"type":"uses","title":"Когда используем","items":[{"label":"Законченное действие, время названо","en":"I [[bought]] this laptop {{two years ago}}.","ru":"Я купил этот ноутбук два года назад."},{"label":"Время понятно из ситуации","text":"Время не названо, но ясно, что речь о конкретном случае в прошлом.","en":"Where [[did]] you [[buy]] that jacket?","ru":"Где ты купил эту куртку?"},{"label":"Цепочка событий","text":"Одно действие за другим — в рассказах, отчётах, биографиях.","en":"He [[came]] home, [[had]] dinner and [[went]] to bed.","ru":"Он пришёл домой, поужинал и лёг спать."},{"label":"Привычки и состояния в прошлом","text":"Раньше было так, а теперь — нет (подробнее — в главе про used to).","en":"{{When I was a child}}, I [[played]] football every day.","ru":"В детстве я каждый день играл в футбол."},{"label":"Длилось, но уже закончилось","text":"Даже с for, если период целиком в прошлом.","en":"I [[lived]] in Omsk {{for five years}}.","ru":"Я пять лет жил в Омске (теперь не живу)."}],
"note":"Слова-подсказки: {{yesterday}}, {{last week / year}}, {{two days ago}}, {{in 2019}}, {{when I was a child}}. ago ставим после отрезка (two days ago), а last — без the (last week)."},{"type":"table","title":"Неправильные глаголы: все три формы одинаковые","head":["V","V2","V3","Перевод"],"rows":[["cut","cut","cut","резать"],["put","put","put","класть, ставить"],["set","set","set","устанавливать, задавать"],["let","let","let","позволять"],["cost","cost","cost","стоить"],["hit","hit","hit","ударять, попадать"],["shut","shut","shut","закрывать"],["hurt","hurt","hurt","ранить, причинять боль"],["read","read","read","читать"]],"note":"read пишется одинаково во всех формах, но V2 и V3 читаются [red] — как слово red."},{"type":"table","title":"Неправильные глаголы: V2 = V3 (часть 1)","head":["V","V2","V3","Перевод"],"rows":[["buy","bought","bought","покупать"],["bring","brought","brought","приносить"],["think","thought","thought","думать"],["teach","taught","taught","учить, преподавать"],["catch","caught","caught","ловить, успевать (на транспорт)"],["build","built","built","строить"],["send","sent","sent","отправлять"],["spend","spent","spent","тратить, проводить (время)"],["keep","kept","kept","хранить, держать"],["leave","left","left","уходить, уезжать, оставлять"],["lose","lost","lost","терять, проигрывать"],["feel","felt","felt","чувствовать"]],"note":"Запоминай гнёздами: -ought / -aught (bought, brought, thought, taught, caught) и d → t (build → built, send → sent, spend → spent)."},{"type":"table","title":"Неправильные глаголы: V2 = V3 (часть 2)","head":["V","V2","V3","Перевод"],"rows":[["make","made","made","делать, изготавливать"],["have","had","had","иметь"],["find","found","found","находить"],["pay","paid","paid","платить"],["say","said","said","сказать"],["sell","sold","sold","продавать"],["tell","told","told","рассказать, сказать (кому-то)"],["get","got","got","получать, добираться, становиться"],["stand","stood","stood","стоять"],["understand","understood","understood","понимать"],["sit","sat","sat","сидеть"],["meet","met","met","встречать(ся)"]],"note":"Не ~~sayed~~, ~~payed~~ — только said и paid; said читается [sed]. В американском V3 от get чаще gotten."},{"type":"table","title":"Неправильные глаголы: три разные формы (часть 1)","head":["V","V2","V3","Перевод"],"rows":[["go","went","gone","идти, ехать"],["do","did","done","делать"],["see","saw","seen","видеть"],["take","took","taken","брать"],["give","gave","given","давать"],["write","wrote","written","писать"],["speak","spoke","spoken","говорить"],["break","broke","broken","ломать"],["choose","chose","chosen","выбирать"],["know","knew","known","знать"],["drive","drove","driven","водить (машину), ехать"],["eat","ate","eaten","есть"]],"note":"Для Past Simple нужна только V2. V3 понадобится в Present Perfect (have gone) и в пассиве (was written) — учи сразу тройками."},{"type":"table","title":"Неправильные глаголы: три разные формы (часть 2)","head":["V","V2","V3","Перевод"],"rows":[["be","was / were","been","быть"],["begin","began","begun","начинать"],["drink","drank","drunk","пить"],["swim","swam","swum","плавать"],["fly","flew","flown","летать"],["draw","drew","drawn","рисовать, чертить"],["grow","grew","grown","расти, выращивать"],["forget","forgot","forgotten","забывать"],["come","came","come","приходить"],["become","became","become","становиться"],["run","ran","run","бежать; руководить"]],"note":"come, become, run — особый случай: V3 совпадает с V (come → came → come). Гнездо i → a → u: begin — began — begun, drink — drank — drunk, swim — swam — swum."},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"I ~~didn't went~~ to the lecture.","right":"I [[didn't go]] to the lecture.","why":"После didn't — начальная форма: прошедшее уже в did."},{"wrong":"Where ~~you went~~ yesterday?","right":"Where [[did]] you [[go]] {{yesterday}}?","why":"Вопрос строится через did: Wh- + did + S + V."},{"wrong":"They ~~was~~ late.","right":"They [[were]] late.","why":"you / we / they → were."},{"wrong":"I ~~have bought~~ it two days ago.","right":"I [[bought]] it {{two days ago}}.","why":"ago, yesterday, last… — только Past Simple, не Present Perfect."},{"wrong":"I moved to Tomsk ~~before two years~~.","right":"I [[moved]] to Tomsk {{two years ago}}.","why":"«Два года назад» = two years ago (ago — после отрезка); «before two years» — калька, так не говорят."}]},{"type":"quiz","items":[{"q":"We ___ (stop) at a small café on the way home.","a":"stopped","why":"Ударный слог 1 гласная + 1 согласная: удваиваем p."},{"q":"She ___ (study) geodesy in Novosibirsk from 2015 to 2019.","a":"studied","why":"Период в прошлом закончился; согласная + y → ied."},{"q":"I ___ (not / see) Tom at the lecture yesterday.","a":"didn't see","why":"didn't + начальная форма."},{"q":"___ you ___ (enjoy) the trip last weekend?","a":["Did","enjoy"],"why":"Вопрос: Did + S + V."},{"q":"The engineers ___ this bridge in 1998.","options":["builded","built","build"],"a":"built","why":"build — неправильный: build → built → built."},{"q":"Where ___ you yesterday evening?","options":["did","was","were"],"a":"were","why":"you → were; с be did не нужен."},{"q":"My grandfather ___ as a surveyor for forty years. He retired in 2010.","options":["worked","has worked","works"],"a":"worked","why":"Период закончился (он на пенсии) — Past Simple."},{"q":"I ___ (lose) my phone on Monday, but I ___ (find) it the next day.","a":["lost","found"],"why":"lose → lost, find → found; цепочка событий в прошлом."}]},{"type":"summary","points":["Past Simple — законченное действие в прошлом, время названо или понятно.","Правильные: [[V-ed]]; неправильные: [[V2]] — учи по таблицам тройками.","Отрицание и вопрос — через [[did / didn't]] + начальная форма.","be: I / he / she / it [[was]], you / we / they [[were]]; did с ними не нужен.","Маркеры: {{yesterday, last week, two days ago, in 2019}}."]}]},{"id":"past-continuous","title":"Past Continuous","subtitle":"Прошедшее длительное время","level":"A2–B1","tagline":"Действие шло в какой-то момент прошлого — было в процессе.","formula":"S + [[was / were]] + [[V-ing]]","blocks":[{"type":"timeline","title":"Как это выглядит на оси времени","events":[{"kind":"span","from":-0.75,"to":-0.25,"label":"работал"},{"kind":"mark","at":-0.5,"label":"вчера в 7 вечера"}],
"caption":"В этот момент действие уже шло и ещё не закончилось. Когда оно началось и когда кончилось — неважно.","en":"{{At 7 pm yesterday}} I [[was working]] on my project.","ru":"Вчера в 7 вечера я работал над своим проектом."},{"type":"formula","title":"Как строится","rows":[{"sign":"+","formula":"I / he / she / it + [[was]] + [[V-ing]]","en":"{{At three o'clock}} she [[was reading]] in the library.","ru":"В три часа она читала в библиотеке."},{"sign":"+","formula":"you / we / they + [[were]] + [[V-ing]]","en":"They [[were playing]] football {{at 6}}.","ru":"В 6 они играли в футбол."},{"sign":"-","formula":"S + [[wasn't / weren't]] + [[V-ing]]","en":"Sorry, I [[wasn't listening]].","ru":"Извини, я не слушал."},{"sign":"?","formula":"[[Was / Were]] + S + [[V-ing]] + ?","en":"What [[were]] you [[doing]] {{at ten o'clock last night}}?","ru":"Что ты делал вчера в десять вечера?"}],
"note":"was / were — как в Past Simple: I / he / she / it → was, you / we / they → were. Правила -ing те же, что в Present Continuous (lie → lying, run → running)."},{"type":"timeline","title":"Фон и прерывание","events":[{"kind":"span","from":-0.8,"to":-0.2,"label":"я работал"},{"kind":"dot","at":-0.45,"label":"он позвонил"}],
"caption":"Длинное действие (Past Continuous) — фон. Короткое (Past Simple) «врезается» в него.","en":"I [[was working]] {{when}} he called.","ru":"Я работал, когда он позвонил."},{"type":"uses","title":"Когда используем","items":[{"label":"Процесс в конкретный момент прошлого","en":"{{This time yesterday}} we [[were flying]] to Sochi.","ru":"Вчера в это время мы летели в Сочи."},{"label":"Фон + прерывающее действие","text":"Длинное действие — Past Continuous, короткое — Past Simple. Обычно с when.","en":"I [[was walking]] home {{when}} it started to rain.","ru":"Я шёл домой, когда начался дождь."},{"label":"Два процесса одновременно","text":"Оба действия шли параллельно — оба в Past Continuous, обычно с while.","en":"{{While}} I [[was cooking]], my brother [[was laying]] the table.","ru":"Пока я готовил, брат накрывал на стол."},{"label":"Обстановка в рассказе","text":"Рассказ часто начинается с фона: что происходило вокруг.","en":"The sun [[was shining]], and the surveyors [[were setting up]] their equipment.","ru":"Светило солнце, геодезисты устанавливали оборудование."}]},{"type":"points","title":"when или while?","items":[{"label":"when + короткое действие","text":"«Когда (вдруг)…» — перед действием в Past Simple.","en":"I [[was sleeping]] {{when}} the phone rang.","ru":"Я спал, когда зазвонил телефон."},{"label":"while + процесс","text":"«Пока, в то время как» — после while обычно Past Continuous.","en":"The phone rang {{while}} I [[was sleeping]].","ru":"Телефон зазвонил, пока я спал."}],
"note":"when можно поставить и перед процессом: {{When}} I [[was walking]] home, I saw Tom. А вот короткое действие после while не ставят."},{"type":"compare","title":"Past Continuous или Past Simple?","left":{"title":"Past Continuous","sub":"уже шло в тот момент","points":["процесс в момент прошлого","начало и конец не важны","фон для другого действия"],"examples":[{"en":"{{When}} Anna arrived, we [[were having]] dinner.","ru":"Когда Анна пришла, мы ужинали (уже сидели за столом)."}]},"right":{"title":"Past Simple","sub":"произошло и закончилось","points":["законченное действие","цепочка: сначала одно, потом другое","короткое действие, которое прерывает процесс"],"examples":[{"en":"{{When}} Anna arrived, we [[had]] dinner.","ru":"Когда Анна пришла, мы поужинали (сначала пришла, потом сели есть)."}]},"note":"Continuous — «в тот момент уже шло», Simple — «сначала одно, потом другое»."},{"type":"markers","title":"Слова-подсказки","groups":[{"label":"Момент в прошлом","chips":["at 7 pm yesterday|вчера в 7 вечера","this time yesterday|вчера в это время","at midnight|в полночь","at that moment|в тот момент"]},{"label":"Связки","chips":["when|когда","while|пока, в то время как","as|когда, пока"]}],
"en":"{{At that moment}} everyone [[was looking]] at me.","ru":"В тот момент все смотрели на меня."},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"When you called, I ~~slept~~.","right":"When you called, I [[was sleeping]].","why":"«Спал» в момент звонка — процесс: Past Continuous."},{"wrong":"I was walking home when it ~~was starting~~ to rain.","right":"I was walking home {{when}} it [[started]] to rain.","why":"Короткое действие, которое прерывает процесс, — Past Simple."},{"wrong":"~~Were you sleep~~ at 11?","right":"[[Were]] you [[sleeping]] at 11?","why":"После was / were нужен V-ing."},{"wrong":"I ~~was knowing~~ the answer.","right":"I [[knew]] the answer.","why":"Глаголы состояния (know, want, like…) не ставят в Continuous — в прошедшем тоже."},{"wrong":"They ~~was~~ playing football.","right":"They [[were playing]] football.","why":"you / we / they → were."}]},{"type":"quiz","items":[{"q":"This time yesterday I ___ (lie) on the beach.","a":"was lying","why":"Процесс в момент прошлого; lie → lying."},{"q":"I was walking home when it ___ (start) to rain.","a":"started","why":"Короткое действие прерывает процесс — Past Simple."},{"q":"Sorry, I ___ (not / listen). Can you repeat the question?","a":"wasn't listening","why":"В момент вопроса я не слушал — процесс."},{"q":"The surveyors ___ the plot when the storm began, so they had to stop.","options":["measured","were measuring","was measuring"],"a":"were measuring","why":"Процесс, который прервала гроза; they → were."},{"q":"I ___ the answer, so I put up my hand.","options":["knew","was knowing"],"a":"knew","why":"know — глагол состояния, не бывает в Continuous."},{"q":"My phone rang ___ I was giving a presentation.","options":["while","during"],"a":"while","why":"while + предложение; during + существительное (during the presentation)."},{"q":"When Anna arrived, we ___ (have) dinner, so she joined us.","a":"were having","why":"Ужин уже шёл, поэтому она присоединилась."},{"q":"What ___ you ___ (do) when I saw you in the park?","a":["were","doing"],"why":"Процесс в тот момент: were + you + V-ing."}]},{"type":"summary","points":["Past Continuous — процесс в момент прошлого: [[was / were]] + [[V-ing]].","Длинное действие (фон) — Past Continuous, короткое (прерывание) — Past Simple.","when — перед коротким действием, while — перед процессом.","When Anna arrived, we [[were having]] dinner (уже ели) ≠ we [[had]] dinner (сели после).","Глаголы состояния — в Past Simple: I [[knew]], I [[wanted]]."]}]},{"id":"present-perfect","title":"Present Perfect","subtitle":"Настоящее совершенное время","level":"A2–B1","tagline":"Прошлое, которое важно сейчас: результат, опыт или период, который ещё не закончился.","formula":"S + [[have / has]] + [[V3]]","blocks":[{"type":"timeline","title":"Как это выглядит на оси времени","events":[{"kind":"dot","at":-0.4,"label":"потерял"},{"kind":"arrow","from":-0.4,"to":0,"label":"ключа нет до сих пор"}],
"caption":"Когда именно это случилось — неважно. Важно, что результат виден сейчас: ключа нет, домой не попасть.","en":"I[['ve lost]] my key.","ru":"Я потерял ключ."},{"type":"formula","title":"Как строится","rows":[{"sign":"+","formula":"I / you / we / they + [[have]] + [[V3]]","en":"We [[have finished]] the project.","ru":"Мы закончили проект."},{"sign":"+","formula":"he / she / it + [[has]] + [[V3]]","en":"She [[has passed]] all her exams.","ru":"Она сдала все экзамены."},{"sign":"-","formula":"S + [[haven't / hasn't]] + [[V3]]","en":"I [[haven't read]] this book.","ru":"Я не читал эту книгу."},{"sign":"?","formula":"[[Have / Has]] + S + [[V3]] + ?","en":"[[Have]] you [[seen]] my phone? — Yes, I have.","ru":"Ты видел мой телефон? — Да, видел."}],
"note":"Короткие формы: I've, you've, we've, they've; he's / she's / it's (= has); haven't, hasn't. he's бывает и is, и has — смотри на глагол после: he's working = is, he's worked = has."},{"type":"uses","title":"Когда используем","items":[{"label":"Результат сейчас","text":"Что-то случилось раньше, и это видно или важно сейчас.","en":"I[['ve broken]] my leg, so I can't come.","ru":"Я сломал ногу, поэтому не смогу прийти.","examples":[{"en":"The price of steel [[has gone]] up.","ru":"Сталь подорожала."}]},{"label":"Опыт в жизни","text":"Было ли когда-нибудь — а когда именно, неважно. Часто с ever / never.","en":"[[Have]] you {{ever}} [[been]] to St Petersburg?","ru":"Ты когда-нибудь был в Петербурге?","examples":[{"en":"I[['ve]] {{never}} [[seen]] a bridge like this.","ru":"Я никогда не видел такого моста."}]},{"label":"Свежие новости: just, already, yet","en":"I[['ve]] {{just}} [[sent]] you the drawings.","ru":"Я только что отправил тебе чертежи."},{"label":"Период ещё не закончился","text":"today, this week, this year — пока этот период идёт.","en":"I[['ve drunk]] three cups of coffee {{today}}.","ru":"Сегодня я выпил три чашки кофе."},{"label":"Состояние с прошлого до сейчас: for / since","text":"Чаще с глаголами состояния (be, know, have), а также с live, work. По-русски — настоящее время!","en":"I[['ve known]] him {{for ten years}}.","ru":"Я знаю его десять лет.","examples":[{"en":"She[['s been]] ill {{since Monday}}.","ru":"Она болеет с понедельника."}]},{"label":"It's the first time…","text":"После It's the first time / the second time… — Present Perfect, если главное предложение в настоящем: It's the first time I've been on a real construction site. Если главное в прошедшем, время сдвигается в Past Perfect: It was the first time I had flown. (См. главу Past Perfect.)","en":"It's the first time I[['ve been]] on a real construction site.","ru":"Я впервые на настоящей стройке."}]},{"type":"table","title":"for или since","head":["Слово","Что после","Примеры"],"rows":[["for","отрезок: сколько времени","{{for}} two hours, {{for}} five years, {{for}} a long time"],["since","точка отсчёта: с какого момента","{{since}} Monday, {{since}} 2020, {{since}} I was a child"],["How long…?","вопрос «как долго?»","How long [[have]] you [[known]] her?"]],"note":"По-русски в обоих случаях часто «уже…»: «живу здесь уже пять лет» = for five years, а не ~~since five years~~.","noteKind":"warn"},{"type":"points","title":"Где стоят just, already, yet, ever, never","items":[{"label":"just — только что","text":"Между have и V3.","en":"I[['ve]] {{just}} [[had]] lunch.","ru":"Я только что пообедал."},{"label":"already — уже","text":"Между have и V3, обычно в утверждении.","en":"They[['ve]] {{already}} [[laid]] the foundations.","ru":"Они уже заложили фундамент."},{"label":"yet — ещё не / уже?","text":"В конце предложения: в отрицании = «ещё не», в вопросе = «уже?».","en":"I [[haven't finished]] {{yet}}.","ru":"Я ещё не закончил.","examples":[{"en":"[[Has]] the lecture [[started]] {{yet}}?","ru":"Лекция уже началась?"}]},{"label":"ever / never","text":"Перед V3. ever — «когда-нибудь» в вопросах; never — «никогда», это уже отрицание, not не нужен.","en":"I[['ve]] {{never}} [[flown]] a drone.","ru":"Я ни разу не запускал дрон."}],
"note":"В американском английском с just, already, yet часто ставят Past Simple: I just ate. Did you finish yet? В британском — Present Perfect: I've just eaten. Have you finished yet?"},{"type":"compare","title":"been или gone?","left":{"title":"has been to","sub":"побывал и вернулся","points":["опыт: был там когда-то","Have you ever been to…?"],"examples":[{"en":"He[['s been]] to Paris twice.","ru":"Он дважды был в Париже."}]},"right":{"title":"has gone to","sub":"уехал и сейчас там","points":["ушёл или уехал и ещё не вернулся","ответ на «Где он?»"],"examples":[{"en":"Where's Oleg? — He[['s gone]] to the bank.","ru":"Где Олег? — Ушёл в банк."}]},"note":"been to — «побывал», gone to — «ушёл туда, и сейчас его здесь нет»."},{"type":"points","title":"Как переводить на русский","items":[{"label":"Результат — прошедшим совершенным","en":"She[['s written]] the report.","ru":"Она написала отчёт."},{"label":"Опыт — прошедшим несовершенным","en":"I[['ve read]] this book.","ru":"Я читал эту книгу."},{"label":"for / since — настоящим временем","en":"We[['ve lived]] here {{for ten years}}.","ru":"Мы живём здесь десять лет."},{"label":"haven't … yet — «ещё не»","en":"He [[hasn't called]] {{yet}}.","ru":"Он ещё не позвонил."}]},{"type":"markers","title":"Слова-подсказки","groups":[{"label":"Результат, новости","chips":["just|только что","already|уже","yet|ещё не; уже?","recently|недавно","lately|в последнее время"]},{"label":"Опыт","chips":["ever|когда-нибудь","never|никогда","before|раньше","twice|дважды","so far|пока что"]},{"label":"Период","chips":["for|в течение","since|с (какого-то момента)","today|сегодня","this week|на этой неделе","How long…?|Как долго…?"]}],
"note":"С точным временем в прошлом (yesterday, last week, in 2019, two days ago) и с вопросом When…? — только Past Simple. Подробнее — в следующей главе.","noteKind":"warn","en":"I [[haven't seen]] him {{since Monday}}.","ru":"Я не видел его с понедельника."},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"I ~~have seen~~ him yesterday.","right":"I [[saw]] him {{yesterday}}.","why":"Точное время в прошлом (yesterday, ago, last week) — только Past Simple."},{"wrong":"I ~~live~~ here for five years.","right":"I[['ve lived]] here {{for five years}}.","why":"Живёшь с прошлого до сих пор — Present Perfect, хотя по-русски «живу»."},{"wrong":"I ~~haven't never~~ been there.","right":"I[['ve]] {{never}} [[been]] there.","why":"never — уже отрицание, not не нужен."},{"wrong":"She ~~has went~~ home.","right":"She [[has gone]] home.","why":"После have / has — V3: go → went → gone."},{"wrong":"I've worked here ~~since three years~~.","right":"I[['ve worked]] here {{for three years}}.","why":"Отрезок (три года) — for; since — с какого момента (since 2022)."}]},{"type":"quiz","items":[{"q":"I can't get into my flat — I ___ (lose) my key.","a":"have lost","why":"Результат сейчас: войти не могу."},{"q":"___ you ever ___ (be) to Kazan?","a":["Have","been"],"why":"Опыт в жизни: Have you ever been…?"},{"q":"She ___ (not / finish) the drawing yet.","a":"hasn't finished","why":"yet в отрицании — «ещё не»; she → has."},{"q":"We have lived in this flat ___ 2015.","options":["for","since","from"],"a":"since","why":"2015 — точка отсчёта."},{"q":"Where's Pavel? — He ___ to the library.","options":["has been","has gone"],"a":"has gone","why":"Ушёл и сейчас там — gone."},{"q":"I ___ Oleg yesterday.","options":["have met","met"],"a":"met","why":"yesterday — точное время: только Past Simple."},{"q":"It's the first time I ___ (drive) in a big city.","a":"have driven","why":"It's the first time… + Present Perfect."},{"q":"Look! Somebody ___ (break) the window.","a":"has broken","why":"Результат виден сейчас."}]},{"type":"summary","points":["Present Perfect = [[have / has]] + [[V3]]: прошлое, которое важно сейчас.","Результат (I've lost my key), опыт (Have you ever…?), незаконченный период (today, this week).","for — сколько (for five years), since — с какого момента (since 2020); переводим настоящим.","just / already / never — между have и V3; yet — в конце.","С точным прошлым временем (yesterday, ago, in 2019) — только Past Simple."]}]},{"id":"perfect-vs-past","title":"Present Perfect или Past Simple?","subtitle":"Как выбрать между двумя «прошедшими»","level":"A2–B1","tagline":"Оба времени — про то, что уже случилось. Present Perfect смотрит из «сейчас», Past Simple — из законченного «тогда».","blocks":[{"type":"compare","title":"Главная разница","left":{"title":"Present Perfect","sub":"прошлое, связанное с «сейчас»","points":["Когда именно — не сказано и не важно.","Важен результат или опыт на сегодня.","Период ещё не закончился: today, this week, ever, so far."],"examples":[{"en":"I[['ve broken]] my phone, so I can't call you.","ru":"Я разбил телефон, поэтому не могу тебе позвонить."},{"en":"[[Have]] you {{ever}} [[been]] to Kazan?","ru":"Ты когда-нибудь был в Казани?"}]},"right":{"title":"Past Simple","sub":"законченное прошлое","points":["Сказано или понятно, когда: yesterday, in 2022, ago.","Период закончился: last week, when I was a child.","Рассказ о событиях по порядку."],"examples":[{"en":"I [[broke]] my phone {{last year}}.","ru":"В прошлом году я разбил телефон."},{"en":"[[Did]] you [[go]] to Kazan {{last summer}}?","ru":"Ты ездил в Казань прошлым летом?"}]},"note":"Главный вопрос: есть ли у действия законченное «когда»? Есть — Past Simple. Нет, а важно «сейчас» — Present Perfect."},{"type":"timeline","title":"Past Simple: точка в законченном прошлом","events":[{"kind":"dot","at":-0.6,"label":"в 2022 году"}],
"caption":"Действие случилось в известный момент, и этот момент уже закончился. С «сейчас» оно никак не связано.","en":"I [[went]] to London {{in 2022}}.","ru":"Я ездил в Лондон в 2022 году."},{"type":"timeline","title":"Present Perfect: прошлое, которое видно из «сейчас»","events":[{"kind":"dot","at":-0.35,"label":"потерял когда-то"},{"kind":"arrow","from":-0.35,"to":0,"label":"ключей нет до сих пор"}],
"caption":"Когда именно это случилось, не важно. Важно, что результат есть сейчас: ключей нет.","en":"I[['ve lost]] my keys.","ru":"Я потерял ключи."},{"type":"markers","title":"Слова-подсказки","groups":[{"label":"Законченное время → Past Simple","chips":["yesterday|вчера","last week|на прошлой неделе","in 2020|в 2020 году","two days ago|два дня назад","when I was a child|когда я был ребёнком","When…?|Когда…?","What time…?|Во сколько…?"]},{"label":"Обычно Present Perfect","chips":["ever|когда-нибудь","never|никогда","already|уже","yet|уже / ещё (в ? и −)","just|только что","so far|пока что","since|с тех пор"]},{"label":"Смотри, закончился ли период","chips":["today|сегодня","this morning|сегодня утром","this week|на этой неделе","for|в течение"]}],
"note":"Точное время в прошлом и Present Perfect несовместимы: ~~I have seen him yesterday~~ → I [[saw]] him {{yesterday}}.","noteKind":"warn","en":"I [[saw]] Oleg {{two days ago}}. I [[haven't seen]] him {{since}}.","ru":"Я видел Олега два дня назад. С тех пор я его не видел."},{"type":"uses","title":"Новость и подробности","items":[{"label":"Начинаем с новости или опыта — Present Perfect","en":"I[['ve been]] to London.","ru":"Я был в Лондоне."},{"label":"Спрашиваем «когда?» — Past Simple","text":"When…? и What time…? спрашивают о законченном моменте, поэтому Present Perfect с ними не бывает.","en":"Really? {{When}} [[did]] you [[go]]?","ru":"Правда? А когда ты ездил?"},{"label":"Рассказываем подробности — Past Simple","en":"I [[went]] there {{in 2022}}. It [[rained]] every day!","ru":"Я ездил туда в 2022 году. Каждый день шёл дождь!"},{"label":"Так же устроены новости","text":"Сначала сама новость, потом детали со временем.","en":"A new metro station [[has opened]] in Kazan.","ru":"В Казани открылась новая станция метро.","examples":[{"en":"The mayor [[opened]] it {{on Monday}}.","ru":"Мэр открыл её в понедельник."}]}],
"note":"Подробнее про just, already, yet, been и gone — в главе про Present Perfect."},{"type":"compare","title":"today, this morning: закончилось или нет?","left":{"title":"Период ещё идёт","sub":"→ Present Perfect","points":["Утро, день, неделя ещё не закончились.","Может, что-то ещё и произойдёт."],"examples":[{"en":"I[['ve drunk]] three cups of coffee {{today}}.","ru":"Сегодня я выпил уже три чашки кофе (день ещё не кончился)."},{"en":"[[Have]] you [[seen]] Anna {{this morning}}?","ru":"Ты видел Анну сегодня утром? (сейчас ещё утро)"}]},"right":{"title":"Период закончился","sub":"→ Past Simple","points":["Утро уже прошло — говорим о нём как о законченном.","Часто это рассказ о событиях дня."],"examples":[{"en":"[[Did]] you [[see]] Anna {{this morning}}?","ru":"Ты видел Анну сегодня утром? (сейчас уже вечер)"},{"en":"I [[was]] late for work {{this morning}}.","ru":"Сегодня утром я опоздал на работу (утро прошло)."}]},"note":"По-русски разницы нет, по-английски решают часы: утро ещё идёт — Present Perfect, утро прошло — Past Simple."},{"type":"compare","title":"for в обоих временах","left":{"title":"Present Perfect + for","sub":"длится до сих пор","points":["Началось в прошлом и продолжается сейчас.","По-русски — настоящее время: «живу пять лет»."],"examples":[{"en":"I[['ve lived]] in Tomsk {{for}} five years.","ru":"Я живу в Томске пять лет."},{"en":"{{How long}} [[have]] you [[known]] him?","ru":"Сколько ты его знаешь?"}]},"right":{"title":"Past Simple + for","sub":"уже закончилось","points":["Весь отрезок в прошлом, сейчас уже не так.","По-русски — прошедшее: «жил пять лет»."],"examples":[{"en":"I [[lived]] in Tomsk {{for}} five years. Now I live in Moscow.","ru":"Я пять лет жил в Томске. Теперь живу в Москве."},{"en":"{{How long}} [[did]] you [[live]] there?","ru":"Сколько ты там прожил?"}]},"note":"Спроси себя: это продолжается сейчас? Да — Present Perfect. Нет — Past Simple."},{"type":"note","kind":"tip","title":"Русский перевод не подскажет","text":"По-русски оба времени обычно переводятся прошедшим. Решает не русский глагол, а вопрос: есть законченное «когда» или важно «сейчас»? В американском английском Past Simple часто стоит там, где британцы скажут Present Perfect:","en":"[[Have]] you [[eaten]] {{yet}}? (BrE) — [[Did]] you [[eat]] {{yet}}? (AmE)","ru":"Ты уже поел?"},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"I ~~have seen~~ him yesterday.","right":"I [[saw]] him {{yesterday}}.","why":"Точное время в прошлом (yesterday, ago, in 2020) — только Past Simple."},{"wrong":"When ~~have you arrived~~?","right":"{{When}} [[did]] you [[arrive]]?","why":"When…? спрашивает о законченном моменте — Past Simple."},{"wrong":"I ~~live~~ here for five years.","right":"I[['ve lived]] here {{for}} five years.","why":"«Живу пять лет» — и сейчас живу: Present Perfect, а не Present Simple."},{"wrong":"I ~~have lived~~ in Omsk for two years, then I moved to Kazan.","right":"I [[lived]] in Omsk {{for}} two years, then I moved to Kazan.","why":"Ты там уже не живёшь — период закончен, значит Past Simple."},{"wrong":"Pushkin ~~has written~~ a lot of poems.","right":"Pushkin [[wrote]] a lot of poems.","why":"Жизнь Пушкина — законченный период, поэтому Past Simple (хотя стихи есть и сейчас)."}]},{"type":"quiz","items":[{"q":"We ___ the survey of this site in 2023.","options":["finished","have finished"],"a":"finished","why":"in 2023 — законченное время → Past Simple."},{"q":"___ you ever ___ (work) on a building site?","a":["Have","worked"],"why":"ever — опыт за всю жизнь → Present Perfect."},{"q":"— I've been to Norway. — Really? When ___ you ___ (go) there?","a":["did","go"],"why":"Вопрос When…? — Past Simple."},{"q":"My grandmother ___ in Tomsk for twenty years, but then she moved to Moscow.","options":["lived","has lived"],"a":"lived","why":"Она там больше не живёт — период закончен."},{"q":"I ___ (know) Sergey for ten years, and we're still good friends.","a":"have known","why":"Длится до сих пор + for → Present Perfect."},{"q":"I ___ three cups of coffee today, and it's only eleven o'clock!","options":["drank","have drunk"],"a":"have drunk","why":"День ещё не кончился → Present Perfect."},{"q":"I can't send you the report yet — I ___ (not / finish) it.","a":"haven't finished","why":"Результата пока нет, важно «сейчас» → Present Perfect."},{"q":"— How long ___ in Kazan? — Three years. Then I moved to Samara.","options":["did you live","have you lived"],"a":"did you live","why":"Он там уже не живёт — вопрос о законченном периоде."}]},{"type":"summary","points":["Есть законченное «когда» (yesterday, ago, in 2022, last week) → Past Simple.","«Когда» не важно, важен результат или опыт сейчас → Present Perfect.","Новость — Present Perfect; When…? и подробности — Past Simple.","today, this morning: период идёт → Present Perfect, закончился → Past Simple.","for + до сих пор → I[['ve lived]]; for + уже нет → I [[lived]]."]}]},{"id":"present-perfect-continuous","title":"Present Perfect Continuous","subtitle":"Настоящее совершенное длительное время","level":"B1","tagline":"Процесс начался в прошлом и идёт до сих пор — или только что закончился, и видны следы.","formula":"S + [[have / has been]] + [[V-ing]]","blocks":[{"type":"timeline","title":"Как это выглядит на оси времени","events":[{"kind":"arrow","from":-0.65,"to":0,"label":"три года — и сейчас"}],
"caption":"Процесс начался в прошлом и продолжается в момент речи. По-русски это настоящее время: «учу три года».","en":"I[['ve been learning]] English {{for}} three years.","ru":"Я учу английский три года."},{"type":"formula","title":"Как строится","rows":[{"sign":"+","formula":"I / you / we / they + [[have been]] + [[V-ing]]","en":"We[['ve been waiting]] {{for}} twenty minutes.","ru":"Мы ждём уже двадцать минут."},{"sign":"+","formula":"he / she / it + [[has been]] + [[V-ing]]","en":"She[['s been working]] here {{since}} May.","ru":"Она работает здесь с мая."},{"sign":"-","formula":"S + [[haven't / hasn't been]] + [[V-ing]]","en":"I [[haven't been sleeping]] well {{lately}}.","ru":"Последнее время я плохо сплю."},{"sign":"?","formula":"[[Have / Has]] + S + [[been]] + [[V-ing]] + ?","en":"[[Have]] you [[been waiting]] long? — No, just five minutes.","ru":"Давно ждёшь? — Нет, всего пять минут."}],
"note":"been не меняется ни для каких лиц. She's been… = She **has** been…, а не is: если после 's стоит been, это has."},{"type":"uses","title":"Когда используем","items":[{"label":"Процесс идёт до сих пор","text":"Обычно с How long…?, for, since. По-русски — настоящее время.","en":"{{How long}} [[have]] you [[been learning]] English?","ru":"Сколько ты уже учишь английский?","examples":[{"en":"It[['s been raining]] {{since}} this morning.","ru":"Дождь идёт с самого утра."},{"en":"He[['s been playing]] football {{since}} he was eight.","ru":"Он играет в футбол с восьми лет."}]},{"label":"Процесс только что закончился — видны следы","text":"Самого процесса уже нет, но виден результат: мокрая земля, красные глаза, одышка. По-русски — прошедшее время.","en":"You're out of breath. [[Have]] you [[been running]]?","ru":"Ты запыхался. Бегал?","examples":[{"en":"The ground is wet. It[['s been raining]].","ru":"Земля мокрая — шёл дождь."},{"en":"Your hands are dirty. What [[have]] you [[been doing]]?","ru":"У тебя грязные руки. Что ты делал?"}]},{"label":"Что-то происходит в последнее время","text":"Повторяющиеся действия за период, который тянется до сейчас.","en":"I[['ve been going]] to the gym a lot {{recently}}.","ru":"Последнее время я часто хожу в спортзал."}]},{"type":"markers","title":"Слова-подсказки","groups":[{"label":"Как долго","chips":["for two hours|два часа","for ages|целую вечность","since 9 o'clock|с девяти часов","since Monday|с понедельника","all day|весь день","all morning|всё утро","How long…?|Как долго…? Сколько…?"]},{"label":"Последнее время","chips":["lately|в последнее время","recently|недавно, в последнее время"]}],
"note":"for — сколько длится (for three hours), since — с какого момента (since 2022, since I was a child). После since в придаточном — Past Simple: since I [[moved]] here.","en":"I[['ve been waiting]] {{since}} nine o'clock!","ru":"Я жду с девяти часов!"},{"type":"compare","title":"Present Perfect или Present Perfect Continuous?","left":{"title":"Present Perfect","sub":"сколько сделано, результат","points":["Важен результат: что уже готово.","Отвечает на How many? / How much?","Действие закончено."],"examples":[{"en":"I[['ve written]] three letters.","ru":"Я написал три письма."},{"en":"She[['s painted]] the room. It looks great.","ru":"Она покрасила комнату — выглядит отлично."}]},"right":{"title":"Present Perfect Continuous","sub":"как долго, сам процесс","points":["Важен процесс и его длительность.","Отвечает на How long?","Действие может быть ещё не закончено."],"examples":[{"en":"I[['ve been writing]] letters {{all morning}}.","ru":"Я с утра пишу письма."},{"en":"She[['s been painting]] the room — that's why she's covered in paint.","ru":"Она красила комнату — поэтому вся в краске."}]},"note":"Есть число или количество (three letters, how many) — только Present Perfect: ~~I've been writing three letters~~."},{"type":"points","title":"Когда Continuous нельзя или не обязательно","items":[{"label":"Глаголы состояния — только Present Perfect","text":"know, like, want, believe, understand, have (= иметь), be в Continuous не ставим.","en":"I[['ve known]] him {{for}} years.","ru":"Я знаю его много лет.","examples":[{"en":"We[['ve been]] friends {{since}} school.","ru":"Мы дружим со школы."},{"en":"{{How long}} [[have]] you [[had]] this car?","ru":"Давно у тебя эта машина?"}]},{"label":"live, work, study, teach — можно оба","text":"С for / since разница почти незаметна.","en":"She[['s worked]] here {{for}} ten years.","ru":"Она работает здесь десять лет.","examples":[{"en":"She[['s been working]] here {{for}} ten years.","ru":"Она работает здесь десять лет."}]},{"label":"always — Present Perfect","en":"I[['ve]] {{always}} [[lived]] in the countryside.","ru":"Я всю жизнь живу за городом."}]},{"type":"table","title":"Как перевести с русского","head":["По-русски","По-английски","Почему"],"rows":[["Я учу английский три года.","I[['ve been learning]] English {{for}} three years.","процесс идёт до сих пор"],["Я жду тебя с восьми.","I[['ve been waiting]] for you {{since}} eight.","процесс + since"],["Я знаю его пять лет.","I[['ve known]] him {{for}} five years.","know — глагол состояния"],["Сколько ты здесь работаешь?","{{How long}} [[have]] you [[been working]] here?","как долго — до сейчас"],["Ты весь в краске! Что ты делал?","You're covered in paint! What [[have]] you [[been doing]]?","процесс закончился, видны следы"]],"note":"Русское настоящее время + «сколько» или «с какого момента» — почти всегда Present Perfect (Continuous), а не Present Simple."},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"I ~~learn~~ English for three years.","right":"I[['ve been learning]] English {{for}} three years.","why":"«Учу три года» — процесс идёт до сих пор: нужен Present Perfect Continuous, а не Present Simple."},{"wrong":"I ~~am waiting~~ for you since eight o'clock.","right":"I[['ve been waiting]] for you {{since}} eight o'clock.","why":"С since / for Present Continuous не ставим — только have been V-ing."},{"wrong":"I ~~have been knowing~~ her for years.","right":"I[['ve known]] her {{for}} years.","why":"know — глагол состояния, в Continuous не бывает."},{"wrong":"I ~~have been writing~~ three reports today.","right":"I[['ve written]] three reports {{today}}.","why":"Есть количество (три отчёта) — Present Perfect."},{"wrong":"It ~~has raining~~ all day.","right":"It[['s been raining]] {{all day}}.","why":"Не пропускай been: has + been + V-ing."}]},{"type":"quiz","items":[{"q":"I ___ for you for forty minutes! Where are you?","options":["am waiting","have been waiting","wait"],"a":"have been waiting","why":"Ждёшь до сих пор, и сказано сколько (for) → have been V-ing."},{"q":"Your eyes are red. ___ you ___ (cry)?","a":["Have","been crying"],"why":"Процесс только что закончился — видны следы."},{"q":"I ___ Tom since we were at school.","options":["know","have known","have been knowing"],"a":"have known","why":"know — глагол состояния: только Present Perfect."},{"q":"How many pages ___ so far?","options":["have you written","have you been writing"],"a":"have you written","why":"How many — сколько сделано → Present Perfect."},{"q":"My brother ___ (learn) Spanish for two years, but he still can't order a coffee.","a":"has been learning","why":"Процесс идёт до сих пор + for."},{"q":"It's still snowing. How long ___ it ___ (snow)?","a":["has","been snowing"],"why":"How long…? о процессе, который идёт до сейчас."},{"q":"We ___ friends since 2015.","options":["are","have been","have been being"],"a":"have been","why":"be — глагол состояния; «дружим с 2015 года» → have been."},{"q":"The ground is wet. It ___ (rain).","a":"has been raining","why":"Дождь недавно закончился — видны следы."}]},{"type":"summary","points":["[[have / has been + V-ing]] — процесс от прошлого до сейчас.","«Учу три года» = I[['ve been learning]] for three years (How long, for, since).","Видны следы недавнего процесса: The ground is wet. It[['s been raining]].","Сколько сделано (число) → Present Perfect; как долго → Continuous.","Глаголы состояния — только Present Perfect: I[['ve known]] him for years."]}]},{"id":"past-perfect","title":"Past Perfect","subtitle":"Прошедшее совершенное время (и Past Perfect Continuous)","level":"B1","tagline":"Когда рассказываешь о прошлом и нужно показать, что одно случилось ещё раньше другого.","formula":"S + [[had]] + [[V3]]","blocks":[{"type":"timeline","title":"Как это выглядит на оси времени","events":[{"kind":"dot","at":-0.7,"label":"поезд ушёл"},{"kind":"mark","at":-0.35,"label":"я пришёл на вокзал"}],
"caption":"Два события в прошлом. Опорная точка — «я пришёл» (Past Simple). То, что случилось ещё раньше, — Past Perfect.","en":"{{When}} I arrived at the station, the train [[had]] {{already}} [[left]].","ru":"Когда я пришёл на вокзал, поезд уже ушёл."},{"type":"formula","title":"Как строится","rows":[{"sign":"+","formula":"S + [[had]] + [[V3]]","en":"{{By}} six o'clock we [[had finished]] the survey.","ru":"К шести часам мы закончили съёмку."},{"sign":"-","formula":"S + [[hadn't]] + [[V3]]","en":"I [[hadn't seen]] the plan {{before}} the meeting.","ru":"До совещания я этот план не видел."},{"sign":"?","formula":"[[Had]] + S + [[V3]] + ?","en":"[[Had]] you [[met]] her {{before}} the party?","ru":"Ты был с ней знаком до вечеринки?"}],
"note":"had — одно для всех лиц. Кратко: I'd, she'd, they'd. Но 'd бывает и would: I'd gone = I had gone, I'd go = I would go — смотри на форму глагола после."},{"type":"compare","title":"Past Simple или Past Perfect?","left":{"title":"Past Simple","sub":"события по порядку","points":["Рассказываем в том порядке, как всё было.","Основное время рассказа о прошлом."],"examples":[{"en":"{{When}} I arrived, the train [[left]].","ru":"Когда я пришёл, поезд тронулся (сначала пришёл я, потом ушёл поезд)."},{"en":"{{When}} I got home, my sister [[cooked]] dinner.","ru":"Когда я пришёл домой, сестра приготовила ужин (уже при мне)."}]},"right":{"title":"Past Perfect","sub":"одно раньше другого","points":["Из момента в прошлом смотрим ещё дальше назад.","Событие случилось до опорной точки."],"examples":[{"en":"{{When}} I arrived, the train [[had left]].","ru":"Когда я пришёл, поезд уже ушёл (сначала ушёл поезд, потом пришёл я)."},{"en":"{{When}} I got home, my sister [[had cooked]] dinner.","ru":"Когда я пришёл домой, сестра уже приготовила ужин."}]},"note":"Одна форма меняет порядок событий: Past Simple — «пришёл, и тогда…», Past Perfect — «к моменту, когда пришёл, уже…»."},{"type":"uses","title":"Когда используем","items":[{"label":"Действие раньше другого действия в прошлом","en":"I didn't go to the cinema because I [[had]] {{already}} [[seen]] the film.","ru":"Я не пошёл в кино, потому что уже видел этот фильм."},{"label":"Сделано к моменту в прошлом","text":"С by, by the time — «к тому времени уже».","en":"{{By}} 2020 the company [[had built]] three bridges.","ru":"К 2020 году компания построила три моста."},{"label":"Никогда раньше / впервые","en":"I [[had]] {{never}} [[seen]] such a tall building {{before}}.","ru":"Я никогда раньше не видел такого высокого здания.","examples":[{"en":"It was the first time I [[had flown]].","ru":"Я тогда летел на самолёте впервые."}]},{"label":"В косвенной речи (кратко)","text":"После said, told прошедшее часто сдвигается в Past Perfect. Подробнее — в главе про косвенную речь.","en":"She said she [[had lost]] her pass.","ru":"Она сказала, что потеряла пропуск."}]},{"type":"markers","title":"Слова-подсказки","groups":[{"label":"Опорный момент","chips":["by|к (какому-то моменту)","by the time|к тому времени, как","when|когда","before|до того как","after|после того как"]},{"label":"Внутри предложения","chips":["already|уже","just|только что","never … before|никогда раньше","ever|когда-либо"]}],
"note":"by the time и when вводят опорный момент (Past Simple), а то, что случилось раньше, стоит в главной части (Past Perfect).","en":"{{By the time}} we got there, the concert [[had]] {{already}} [[started]].","ru":"К тому времени, как мы добрались, концерт уже начался."},{"type":"points","title":"Когда Past Perfect не нужен","items":[{"label":"after и before уже показывают порядок","text":"Past Perfect можно, но не обязательно.","en":"{{After}} he [[finished]] the report, he went home.","ru":"Закончив отчёт, он пошёл домой.","examples":[{"en":"{{After}} he [[had finished]] the report, he went home.","ru":"После того как он закончил отчёт, он пошёл домой."}]},{"label":"События идут по порядку","text":"Рассказываешь цепочку в том порядке, как всё было, — хватит Past Simple.","en":"I [[got up]] and [[went]] to the site.","ru":"Я встал и поехал на объект."},{"label":"Past Perfect — не «очень давно»","text":"Нет второго, более позднего момента в прошлом — Past Perfect не нужен, даже если это было давно.","en":"My grandfather [[built]] this house {{in 1965}}.","ru":"Дед построил этот дом в 1965 году."}]},{"type":"timeline","title":"Past Perfect Continuous: как долго до момента в прошлом","events":[{"kind":"arrow","from":-0.8,"to":-0.3,"label":"ждали целый час"},{"kind":"mark","at":-0.3,"label":"пришёл автобус"}],
"caption":"Процесс длился какое-то время и дошёл до момента в прошлом (или закончился прямо перед ним).","en":"We [[had been waiting]] {{for}} an hour when the bus finally came.","ru":"Мы ждали уже целый час, когда наконец пришёл автобус."},{"type":"formula","title":"Past Perfect Continuous: как строится","rows":[{"sign":"+","formula":"S + [[had been]] + [[V-ing]]","en":"He was tired because he [[had been working]] {{all day}}.","ru":"Он устал, потому что весь день работал."},{"sign":"-","formula":"S + [[hadn't been]] + [[V-ing]]","en":"She [[hadn't been sleeping]] well {{for}} weeks.","ru":"Она уже несколько недель плохо спала."},{"sign":"?","formula":"[[Had]] + S + [[been]] + [[V-ing]] + ?","en":"{{How long}} [[had]] you [[been living]] in Omsk before you moved?","ru":"Сколько ты прожил в Омске до переезда?"}],
"note":"Это Present Perfect Continuous, сдвинутый в прошлое. Как долго → [[had been writing]]; сколько сделано → [[had written]] three chapters. Глаголы состояния — только had + V3: I [[had known]] him for years."},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"Last summer I ~~had gone~~ to Sochi. It was great!","right":"{{Last summer}} I [[went]] to Sochi. It was great!","why":"Нет второго, более позднего момента — просто Past Simple. Past Perfect ≠ «давно»."},{"wrong":"When I got there, they ~~already left~~.","right":"{{When}} I got there, they [[had]] {{already}} [[left]].","why":"Они ушли раньше, чем я пришёл, — Past Perfect."},{"wrong":"She had ~~went~~ home.","right":"She [[had gone]] home.","why":"После had — третья форма (V3): gone, а не went."},{"wrong":"I ~~was waiting~~ for two hours when he finally called.","right":"I [[had been waiting]] {{for}} two hours when he finally called.","why":"Сколько длилось до момента в прошлом — had been V-ing."},{"wrong":"I ~~had been knowing~~ him for years.","right":"I [[had known]] him {{for}} years.","why":"know — глагол состояния: только had + V3."}]},{"type":"quiz","items":[{"q":"When we got to the station, the train ___ already ___ (leave).","a":["had","left"],"why":"Поезд ушёл раньше, чем мы пришли."},{"q":"She was tired because she ___ all night.","options":["had been studying","has been studying","studies"],"a":"had been studying","why":"Процесс длился до момента в прошлом → had been V-ing."},{"q":"By the end of last year, the company ___ (build) three bridges.","a":"had built","why":"by + момент в прошлом, результат к нему → Past Perfect."},{"q":"I didn't recognise him because I ___ him before.","options":["had never seen","never saw","have never seen"],"a":"had never seen","why":"Не видел до того момента в прошлом."},{"q":"«After he had finished the report, he went home». Можно ли сказать After he finished…?","options":["Да, after и так показывает порядок","Нет, после after нужен только Past Perfect"],"a":"Да, after и так показывает порядок","why":"С after Past Perfect не обязателен."},{"q":"We ___ for an hour when the bus finally arrived.","options":["waited","had been waiting","have been waiting"],"a":"had been waiting","why":"Сколько длилось до момента в прошлом → had been V-ing."},{"q":"The film ___ (already / start) when we arrived.","a":"had already started","why":"Фильм начался раньше, чем мы пришли."},{"q":"Her eyes were red — she ___ (cry).","a":"had been crying","why":"Процесс только что закончился, следы видны в тот момент в прошлом."}]},{"type":"summary","points":["[[had + V3]] — случилось раньше другого момента в прошлом.","Опорный момент — Past Simple, то, что раньше, — Past Perfect: When I arrived, the train [[had left]].","Нет второго момента — нет Past Perfect, даже если было давно.","after / before сами показывают порядок — Past Perfect не обязателен.","[[had been + V-ing]] — как долго длилось до момента в прошлом."]}]},{"id":"used-to","title":"Used to, would, be used to","subtitle":"«Раньше делал», «бывало» и «привык»","level":"A2–B1","tagline":"Как сказать о том, что было раньше, а теперь нет, — и не спутать это с «я привык».","formula":"S + [[used to]] + [[V]]","blocks":[{"type":"timeline","title":"Как это выглядит на оси времени","events":[{"kind":"dots","at":[-0.9,-0.75,-0.6,-0.45],"label":"каждые выходные"},{"kind":"mark","at":-0.3,"label":"бросил"}],
"caption":"Регулярное действие или состояние в прошлом, которого сейчас больше нет.","en":"I [[used to play]] football {{every weekend}}.","ru":"Раньше я каждые выходные играл в футбол."},{"type":"formula","title":"used to: как строится","rows":[{"sign":"+","formula":"S + [[used to]] + [[V]]","en":"She [[used to live]] in Omsk.","ru":"Раньше она жила в Омске."},{"sign":"-","formula":"S + [[didn't use to]] + [[V]]","en":"I [[didn't use to like]] coffee.","ru":"Раньше я не любил кофе."},{"sign":"?","formula":"[[Did]] + S + [[use to]] + [[V]] + ?","en":"[[Did]] you [[use to walk]] to school?","ru":"Ты раньше ходил в школу пешком?"}],
"note":"Форма одна для всех лиц. После did — use без -d, как любой глагол после did: ~~didn't used to~~ → [[didn't use to]].","noteKind":"warn"},{"type":"uses","title":"Когда используем used to","items":[{"label":"Привычки в прошлом, которых больше нет","en":"My dad [[used to smoke]], but he gave up.","ru":"Папа раньше курил, но бросил."},{"label":"Состояния в прошлом","text":"be, have, live, like, know — то, что было, а теперь нет.","en":"There [[used to be]] a field here. Now there's a shopping centre.","ru":"Раньше здесь было поле. Теперь тут торговый центр."},{"label":"Только о прошлом","text":"Для привычек в настоящем used to нет — берём Present Simple: I {{usually}} [[get up]] at seven, а не ~~I use to get up~~."}],
"note":"Past Simple тоже подходит: I played football as a child. used to подчёркивает «раньше — да, теперь — нет». Но если сказано, как долго или сколько раз, — только Past Simple: I [[lived]] there {{for}} five years."},{"type":"compare","title":"used to или would?","left":{"title":"used to","sub":"действия и состояния","points":["Повторяющиеся действия: used to play, used to go.","Состояния: used to have, used to be, used to live.","Можно начать им рассказ."],"examples":[{"en":"We [[used to have]] a dog.","ru":"Раньше у нас была собака."}]},"right":{"title":"would","sub":"только повторяющиеся действия","points":["«Бывало, …» — в воспоминаниях.","Обычно когда время уже задано: When I was a child…","Для состояний нельзя."],"examples":[{"en":"{{When}} I was a child, my grandma [[would bake]] pies {{every Sunday}}.","ru":"Когда я был маленьким, бабушка каждое воскресенье пекла пироги."}]},"note":"would — не для состояний: ~~I would have a dog~~ → I [[used to have]] a dog. Сомневаешься — бери used to: он подходит в обоих случаях.","noteKind":"warn"},{"type":"formula","title":"be used to — «привык»","rows":[{"sign":"+","formula":"S + [[am / is / are used to]] + [[V-ing / noun]]","en":"I[['m used to getting up]] early.","ru":"Я привык рано вставать."},{"sign":"-","formula":"S + [[am not / isn't / aren't used to]] + [[V-ing / noun]]","en":"She [[isn't used to]] the cold.","ru":"Она не привыкла к холоду."},{"sign":"?","formula":"[[Am / Is / Are]] + S + [[used to]] + [[V-ing / noun]] + ?","en":"[[Are]] you [[used to working]] at night?","ru":"Ты привык работать по ночам?"},{"sign":"Прошлое","formula":"S + [[was / were used to]] + [[V-ing / noun]]","en":"{{By then}} I [[was used to]] the noise.","ru":"К тому времени я уже привык к шуму."}],
"note":"to здесь — предлог, как «привык К чему-то». После предлога глагол идёт с -ing: ~~I'm used to get up~~ → I[['m used to getting up]].","noteKind":"warn"},{"type":"points","title":"get used to — «привыкать»","items":[{"label":"Процесс: привыкаю","en":"I[['m getting used to]] the new job.","ru":"Я привыкаю к новой работе."},{"label":"Результат: привык","en":"At first it was hard, but I [[got used to]] it.","ru":"Сначала было трудно, но я привык."},{"label":"Привыкну / не могу привыкнуть","en":"You'll {{soon}} [[get used to driving]] on the left.","ru":"Скоро ты привыкнешь ездить по левой стороне.","examples":[{"en":"I can't [[get used to]] the time difference.","ru":"Никак не могу привыкнуть к разнице во времени."}]}],
"note":"Русское «я привык» — это либо состояние: I[['m used to]] it (мне уже привычно), либо событие: I [[got used to]] it (в какой-то момент привык)."},{"type":"table","title":"Сравни четыре конструкции","head":["Конструкция","После неё","Пример","Перевод"],"rows":[["used to","V","I [[used to work]] nights.","Раньше я работал по ночам."],["would","V","Every summer we [[would go]] to the lake.","Каждое лето мы, бывало, ездили на озеро."],["be used to","V-ing / noun","I[['m used to working]] nights.","Я привык работать по ночам."],["get used to","V-ing / noun","I'll [[get used to]] working nights.","Я привыкну работать по ночам."]],"note":"Главная ловушка: used to work (раньше работал) и am used to working (привык работать) отличаются только am и -ing."},{"type":"note","kind":"warn","title":"Ловушка в технических текстах","text":"В учебных текстах часто встречается be used to + V без -ing. Это пассив глагола use — «используется для». К «привык» это отношения не имеет.","en":"GPS [[is used to determine]] the position of points.","ru":"GPS используется для определения положения точек."},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"I ~~use to go~~ to the gym after work.","right":"I {{usually}} [[go]] to the gym after work.","why":"used to — только о прошлом; привычка сейчас — Present Simple (+ usually)."},{"wrong":"I ~~am used to get up~~ early.","right":"I[['m used to getting up]] early.","why":"В be used to слово to — предлог, после него V-ing."},{"wrong":"I ~~used to living~~ in a big city now.","right":"I[['m used to living]] in a big city now.","why":"«Привык» — это be used to: am / is / are пропускать нельзя."},{"wrong":"When I was a child, we ~~would have~~ a cat.","right":"{{When}} I was a child, we [[used to have]] a cat.","why":"would — только для повторяющихся действий, а have (= иметь) — состояние."},{"wrong":"I ~~didn't used to~~ like tea.","right":"I [[didn't use to like]] tea.","why":"После did — use без -d."}]},{"type":"quiz","items":[
