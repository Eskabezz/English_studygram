<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F3F5F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10131A" media="(prefers-color-scheme: dark)">
<title>Грамматика в клетку</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap">
<style>
:root {
  --paper: #F3F5F9;
  --grid: rgba(37, 72, 200, .065);
  --surface: #FFFFFF;
  --surface-2: #EDF0F6;
  --ink: #161B2E;
  --ink-2: #394157;
  --muted: #636C81;
  --line: #DBE0EA;
  --pen: #2548C8;
  --pen-soft: rgba(37, 72, 200, .09);
  --hl: #FFE45A;
  --hl-ink: #161B2E;
  --red: #C92F2A;
  --red-soft: rgba(201, 47, 42, .075);
  --green: #1A8547;
  --green-soft: rgba(26, 133, 71, .09);
  --margin: #EBA4AA;
  --shadow: 0 1px 2px rgba(22, 27, 46, .05), 0 10px 28px -16px rgba(22, 27, 46, .22);
  --f-display: "Unbounded", "Onest", system-ui, sans-serif;
  --f-body: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-en: "Literata", Georgia, "Times New Roman", serif;
  --f-hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  --side-w: 300px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #10131A; --grid: rgba(140, 166, 255, .045); --surface: #171B24; --surface-2: #1E2330;
    --ink: #E8EBF3; --ink-2: #C3C9D7; --muted: #8E97AB; --line: #2A3040;
    --pen: #8FA8FF; --pen-soft: rgba(143, 168, 255, .12); --hl: rgba(255, 212, 20, .26); --hl-ink: #FFF0A6;
    --red: #FF7C72; --red-soft: rgba(255, 124, 114, .1); --green: #5AD38D; --green-soft: rgba(90, 211, 141, .1);
    --margin: rgba(255, 124, 140, .32); --shadow: 0 1px 0 rgba(255, 255, 255, .03), 0 12px 30px -18px rgba(0, 0, 0, .7);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #10131A; --grid: rgba(140, 166, 255, .045); --surface: #171B24; --surface-2: #1E2330;
  --ink: #E8EBF3; --ink-2: #C3C9D7; --muted: #8E97AB; --line: #2A3040;
  --pen: #8FA8FF; --pen-soft: rgba(143, 168, 255, .12); --hl: rgba(255, 212, 20, .26); --hl-ink: #FFF0A6;
  --red: #FF7C72; --red-soft: rgba(255, 124, 114, .1); --green: #5AD38D; --green-soft: rgba(90, 211, 141, .1);
  --margin: rgba(255, 124, 140, .32); --shadow: 0 1px 0 rgba(255, 255, 255, .03), 0 12px 30px -18px rgba(0, 0, 0, .7);
}

* { box-sizing: border-box; }
html { scroll-padding-top: 76px; }
body {
  margin: 0; background-color: var(--paper); color: var(--ink);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px; background-attachment: fixed;
  font: 400 17px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
a { color: var(--pen); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--pen); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }

/* ---------- inline marks ---------- */
mark.hl {
  color: var(--hl-ink); font-weight: 600;
  background: linear-gradient(100deg, transparent .12em, var(--hl) .2em, var(--hl) calc(100% - .2em), transparent calc(100% - .12em));
  background-size: 100% 62%; background-position: 0 78%; background-repeat: no-repeat;
  padding: 0 .16em; margin: 0 -.06em; -webkit-box-decoration-break: clone; box-decoration-break: clone; border-radius: 2px;
}
.mk { color: var(--pen); text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: .2em; text-decoration-color: color-mix(in oklab, var(--pen) 55%, transparent); }
s.wr { color: var(--red); text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: var(--red); }
strong { font-weight: 650; }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; overscroll-behavior: contain;
  background: color-mix(in oklab, var(--surface) 88%, transparent); backdrop-filter: blur(6px);
  border-right: 1px solid var(--line); padding: 22px 16px 40px; display: flex; flex-direction: column; gap: 16px;
}
.brand { display: block; text-decoration: none; color: var(--ink); font: 700 21px/1.1 var(--f-display); letter-spacing: -.01em; padding: 2px 8px; }
.brand span { color: var(--pen); font-weight: 500; font-size: 15px; letter-spacing: .02em; }
.meter { padding: 0 8px; font-size: 13px; color: var(--muted); }
.meter-bar { height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden; margin-bottom: 6px; }
.meter-bar i { display: block; height: 100%; background: var(--green); border-radius: 6px; transition: width .3s; }
.search input {
  width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 10px; padding: 9px 12px; font: 400 15px var(--f-body);
}
.search input::placeholder { color: var(--muted); }
.toc { display: flex; flex-direction: column; gap: 14px; }
.toc-part > div { font: 600 11.5px/1.2 var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 8px 6px; }
.toc-part > div b { color: var(--pen); font-weight: 700; margin-right: 6px; }
.toc a {
  display: grid; grid-template-columns: 26px 1fr auto; gap: 6px; align-items: baseline; text-decoration: none; color: var(--ink-2);
  padding: 5px 8px; border-radius: 8px; font-size: 14.5px; line-height: 1.3;
}
.toc a:hover { background: var(--surface-2); color: var(--ink); }
.toc a.cur { background: var(--pen-soft); color: var(--ink); font-weight: 600; }
.toc a .n { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12.5px; }
.toc a .ok { color: var(--green); font-size: 13px; font-weight: 700; }
.toc-empty { color: var(--muted); font-size: 14px; padding: 4px 8px; }

.main { min-width: 0; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; gap: 10px; align-items: center; justify-content: space-between;
  padding: 10px clamp(16px, 4vw, 48px); background: color-mix(in oklab, var(--paper) 86%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.menu { display: none; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 12px; font-weight: 600; font-size: 14px; cursor: pointer; }
.modes { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 12px; margin-left: auto; }
.modes a { text-decoration: none; color: var(--ink-2); font-weight: 600; font-size: 14px; padding: 6px 14px; border-radius: 9px; }
.modes a.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.view { padding: clamp(24px, 4vw, 48px) clamp(16px, 4vw, 48px) 96px; max-width: 980px; }
.sheet { position: relative; padding-left: 28px; }
.sheet::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 1.5px; background: var(--margin); }

/* ---------- chapter header ---------- */
.eyebrow { font: 600 12.5px/1.3 var(--f-display); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.eyebrow b { color: var(--pen); }
.ch-head { display: grid; gap: 14px; margin-bottom: 36px; }
.ch-title { display: flex; align-items: flex-start; gap: 18px; }
.ch-no { font: 700 clamp(44px, 7vw, 72px)/0.9 var(--f-display); color: transparent; -webkit-text-stroke: 1.6px var(--pen); letter-spacing: -.03em; flex: none; }
.ch-title h1 { font: 700 clamp(28px, 4.4vw, 44px)/1.08 var(--f-display); letter-spacing: -.015em; }
.ch-title .sub { color: var(--ink-2); font-size: 18px; margin-top: 8px; }
.lvl { display: inline-block; font: 600 12px/1 var(--f-display); letter-spacing: .04em; color: var(--pen); border: 1.5px solid color-mix(in oklab, var(--pen) 40%, transparent); padding: 5px 8px 4px; border-radius: 7px; vertical-align: middle; margin-left: 8px; position: relative; top: -3px; }
.tagline { font-size: 18.5px; color: var(--ink-2); max-width: 62ch; }
.keyf { margin-top: 4px; }

/* ---------- blocks ---------- */
.blocks { display: flex; flex-direction: column; gap: 44px; }
.blk > h2 { font: 600 19px/1.25 var(--f-display); letter-spacing: -.005em; margin-bottom: 16px; }
.blk .lead { color: var(--ink-2); margin: -6px 0 14px; max-width: 64ch; }
.ex { display: grid; gap: 2px; }
.en { font: 400 19.5px/1.45 var(--f-en); color: var(--ink); }
.ru { font-size: 15.5px; color: var(--muted); line-height: 1.45; }
.ex + .ex { margin-top: 10px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }

/* formula */
.fcard { padding: 8px 24px; }
.frow { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 16px; padding: 16px 0; align-items: start; }
.frow + .frow { border-top: 1px dashed var(--line); }
.sg { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font: 700 19px/1 var(--f-display); margin-top: 2px; }
.sg.pos { color: var(--green); background: var(--green-soft); }
.sg.neg { color: var(--red); background: var(--red-soft); }
.sg.qst { color: var(--pen); background: var(--pen-soft); }
.fcard.wide .frow { grid-template-columns: 92px minmax(0, 1fr); }
.sg.txt { width: auto; min-width: 34px; max-width: 92px; overflow-wrap: anywhere; justify-self: start; font: 600 11px/1.1 var(--f-body); color: var(--muted); background: var(--surface-2); padding: 4px; text-align: center; }
.frow .ex { margin-top: 10px; }
.fx { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 7px 8px; }
.tok { font: 600 16.5px/1.25 var(--f-body); padding: 5px 11px; border-radius: 8px; background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
.tok-hl { background: var(--hl); color: var(--hl-ink); border-color: transparent; }
.tok-mk { background: var(--pen-soft); color: var(--pen); border-color: transparent; }
.tok mark.hl { background: none; padding: 0; margin: 0; }
.op { font: 700 16px var(--f-display); color: var(--muted); }
.op.q { color: var(--pen); font-size: 19px; }

/* uses / points */
.uses { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0; }
.uses > li { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 14px; padding: 16px 0; border-top: 1px solid var(--line); }
.uses > li:first-child { border-top: none; padding-top: 4px; }
.num { width: 30px; height: 30px; border-radius: 30px; border: 1.5px solid var(--pen); color: var(--pen); display: grid; place-items: center; font: 600 13px/1 var(--f-display); margin-top: 1px; }
.dot { width: 30px; display: grid; place-items: center; height: 26px; }
.dot::before { content: ""; width: 8px; height: 8px; border-radius: 8px; background: var(--pen); }
.u-label { font-weight: 650; font-size: 17.5px; line-height: 1.35; }
.u-text { color: var(--ink-2); margin-top: 3px; max-width: 64ch; }
.u-body > .ex { margin-top: 10px; padding-left: 14px; border-left: 2px solid var(--line); }

/* markers */
.mgroups { display: grid; gap: 18px; }
.mg-l { font: 600 12px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: baseline; gap: 8px; padding: 6px 13px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.chip b { font: 600 16px/1.3 var(--f-en); color: var(--pen); }
.chip i { font-style: normal; font-size: 13.5px; color: var(--muted); }
.mg-ex { margin-top: 18px; }

/* table */
.tbl { overflow-x: auto; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
table.t { border-collapse: collapse; width: 100%; min-width: 520px; }
.t th { text-align: left; font: 600 11.5px/1.3 var(--f-display); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); padding: 12px 16px; vertical-align: bottom; }
.t td { padding: 11px 16px; border-top: 1px solid var(--line); vertical-align: top; font-size: 15.5px; line-height: 1.45; }
.t td.enc { font: 400 16.5px/1.45 var(--f-en); }
.t td:first-child { font-weight: 600; }
.t td.enc:first-child { font-weight: 600; }
.t tbody tr:hover td { background: color-mix(in oklab, var(--pen-soft) 45%, transparent); }

/* compare */
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.cmp .card { padding: 20px 22px; }
.cmp h3 { font: 600 18px/1.25 var(--f-display); color: var(--pen); }
.cmp .card.b h3 { color: var(--ink); }
.cmp .sub { color: var(--muted); font-size: 15px; margin-top: 4px; }
.cmp ul { margin: 12px 0 0; padding-left: 18px; color: var(--ink-2); }
.cmp li { margin: 4px 0; }
.cmp li::marker { color: var(--pen); }
.cmp .exs { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
.cmp .en { font-size: 18px; }

/* notes */
.note { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; padding: 14px 18px; border-radius: 12px; background: var(--pen-soft); color: var(--ink); margin-top: 16px; }
.note.warn { background: var(--red-soft); }
.note .ni { width: 24px; height: 24px; border-radius: 24px; display: grid; place-items: center; font: 700 13px/1 var(--f-display); color: var(--surface); background: var(--pen); margin-top: 1px; }
.note.warn .ni { background: var(--red); }
.note .nt { font: 600 12px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--pen); margin-bottom: 5px; }
.note.warn .nt { color: var(--red); }
.note .ex { margin-top: 8px; }
.blk.note-blk .note { margin-top: 0; }

/* mistakes */
.mist { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.mist li { padding: 14px 20px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.m-row { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; align-items: baseline; }
.m-row + .m-row { margin-top: 4px; }
.m-ico { font: 700 15px/1 var(--f-display); }
.m-ico.x { color: var(--red); }
.m-ico.v { color: var(--green); }
.m-wrong .en { color: var(--muted); }
.m-why { font: 600 22px/1.25 var(--f-hand); color: var(--red); margin: 4px 0 0 34px; transform: rotate(-.4deg); transform-origin: left; }

/* timeline */
.tl { padding: 18px 20px 16px; }
.tl svg { width: 100%; height: auto; display: block; }
.tl-axis { stroke: var(--ink-2); stroke-width: 2; }
.tl-head { fill: var(--ink-2); }
.tl-now { stroke: var(--red); stroke-width: 1.6; stroke-dasharray: 5 5; }
.tl-now-t { fill: var(--red); font: 600 13px var(--f-body); }
.tl-cap { fill: var(--muted); font: 500 12.5px var(--f-body); }
.tl-dot { fill: var(--pen); }
.tl-wave { fill: none; stroke: var(--pen); stroke-width: 3; stroke-linecap: round; }
.tl-arrow { stroke: var(--pen); stroke-width: 3; stroke-linecap: round; }
.tl-arrowhead { fill: var(--pen); }
.tl-mark { stroke: var(--ink-2); stroke-width: 1.6; stroke-dasharray: 3 4; }
.tl-lab { fill: var(--ink); font: 600 13.5px var(--f-body); }
.tl-lab.m { fill: var(--ink-2); font-weight: 500; }
.tl .cap { color: var(--ink-2); margin-top: 8px; max-width: 64ch; }
.tl .ex { margin-top: 12px; }

/* quiz */
.quiz { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px 20px; box-shadow: var(--shadow); }
.quiz > h2 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.quiz > h2 small { font: 400 14px var(--f-body); color: var(--muted); letter-spacing: 0; }
.qlist { margin: 0; padding: 0 0 0 26px; display: grid; gap: 16px; }
.qlist > li { padding-left: 4px; }
.qlist > li::marker { font: 600 14px var(--f-display); color: var(--muted); }
.q { font: 400 19px/1.9 var(--f-en); }
.gapin {
  font: 600 18px/1.3 var(--f-en); color: var(--pen); background: var(--pen-soft); border: none; border-bottom: 2px solid var(--pen);
  border-radius: 6px 6px 2px 2px; padding: 2px 6px; margin: 0 2px; max-width: 100%; text-align: center;
}
.gapin.ok { color: var(--green); background: var(--green-soft); border-bottom-color: var(--green); }
.gapin.bad { color: var(--red); background: var(--red-soft); border-bottom-color: var(--red); }
.gap { display: inline-block; min-width: 3.5em; border-bottom: 2px solid var(--pen); color: transparent; line-height: 1.2; }
.gap.filled { color: var(--green); border-bottom-color: var(--green); min-width: 0; font-weight: 600; padding: 0 4px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.opt { font: 400 17px/1.3 var(--f-en); border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 14px; cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--pen); }
.opt:disabled { cursor: default; opacity: .6; }
.opt.right { border-color: var(--green); background: var(--green-soft); color: var(--green); opacity: 1; font-weight: 600; }
.opt.wrong { border-color: var(--red); background: var(--red-soft); color: var(--red); opacity: 1; text-decoration: line-through; }
.qfb { margin-top: 6px; font-size: 15px; line-height: 1.45; }
.qfb.ok { color: var(--green); }
.qfb.bad { color: var(--ink-2); }
.qfb .ans { font: 600 16px var(--f-en); color: var(--green); }
.qfb .why { color: var(--ink-2); }
.qctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 20px; padding-top: 16px; border-top: 1px dashed var(--line); }
.btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 16px; font-weight: 600; font-size: 15px; cursor: pointer; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { border-color: var(--pen); }
.btn.primary { background: var(--pen); border-color: var(--pen); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.08); }
.qscore { margin-left: auto; font: 600 15px var(--f-display); color: var(--ink-2); }

/* summary — index card */
.idx { background: var(--surface); border-radius: 6px; box-shadow: var(--shadow); border: 1px solid var(--line);
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 35px, color-mix(in oklab, var(--pen) 16%, transparent) 35px, color-mix(in oklab, var(--pen) 16%, transparent) 36px);
  background-position: 0 58px; padding: 16px 24px 18px; }
.idx h2 { font: 600 19px/1 var(--f-display); color: var(--red); padding-bottom: 14px; border-bottom: 1.5px solid var(--margin); margin-bottom: 4px; }
.idx ul { list-style: none; margin: 0; padding: 0; }
.idx li { line-height: 36px; font-size: 17px; padding-left: 22px; position: relative; }
.idx li::before { content: "✓"; position: absolute; left: 0; color: var(--green); font-weight: 700; }

/* chapter footer */
.ch-foot { margin-top: 56px; display: grid; gap: 20px; }
.learn { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.learn .btn.done { border-color: var(--green); color: var(--green); background: var(--green-soft); }
.pn { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pn a { display: block; padding: 14px 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: var(--ink); }
.pn a:hover { border-color: var(--pen); }
.pn a.next { text-align: right; grid-column: 2; }
.pn small { display: block; color: var(--muted); font-size: 13px; }
.pn b { font: 600 16px/1.3 var(--f-display); }

/* home */
.hero { display: grid; gap: 16px; margin-bottom: 40px; }
.hero h1 { font: 700 clamp(30px, 4.4vw, 52px)/1.05 var(--f-display); letter-spacing: -.025em; }
.hero h1 span { color: var(--pen); }
.hero .lead2 { font-size: 19px; color: var(--ink-2); max-width: 60ch; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 20px; color: var(--muted); font-size: 15px; }
.stats b { color: var(--ink); font: 600 17px var(--f-display); font-variant-numeric: tabular-nums; margin-right: 4px; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
.legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 28px; padding: 20px 24px; }
.legend > div { display: grid; gap: 6px; align-content: start; font-size: 15px; color: var(--ink-2); }
.legend .fx { justify-self: start; }
.legend .en { font-size: 17.5px; }

] far from here.","ru":"Офис недалеко отсюда."},{"sign":"?","formula":"[[Am / Is / Are]] + S + ?","en":"[[Is]] he at home? — Yes, he is.","ru":"Он дома? — Да."}],

:"В вопросе to be встаёт перед подлежащим — и после where, what, how тоже."},{"wrong":"I am 20 ~~years~~.","right":"I'm 20. / I'm 20 [[years old]].","why":"Возраст: либо просто число, либо целиком years old."}]},{"type":"quiz","items":[{"q":"My parents ___ (be) engineers. They work for a big company.","a":"are","why":"Настоящее, they (parents) → are."},{"q":"___ you tired? — No, I'm not.","a":"Are","why":"Вопрос с to be: are перед подлежащим, do не нужен."},{"q":"I ___ (not / be) at the lecture yesterday.","a":"wasn't","why":"Прошлое, I → was; отрицание — wasn't."},{"q":"We ___ (be) in Kazan two years ago.","a":"were","why":"Прошлое (ago), we → were."},{"q":"Where ___ your office? — It's in the city centre.","a":"is","why":"Вопрос: where + is + подлежащее."},{"q":"I ___ with you.","options":["agree","am agree","'m agree"],"a":"agree","why":"agree — обычный глагол, am не нужен."},{"q":"He likes ___.","options":["very much his job","his job very much"],"a":"his job very much","why":"Дополнение сразу после глагола, very much — в конце."},{"q":"Выбери правильный порядок слов.","options":["I met Anna at the station yesterday.","I met at the station Anna yesterday.","I yesterday met Anna at the station."],"a":"I met Anna at the station yesterday.","why":"Кто + что делает + кого + где + когда."}]},{"type":"summary","points":["Порядок жёсткий: кто + что делает + что + где + когда.","Нет действия (кто, какой, где, сколько лет) — нужен [[am / is / are]].","Прошедшее: [[was]] (I, he, she, it), [[were]] (you, we, they); будущее: [[will be]].","Вопрос: [[Is]] he…? [[Were]] you…? — to be встаёт перед подлежащим, do не нужен.","С обычным глаголом to be не ставим: I [[agree]], I [[like]]."]}]},{"id":"there-is","title":"There is / There are","subtitle":"Оборот «где-то что-то есть»","level":"A1–A2","tagline":"Когда сообщаем, что где-то что-то есть или находится: «На стене висит карта» → There is a map on the wall.","formula":"[[There is / There are]] + что + где","blocks":[{"type":"formula","title":"Как строится","rows":[{"sign":"+","formula":"[[There is]] + a / an + ед. ч. + где","en":"[[There is]] a map on the wall.","ru":"На стене висит карта."},{"sign":"+","formula":"[[There are]] + мн. ч. + где","en":"[[There are]] 25 students in our group.","ru":"В нашей группе 25 студентов."},{"sign":"-","formula":"[[There isn't / There aren't]] + …","en":"[[There isn't]] a lift in this building.","ru":"В этом здании нет лифта."},{"sign":"?","formula":"[[Is there / Are there]] + … + ?","en":"[[Is there]] a café near here? — Yes, there is.","ru":"Здесь поблизости есть кафе? — Да, есть."}],
"note":"Краткие ответы: Yes, there is / No, there isn't; Yes, there are / No, there aren't. Сокращение [[there's]] — только внутри предложения: There's a problem. В конце краткого ответа не сокращаем: ~~Yes, there's.~~"},{"type":"table","title":"Порядок другой — переводим с конца","head":["По-русски: где → что","По-английски: there is → что → где"],"rows":[["На столе лежит книга.","[[There is]] a book on the table."],["В городе три моста.","[[There are]] three bridges in the city."],["Рядом с университетом есть парк.","[[There is]] a park near the university."],["На участке нет воды.","[[There is]] no water on the plot."],["В 2010 году здесь было поле.","[[There was]] a field here in 2010."]],"note":"Английское предложение с there is переводи с конца: сначала «где», потом «что». Глаголы «есть, лежит, висит, стоит, находится» по-английски обычно не нужны — хватает there is."},{"type":"formula","title":"В прошлом и будущем","rows":[{"sign":"+","formula":"[[There was]] + ед. ч.","en":"[[There was]] an accident on the bridge yesterday.","ru":"Вчера на мосту произошла авария."},{"sign":"+","formula":"[[There were]] + мн. ч.","en":"[[There were]] a lot of people at the meeting.","ru":"На собрании было много людей."},{"sign":"+","formula":"[[There will be]] + ед. / мн. ч.","en":"[[There will be]] a new metro station here.","ru":"Здесь будет новая станция метро."},{"sign":"-","formula":"[[There wasn't / weren't / won't be]]","en":"[[There won't be]] a lecture tomorrow.","ru":"Завтра лекции не будет."},{"sign":"?","formula":"[[Was there / Were there]] + … + ?","en":"[[Were there]] any questions after the lecture?","ru":"После лекции были вопросы?"}],
"note":"Меняется только форма to be, there остаётся на месте: there has been, there can be, there must be. [[There has been]] an accident. — Произошла авария."},{"type":"table","title":"is или are? Смотри на то, что идёт после","head":["После there идёт","is / are","Пример"],"rows":[["одна вещь (a / an)","is","[[There is]] a printer in the office."],["неисчисляемое: water, time, money","is","[[There is]] some milk in the fridge."],["несколько вещей","are","[[There are]] two printers in the office."],["список, первое — ед. ч.","обычно is","[[There is]] a desk and two chairs in the room."],["a lot of + мн. ч.","are","[[There are]] a lot of cars on the road today."],["a lot of + неисчисляемое","is","[[There is]] a lot of traffic today."]],"note":"В разговоре часто слышно there's и с мн. ч. (There's two people outside), но в письме и на экзамене с мн. ч. — только [[there are]]."},{"type":"compare","title":"There is или It is?","left":{"title":"There is","sub":"сообщаем, что что-то есть","points":["Вводим новое: «есть, имеется, находится».","Отвечает на вопрос «что там есть?»."],"examples":[{"en":"[[There is]] a new café near the station.","ru":"Около вокзала есть новое кафе."},{"en":"[[There is]] a lot of snow this year.","ru":"В этом году много снега."}]},"right":{"title":"It is","sub":"описываем «оно» или обстановку","points":["О том, что уже назвали: it = оно, он, она, это.","Погода, время, расстояние."],"examples":[{"en":"[[It's]] very small but cosy.","ru":"Оно очень маленькое, но уютное."},{"en":"[[It's]] cold today.","ru":"Сегодня холодно."},{"en":"[[It's]] three kilometres to the site.","ru":"До объекта три километра."}]},"note":"Цепочка: [[There's]] a new café near the station. [[It's]] very small but cosy. — Сначала «есть», потом «оно»."},{"type":"table","title":"There is a / some / any / no","head":["","Одна вещь","Много (мн. ч.)","Неисчисляемое"],"rows":[["+","There's [[a]] chair.","There are [[some]] chairs.","There's [[some]] water."],["−","There isn't [[a]] chair.","There aren't [[any]] chairs.","There isn't [[any]] water."],["− через no","There's [[no]] chair.","There are [[no]] chairs.","There's [[no]] water."],["?","Is there [[a]] chair?","Are there [[any]] chairs?","Is there [[any]] water?"]],"note":"no = not any, поэтому второе not не нужно: There are [[no]] chairs (не ~~There aren't no chairs~~). Подробнее о some / any / no — в главе о количестве.","noteKind":"warn"},{"type":"points","title":"Важные мелочи","items":[{"label":"Известное (the, my, this) — без there is","text":"there is вводит новое. Если предмет уже известен, начинаем с него.","en":"The keys [[are]] on the table.","ru":"Ключи (те самые) на столе.","examples":[{"en":"[[There are]] some keys on the table.","ru":"На столе лежат какие-то ключи."}]},{"label":"Сколько? — How many … are there?","en":"How many floors [[are there]] in this building?","ru":"Сколько этажей в этом здании?"},{"label":"«У меня есть» — это have, а не there is","text":"there is — «где-то есть», а владение — have / have got.","en":"I [[have]] a car.","ru":"У меня есть машина."}]},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"~~In the room is~~ a table.","right":"[[There is]] a table in the room.","why":"Русский порядок «где → что» не работает: начинаем с there is."},{"wrong":"~~It is~~ a lot of traffic today.","right":"[[There is]] a lot of traffic today.","why":"Сообщаем, что что-то есть, — there is; it is — о погоде, времени или уже названном."},{"wrong":"~~There is~~ two lifts in the building.","right":"[[There are]] two lifts in the building.","why":"Мн. ч. → there are."},{"wrong":"~~There is a car at me.~~","right":"I [[have]] a car.","why":"«У меня есть» — have (have got), а не there is."},{"wrong":"~~There aren't no~~ problems.","right":"[[There aren't any]] problems. / [[There are no]] problems.","why":"Одно отрицание на предложение: aren't any или are no."}]},{"type":"quiz","items":[{"q":"___ a bus stop near my house, so I get to university quickly.","a":"There is","alt":["There's"],"why":"Сейчас и одна вещь (a bus stop) → there is."},{"q":"___ there many people at the meeting yesterday?","a":"Were","why":"Прошлое (yesterday) и мн. ч. (people) → were."},{"q":"There ___ (not / be) any milk in the fridge. Can you buy some?","a":"isn't","why":"Сейчас; milk неисчисляемое → is; отрицание — isn't any."},{"q":"How many floors ___ ___ in this building?","a":["are","there"],"why":"Вопрос: how many + сущ. + are there."},{"q":"___ cold today. Put on a jacket.","options":["It's","There's","There are"],"a":"It's","why":"Погода — через it is."},{"q":"___ a new café near the station. It's very good.","options":["There's","It's","There are"],"a":"There's","why":"Впервые сообщаем, что кафе есть, — there is."},{"q":"Next year ___ a new metro station here.","options":["there will be","there was","there were"],"a":"there will be","why":"Будущее (next year) → there will be."},{"q":"There are ___ chairs in the room, so we have to stand.","options":["no","not","any"],"a":"no","why":"are + no = нет ни одного; any требует отрицания aren't."}]},{"type":"summary","points":["[[There is / There are]] + что + где — «где-то что-то есть»; переводим с конца.","is или are — по тому, что идёт после: [[there is]] a…, [[there are]] two…","Прошлое: [[there was / there were]]; будущее: [[there will be]].","Вопрос: [[Is there]]…? [[Are there]]…? Отрицание: [[there isn't any]] / [[there is no]].","Есть (новое) → there is; оно (уже названное), погода, время → it is."]}]},{"id":"nouns","title":"Nouns","subtitle":"Существительные: число, исчисляемость, «чей»","level":"A1–B1","tagline":"Как образовать множественное число, почему нельзя сказать «an advice» и как сказать «машина брата».","formula":"сущ. + [[-s / -es]]","blocks":[{"type":"table","title":"Множественное число: правила","head":["Слово оканчивается на","Что делаем","Пример"],"rows":[["почти любую букву","+ s","map → [[maps]], engineer → [[engineers]]"],["-s, -ss, -sh, -ch, -x","+ es","bus → [[buses]], box → [[boxes]], bench → [[benches]]"],["-o (часть слов)","+ es","potato → [[potatoes]], tomato → [[tomatoes]], hero → [[heroes]]"],["согласная + y","y → ies","city → [[cities]], company → [[companies]]"],["гласная + y","+ s","day → [[days]], key → [[keys]], survey → [[surveys]]"],["-f / -fe (часть слов)","f → ves","shelf → [[shelves]], knife → [[knives]], life → [[lives]]"]],"note":"Исключения: photo → [[photos]], piano → [[pianos]], kilo → [[kilos]] — просто -s; roof → [[roofs]] (крыши), chief → [[chiefs]] — без -ves."},{"type":"table","title":"Неправильное множественное число","head":["Одно","Много","Перевод"],"rows":[["man","[[men]]","мужчина — мужчины"],["woman","[[women]]","женщина — женщины"],["child","[[children]]","ребёнок — дети"],["person","[[people]]","человек — люди"],["foot","[[feet]]","ступня, фут — ступни, футы"],["tooth","[[teeth]]","зуб — зубы"],["mouse","[[mice]]","мышь — мыши"],["sheep","[[sheep]]","овца — овцы (не меняется)"],["fish","[[fish]]","рыба — рыбы (не меняется)"],["series, species","[[series]], [[species]]","серия, вид — не меняются"]],"note":"В научно-технических текстах встретишь латинские и греческие формы: criterion → [[criteria]], phenomenon → [[phenomena]], analysis → [[analyses]], axis → [[axes]]."},{"type":"compare","title":"Исчисляемые и неисчисляемые","left":{"title":"Исчисляемые","sub":"можно посчитать: one, two, three","points":["Есть ед. и мн. ч.","В ед. ч. нужен a / an: a brick.","many, a few, how many."],"examples":[{"en":"I have [[a question]].","ru":"У меня вопрос."},{"en":"We need 200 [[bricks]].","ru":"Нам нужно 200 кирпичей."}]},"right":{"title":"Неисчисляемые","sub":"нельзя посчитать поштучно","points":["Нет мн. ч. и нет a / an.","Глагол в ед. ч.: water is.","much, a little, how much."],"examples":[{"en":"We need some [[water]].","ru":"Нам нужно немного воды."},{"en":"This [[information]] is useful.","ru":"Эта информация полезна."}]},"note":"Неисчисляемые — это вещества (water, sand, cement), абстрактные понятия (help, time, fun) и слова-«собрания» (furniture, equipment, luggage)."},{"type":"table","title":"Ловушки: в русском считаются, в английском — нет","head":["Слово","Значение","Как сказать"],"rows":[["advice","совет, советы","[[a piece of advice]], some advice"],["information","информация, сведения","[[a piece of information]]"],["news","новость, новости","[[a piece of news]]; the news is good"],["furniture","мебель","[[a piece of furniture]]"],["equipment","оборудование","[[a piece of equipment]]"],["luggage","багаж, чемоданы","[[a piece of luggage]]"],["money","деньги","The money [[is]] on the table."],["hair","волосы","Her hair [[is]] long. (a hair — один волосок)"],["knowledge","знания","His knowledge of maths [[is]] good."],["research","исследования","do some [[research]]"],["homework","домашнее задание","a lot of [[homework]]; одно задание — [[an exercise]]"],["work","работа, труд","a lot of [[work]]; должность — [[a job]]"]],"note":"Эти слова — без a / an и без -s, глагол после них в ед. ч.: The information [[is]] correct. — Сведения верные."},{"type":"table","title":"Как посчитать неисчисляемое","head":["Мера","Пример","Перевод"],"rows":[["a piece of","[[a piece of]] advice / furniture","совет / предмет мебели"],["a sheet of","[[a sheet of]] paper","лист бумаги"],["a bottle of","[[a bottle of]] water","бутылка воды"],["a cup of / a glass of","[[a cup of]] tea, [[a glass of]] milk","чашка чая, стакан молока"],["a bag of","[[a bag of]] cement","мешок цемента"],["a loaf of / a slice of","[[a loaf of]] bread, [[a slice of]] bread","буханка хлеба, ломтик хлеба"],["a litre of / a kilo of","[[a litre of]] petrol, [[a kilo of]] sugar","литр бензина, килограмм сахара"]],"note":"Во мн. ч. меняется только мера: two [[bottles of]] water, three [[pieces of]] advice (не ~~advices~~, не ~~furnitures~~)."},{"type":"points","title":"is или are после существительного","items":[{"label":"news — ед. ч., хоть и на -s","en":"The news [[is]] good.","ru":"Новости хорошие."},{"label":"Науки на -ics — ед. ч.","text":"mathematics, physics, economics, electronics.","en":"Physics [[is]] my favourite subject.","ru":"Физика — мой любимый предмет."},{"label":"police и people — всегда мн. ч.","en":"The police [[are]] looking for the driver.","ru":"Полиция ищет водителя.","examples":[{"en":"These people [[are]] from our company.","ru":"Эти люди из нашей компании."}]},{"label":"Парные предметы — только мн. ч.","text":"trousers, jeans, glasses, scissors; «одна штука» — a pair of.","en":"My new jeans [[are]] too long.","ru":"Мои новые джинсы слишком длинные.","examples":[{"en":"I need [[a pair of]] scissors.","ru":"Мне нужны ножницы."}]}],
"note":"В британском английском team, family, staff, government могут идти с are, когда думаем о людях: The team [[are]] happy. В американском обычно is."},{"type":"formula","title":"Притяжательный падеж: чей?","rows":[{"sign":"ед. ч.","formula":"сущ. + [['s]]","en":"my [[brother's]] car","ru":"машина моего брата"},{"sign":"мн. ч. на -s","formula":"сущ. + [[']]","en":"my [[parents']] flat","ru":"квартира моих родителей"},{"sign":"мн. ч. без -s","formula":"сущ. + [['s]]","en":"the [[children's]] room","ru":"детская комната"},{"sign":"вещи","formula":"the + сущ. + [[of]] + сущ.","en":"the roof [[of]] the building","ru":"крыша здания"}],
"note":"brother's и brothers' звучат одинаково — разницу видно только на письме: my [[brother's]] friends (друзья брата), my [[brothers']] friends (друзья братьев)."},{"type":"points","title":"'s, of или два существительных подряд?","items":[{"label":"'s — люди, животные, организации, время","en":"[[Anna's]] phone, [[today's]] lecture","ru":"телефон Анны, сегодняшняя лекция","examples":[{"en":"the [[company's]] new office","ru":"новый офис компании"}]},{"label":"of — вещи, части, места","en":"the end [[of]] the lesson, the centre [[of]] the city","ru":"конец урока, центр города"},{"label":"Сущ. + сущ. — какой, для чего","text":"Первое существительное работает как прилагательное и стоит в ед. ч.","en":"a [[road map]], a [[building site]], a [[car key]]","ru":"карта дорог, стройплощадка, ключ от машины","examples":[{"en":"a [[ten-storey]] building","ru":"десятиэтажное здание"}]}],
"note":"С людьми естественнее 's: [[my brother's]] car, а не the car of my brother. С вещами — of: the roof of the house (the house's roof звучит непривычно)."},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"Can you give me ~~an advice~~?","right":"Can you give me [[some advice]] / [[a piece of advice]]?","why":"advice неисчисляемое: без a и без -s."},{"wrong":"The news ~~are~~ bad.","right":"The news [[is]] bad.","why":"news — ед. ч., хоть и оканчивается на -s."},{"wrong":"I need some ~~informations~~.","right":"I need some [[information]].","why":"information не бывает во мн. ч."},{"wrong":"Many ~~peoples~~ come here in summer.","right":"Many [[people]] come here in summer.","why":"people — уже мн. ч.; peoples значит «народы»."},{"wrong":"I have a lot of ~~works~~ this week.","right":"I have a lot of [[work]] this week.","why":"work (труд, дела) неисчисляемое; должность — a job."}]},{"type":"quiz","items":[{"q":"one shelf — two ___","a":"shelves","why":"-f → -ves."},{"q":"one photo — three ___","a":"photos","why":"photo — исключение: просто -s."},{"q":"one child — two ___","a":"children","why":"Неправильная форма мн. ч."},{"q":"Where ___ (be) the money? I can't find it.","a":"is","why":"money неисчисляемое → глагол в ед. ч."},{"q":"Could you give me ___?","options":["an advice","some advice","some advices"],"a":"some advice","why":"advice неисчисляемое: без a и без -s."},{"q":"The police ___ looking for the driver.","options":["is","are"],"a":"are","why":"police — всегда мн. ч."},{"q":"This is the ___ playground.","options":["children's","childrens'","childs'"],"a":"children's","why":"children — мн. ч. без -s, поэтому 's."},{"q":"My cousin has got a new ___ at a construction company.","options":["work","job"],"a":"job","why":"Конкретная должность — исчисляемое a job; work — труд вообще."}]},{"type":"summary","points":["Мн. ч.: [[+s]]; после s, sh, ch, x — [[+es]]; согласная + y → [[-ies]]; часть слов на -f → [[-ves]].","Неправильные: [[men, women, children, people, feet, teeth, mice]]; sheep и fish не меняются.","advice, information, news, money, work, furniture — без a и -s; считаем через [[a piece of]].","news [[is]], physics [[is]]; police [[are]], people [[are]].","Чей: [[brother's]] (люди), [[parents']] (мн. ч. на -s), [[of]] (вещи)."]}]},{"id":"articles","title":"Articles","subtitle":"Артикли a / an, the и нулевой артикль","level":"A2–B1","tagline":"Главное, чего нет в русском: артикль показывает, «какой-то» это предмет или «тот самый».","formula":"[[a / an / the]] + сущ.","blocks":[{"type":"table","title":"Главная схема","head":["Смысл","Одна вещь","Много (мн. ч.)","Неисчисляемое"],"rows":[["какой-то, впервые","[[a]] map","maps, some maps","water, some water"],["тот самый, известный","[[the]] map","[[the]] maps","[[the]] water"],["вообще, в целом","без артикля не бывает","maps","water"]],"note":"Главное правило: исчисляемое существительное в ед. ч. не стоит «голым» — перед ним всегда a / an, the, my, this и т. п."},{"type":"table","title":"a или an — по звуку, а не по букве","head":["Слово начинается","Артикль","Примеры"],"rows":[["с согласного звука","a","[[a]] map, [[a]] big office"],["с гласного звука","an","[[an]] engineer, [[an]] idea, [[an]] old house"],["с гласной буквы, но звука [j] или [w]","a","[[a]] university, [[a]] European country, [[a]] one-way street"],["с немой h","an","[[an]] hour, [[an]] honest answer"],["аббревиатура — по названию первой буквы","a / an","[[an]] SMS, [[an]] MRI scan, [[a]] GPS receiver"]],"note":"Смотри на слово сразу после артикля: an engineer, но a young engineer. И проверяй на слух: hour [aʊ] → an hour, university [juː] → a university."},{"type":"uses","title":"Когда нужен a / an","items":[{"label":"Упоминаем впервые","en":"There's [[a]] problem with my laptop.","ru":"С моим ноутбуком какая-то проблема."},{"label":"Профессия, кто такой человек","text":"По-русски ни связки, ни артикля, по-английски нужны оба.","en":"She is [[an]] engineer.","ru":"Она инженер."},{"label":"Что это? Один из многих","en":"What's this? — It's [[a]] theodolite.","ru":"Что это? — Это теодолит.","examples":[{"en":"He works for [[a]] big company.","ru":"Он работает в крупной компании."}]},{"label":"Частота и скорость: «в»","en":"twice [[a]] week, 60 kilometres [[an]] hour","ru":"два раза в неделю, 60 километров в час"},{"label":"Восклицание What a…!","en":"What [[a]] beautiful view!","ru":"Какой красивый вид!"}]},{"type":"uses","title":"Когда нужен the","items":[{"label":"Уже упоминали","en":"I bought a map and a compass. [[The]] map was old.","ru":"Я купил карту и компас. Карта была старая."},{"label":"Из ситуации понятно, какой именно","en":"Can you close [[the]] window, please?","ru":"Можешь закрыть окно?"},{"label":"Единственный в своём роде","text":"the sun, the moon, the sky, the world, the internet.","en":"[[The]] sun rises in the east.","ru":"Солнце встаёт на востоке."},{"label":"Превосходная степень, the first, the only, the same","en":"It's [[the]] tallest building in the city.","ru":"Это самое высокое здание в городе.","examples":[{"en":"This is [[the]] only way.","ru":"Это единственный путь."}]},{"label":"Уточнение с of","en":"[[The]] price of the flat is too high.","ru":"Цена квартиры слишком высокая."}]},{"type":"compare","title":"Вообще или конкретно?","left":{"title":"Без артикля","sub":"вообще, все такие","points":["Мн. ч. и неисчисляемые в общем смысле.","По-русски: «люди», «деньги», «кофе» вообще."],"examples":[{"en":"I don't like [[coffee]].","ru":"Я не люблю кофе."},{"en":"[[Students]] often study at night.","ru":"Студенты часто занимаются по ночам."}]},"right":{"title":"the","sub":"конкретные, известные","points":["Понятно, какие именно: из этого места, из этой группы."],"examples":[{"en":"[[The]] coffee in this café is terrible.","ru":"Кофе в этом кафе ужасный."},{"en":"[[The]] students in my group are friendly.","ru":"Студенты в моей группе дружелюбные."}]},"note":"Частая ошибка — ставить the «на всякий случай». Говоришь о чём-то вообще — артикль не нужен: Life is short. Money isn't everything."},{"type":"table","title":"Особые случаи","head":["Правило","Пример","Перевод"],"rows":[["музыкальные инструменты — с the","play [[the]] piano / [[the]] guitar","играть на пианино / гитаре"],["спорт и игры — без артикля","play [[football]] / [[chess]]","играть в футбол / шахматы"],["приёмы пищи — без артикля","have [[breakfast]] / [[lunch]] / [[dinner]]","завтракать / обедать / ужинать"],["языки и предметы — без артикля","speak [[English]], study [[maths]]","говорить по-английски, изучать математику"],["учреждение по назначению — без the","go to [[school]] / [[university]] / [[work]] / [[bed]]","учиться в школе / в вузе, ходить на работу, ложиться спать"],["здание просто как место — с the","go to [[the]] school for a meeting","прийти в школу (в здание) на собрание"],["транспорт с by — без артикля","by [[bus]], by [[train]], by [[car]]","на автобусе, поездом, на машине"]],"note":"Сравни: My brother goes to [[school]]. (учится) — Mum went to [[the]] school to meet his teacher. (пришла в здание). В разговоре, особенно американском, инструменты часто без артикля: play guitar."},{"type":"table","title":"Географические названия","head":["Что","Артикль","Примеры"],"rows":[["реки, моря, океаны, каналы","the","[[the]] Volga, [[the]] Thames, [[the]] Black Sea, [[the]] Pacific"],["горные цепи, группы островов","the","[[the]] Alps, [[the]] Urals, [[the]] Canary Islands"],["пустыни","the","[[the]] Sahara, [[the]] Gobi"],["страны со словами States, Kingdom, Republic и во мн. ч.","the","[[the]] USA, [[the]] UK, [[the]] Czech Republic, [[the]] Netherlands"],["большинство стран, городов, континентов","—","Russia, France, Moscow, Europe, Asia"],["отдельные горы и озёра","—","Everest, Elbrus, Lake Baikal"],["улицы, площади, парки","—","Tverskaya Street, Red Square, Gorky Park"]],"note":"Есть of — ставим the: [[the]] Gulf of Finland, [[the]] Republic of Tatarstan, [[the]] University of London (но Moscow State University — без the)."},{"type":"markers","title":"Устойчивые выражения — запомни целиком","groups":[{"label":"Без артикля","chips":["at home|дома","at work|на работе","go home|идти домой","by bus|на автобусе","on foot|пешком","at night|ночью","in bed|в постели","at first|сначала"]},{"label":"С the","chips":["in the morning|утром","in the evening|вечером","at the weekend|в выходные (BrE)","on the left|слева","in the centre|в центре","the same|тот же самый","the other day|на днях"]},{"label":"С a / an","chips":["a lot of|много","a bit|немного","have a look|взглянуть","have a rest|отдохнуть","in a hurry|в спешке","It's a pity|жаль"]}],
"note":"Логики тут мало: in the morning, но at night. Такие сочетания проще заучить как одно слово."},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"She is ~~engineer~~.","right":"She is [[an]] engineer.","why":"Профессия в ед. ч. — всегда с a / an."},{"wrong":"Yesterday I bought ~~new phone~~.","right":"Yesterday I bought [[a]] new phone.","why":"Исчисляемое в ед. ч. не бывает «голым»."},{"wrong":"I like ~~the music~~.","right":"I like [[music]].","why":"О чём-то вообще — без артикля."},{"wrong":"I go to ~~the bed~~ at 11.","right":"I go to [[bed]] at 11.","why":"go to bed / school / work — по назначению, без the."},{"wrong":"It takes ~~a hour~~.","right":"It takes [[an]] hour.","why":"h не читается — слово начинается с гласного звука."}]},{"type":"quiz","items":[{"q":"My sister is ___ architect — she designs houses.","a":"an","why":"Профессия → a / an; architect начинается с гласного звука."},{"q":"It takes ___ hour to get to the site.","a":"an","why":"hour читается с гласного звука [aʊ]."},{"q":"Bulgaria is ___ European country.","a":"a","why":"European начинается со звука [j] — значит a."},{"q":"I bought a jacket and a hat. ___ jacket was quite expensive.","a":"The","why":"Куртку уже упоминали — the."},{"q":"Last winter we went skiing in ___ Alps.","a":"the","why":"Горные цепи — с the."},{"q":"I don't like ___ coffee. I prefer tea.","options":["the","a","— (без артикля)"],"a":"— (без артикля)","why":"Кофе вообще — неисчисляемое в общем смысле, без артикля."},{"q":"My brother plays ___ piano.","options":["the","a","an"],"a":"the","why":"Музыкальные инструменты — с the."},{"q":"I'm really tired. I'm going to ___.","options":["bed","the bed","a bed"],"a":"bed","why":"go to bed — устойчивое сочетание без артикля."}]},{"type":"summary","points":["Исчисляемое в ед. ч. не бывает «голым»: [[a / an]], [[the]], my, this…","[[a / an]] — какой-то, впервые, профессия; [[the]] — тот самый, известный, единственный.","a или an — по звуку: [[an]] hour, [[a]] university.","Вообще (мн. ч., неисчисляемые) — без артикля: I like music.","С the: реки, моря, горные цепи, the USA, the UK; без: большинство стран, городов, Lake Baikal."]}]},{"id":"pronouns","title":"Pronouns","subtitle":"Местоимения","level":"A1–B1","tagline":"I или me, my или mine, myself, this, somebody — какую форму взять и куда её поставить.","blocks":[{"type":"table","title":"Главная таблица","head":["Кто?","Кого? Кому?","Чей + сущ.","Чей (без сущ.)","Себя, сам"],"rows":[["I","me","my","mine","myself"],["you","you","your","yours","yourself / yourselves"],["he","him","his","his","himself"],["she","her","her","hers","herself"],["it","it","its","—","itself"],["we","us","our","ours","ourselves"],["they","them","their","theirs","themselves"]],"note":"its (его, её — о предмете) пишется без апострофа, а it's = it is: The company changed [[its]] name. — Компания сменила название."},{"type":"points","title":"I или me?","items":[{"label":"Перед глаголом (кто?) — I, he, she, we, they","en":"[[We]] live in Tula.","ru":"Мы живём в Туле."},{"label":"После глагола и предлога — me, him, her, us, them","en":"Call [[me]] tomorrow.","ru":"Позвони мне завтра.","examples":[{"en":"This letter is for [[him]].","ru":"Это письмо для него."},{"en":"Come with [[us]]!","ru":"Пойдём с нами!"}]},{"label":"В коротком ответе — объектная форма","en":"Who's there? — It's [[me]].","ru":"Кто там? — Это я.","examples":[{"en":"I'm hungry. — [[Me]] too.","ru":"Я голоден. — Я тоже."}]},{"label":"Себя — последним","text":"В паре с другим человеком о себе говорят в конце.","en":"Anna and [[I]] are in the same group.","ru":"Мы с Анной в одной группе."},{"label":"it — о вещах и животных","text":"О предметах не говорят he / she, даже если по-русски «он» или «она».","en":"Where's my phone? — [[It's]] on the desk.","ru":"Где мой телефон? — Он на столе."}]},{"type":"compare","title":"my или mine?","left":{"title":"my, your, his, her, our, their","sub":"перед существительным","points":["После них всегда идёт существительное."],"examples":[{"en":"This is [[my]] laptop.","ru":"Это мой ноутбук."},{"en":"Is this [[your]] bag?","ru":"Это твоя сумка?"}]},"right":{"title":"mine, yours, his, hers, ours, theirs","sub":"без существительного","points":["Заменяют «мой + предмет».","a friend of mine = один из моих друзей."],"examples":[{"en":"This laptop is [[mine]].","ru":"Этот ноутбук мой."},{"en":"Whose is this bag? — It's [[hers]].","ru":"Чья это сумка? — Её."}]},"note":"«Мой друг» (один из) — a friend of [[mine]], не ~~a friend of me~~."},{"type":"uses","title":"Возвратные: myself, yourself…","items":[{"label":"Действие на себя","en":"He cut [[himself]] on a piece of glass.","ru":"Он порезался о стекло.","examples":[{"en":"Be careful! Don't hurt [[yourself]].","ru":"Осторожно! Не ушибись."}]},{"label":"Сам, без чужой помощи","en":"We built the garage [[ourselves]].","ru":"Мы сами построили гараж."},{"label":"by myself — в одиночку","en":"She lives [[by herself]].","ru":"Она живёт одна."},{"label":"Устойчивые выражения","en":"[[Help yourself]] to some cake!","ru":"Угощайся тортом!","examples":[{"en":"Did you [[enjoy yourselves]] at the party?","ru":"Вам понравилось на вечеринке?"}]}],
"note":"Многие русские «-ся» и «себя» по-английски идут без myself: feel, relax, concentrate, meet, wash, dress. I [[feel]] tired (не ~~I feel myself tired~~). Оделся — I [[got dressed]].","noteKind":"warn"},{"type":"compare","title":"themselves или each other?","left":{"title":"themselves","sub":"каждый — себя","examples":[{"en":"They looked at [[themselves]] in the mirror.","ru":"Они посмотрели на себя в зеркало."}]},"right":{"title":"each other","sub":"друг друга","examples":[{"en":"They looked at [[each other]].","ru":"Они посмотрели друг на друга."},{"en":"We've known [[each other]] for years.","ru":"Мы знаем друг друга много лет."}]},"note":"one another = each other, звучит чуть формальнее. Часто «друг друга» и вовсе не нужно: We [[met]] at university. — Мы познакомились в университете."},{"type":"table","title":"this / that / these / those","head":["","Близко: этот, эти","Далеко: тот, те"],"rows":[["одна вещь","[[this]] book","[[that]] house"],["много","[[these]] books","[[those]] houses"],["время","[[this]] week — на этой неделе","[[that]] day — в тот день"],["в речи","[[This is]] Pavel. — Это Павел.","[[That's]] right! — Верно!"]],"note":"these / those — только с мн. ч.: [[these]] people, [[those]] jeans (не ~~this people~~)."},{"type":"table","title":"somebody, anything, nowhere…","head":["","some-","any-","no-","every-"],"rows":[["люди","somebody / someone — кто-то","anybody / anyone — кто-нибудь","nobody / no one — никто","everybody / everyone — все"],["вещи","something — что-то","anything — что-нибудь","nothing — ничего","everything — всё"],["места","somewhere — где-то","anywhere — где-нибудь","nowhere — нигде","everywhere — везде"]],"note":"Выбор как у some / any: some- — в утверждении, any- — в вопросе и после not, no- — само по себе отрицание. I didn't see [[anybody]]. = I saw [[nobody]]. — Я никого не видел."},{"type":"points","title":"Как с ними обращаться","items":[{"label":"Одно отрицание","text":"По-русски «никто не пришёл» — два отрицания, по-английски — одно.","en":"[[Nobody]] came.","ru":"Никто не пришёл."},{"label":"Глагол — в ед. ч.","en":"[[Everybody is]] here.","ru":"Все здесь.","examples":[{"en":"[[Everything is]] ready.","ru":"Всё готово."}]},{"label":"something + прилагательное","text":"Прилагательное и else ставим после.","en":"Let's do [[something interesting]].","ru":"Давай сделаем что-нибудь интересное.","examples":[{"en":"Do you need [[anything else]]?","ru":"Тебе нужно что-нибудь ещё?"}]},{"label":"any- в утверждении = «любой, что угодно»","en":"You can ask me [[anything]].","ru":"Можешь спрашивать меня о чём угодно."},{"label":"some- в просьбах и предложениях","en":"Would you like [[something]] to drink?","ru":"Хочешь чего-нибудь выпить?"}],
"note":"После somebody, everybody вместо «его или её» обычно ставят their: Somebody left [[their]] umbrella here. — Кто-то оставил здесь зонт."},{"type":"note","kind":"tip","title":"one / ones — чтобы не повторять существительное","text":"Вместо уже названного исчисляемого существительного ставим one (ед. ч.) или ones (мн. ч.). Подробнее — в главе про it, one и that.","en":"This drill is too old. We need a new [[one]].","ru":"Эта дрель слишком старая. Нам нужна новая."},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"~~Me and Anna~~ went to the cinema.","right":"Anna and [[I]] went to the cinema.","why":"Подлежащее — I, а себя называем последним."},{"wrong":"I ~~feel myself~~ tired.","right":"I [[feel]] tired.","why":"feel, relax, concentrate — без myself, хотя по-русски «чувствую себя»."},{"wrong":"~~This people~~ are my colleagues.","right":"[[These]] people are my colleagues.","why":"people — мн. ч., значит these."},{"wrong":"~~Nobody didn't come.~~","right":"[[Nobody]] came.","why":"nobody уже значит «никто не» — второе отрицание лишнее."},{"wrong":"Is this pen ~~your~~?","right":"Is this pen [[yours]]?","why":"Без существительного после — yours, mine, hers…"}]},{"type":"quiz","items":[{"q":"Can you help ___ with this task? (я)","a":"me","why":"После глагола — объектная форма me."},{"q":"This isn't my bag. I think it's ___. (её)","a":"hers","why":"Без существительного после — hers."},{"q":"They built the garage ___. (сами)","a":"themselves","alt":["by themselves"],"why":"«Сами» для they — themselves (или by themselves — без чужой помощи)."},{"q":"___ is here, so we can start. (все)","a":"Everybody","alt":["Everyone"],"why":"«Все (люди)» — everybody / everyone, глагол в ед. ч."},{"q":"Anna and Tom often help ___ with homework.","options":["each other","themselves","theirselves"],"a":"each other","why":"«Друг другу» — each other; theirselves не существует."},{"q":"There isn't ___ in the fridge.","options":["anything","nothing","something"],"a":"anything","why":"После not — any-; nothing дало бы двойное отрицание."},{"q":"Look at ___ cranes over there!","options":["this","these","those"],"a":"those","why":"Далеко (over there) и мн. ч. — those."},{"q":"I want to tell you ___.","options":["something important","important something","an important something"],"a":"something important","why":"Прилагательное ставим после something."}]},{"type":"summary","points":["Перед глаголом — [[I, he, she, we, they]]; после глагола и предлога — [[me, him, her, us, them]].","[[my]] + сущ.; без сущ. — [[mine, yours, hers, ours, theirs]].","[[myself]] — действие на себя или «сам»; [[each other]] — «друг друга».","[[this / these]] — близко, [[that / those]] — далеко.","[[nobody, nothing]] — уже отрицание; [[something]] + прилагательное."]}]},{"id":"quantifiers","title":"Quantifiers","subtitle":"Количество: some, any, much, many, a few, a little","level":"A2–B1","tagline":"Как сказать «немного», «много», «мало» и «совсем нет» — и почему для денег и для друзей нужны разные слова.","formula":"[[much / many / a lot of]] + сущ.","blocks":[{"type":"markers","title":"Шкала: от «нисколько» до «слишком много»","groups":[{"label":"С исчисляемыми (мн. ч.)","chips":["no|ни одного","very few|очень мало","a few|несколько","some|сколько-то","many / a lot of|много","too many|слишком много"]},{"label":"С неисчисляемыми","chips":["no|нисколько","very little|очень мало","a little|немного","some|сколько-то","much / a lot of|много","too much|слишком много"]}],
"note":"some, no, a lot of, lots of, plenty of, enough подходят и к тем, и к другим.","en":"We need [[a few]] bricks and [[a little]] cement.","ru":"Нам нужно несколько кирпичей и немного цемента."},{"type":"formula","title":"some / any / no","rows":[{"sign":"+","formula":"[[some]] + мн. ч. / неисч.","en":"I've got [[some]] questions.","ru":"У меня есть вопросы."},{"sign":"-","formula":"not + [[any]]","en":"I don't have [[any]] money.","ru":"У меня нет денег."},{"sign":"-","formula":"[[no]] (без not)","en":"I have [[no]] money.","ru":"У меня совсем нет денег."},{"sign":"?","formula":"[[any]] + ?","en":"Do you have [[any]] brothers or sisters?","ru":"У тебя есть братья или сёстры?"}],
"note":"no = not any, но звучит категоричнее. Два отрицания нельзя: ~~I don't have no money~~.","noteKind":"warn"},{"type":"uses","title":"Когда some и any «нарушают» правило","items":[{"label":"some в просьбах и предложениях","text":"Когда ждём ответа «да».","en":"Would you like [[some]] tea?","ru":"Хочешь чаю?","examples":[{"en":"Can I have [[some]] water, please?","ru":"Можно мне воды?"}]},{"label":"some = некоторые (не все)","en":"[[Some]] students work at weekends.","ru":"Некоторые студенты работают по выходным."},{"label":"any в утверждении = любой","en":"You can take [[any]] bus from here.","ru":"Отсюда можно уехать на любом автобусе."},{"label":"any после if","en":"If you have [[any]] questions, call me.","ru":"Если будут вопросы — звони."}],
"note":"somebody, anything, nowhere подчиняются тем же правилам — подробнее в главе про местоимения."},{"type":"compare","title":"many или much?","left":{"title":"many","sub":"исчисляемые, мн. ч.","points":["how many — сколько (штук)"],"examples":[{"en":"There aren't [[many]] parks in our town.","ru":"В нашем городе мало парков."}]},"right":{"title":"much","sub":"неисчисляемые","points":["how much — сколько (чего)"],"examples":[{"en":"I don't have [[much]] time.","ru":"У меня мало времени."}]},"note":"much и many — в основном в отрицаниях и вопросах. В утверждении естественнее a lot of: We have [[a lot of]] time. (We have much time звучит книжно.)"},{"type":"table","title":"Много: a lot of, lots of, plenty of","head":["Выражение","С чем","Пример"],"rows":[["a lot of","мн. ч. и неисч.","We've got [[a lot of]] work this week."],["lots of","то же, разговорное","There were [[lots of]] people at the concert."],["plenty of","«с запасом, более чем достаточно»","Don't hurry — we've got [[plenty of]] time."],["a lot (без сущ.)","в конце, после глагола","She travels [[a lot]]."]],"note":"a lot of — только если дальше идёт существительное. Нет существительного — просто a lot: I like it [[a lot]] (не ~~a lot of~~)."},{"type":"compare","title":"a few / a little или few / little?","left":{"title":"a few / a little","sub":"немного — и этого хватает","points":["a few + мн. ч.: a few friends","a little + неисч.: a little money"],"examples":[{"en":"I have [[a few]] friends in Omsk, so I'm not lonely there.","ru":"У меня в Омске есть несколько друзей, так что мне там не одиноко."},{"en":"We've got [[a little]] time before the train. Let's have a coffee.","ru":"До поезда есть немного времени. Давай выпьем кофе."}]},"right":{"title":"few / little","sub":"мало, почти нет — не хватает","points":["few + мн. ч., little + неисч.","Звучит книжно; в разговоре — very few, not many, not much."],"examples":[{"en":"He has very [[few]] friends, so he's often lonely.","ru":"У него очень мало друзей, поэтому ему часто одиноко."},{"en":"Hurry up! We have very [[little]] time.","ru":"Быстрее! У нас очень мало времени."}]},"note":"Артикль a меняет смысл: a little — «немного есть» (хорошо), little — «почти нет» (плохо)."},{"type":"formula","title":"Сколько? How many / How much","rows":[{"sign":"?","formula":"[[How many]] + мн. ч. + ?","en":"[[How many]] floors does the building have?","ru":"Сколько этажей в здании?"},{"sign":"?","formula":"[[How much]] + неисч. + ?","en":"[[How much]] cement do we need?","ru":"Сколько цемента нам нужно?"},{"sign":"Цена","formula":"[[How much]] + is / are + … + ?","en":"[[How much]] is this laptop?","ru":"Сколько стоит этот ноутбук?"}],
"note":"Если считаем в единицах (метры, литры, рубли) — how many: [[How many]] metres of cable do we need? Но деньги вообще — how much money."},{"type":"table","title":"Слишком много, слишком мало","head":["Выражение","С чем","Пример"],"rows":[["too many","мн. ч.","There are [[too many]] cars in the city centre."],["too much","неисч.","I drink [[too much]] coffee."],["too few","мн. ч.","There are [[too few]] parking spaces here."],["too little","неисч.","We have [[too little]] information."]],"note":"too — больше или меньше, чем нужно, это всегда «плохо». Просто «много» — a lot of. Подробнее о too и enough — в отдельной главе."},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"I don't have ~~some~~ money.","right":"I don't have [[any]] money.","why":"После not — any."},{"wrong":"How ~~much~~ students are there in your group?","right":"[[How many]] students are there in your group?","why":"Студентов можно посчитать — how many."},{"wrong":"I have ~~much~~ friends.","right":"I have [[a lot of]] friends.","why":"friends — исчисляемое (many), а в утверждении естественнее a lot of."},{"wrong":"I ~~don't have no~~ time.","right":"I [[don't have any]] time. / I [[have no]] time.","why":"Одно отрицание: либо not any, либо no."},{"wrong":"We've got ~~little~~ time, so let's have a coffee.","right":"We've got [[a little]] time, so let's have a coffee.","why":"Время есть, и его хватает, — a little; little = почти нет."}]},{"type":"quiz","items":[{"q":"Have you got ___ brothers or sisters?","a":"any","why":"Вопрос — any."},{"q":"How ___ water do you drink a day?","a":"much","why":"water неисчисляемое — how much."},{"q":"How ___ lectures do you have on Monday?","a":"many","why":"Лекции можно посчитать — how many."},{"q":"She reads a ___ — two or three books a week.","a":"lot","why":"Без существительного после — a lot, без of."},{"q":"Would you like ___ coffee?","options":["some","any","many"],"a":"some","why":"Предлагаем и ждём «да» — some."},{"q":"There are ___ cars in the city centre. The traffic is terrible.","options":["too many","too much","a few"],"a":"too many","why":"cars — мн. ч., и их больше, чем нужно."},{"q":"Don't worry, we have ___ time before the train. Let's have a coffee.","options":["a little","little","a few"],"a":"a little","why":"Немного, но хватает; time неисчисляемое."},{"q":"The town is boring: there are very ___ things to do.","options":["few","a few","little"],"a":"few","why":"Мало (плохо) + мн. ч. — very few."}]},{"type":"summary","points":["[[some]] — в утверждении, просьбах и предложениях; [[any]] — в вопросе и после not; [[no]] = not any.","[[many]] + мн. ч., [[much]] + неисч.; в утверждении чаще [[a lot of]].","[[a few / a little]] — немного (хватает); [[few / little]] — мало (не хватает).","[[How many]] + мн. ч.?, [[How much]] + неисч.? — и о цене.","[[too many / too much]] — слишком много; [[plenty of]] — с запасом."]}]},{"id":"all-each-both","title":"All, Every, Each, Both","subtitle":"Все, каждый, весь, оба, ни один","level":"A2–B1","tagline":"«Все», «каждый», «весь», «оба», «ни тот ни другой» — чем они отличаются и какой глагол ставить после них.","formula":"[[every / each]] + ед. ч. + V-s","blocks":[{"type":"compare","title":"all или every?","left":{"title":"all","sub":"все вместе","points":["+ мн. ч. или неисч.: all students, all the money","Глагол во мн. ч.: all students are"],"examples":[{"en":"[[All]] my friends live nearby.","ru":"Все мои друзья живут рядом."},{"en":"[[All]] metals conduct electricity.","ru":"Все металлы проводят электрический ток."}]},"right":{"title":"every","sub":"каждый — а значит, все","points":["+ ед. ч.: every student","Глагол в ед. ч.: every student is"],"examples":[{"en":"[[Every]] student has a student card.","ru":"У каждого студента есть студенческий билет."},{"en":"I go to the gym [[every]] week.","ru":"Я хожу в спортзал каждую неделю."}]},"note":"Смысл почти один, а форма разная: [[All]] the rooms have Wi-Fi. = [[Every]] room has Wi-Fi."},{"type":"table","title":"Как строится all","head":["Схема","Пример","Перевод"],"rows":[["all + мн. ч. / неисч.","[[all]] buildings, [[all]] equipment","все здания, всё оборудование"],["all (of) the / my + сущ.","[[all (of) the]] money, [[all (of) my]] friends","все деньги, все мои друзья"],["all of + us / you / them","[[all of us]], [[all of them]]","мы все, все они"],["подлежащее + all","We [[all]] agree. They are [[all]] here.","Мы все согласны. Они все здесь."],["all day / all week","[[all]] day, [[all]] night","весь день, всю ночь"]],"note":"Перед местоимением of обязателен: all [[of]] us (не ~~all us~~). «Всё» одним словом — [[everything]]: Everything is ready (не ~~All is ready~~).","noteKind":"warn"},{"type":"compare","title":"every или each?","left":{"title":"every","sub":"все подряд, без исключения","points":["Смотрим на группу целиком.","Только о трёх и больше.","Часто со временем: every day, every week."],"examples":[{"en":"[[Every]] house in this street has a garden.","ru":"У каждого дома на этой улице есть сад."}]},"right":{"title":"each","sub":"каждый по отдельности","points":["Смотрим на каждого отдельно.","Можно и о двоих: in each hand.","Бывает с of и без существительного: each of them."],"examples":[{"en":"He had a cup of coffee in [[each]] hand.","ru":"У него в каждой руке было по чашке кофе."},{"en":"[[Each]] student gets a different task.","ru":"Каждый студент получает своё задание."}]},"note":"Часто подходят оба: Each / Every room has a window. Но every не бывает с of: [[each of]] them или every one of them (не ~~every of them~~)."},{"type":"points","title":"Весь: all или the whole?","items":[{"label":"the whole + ед. ч. = весь, целиком","en":"I spent [[the whole]] day at the library.","ru":"Я провёл в библиотеке весь день.","examples":[{"en":"She read [[the whole]] book in one evening.","ru":"Она прочитала всю книгу за один вечер."}]},{"label":"all day / all week / all night — без the","en":"It rained [[all]] day.","ru":"Весь день шёл дождь."},{"label":"a whole = целый","en":"We waited for [[a whole]] hour!","ru":"Мы прождали целый час!"},{"label":"С неисчисляемыми — только all the","text":"the whole с неисчисляемыми не ставят: не ~~the whole money~~.","en":"They spent [[all the]] money.","ru":"Они потратили все деньги."}],
"note":"Следи за порядком слов: [[my whole]] life = [[all]] my life — вся моя жизнь."},{"type":"formula","title":"Про двоих: both, either, neither","rows":[{"sign":"оба","formula":"[[both]] + мн. ч.","en":"[[Both]] bridges are made of steel.","ru":"Оба моста стальные."},{"sign":"любой из двух","formula":"[[either]] + ед. ч.","en":"You can park on [[either]] side of the street.","ru":"Парковаться можно на любой стороне улицы."},{"sign":"ни один из двух","formula":"[[neither]] + ед. ч.","en":"[[Neither]] answer is correct.","ru":"Ни один из двух ответов не верен."}],

"note":"neither … nor уже содержит отрицание, поэтому глагол утвердительный: Neither Anna nor Oleg [[came]] (не ~~didn't come~~).","noteKind":"warn"},{"type":"table","title":"С of: all of us, each of them, none of…","head":["Выражение","Пример","Перевод"],"rows":[["all of us / them","[[All of us]] passed the test.","Мы все сдали тест."],["each of us / them","[[Each of them]] has a key.","У каждого из них есть ключ."],["both of us / them","[[Both of them]] are engineers.","Они оба инженеры."],["either of them","Is [[either of them]] at home?","Кто-нибудь из них двоих дома?"],["neither of them","[[Neither of them]] knows the answer.","Никто из них двоих не знает ответа."],["none of us / them","[[None of them]] came.","Никто из них не пришёл."]],"note":"Про двоих — both / either / neither of; про троих и больше — all / any / none of. Можно и без of: We [[both]] passed. They [[all]] came."},{"type":"table","title":"Какой глагол: ед. или мн. ч.?","head":["После","Глагол","Пример"],"rows":[["every / each + сущ.","ед. ч.","Every student [[has]] a card."],["everybody, everyone, everything","ед. ч.","Everyone [[is]] here."],["each of + мн. ч.","ед. ч.","Each of the rooms [[has]] a window."],["all / both + мн. ч.","мн. ч.","All the rooms [[have]] windows."],["neither of / either of","ед. ч. (в разговоре — и мн. ч.)","Neither of them [[is]] ready."],["none of + мн. ч.","ед. или мн. ч.","None of the lifts [[were]] / [[was]] working."]],"note":"После everybody глагол в ед. ч., но дальше обычно their: Everybody [[has]] their own opinion. — У каждого своё мнение."},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"~~Every students have~~ a card.","right":"[[Every]] student [[has]] a card.","why":"every + ед. ч., и глагол тоже в ед. ч."},{"wrong":"~~All is~~ ready.","right":"[[Everything]] is ready.","why":"«Всё» одним словом — everything; all в этом значении почти не используют."},{"wrong":"~~Every of~~ them got a prize.","right":"[[Each of]] them got a prize.","why":"every с of не бывает: each of или every one of."},{"wrong":"Neither Anna nor Oleg ~~didn't come~~.","right":"[[Neither]] Anna [[nor]] Oleg came.","why":"neither … nor уже отрицание — not не нужен."},{"wrong":"I spent ~~the whole money~~.","right":"I spent [[all the]] money.","why":"the whole не ставят с неисчисляемыми."}]},{"type":"quiz","items":[{"q":"___ student in our group has a laptop. (каждый)","a":"Every","alt":["Each"],"why":"Ед. ч. (student, has) — every или each."},{"q":"I've got two sisters. ___ of them are doctors. (обе)","a":"Both","why":"Про двоих, «обе» — both."},{"q":"It rained ___ day yesterday.","a":"all","alt":["the whole"],"why":"all day = the whole day = весь день."},{"q":"Every worker on the site ___ (have) a helmet.","a":"has","why":"every + ед. ч. → глагол в ед. ч."},{"q":"___ of my parents speaks English — they only speak Russian.","options":["Neither","Both","None"],"a":"Neither","why":"Родителей двое, и смысл отрицательный — neither (глагол в ед. ч.)."},{"q":"We can meet ___ on Friday or on Saturday.","options":["either","both","neither"],"a":"either","why":"«Либо … либо» — either … or."},{"q":"___ is ready for the inspection.","options":["Everything","All","Every"],"a":"Everything","why":"«Всё» без существительного — everything."},{"q":"There were five of us, but ___ of us knew the way.","options":["none","neither","no"],"a":"none","why":"Больше двух — none of."}]},{"type":"summary","points":["[[all]] + мн. ч. (глагол мн. ч.); [[every / each]] + ед. ч. (глагол ед. ч.).","[[each]] — каждый по отдельности, можно о двоих и с of; [[every]] — все подряд, без of.","Весь день: [[all day]] = [[the whole day]]; с неисчисляемыми — только [[all the]].","Про двоих: [[both]] (оба), [[either]] (любой), [[neither]] (ни один); про троих и больше — all / any / none.","[[neither … nor]] — глагол без not."]}]}]},{"id":"present","roman":"II","title":"Настоящее время","chapters":[{"id":"tenses-map","title":"English Tenses","subtitle":"Карта времён: 3 времени × 4 вида","level":"A2–B1","tagline":"12 времён — это не 12 отдельных правил, а 3 времени × 4 вида. Разберёшься в видах — таблица сложится сама.","formula":"[[Present / Past / Future]] + {{Simple / Continuous / Perfect / Perfect Continuous}}","blocks":[{"type":"uses","title":"Четыре вида — четыре взгляда на действие","items":[{"label":"Simple — просто факт","text":"Регулярно, всегда, по расписанию — или просто «случилось». Самый нейтральный вид.","en":"I [[work]] {{every day}}.","ru":"Я работаю каждый день.","examples":[{"en":"I [[worked]] late {{yesterday}}.","ru":"Вчера я работал допоздна."}]},{"label":"Continuous — процесс","text":"Действие в разгаре: идёт сейчас или шло (будет идти) в конкретный момент. Всегда be + V-ing.","en":"I[['m working]] {{now}}.","ru":"Я сейчас работаю.","examples":[{"en":"{{At 5 pm yesterday}} I [[was working]].","ru":"Вчера в 5 вечера я работал."}]},{"label":"Perfect — результат к моменту","text":"Действие случилось раньше какого-то момента, и важен итог к этому моменту. Всегда have + V3.","en":"I[['ve finished]] the drawing.","ru":"Я закончил чертёж.","examples":[{"en":"I [[had finished]] the drawing {{by Monday}}.","ru":"К понедельнику я уже закончил чертёж."}]},{"label":"Perfect Continuous — сколько длится","text":"Процесс начался раньше и тянется до момента (или только что закончился). Важно — как долго. Всегда have been + V-ing.","en":"I[['ve been working]] here {{for three years}}.","ru":"Я работаю здесь уже три года."}]},{"type":"timeline","title":"Simple и Continuous на оси","events":[{"kind":"dots","at":[-0.85,-0.6,-0.35,0.35,0.6,0.85],"label":"обычно — Simple"},{"kind":"span","from":-0.12,"to":0.12,"label":"сегодня — Continuous"}],
"caption":"Точки — то, что повторяется вообще (Simple). Волнистый отрезок вокруг «сейчас» — процесс, который идёт в этот момент (Continuous).","en":"I {{usually}} [[work]] in the office, but {{today}} I[['m working]] from home.","ru":"Обычно я работаю в офисе, но сегодня работаю из дома."},{"type":"timeline","title":"Perfect и Perfect Continuous на оси","events":[{"kind":"arrow","from":-0.6,"to":0,"label":"пишу с девяти"},{"kind":"mark","at":0,"label":"итог: 2 страницы"}],
"caption":"Perfect Continuous смотрит на процесс и его длительность (с девяти до сейчас). Perfect — на результат к моменту «сейчас» (две страницы готовы).","en":"I[['ve been writing]] {{since nine o'clock}}, and I[['ve written]] two pages.","ru":"Я пишу с девяти часов и уже написал две страницы."},{"type":"table","title":"12 времён: формулы и примеры с work","head":["Вид ↓ время →","Present","Past","Future"],"rows":[["Simple","V / V-s\nI [[work]]","V2 / V-ed\nI [[worked]]","will + V\nI [[will work]]"],["Continuous","am / is / are + V-ing\nI [[am working]]","was / were + V-ing\nI [[was working]]","will be + V-ing\nI [[will be working]]"],["Perfect","have / has + V3\nI [[have worked]]","had + V3\nI [[had worked]]","will have + V3\nI [[will have worked]]"],["Perfect Continuous","have / has been + V-ing\nI [[have been working]]","had been + V-ing\nI [[had been working]]","will have been + V-ing\nI [[will have been working]]"]],"note":"Время видно по первому вспомогательному глаголу (am → was → will be, have → had → will have), а вид — по тому, что идёт дальше: V-ing, V3 или been + V-ing."},{"type":"table","title":"Одно русское время — разные английские","head":["По-русски","По-английски","Почему так"],"rows":[["Я работаю в банке.","I [[work]] in a bank.","постоянно → Simple"],["Не мешай, я работаю.","Don't disturb me, I[['m working]].","прямо сейчас → Continuous"],["Я работаю здесь с 2020 года.","I[['ve been working]] here {{since 2020}}.","длится до сих пор → Perfect Continuous"],["В детстве я много читал.","I [[read]] a lot as a child.","факт прошлого → Simple"],["Я читал, когда он позвонил.","I [[was reading]] {{when}} he called.","процесс в момент → Continuous"],["Я читал эту книгу.","I[['ve read]] this book.","опыт к «сейчас» → Perfect"]],"note":"В русском всего два вида глагола (совершенный и несовершенный), и они не совпадают с английскими. Выбирай время по смыслу, а не по русской форме.","noteKind":"warn"},{"type":"uses","title":"Как выбрать: вопросы себе по порядку","items":[{"label":"Когда: сейчас, в прошлом или в будущем?","text":"Это выбирает время — и первый вспомогательный глагол: do / did / will, am / was / will be, have / had / will have."},{"label":"Факт или процесс?","text":"Просто факт, привычка, цепочка событий → Simple. Действие в разгаре в конкретный момент («в тот момент как раз…») → Continuous.","en":"{{At 8 pm}} I [[was having]] dinner.","ru":"В 8 вечера я ужинал."},{"label":"Важен результат или опыт к моменту?","text":"Итог к моменту, «уже», «ещё не», «когда-нибудь» → Perfect.","en":"I[['ve]] {{already}} [[done]] my homework.","ru":"Я уже сделал домашнее задание."},{"label":"Важно, как долго до этого момента?","text":"«Уже два часа», «с утра», «сколько времени?» — про процесс, который тянется до момента → Perfect Continuous.","en":"She[['s been waiting]] {{for an hour}}.","ru":"Она ждёт уже час."}]},{"type":"markers","title":"С чего начинать","groups":[{"label":"Сначала — эти пять","chips":["Present Simple|привычки, факты","Present Continuous|сейчас, временно","Past Simple|было и закончилось","Present Perfect|результат, опыт","will / be going to|будущее"]},{"label":"Потом","chips":["Past Continuous|процесс в прошлом","Past Perfect|раньше другого прошлого","Present Perfect Continuous|как долго до сих пор"]},{"label":"Сначала узнавать при чтении","chips":["Future Continuous|процесс в будущем","Future Perfect|сделано к моменту","Past Perfect Continuous","Future Perfect Continuous"]}],
"note":"Первой пятёрки хватает для большинства разговоров. Остальные чаще встречаются в книгах и технических текстах — сначала научись их узнавать, строить будешь позже."},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"I ~~am work~~ for a construction company.","right":"I [[work]] for a construction company.","why":"am / is / are + голый глагол не бывает: либо I work (Simple), либо I am working (Continuous)."},{"wrong":"Look, it ~~snowing~~!","right":"Look, it[['s snowing]]!","why":"Continuous без am / is / are не бывает: be + V-ing."},{"wrong":"I ~~am studying~~ English for three years.","right":"I[['ve been studying]] English {{for three years}}.","why":"«Учу уже три года» — процесс тянется до сих пор: Present Perfect Continuous."},{"wrong":"I ~~have seen~~ this film last week.","right":"I [[saw]] this film {{last week}}.","why":"С точным временем в прошлом (last week, yesterday, ago) — только Past Simple."},{"wrong":"Tomorrow I ~~go~~ to the dentist.","right":"I[['m going]] to the dentist {{tomorrow}}.","why":"Договорённость на будущее — Present Continuous; Present Simple о будущем — для расписаний."}]},{"type":"quiz","items":[{"q":"They [[were playing]] football at 6 pm yesterday. — Какой вид?","options":["Simple","Continuous","Perfect","Perfect Continuous"],"a":"Continuous","why":"was / were + V-ing — процесс в момент прошлого."},{"q":"She [[works]] for a design company. — Какой вид?","options":["Simple","Continuous","Perfect","Perfect Continuous"],"a":"Simple","why":"Постоянная ситуация, простая форма глагола."},{"q":"I [[have lived]] in Tomsk for ten years. — Какой вид?","options":["Simple","Continuous","Perfect","Perfect Continuous"],"a":"Perfect","why":"have + V3."},{"q":"We [[had been waiting]] for an hour when the bus came. — Какой вид?","options":["Simple","Continuous","Perfect","Perfect Continuous"],"a":"Perfect Continuous","why":"had been + V-ing: процесс длился до момента в прошлом."},{"q":"The surveyors [[will have finished]] the wor
