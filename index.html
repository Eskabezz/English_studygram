"caption":"since называет точку, с которой всё началось; for — длину всего отрезка. Действие длится до сейчас, поэтому здесь Present Perfect.","en":"I've been here [[since]] 8 o'clock — [[for]] four hours now.","ru":"Я здесь с восьми часов — уже четыре часа."},{"type":"compare","title":"in ten minutes или within ten minutes?","left":{"title":"in + период","sub":"через; за","points":["«Через»: отсчитываем от сейчас — через десять минут, через неделю.","«За»: сколько времени заняло дело."],"examples":[{"en":"The train leaves [[in]] ten minutes.","ru":"Поезд отходит через десять минут."},{"en":"They built the house [[in]] six months.","ru":"Они построили дом за полгода."}]},"right":{"title":"within + период","sub":"в течение, не позже чем","points":["Граница срока: в любой момент внутри периода, но не позже.","Частое слово в договорах, инструкциях и деловых письмах."],"examples":[{"en":"The results will be ready [[within]] three days.","ru":"Результаты будут готовы в течение трёх дней."},{"en":"Report any damage [[within]] 24 hours.","ru":"О любых повреждениях сообщайте в течение суток."}]},"note":"«Через час» о будущем — [[in]] an hour, а не ~~after an hour~~. After + период бывает в рассказе о прошлом: After an hour, the rain stopped — Через час дождь прекратился.","noteKind":"warn"},{"type":"compare","title":"by или until?","left":{"title":"by","sub":"к сроку, не позже","points":["Действие случится один раз — до срока или точно в срок.","Проверка: по-русски можно сказать «к пятнице»."],"examples":[{"en":"Please send me the report [[by]] Friday.","ru":"Пришли мне, пожалуйста, отчёт к пятнице."},{"en":"The road must be finished [[by]] the end of the year.","ru":"Дорогу нужно закончить к концу года."}]},"right":{"title":"until / till","sub":"до какого-то момента (всё это время)","points":["Действие или состояние длится вплоть до этой точки.","till — то же самое, но разговорнее."],"examples":[{"en":"I'll wait [[until]] six.","ru":"Я подожду до шести."},{"en":"The library is open [[until]] 9 p.m.","ru":"Библиотека работает до девяти вечера."}]},"note":"С отрицанием until значит «только, не раньше»: We didn't get the results [[until]] Monday — Результаты мы получили только в понедельник."},{"type":"points","title":"from … to, ago, before и полезные выражения","items":[{"label":"from … to — с … до","text":"Начало и конец периода; вместо to можно until. В американском часто Monday through Friday.","en":"The office is open [[from]] 9 [[to]] 6.","ru":"Офис работает с 9 до 6."},{"label":"ago — назад","text":"Отсчитываем назад от сейчас. Стоит ПОСЛЕ периода, глагол — в Past Simple.","en":"I moved to Kazan three years [[ago]].","ru":"Я переехал в Казань три года назад."},{"label":"before — до, перед; раньше","text":"before + событие или время: before lunch, before 2010. В конце фразы — «раньше, прежде».","en":"Check the formwork [[before]] pouring the concrete.","ru":"Проверь опалубку перед заливкой бетона.","examples":[{"en":"I've never been here [[before]].","ru":"Я никогда здесь раньше не был."}]},{"label":"on time и in time","text":"on time — вовремя, точно по плану; in time — успеть, не опоздать (к чему-то).","en":"The train arrived [[on time]].","ru":"Поезд пришёл вовремя.","examples":[{"en":"We got there [[in time]] for the lecture.","ru":"Мы успели к лекции."}]},{"label":"at the end of и in the end","text":"at the end of — в конце чего-то; in the end — в конце концов, в итоге.","en":"We'll pay [[at the end of]] the month.","ru":"Мы заплатим в конце месяца.","examples":[{"en":"[[In the end]], we chose the second option.","ru":"В итоге мы выбрали второй вариант."}]}],
"note":"ago — только после периода и только «от сейчас»: two years [[ago]], а не ~~before two years~~.","noteKind":"warn"},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"See you ~~in~~ Monday.","right":"See you [[on]] Monday.","why":"Дни недели и даты — on."},{"wrong":"We have an exam ~~on~~ next week.","right":"We have an exam {{next week}}.","why":"Перед next / last / this / every предлог не ставится."},{"wrong":"I studied ~~during~~ three hours.","right":"I studied [[for]] three hours.","why":"«Сколько времени» — for; during — во время события: during the lecture."},{"wrong":"I'll call you ~~after~~ an hour.","right":"I'll call you [[in]] an hour.","why":"«Через час» от сейчас — in."},{"wrong":"Please send the drawings ~~until~~ Friday.","right":"Please send the drawings [[by]] Friday.","why":"«К пятнице, не позже» — by; until — когда действие длится до пятницы."}]},{"type":"quiz","items":[{"q":"The lecture starts ___ 9:40.","a":"at","why":"Точное время по часам — at."},{"q":"We have a meeting ___ Friday morning.","options":["in","on","at"],"a":"on","why":"Назван день — on, даже если дальше идёт morning."},{"q":"Какой предлог нужен во фразе «We're going to Sochi … next summer»?","options":["in","on","никакой"],"a":"никакой","why":"Перед next / last / this / every предлог не ставится."},{"q":"I'll be back ___ ten minutes.","options":["after","in","during"],"a":"in","why":"«Через» от настоящего момента — in."},{"q":"I've lived in this flat ___ 2019.","a":"since","why":"Точка начала — since."},{"q":"Please send me the drawings ___ Friday — that's the deadline.","options":["until","by","since"],"a":"by","why":"К сроку, не позже — by; until — для действия, которое длится."},{"q":"He fell asleep ___ the lecture.","options":["during","while","for"],"a":"during","why":"Во время события (существительное) — during; while нужно целое предложение."},{"q":"They moved to Kazan three years ___.","a":"ago","why":"«Назад» от сейчас — ago, после периода."}]},{"type":"summary","points":["[[at]] — точка (at 5 o'clock, at night), [[on]] — день и дата, [[in]] — месяц, год, сезон, часть дня.","this / next / last / every, today, tomorrow — без предлога.","[[for]] — как долго, [[since]] — с какого момента, [[during]] + событие, [[while]] + предложение.","[[in]] an hour — через час, [[within]] — не позже чем через, three years [[ago]] — три года назад.","[[by]] Friday — к пятнице (не позже); [[until]] Friday — до пятницы (всё это время)."]}]},{"id":"prepositions-place","title":"Prepositions of Place","subtitle":"Предлоги места и направления","level":"A2–B1","tagline":"Где что находится и куда движется: at, on, in, to, into, across и другие.","formula":"[[at / on / in]] + место","blocks":[{"type":"uses","title":"at, on, in: пункт, поверхность, внутри","items":[{"label":"AT — точка, пункт","text":"Место как точка на маршруте или место события: at the station, at work, at a concert. Если важно «внутри здания» — in: It's cold in the station.","en":"I'll meet you [[at]] the station.","ru":"Встретимся на вокзале.","examples":[{"en":"She's [[at]] work until six.","ru":"Она на работе до шести."}]},{"label":"ON — поверхность или линия","text":"На стене, на полу, на столе, на карте, на странице; на реке, на дороге, на побережье.","en":"There's a crack [[on]] the wall.","ru":"На стене трещина.","examples":[{"en":"Find the village [[on]] the map.","ru":"Найди деревню на карте."},{"en":"Kazan is [[on]] the Volga.","ru":"Казань стоит на Волге."}]},{"label":"IN — внутри пространства","text":"Комната, коробка, здание изнутри, город, страна.","en":"The drawings are [[in]] the top drawer.","ru":"Чертежи в верхнем ящике.","examples":[{"en":"My parents live [[in]] Samara.","ru":"Мои родители живут в Самаре."}]}],
"note":"Русское «на» — не всегда on: [[at]] the station — на вокзале, [[in]] the photo — на фото, [[in]] the street — на улице (BrE; в американском — on the street).","noteKind":"warn"},{"type":"table","title":"Шпаргалка: at, on, in","head":["AT — пункт","ON — поверхность, линия","IN — внутри"],"rows":[["[[at]] home","[[on]] the wall","[[in]] the room"],["[[at]] work","[[on]] the floor","[[in]] the box"],["[[at]] university","[[on]] the table","[[in]] the building"],["[[at]] the station","[[on]] the ground floor","[[in]] Moscow"],["[[at]] the bus stop","[[on]] the map","[[in]] Russia"],["[[at]] the door","[[on]] page 10","[[in]] the picture"],["[[at]] the entrance","[[on]] the left / right","[[in]] the park"],["[[at]] a concert","[[on]] the coast","[[in]] the car"],["[[at]] the end of the street","[[on]] the bus","[[in]] a taxi"]],"note":"Этажи: в британском ground floor — первый этаж, first floor — второй; в американском first floor — первый. Предлог всегда on: [[on]] the third floor."},{"type":"compare","title":"Где? или Куда?","left":{"title":"Где? — at / in / on","sub":"положение, никуда не движемся","points":["По-русски: в школе, на работе, в сумке.","Обычно с be, live, work, stay, wait."],"examples":[{"en":"She is [[at]] school now.","ru":"Она сейчас в школе."},{"en":"The keys are [[in]] my bag.","ru":"Ключи у меня в сумке."}]},"right":{"title":"Куда? — to / into / onto","sub":"движение к цели или внутрь","points":["По-русски: в школу, на работу, в сумку.","Обычно с go, come, walk, drive (to / into). onto — о движении на поверхность: jump, climb, spill, step"],"examples":[{"en":"She goes [[to]] school by bus.","ru":"Она ездит в школу на автобусе."},{"en":"He went [[into]] the office.","ru":"Он вошёл в кабинет."}]},"note":"В разговоре после put, drop, jump часто говорят in / on вместо into / onto: Put it [[in]] your bag. А home — без предлога: go home, get home, но be [[at]] home."},{"type":"table","title":"Движение: куда и как","head":["Предлог","Значение","Пример"],"rows":[["to","к, в, на (цель)","We went [[to]] Sochi."],["into","внутрь","He went [[into]] the room."],["out of","изнутри наружу","She ran [[out of]] the house."],["onto","на поверхность","The cat jumped [[onto]] the table."],["off","с поверхности","He fell [[off]] the ladder."],["from","от, из (откуда)","She walked home [[from]] the station."],["through","сквозь, через (внутри чего-то)","We drove [[through]] the tunnel."],["across","через, поперёк (на другую сторону)","They walked [[across]] the bridge."],["along","вдоль, по","We walked [[along]] the river."],["towards","по направлению к","He was walking [[towards]] me."],["up / down","вверх / вниз по","She ran [[up]] the stairs."],["past","мимо","We drove [[past]] the stadium."]],"note":"through — сквозь что-то объёмное (туннель, лес, толпу); across — по поверхности на другую сторону (дорогу, реку, поле). towards — британский вариант, в американском чаще toward."},{"type":"table","title":"Положение: где относительно чего","head":["Предлог","Значение","Пример"],"rows":[["under","под","The cable runs [[under]] the road."],["below","ниже (уровня)","The basement is [[below]] ground level."],["over","над; поверх","There's a bridge [[over]] the river."],["above","выше, над","The lamp hangs [[above]] the table."],["between","между (двумя)","The café is [[between]] the bank and the post office."],["among","среди (многих)","The house stands [[among]] the trees."],["next to / beside","рядом с","The car park is [[next to]] the station."],["near","недалеко от, поблизости","Is there a pharmacy [[near]] here?"],["behind","за, позади","The garden is [[behind]] the house."],["in front of","перед","There's a bus stop [[in front of]] the school."],["opposite","напротив","The bank is [[opposite]] the station."]],"note":"above / below — выше / ниже по уровню; under / over — прямо под / над, часто вплотную или накрывая. Не путай: in front of the bus — перед автобусом, at the front of the bus — в передней части автобуса."},{"type":"points","title":"Транспорт, arrive и home","items":[{"label":"arrive in / arrive at","text":"arrive in — в город или страну, arrive at — в конкретное место (вокзал, аэропорт, офис). ~~arrive to~~ не бывает.","en":"We arrived [[in]] Moscow at 6 a.m.","ru":"Мы прибыли в Москву в 6 утра.","examples":[{"en":"We arrived [[at]] the airport too early.","ru":"Мы приехали в аэропорт слишком рано."}]},{"label":"home — без предлога","text":"go home, come home, get home, arrive home — без to. Но: be at home, stay at home.","en":"What time did you [[get home]]?","ru":"Во сколько ты вернулся домой?"},{"label":"on / off — общественный транспорт","text":"Автобус, поезд, трамвай, самолёт — on; сесть — get on, выйти — get off.","en":"I usually read [[on]] the train.","ru":"В поезде я обычно читаю.","examples":[{"en":"[[Get off]] the bus at the next stop.","ru":"Выходи из автобуса на следующей остановке."}]},{"label":"in / out of — машина, такси","text":"Легковая машина, такси — in; сесть — get in (into), выйти — get out of.","en":"She got [[out of]] the taxi.","ru":"Она вышла из такси.","examples":[{"en":"We spent five hours [[in]] the car.","ru":"Мы провели в машине пять часов."}]},{"label":"by — каким транспортом","text":"by bus, by train, by car — без артикля; пешком — on foot. Если есть my, the — уже in / on: in my car, on the 8:15 train.","en":"I go to university [[by]] bus.","ru":"Я езжу в университет на автобусе."}]},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"We arrived ~~to~~ Moscow at night.","right":"We arrived [[in]] Moscow at night.","why":"arrive in + город, страна; arrive at + конкретное место. arrive to не бывает."},{"wrong":"I'm going ~~to~~ home.","right":"I'm going [[home]].","why":"После go, come, get, arrive слово home идёт без предлога."},{"wrong":"I'll wait for you ~~on~~ the bus stop.","right":"I'll wait for you [[at]] the bus stop.","why":"Остановка, вокзал, вход — точка на маршруте: at."},{"wrong":"I usually read ~~in~~ the bus.","right":"I usually read [[on]] the bus.","why":"Автобус, поезд, самолёт — on; машина и такси — in."},{"wrong":"We were sitting ~~behind~~ the table.","right":"We were sitting [[at]] the table.","why":"«Сидеть за столом» — at the table; behind the table — буквально позади стола."}]},{"type":"quiz","items":[{"q":"We arrived ___ Novosibirsk late at night.","a":"in","why":"arrive in + город."},{"q":"Who's that man ___ the photo?","options":["on","in","at"],"a":"in","why":"На фото, на картине — in."},{"q":"The café is ___ the ground floor.","a":"on","why":"Этаж — on."},{"q":"I'll meet you ___ the bus stop.","options":["on","at","in"],"a":"at","why":"Остановка — точка на маршруте: at."},{"q":"They walked ___ the bridge to the other side of the river.","options":["through","across","into"],"a":"across","why":"По поверхности на другую сторону — across."},{"q":"It's late. Let's go ___.","options":["to home","home","at home"],"a":"home","why":"go home — без предлога."},{"q":"When we reached the hotel, he got ___ the taxi.","a":"out of","why":"Выйти из машины или такси — get out of."},{"q":"The pharmacy is ___ the bank, on the other side of the street.","options":["opposite","next to","behind"],"a":"opposite","why":"На другой стороне улицы, лицом друг к другу — opposite."}]},{"type":"summary","points":["[[at]] — пункт (at the station, at work), [[on]] — поверхность, линия (on the wall, on the map), [[in]] — внутри (in the room, in Moscow).","Где? — at / in / on; куда? — [[to]] / [[into]] / [[onto]]. home — без предлога: go home.","arrive [[in]] + город, arrive [[at]] + место; arrive to не бывает.","Автобус, поезд — [[on]] (get off); машина, такси — [[in]] (get out of).","[[through]] — сквозь, [[across]] — на другую сторону, [[along]] — вдоль."]}]},{"id":"phrasal-verbs","title":"Phrasal Verbs","subtitle":"Фразовые глаголы","level":"B1","tagline":"Глагол + маленькая частица = новое значение: give up, look after, carry out.","formula":"V + [[частица]]","blocks":[{"type":"points","title":"Что такое фразовый глагол","items":[{"label":"Частица меняет смысл","text":"give — давать, а give up — бросить, перестать; look — смотреть, а look after — присматривать.","en":"He [[gave up]] smoking last year.","ru":"Он бросил курить в прошлом году."},{"label":"Иногда смысл понятен из частей","text":"come back — вернуться, sit down — сесть, stand up — встать.","en":"When did you [[come back]]?","ru":"Когда ты вернулся?"},{"label":"Чаще — учи как новое слово","text":"По частям не догадаться: make up — выдумать, call off — отменить, bring up — вырастить (ребёнка).","en":"They [[called off]] the meeting.","ru":"Они отменили совещание."},{"label":"В технических текстах","text":"Фразовые глаголы часто стоят в пассиве: частица остаётся сразу после V3.","en":"The tests were [[carried out]] in May.","ru":"Испытания провели в мае."}],
"note":"Частица похожа на предлог (on, off, up, out, after), но вместе с глаголом это одно слово по смыслу. Переводи пару целиком, а не по частям."},{"type":"formula","title":"Где стоит дополнение","rows":[{"sign":"Сущ.","formula":"V + [[частица]] + O","en":"[[Put on]] your helmet.","ru":"Надень каску."},{"sign":"Сущ.","formula":"V + O + [[частица]]","en":"[[Put]] your helmet [[on]].","ru":"Надень каску."},{"sign":"Местоим.","formula":"V + it / them + [[частица]]","en":"[[Put]] it [[on]].","ru":"Надень её."},{"sign":"Без доп.","formula":"V + [[частица]]","en":"Our car [[broke down]].","ru":"У нас сломалась машина."}],
"note":"Так ведут себя разделяемые глаголы (put on, turn off, pick up). Местоимение — только в середине: ~~put on it~~ → [[put]] it [[on]].","noteKind":"warn"},{"type":"compare","title":"Разделяемые и неразделяемые","left":{"title":"Разделяемые","sub":"дополнение может встать в середину","points":["Существительное — после частицы или в середине.","Местоимение (it, him, them) — ТОЛЬКО в середине.","turn on / off, pick up, put on, take off, fill in, find out, set up, point out, work out, call off"],"examples":[{"en":"[[Pick]] the box [[up]]. = [[Pick up]] the box.","ru":"Подними коробку."},{"en":"[[Pick]] it [[up]].","ru":"Подними её."}]},"right":{"title":"Неразделяемые","sub":"глагол и частица всегда вместе","points":["Дополнение всегда после частицы — даже местоимение.","look for, look after, deal with, run out of, look forward to."],"examples":[{"en":"I'm [[looking for]] my keys.","ru":"Я ищу ключи."},{"en":"I'm [[looking for]] them.","ru":"Я их ищу."}]},"note":"Разделяемый глагол или нет, видно в словаре: turn sth on — sth стоит в середине, значит, можно разделять; look after sb — нельзя."},{"type":"table","title":"Самые нужные — часть 1: каждый день","head":["Глагол","Перевод","Пример","Делится?"],"rows":[["get up","вставать (с постели)","I [[get up]] at seven.","—"],["come back","возвращаться","He [[came back]] late.","—"],["go on","продолжать(ся); происходить","What's [[going on]]?","—"],["look for","искать","I'm [[looking for]] a flat.","нет"],["look after","присматривать, заботиться","Who [[looks after]] your dog?","нет"],["look forward to","ждать с нетерпением","I'm [[looking forward to]] the holidays.","нет"],["put on","надевать","[[Put on]] a warm jacket.","да"],["take off","снимать (одежду); взлетать","[[Take]] your shoes [[off]].","да"],["turn on / turn off","включать / выключать","[[Turn]] it [[off]], please.","да"],["pick up","поднимать; забирать (кого-то)","I'll [[pick]] you [[up]] at six.","да"],["give up","бросать (привычку); сдаваться","She [[gave up]] smoking.","да"],["run out of","израсходовать всё («у нас кончился…»)","We've [[run out of]] cement.","нет"]],"note":"да — местоимение ставим в середину (turn it off); нет — глагол и частица неразлучны (look for it); — — дополнения нет. После look forward to — V-ing: look forward to seeing you."},{"type":"table","title":"Самые нужные — часть 2: учёба и работа","head":["Глагол","Перевод","Пример","Делится?"],"rows":[["find out","узнавать, выяснять","Can you [[find out]] when the lecture starts?","да"],["carry out","проводить, выполнять (работы, испытания)","The engineers [[carried out]] the tests.","нет"],["set up","создавать; устанавливать, настраивать","[[Set up]] the tripod here.","да"],["deal with","заниматься (проблемой); рассматривать (тему)","This chapter [[deals with]] soil mechanics.","нет"],["point out","указывать, обращать внимание","She [[pointed out]] a mistake in the drawing.","да"],["break down","ломаться (о технике)","The excavator [[broke down]] again.","—"],["fill in","заполнять (бланк)","[[Fill in]] this form, please.","да"],["work out","рассчитать; разобраться","[[Work out]] the area of the plot.","да"],["figure out","понять, разобраться (разг.)","I can't [[figure out]] how it works.","да"],["make up","выдумывать; составлять","He [[made up]] an excuse.","да"],["call off","отменять","They [[called off]] the trip.","да"],["bring up","воспитывать; поднимать (тему)","She [[brought up]] three children.","да"]],"note":"fill in — британский вариант, в американском чаще fill out. figure out звучит разговорно; в письменном тексте лучше work out или understand."},{"type":"points","title":"Частицы-подсказки","items":[{"label":"up — вверх; до конца","en":"We've [[used up]] all the paper.","ru":"Мы израсходовали всю бумагу."},{"label":"off — прочь; отключение, отмена","en":"The plane [[took off]] on time.","ru":"Самолёт взлетел вовремя."},{"label":"out — наружу; до результата","en":"We need to [[find out]] the cause of the crack.","ru":"Нужно выяснить причину трещины."},{"label":"on — продолжение; включение","en":"[[Carry on]], you're doing well.","ru":"Продолжай, у тебя хорошо получается."},{"label":"back — назад, обратно","en":"I'll [[call]] you [[back]] later.","ru":"Я перезвоню тебе позже."}],
"note":"Это подсказки, а не правила: по частице можно догадаться о смысле, но многие глаголы всё равно придётся запомнить."},{"type":"table","title":"В технических текстах: фразовый глагол и формальный синоним","head":["Фразовый (разговорнее)","Формальный (статьи, документы)","Перевод"],"rows":[["carry out","conduct, perform","проводить, выполнять"],["set up","establish, install","создавать; устанавливать"],["find out","discover, determine","выяснять, определять"],["work out","calculate","вычислять, рассчитывать"],["point out","indicate","указывать"],["go on","continue","продолжать(ся)"],["call off","cancel","отменять"],["put off","postpone","откладывать"],["look into","investigate","изучать, расследовать"],["break down","fail","выходить из строя"]],"note":"В научно-технических текстах чаще встречается формальный глагол, в устной речи — фразовый. Узнавать нужно оба."},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"The lamp is still on. ~~Turn off it~~, please.","right":"The lamp is still on. [[Turn]] it [[off]], please.","why":"У разделяемого глагола местоимение — только в середине."},{"wrong":"I'm ~~looking~~ my keys.","right":"I'm [[looking for]] my keys.","why":"«Искать» — look for; без for глагол look значит «смотреть»."},{"wrong":"I look forward to ~~see~~ you.","right":"I look forward to [[seeing]] you.","why":"to здесь — предлог, после него нужен V-ing."},{"wrong":"We've ~~run out~~ sand.","right":"We've [[run out of]] sand.","why":"Если назван запас, который закончился, нужен of: run out of sand."},{"wrong":"Please ~~fill~~ this form.","right":"Please [[fill in]] this form.","why":"«Заполнить бланк» — fill in (AmE fill out); просто fill — наполнить."}]},{"type":"quiz","items":[{"q":"It's cold outside. ___ your jacket ___. (надеть)","a":["Put","on"],"why":"put on — надевать; существительное может стоять в середине."},{"q":"The lamp is still on. Can you ___, please?","options":["turn off it","turn it off","turn it"],"a":"turn it off","why":"Местоимение — между глаголом и частицей."},{"q":"I'm ___ my phone. Have you seen it? (искать)","a":"looking for","why":"Искать — look for, частица for обязательна."},{"q":"We've run out ___ sand. Order some more.","options":["of","from","off"],"a":"of","why":"run out of + то, что закончилось."},{"q":"The engineers ___ (carry out) the tests last week.","a":"carried out","why":"Прошедшее время — carried, частица out остаётся."},{"q":"They had to ___ the meeting because the boss was ill.","options":["call off","call up","look after"],"a":"call off","why":"Отменить — call off."},{"q":"Who ___ your cat when you're on holiday?","options":["looks for","looks after","looks forward to"],"a":"looks after","why":"Присматривать — look after."},{"q":"I'm looking forward to ___ (meet) you.","a":"meeting","why":"После look forward to — V-ing."}]},{"type":"summary","points":["Фразовый глагол = V + [[частица]]; смысл часто новый — учи пару целиком.","Разделяемые: [[turn on]] the light = [[turn]] the light [[on]]; местоимение — только в середине: [[turn]] it [[on]].","Неразделяемые: [[look after]] them, [[look for]] it, [[deal with]] it.","В технических текстах: [[carry out]] = conduct, [[set up]] = establish, [[work out]] = calculate.","После [[look forward to]] — V-ing: look forward to seeing you."]}]},{"id":"word-formation","title":"Word Formation","subtitle":"Словообразование: суффиксы и приставки","level":"B1","tagline":"Как по суффиксу узнать часть речи — и перевести незнакомое слово в техническом тексте.","formula":"[[приставка]] + корень + [[суффикс]]","blocks":[{"type":"uses","title":"Как определить часть речи незнакомого слова","items":[{"label":"Найди суффикс","text":"Конец слова подсказывает часть речи: -tion, -ment, -ity — существительное; -able, -al, -ive — прилагательное; -ize, -ify, -en — глагол; -ly — наречие.","en":"Accurate [[measurement]] is the basis of surveying.","ru":"Точные измерения — основа геодезии."},{"label":"Посмотри на соседей","text":"После the, a, of или прилагательного — существительное; после can, must, will, частицы to или подлежащего — глагол; перед существительным — прилагательное.","en":"The [[stability]] of the slope depends on the soil.","ru":"Устойчивость склона зависит от грунта."},{"label":"Отдели приставку, найди корень","text":"Корень даёт основной смысл, приставка — оттенок: re- — снова, un- — не-.","en":"The old theatre was [[reconstructed]] in 2015.","ru":"Старый театр реконструировали в 2015 году."},{"label":"Собери перевод","text":"Подбери русское слово той же части речи и проверь, естественно ли звучит фраза.","en":"The workers [[strengthened]] the foundation.","ru":"Рабочие укрепили фундамент."}]},{"type":"table","title":"Суффиксы существительных","head":["Суффикс","Смысл · по-русски","Пример"],"rows":[["-er / -or","кто или что делает: «-тель», «-щик»","build → [[builder]], survey → [[surveyor]]"],["-tion / -sion","процесс, результат: «-ция», «-ние»","construct → [[construction]], decide → [[decision]]"],["-ment","действие, результат: «-ние»","develop → [[development]], measure → [[measurement]]"],["-ness","качество, состояние: «-ость», «-ота», «-ина»","dark → [[darkness]], thick → [[thickness]]"],["-ity","качество, свойство: «-ость»","stable → [[stability]], dense → [[density]]"],["-ance / -ence","действие, состояние: «-ние», «-ость»","maintain → [[maintenance]], resist → [[resistance]]"],["-ist","специалист: «-ист»","special → [[specialist]], science → [[scientist]]"],["-ure","действие, результат","press → [[pressure]], fail → [[failure]]"],["-ing","процесс, предмет: «-ние»","build → [[building]], survey → [[surveying]]"]],"note":"-ing бывает и у глагола: a new [[building]] — новое здание, they [[are building]] — они строят. А -er — ещё и сравнительная степень: stronger — прочнее, higher — выше. -ing как существительное образуется в основном от непереходных глаголов: building, meeting, surveying. С переходными обычны -tion / -ment: the construction of the bridge.","noteKind":"warn"},{"type":"table","title":"Суффиксы прилагательных","head":["Суффикс","Смысл · по-русски","Пример"],"rows":[["-able / -ible","такой, что можно: «-емый», «-имый»","measure → [[measurable]], rely → [[reliable]], access → [[accessible]]"],["-al","относящийся к: «-альный», «-ный»","structure → [[structural]], architecture → [[architectural]]"],["-ic","относящийся к: «-ический»","economy → [[economic]], metal → [[metallic]]"],["-ive","обладающий свойством: «-ивный», «-ный»","effect → [[effective]], protect → [[protective]]"],["-ous","обладающий качеством: «-ный», «-истый»","danger → [[dangerous]], pore → [[porous]]"],["-ful","полный чего-то","use → [[useful]], care → [[careful]]"],["-less","без чего-то: «без-», «не-»","use → [[useless]], care → [[careless]]"],["-y","с чем-то: «-истый», «-ный»","sand → [[sandy]], rock → [[rocky]]"],["-ant / -ent","обладающий свойством","resist → [[resistant]], differ → [[different]]"]],"note":"-ful и -less — пара «с / без»: useful — полезный, useless — бесполезный. -al бывает и у существительных (arrival, proposal) — решает место в предложении."},{"type":"table","title":"Суффиксы глаголов и наречий","head":["Суффикс","Часть речи · по-русски","Пример"],"rows":[["-ize / -ise","глагол: «-изировать» (-ise чаще в BrE)","modern → [[modernize]], standard → [[standardize]]"],["-ify","глагол: «-ифицировать», «делать каким-то»","class → [[classify]], simple → [[simplify]]"],["-en","глагол: «делать каким-то»","wide → [[widen]], strength → [[strengthen]]"],["-ate","часто глагол","necessity → [[necessitate]], active → [[activate]]"],["-ly","наречие: «-о», «-ски»","quick → [[quickly]], accurate → [[accurately]]"]],"note":"Не всё на -en — глагол: wooden, golden — прилагательные («деревянный», «золотой»), а broken, written — это V3. И не всё на -ly — наречие: friendly, costly — прилагательные.","noteKind":"warn"},{"type":"table","title":"Приставки","head":["Приставка","Смысл","Пример"],"rows":[["un-","не-, без-","[[unknown]], [[unstable]], [[unsafe]]"],["in- / im- / il- / ir-","не-","[[inaccurate]], [[impossible]], [[illegal]], [[irregular]]"],["dis-","обратное действие, лишение (disconnect, disappear); противоположное состояние (agree → disagree)","[[disagree]], [[disconnect]]"],["re-","снова, пере-","[[rebuild]], [[reconstruct]]"],["over-","сверх-, пере- (слишком)","[[overload]], [[overheat]]"],["under-","под-; недо-","[[underground]], [[underestimate]]"],["pre-","до-, пред-, заранее","[[precast]], [[preheat]]"],["co-","со-, вместе","[[co-author]], [[cooperate]]"],["inter-","меж-, между","[[international]], [[interaction]]"],["mis-","неправильно","[[misunderstand]], [[miscalculate]]"],["non-","не- (часто в терминах)","[[non-standard]], [[non-metallic]]"]],"note":"im- обычно перед p, b, m (impossible, imbalance), il- перед l, ir- перед r. Приставка меняет смысл, но обычно не часть речи: stable и unstable — оба прилагательные."},{"type":"table","title":"Словообразовательные гнёзда","head":["Глагол","Существительное","Прилагательное","Кто / что делает"],"rows":[["construct","construction","constructive","constructor"],["develop","development","developing, developed","developer"],["survey","survey","—","surveyor"],["introduce","introduction","introductory","—"],["necessitate","necessity","necessary","—"],["—","architecture","architectural","architect"],["rely","reliability","reliable","—"],["measure","measurement","measurable","—"],["strengthen","strength","strong","—"],["protect","protection","protective","protector"],["stabilize","stability","stable","stabilizer"]],"note":"Ложные друзья: constructor — тот, кто строит или собирает, а «конструктор»-проектировщик — designer; constructive — «конструктивный» только в смысле «полезный» (constructive criticism). developer в строительстве — застройщик.","noteKind":"warn"},{"type":"compare","title":"Конверсия: одно слово — две части речи","left":{"title":"Существительное","sub":"a plan, the design","points":["Перед ним артикль, притяжательное (my, our) или прилагательное.","Во множественном числе получает -s: plans, designs."],"examples":[{"en":"We liked the [[design]] of the new station.","ru":"Нам понравился проект нового вокзала."},{"en":"The [[plan]] was approved.","ru":"План утвердили."}]},"right":{"title":"Глагол","sub":"to plan, to design","points":["Перед ним подлежащее, to, will, can, must.","С he / she / it тоже получает -s (he plans) — поэтому смотри на соседей."],"examples":[{"en":"Engineers [[design]] bridges and tunnels.","ru":"Инженеры проектируют мосты и тоннели."},{"en":"We [[plan]] to finish in May.","ru":"Мы планируем закончить в мае."}]},"note":"Так же работают test, survey, map, load, record, increase. У некоторых меняется ударение: a récord — to recórd, an íncrease — to incréase."},{"type":"points","title":"Разбор технической фразы","items":[{"label":"Фраза целиком","en":"The reliability of prefabricated structures depends on accurate measurements.","ru":"Надёжность сборных конструкций зависит от точных измерений."},{"label":"reliability","text":"-ity и стоит после the → существительное: надёжность."},{"label":"prefabricated","text":"pre- + -ed, стоит перед существительным → определение: сборный, заводского изготовления."},{"label":"structures, measurements","text":"-ure, -ment + окончание -s → существительные во множественном числе."},{"label":"depends","text":"Стоит после подлежащего, с окончанием -s → глагол: зависит."},{"label":"accurate","text":"Стоит перед существительным → прилагательное: точный. Осторожно: -ate бывает не только у глаголов."}]},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"The ~~construct~~ of the bridge took two years.","right":"The [[construction]] of the bridge took two years.","why":"После the … of нужно существительное; construct — глагол."},{"wrong":"This method is very ~~effect~~.","right":"This method is very [[effective]].","why":"После is very нужно прилагательное; effect — существительное."},{"wrong":"The results are ~~unaccurate~~.","right":"The results are [[inaccurate]].","why":"У accurate отрицание через in-. un- или in- — проверяй по словарю."},{"wrong":"We need to ~~classificate~~ the soils.","right":"We need to [[classify]] the soils.","why":"Глагол — classify (-ify); не переноси русское «классифицировать»."},{"wrong":"My father is a ~~constructor~~ at an aircraft plant.","right":"My father is a [[design engineer]] at an aircraft plant.","why":"«Инженер-конструктор» — design engineer (designer); constructor — тот, кто строит."}]},{"type":"quiz","items":[{"q":"The ___ of the new bridge took three years. (construct)","a":"construction","why":"После the … of нужно существительное: -tion."},{"q":"This is a very ___ method. (rely)","a":"reliable","why":"После very, перед существительным — прилагательное: -able."},{"q":"The soil has low ___, so we need a deeper foundation. (stable)","a":"stability","why":"После прилагательного low — существительное: -ity."},{"q":"The engineers had to ___ the old walls. (strong)","a":"strengthen","why":"После had to — глагол: strength + -en."},{"q":"The surveyor measured the plot very ___. (accurate)","a":"accurately","why":"Слово описывает глагол measured — нужно наречие: -ly."},{"q":"«maintenance» во фразе «The maintenance of roads is expensive» — это…","options":["существительное","глагол","прилагательное"],"a":"существительное","why":"-ance и стоит после the → существительное (обслуживание)."},{"q":"«porous» во фразе «Concrete is a porous material» — это…","options":["существительное","прилагательное","наречие"],"a":"прилагательное","why":"-ous и стоит перед существительным → прилагательное (пористый)."},{"q":"Какое из слов — глагол?","options":["width","wide","widen"],"a":"widen","why":"-en делает глагол: widen — расширять."}]},{"type":"summary","points":["Суффикс подсказывает часть речи, приставка — только смысл.","Существительные: -tion, -ment, -ity, -ness, -ance / -ence, -er / -or, -ure.","Прилагательные: -able, -al, -ic, -ive, -ous, -ful, -less; глаголы: -ize, -ify, -en; наречия: -ly.","Не уверен — смотри на соседей: после the / of — существительное, после can / to — глагол, перед существительным — прилагательное.","Конверсия: a [[design]] — to [[design]]; часть речи решает место в предложении."]}]}]}]};

function applyEditorialPolish(value) {

/* ---------- markup ---------- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function md(s) {
  return esc(s)
    .replace(/\[\[(.+?)\]\]/g, '<mark class="hl">$1</mark>')
    .replace(/\{\{(.+?)\}\}/g, '<span class="mk">$1</span>')
    .replace(/~~(.+?)~~/g, '<s class="wr">$1</s>')
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\n/g, "<br>");
}
const plain = s => String(s == null ? "" : s).replace(/\[\[|\]\]|\{\{|\}\}|~~|\*\*/g, "");
const hasCyr = s => /[А-Яа-яЁё]/.test(s);

function ex(en, ru) {
  if (!en && !ru) return "";

}
function exList(item) {

}
function formulaHTML(f) {
  const toks = String(f).split(/\s\+\s/);
  return '<span class="fx">' + toks.map((t, i) => {
    t = t.trim();
    if (t === "?" || t === "!") return `<span class="op q">${t}</span>`;
    let cls = "tok", m;
    if ((m = t.match(/^\[\[(.+)\]\]$/)) && !/\]\]|\[\[/.test(m[1])) { cls += " tok-hl"; t = m[1]; }
    else if ((m = t.match(/^\{\{(.+)\}\}$/)) && !/\}\}|\{\{/.test(m[1])) { cls += " tok-mk"; t = m[1]; }
    return (i ? '<span class="op">+</span>' : "") + `<span class="${cls}">${md(t)}</span>`;
  }).join("") + "</span>";
}
const SIGNS = { "+": ["pos", "+"], "-": ["neg", "−"], "−": ["neg", "−"], "–": ["neg", "−"], "?": ["qst", "?"] };
function signHTML(s) {
  const k = SIGNS[String(s).trim()];
  return k ? `<span class="sg ${k[0]}" aria-label="${k[0] === "pos" ? "утверждение" : k[0] === "neg" ? "отрицание" : "вопрос"}">${k[1]}</span>` : `<span class="sg txt">${esc(s)}</span>`;
}
function noteHTML(text, kind, title, en, ru) {

}
const blockNote = b => noteHTML(b.note, b.noteKind);

/* ---------- timeline ---------- */
function timelineSVG(b) {
  const W = 760, AX = 128, H = 200, X = a => Math.round(380 + a * 330);
  const cx = x => Math.max(64, Math.min(W - 64, x));
  const lab = (x, y, t, cls = "") => t ? `<text x="${cx(x)}" y="${y}" text-anchor="middle" class="tl-lab ${cls}">${esc(t)}</text>` : "";
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Схема действия на оси времени">`;
  s += `<line x1="20" y1="${AX}" x2="${W - 26}" y2="${AX}" class="tl-axis"/><path d="M${W - 28} ${AX - 7} L${W - 12} ${AX} L${W - 28} ${AX + 7} Z" class="tl-head"/>`;
  s += `<text x="22" y="${AX + 32}" class="tl-cap">прошлое</text><text x="${W - 14}" y="${AX + 32}" text-anchor="end" class="tl-cap">будущее</text>`;
  s += `<line x1="380" y1="${AX - 100}" x2="380" y2="${AX + 14}" class="tl-now"/><text x="380" y="${AX + 32}" text-anchor="middle" class="tl-now-t">сейчас</text>`;
  (b.events || []).forEach((e, i) => {
    const ly = AX - 30 - (i % 2) * 34;
    if (e.kind === "dot") s += `<circle cx="${X(e.at)}" cy="${AX}" r="9" class="tl-dot"/>` + lab(X(e.at), ly, e.label);
    else if (e.kind === "dots") {
      const at = [].concat(e.at);
      at.forEach(a => { s += `<circle cx="${X(a)}" cy="${AX}" r="7" class="tl-dot"/>`; });
      s += lab(X(at.reduce((p, c) => p + c, 0) / at.length), ly, e.label);
    } else if (e.kind === "span") {
      const x1 = X(e.from), x2 = X(e.to), y = AX - 12; let d = `M${x1} ${y}`;
      for (let x = x1 + 3; x <= x2; x += 3) d += ` L${x} ${(y + 6 * Math.sin((x - x1) / 18 * 2 * Math.PI)).toFixed(1)}`;
      s += `<path d="${d}" class="tl-wave"/>` + lab((x1 + x2) / 2, ly - 8, e.label);
    } else if (e.kind === "arrow") {
      const x1 = X(e.from), x2 = X(e.to), y = AX - 14, dir = x2 >= x1 ? 1 : -1;
      s += `<circle cx="${x1}" cy="${y}" r="5" class="tl-dot"/><line x1="${x1}" y1="${y}" x2="${x2 - dir * 10}" y2="${y}" class="tl-arrow"/>`;
      s += `<path d="M${x2 - dir * 12} ${y - 7} L${x2} ${y} L${x2 - dir * 12} ${y + 7} Z" class="tl-arrowhead"/>` + lab((x1 + x2) / 2, ly - 8, e.label);
    } else if (e.kind === "mark") {
      s += `<line x1="${X(e.at)}" y1="${AX - 70}" x2="${X(e.at)}" y2="${AX + 12}" class="tl-mark"/>` + lab(X(e.at), AX + 56, e.label, "m");
    }
  });
  return s + "</svg>";
}

  },
  mistakes: b => `${h2(b.title || "Типичные ошибки")}<ul class="mist">${b.items.map(it =>
    `<li><div class="m-row m-wrong"><span class="m-ico x" aria-label="неверно">✗</span><p class="en" lang="en">${md(it.wrong)}</p></div>` +
    `<div class="m-row"><span class="m-ico v" aria-label="верно">✓</span><p class="en" lang="en">${md(it.right)}</p></div>` +
    `<p class="m-why">${md(it.why)}</p></li>`).join("")}</ul>${blockNote(b)}`,
  note: b => noteHTML(b.text, b.kind || b.noteKind, b.title, b.en, b.ru),
  summary: b => `<div class="idx"><h2>Запомни</h2><ul>${b.points.map(p => `<li>${md(p)}</li>`).join("")}</ul></div>`,
  quiz: (b, bi, ch) => quizHTML(b.items, `${ch.id}-${bi}`, b.title)

/* ---------- quiz ---------- */
const QUIZ = {};
function itemHTML(it, key) {
  if (it.options) {
    const q = md(it.q).replace(/_{3,}/, '<span class="gap">&nbsp;</span>');
    return `<p class="q" lang="en">${q}</p><div class="opts" role="group">${it.options.map((o, k) =>
      `<button class="opt" type="button" data-k="${k}" lang="en">${md(o)}</button>`).join("")}</div>`;
  }
  const ans = [].concat(it.a); let g = 0;
  const q = md(it.q).replace(/_{3,}/g, () => {
    const a = ans[g] || "", n = g++;
    return `<input class="gapin" id="g-${key}-${n}" data-g="${n}" size="${Math.max(4, a.length + 1)}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Пропуск ${n + 1}">`;
  });
  return `<p class="q" lang="en">${q}</p>`;
}
function quizHTML(items, key, title) {
  QUIZ[key] = items;
  return `<div class="quiz" data-quiz="${key}"><h2>${esc(title || "Проверь себя")} <small>${items.length} заданий · Enter — проверить</small></h2>` +
    `<ol class="qlist">${items.map((it, i) => `<li data-i="${i}">${itemHTML(it, key + "-" + i)}<div class="qfb" hidden></div></li>`).join("")}</ol>` +
    `<div class="qctl"><button class="btn primary" type="button" data-act="check">Проверить</button>` +
    `<button class="btn" type="button" data-act="reveal">Показать ответы</button><button class="btn" type="button" data-act="reset">Заново</button>` +
    `<span class="qscore" aria-live="polite"></span></div></div>`;
}

function norm(s) {
  return String(s).toLowerCase().replace(/[’‘`´ʼ]/g, "'").replace(/[.,!?;:…]+$/g, "").replace(/\s+/g, " ").trim();
}
function variants(s) {
  let v = norm(s)
    .replace(/\bwon't\b/g, "will not").replace(/\bshan't\b/g, "shall not").replace(/\bcan't\b/g, "cannot")
    .replace(/\bcan not\b/g, "cannot").replace(/n't\b/g, " not").replace(/'m\b/g, " am").replace(/'re\b/g, " are")
    .replace(/'ve\b/g, " have").replace(/'ll\b/g, " will");
  let out = [v];
  const expand = (re, reps) => { out = out.flatMap(x => re.test(x) ? [x, ...reps.map(r => x.replace(re, r))] : [x]); };
  expand(/'d\b/, [" would", " had"]);
  expand(/'s\b/, [" is", " has"]);
  return out.map(x => x.replace(/\s+/g, " ").trim());
}
const same = (user, answers) => { const u = variants(user); return answers.some(a => variants(a).some(v => u.includes(v))); };

function acceptable(it, g) {
  const ans = [].concat(it.a);
  const list = [ans[g]];
  if (Array.isArray(it.alt)) {
    if (ans.length === 1) list.push(...it.alt.filter(x => typeof x === "string"));
    else if (Array.isArray(it.alt[g])) list.push(...it.alt[g]);
  }
  return list.filter(Boolean);
}
function why(it) { return it.why ? ` <span class="why">${md(it.why)}</span>` : ""; }

// returns true/false when the item was answered, null when left empty
function checkItem(li, it) {
  const fb = li.querySelector(".qfb");
  if (it.options) {
    if (!li.dataset.done) return null;
    return li.dataset.done === "1";
  }
  const inputs = [...li.querySelectorAll(".gapin")];
  if (inputs.every(i => !i.value.trim())) return null;
  let ok = true;
  inputs.forEach(inp => {
    const good = same(inp.value, acceptable(it, +inp.dataset.g));
    inp.classList.toggle("ok", good); inp.classList.toggle("bad", !good);
    if (!good) ok = false;
  });
  fb.hidden = false;
  fb.className = "qfb " + (ok ? "ok" : "bad");
  fb.innerHTML = ok ? `✓ Верно.${why(it)}` : `Правильно: <span class="ans" lang="en">${esc([].concat(it.a).join(" … "))}</span>.${why(it)}`;
  return ok;
}
function chooseOption(li, it, btn) {
  if (li.dataset.done) return;
  const right = it.options.indexOf(it.a);
  const k = +btn.dataset.k;
  li.querySelectorAll(".opt").forEach((b, j) => { b.disabled = true; if (j === right) b.classList.add("right"); });
  if (k !== right) btn.classList.add("wrong");
  const gap = li.querySelector(".gap");
  if (gap) { gap.textContent = it.a; gap.classList.add("filled"); }
  li.dataset.done = k === right ? "1" : "0";
  const fb = li.querySelector(".qfb");
  fb.hidden = false; fb.className = "qfb " + (k === right ? "ok" : "bad");
  fb.innerHTML = (k === right ? "✓ Верно." : `Правильно: <span class="ans" lang="en">${md(it.a)}</span>.`) + why(it);
  return k === right;
}
function revealItem(li, it) {
  const fb = li.querySelector(".qfb");
  if (it.options) {
    if (!li.dataset.done) {
      const right = it.options.indexOf(it.a);
      li.querySelectorAll(".opt").forEach((b, j) => { b.disabled = true; if (j === right) b.classList.add("right"); });
      const gap = li.querySelector(".gap"); if (gap) { gap.textContent = it.a; gap.classList.add("filled"); }
      li.dataset.done = "0";
    }
  } else {
    li.querySelectorAll(".gapin").forEach(inp => {
      const good = inp.value.trim() && same(inp.value, acceptable(it, +inp.dataset.g));
      if (!good) { inp.value = [].concat(it.a)[+inp.dataset.g]; inp.classList.remove("bad"); inp.classList.add("ok"); }
    });
  }
  fb.hidden = false; fb.className = "qfb ok";
  fb.innerHTML = `<span class="ans" lang="en">${esc([].concat(it.a).join(" … "))}</span>.${why(it)}`;
}
function scoreQuiz(box) {
  const items = QUIZ[box.dataset.quiz];
  let right = 0, done = 0;
  box.querySelectorAll(".qlist > li").forEach(li => {
    const it = items[+li.dataset.i];
    const r = it.options ? (li.dataset.done ? li.dataset.done === "1" : null) : (li.querySelector(".gapin.ok, .gapin.bad") ? !li.querySelector(".gapin.bad") : null);
    if (r !== null) { done++; if (r) right++; }
  });
  box.querySelector(".qscore").textContent = done ? `${right} из ${items.length}` : "";
}

document.addEventListener("click", e => {
  const box = e.target.closest(".quiz[data-quiz]");
  if (!box) return;
  const items = QUIZ[box.dataset.quiz];
  const opt = e.target.closest(".opt");
  if (opt) { const li = opt.closest("li[data-i]"); chooseOption(li, items[+li.dataset.i], opt); scoreQuiz(box); return; }
  const act = e.target.closest("[data-act]");
  if (!act) return;
  const lis = [...box.querySelectorAll(".qlist > li")];
  if (act.dataset.act === "check") lis.forEach(li => checkItem(li, items[+li.dataset.i]));
  if (act.dataset.act === "reveal") lis.forEach(li => revealItem(li, items[+li.dataset.i]));
  if (act.dataset.act === "reset") {
    lis.forEach(li => { li.innerHTML = itemHTML(items[+li.dataset.i], box.dataset.quiz + "-" + li.dataset.i) + '<div class="qfb" hidden></div>'; delete li.dataset.done; });
  }
  scoreQuiz(box);
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || !e.target.classList.contains("gapin")) return;
  e.preventDefault();
  const box = e.target.closest(".quiz[data-quiz]");
  if (box) {
    const li = e.target.closest("li[data-i]");
    const inputs = [...li.querySelectorAll(".gapin")];
    const idx = inputs.indexOf(e.target);
    if (idx < inputs.length - 1 && !inputs[idx + 1].value) { inputs[idx + 1].focus(); return; }
    checkItem(li, QUIZ[box.dataset.quiz][+li.dataset.i]); scoreQuiz(box);
    const next = li.nextElementSibling && li.nextElementSibling.querySelector(".gapin");
    if (next) next.focus();
  } else if (e.target.closest(".tr-card")) trainerCheck();
});

  const done = learned.has(c.id);

      <div class="learn"><button class="btn${done ? " done" : ""}" type="button" id="learnBtn">${done ? "✓ Глава выучена" : "Отметить главу выученной"}</button>
      <span class="ru">${done ? "Нажми ещё раз, чтобы снять отметку." : "Отметка сохранится в этом браузере."}</span></div>
      <nav class="pn">${prev ? `<a href="#${prev.id}"><small>← Глава ${prev.no}</small><b>${esc(prev.title)}</b></a>` : ""}${next ? `<a class="next" href="#${next.id}"><small>Глава ${next.no} →</small><b>${esc(next.title)}</b></a>` : ""}</nav>
    </footer>
  </article>`;
}

function homeView() {
  const last = BY[store.get("last", "")];
  const nQuiz = CH.reduce((n, c) => n + c.blocks.filter(b => b.type === "quiz").reduce((m, b) => m + b.items.length, 0), 0);
  const nEx = CH.reduce((n, c) => n + (JSON.stringify(c.blocks).match(/"en":/g) || []).length, 0);
  return `<div class="sheet">
  <section class="hero">
    <div class="eyebrow">Справочник для повторения · A1–B2</div>
    <h1>Вся грамматика английского — <span>в одной тетради</span></h1>
    <p class="lead2">Времена, модальные глаголы, условные предложения, пассив, косвенная речь, артикли, герундий и причастия — с формулами, примерами и переводом. Плюс темы из вузовских методичек: функции it, one, that, be, have, словообразование.</p>
    <div class="stats"><span><b>${CH.length}</b>глав</span><span><b>${DATA.parts.length}</b>частей</span><span><b>${nEx}</b>примеров</span><span><b>${nQuiz}</b>заданий для самопроверки</span></div>
    <div class="cta">${last ? `<a class="btn primary" href="#${last.id}">Продолжить: ${esc(last.title)} →</a><a class="btn" href="#${CH[0].id}">С первой главы</a>` : `<a class="btn primary" href="#${CH[0].id}">Начать с первой главы →</a>`}<a class="btn" href="#trainer">Тренажёр</a><a class="btn" href="#cheatsheet">Шпаргалка</a></div>
  </section>

  <h2 class="sec-h">Как читать пометки</h2>
  <div class="card legend">
    <div><p class="en" lang="en">She [[has left]].</p><span>Маркером выделена <strong>форма</strong>, которую изучаем.</span></div>
    <div><p class="en" lang="en">{{every day}}, {{already}}</p><span>Синей ручкой — <strong>слова-подсказки</strong>: по ним узнают время или конструкцию.</span></div>
    <div><p class="en" lang="en">He ~~go~~ home.</p><span>Красным зачёркнута <strong>ошибка</strong>, ниже — как правильно.</span></div>
    <div>${formulaHTML("S + [[have / has]] + [[V3]]")}<span>Формула: <strong>S</strong> — подлежащее, <strong>V</strong> — глагол, <strong>V2</strong>, <strong>V3</strong> — 2-я и 3-я формы.</span></div>
  </div>

  <h2 class="sec-h">Оглавление</h2>
  <div class="parts">${DATA.parts.map(p => {
    const nl = p.chapters.filter(c => learned.has(c.id)).length;
    return `<div class="card part"><div class="pr"><span class="rn">ЧАСТЬ ${p.roman}</span><span class="pc">${nl}/${p.chapters.length}</span></div><h3>${esc(p.title)}</h3><ol>${p.chapters.map(c =>
      `<li><a href="#${c.id}"><span class="n">${c.no}</span><span>${esc(c.title)}</span>${learned.has(c.id) ? '<span class="ok">✓</span>' : ""}</a></li>`).join("")}</ol></div>`;
  }).join("")}</div>

  <h2 class="sec-h">Как повторять, чтобы запомнилось</h2>
  <div class="sched">${[["1", "прочитал главу"], ["2", "решил квиз без подсказок"], ["4", "шпаргалка + тренажёр"], ["7", "тренажёр по части"], ["14", "только ошибки"], ["30", "общий тренажёр"]].map(([d, t]) => `<div><small>день</small><b>${d}</b><span>${t}</span></div>`).join("")}</div>
  <ul class="tips">
    <li>Сначала закрой перевод рукой и попробуй понять пример сам — потом проверь.</li>
    <li>Квиз решай, пока не будет без ошибок; «Показать ответы» — только в конце.</li>
    <li>Раздел «Типичные ошибки» перечитывай перед контрольной: там ровно то, за что снижают баллы.</li>
  </ul>
</div>`;
}

function cheatsheetView() {
  return `<div class="sheet"><header class="tr-head"><div class="eyebrow">Все главы на одной странице</div><h1>Шпаргалка</h1>
  <p class="tagline">Ключевые формулы и главное из каждой главы. Для быстрого повторения перед занятием или контрольной.</p></header>
  ${DATA.parts.map(p => `<section class="cs-part"><h2><b>${p.roman}</b>${esc(p.title)}</h2><div class="cs-grid">${p.chapters.map(c => {
    const f = c.blocks.find(b => b.type === "formula");
    const sum = c.blocks.find(b => b.type === "summary");
    const rows = f ? f.rows.slice(0, 4).map(r => `<div class="fr">${signHTML(r.sign)}<div>${formulaHTML(r.formula)}</div></div>`).join("") : (c.formula ? `<div>${formulaHTML(c.formula)}</div>` : "");
    return `<div class="card cs"><h3><a href="#${c.id}"><span class="n">${c.no}</span>${esc(c.title)}</a></h3>${rows}${sum ? `<ul>${sum.points.map(x => `<li>${md(x)}</li>`).join("")}</ul>` : ""}</div>`;
  }).join("")}</div></section>`).join("")}</div>`;
}

/* ---------- trainer ---------- */
const TR = { parts: new Set(store.get("trParts", DATA.parts.map(p => p.id)).filter(id => DATA.parts.some(p => p.id === id))), pool: [], i: 0, right: 0, miss: [], state: "q" };
if (!TR.parts.size) DATA.parts.forEach(p => TR.parts.add(p.id));
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function trainerNew() {
  const all = [];
  CH.forEach(c => { if (!TR.parts.has(c.part.id)) return; c.blocks.forEach(b => { if (b.type === "quiz") b.items.forEach(it => all.push({ c, it })); }); });
  TR.pool = shuffle(all).slice(0, 15); TR.i = 0; TR.right = 0; TR.miss = []; TR.state = "q";
}
function trainerView() {
  if (!TR.pool.length) trainerNew();
  const chips = DATA.parts.map(p => `<button class="fchip" type="button" data-part="${p.id}" aria-pressed="${TR.parts.has(p.id)}">${p.roman} · ${esc(p.title)}</button>`).join("");
  return `<div class="sheet"><header class="tr-head"><div class="eyebrow">Вперемешку из всех глав</div><h1>Тренажёр</h1>
    <p class="tagline">15 случайных заданий из выбранных частей. Смешанные задания учат главному — самому выбирать форму.</p>
    <div class="fchips" role="group" aria-label="Какие части включить">${chips}</div></header><div id="trBox">${trainerCard()}</div></div>`;
}
function trainerCard() {
  const n = TR.pool.length;
  if (!n) return `<div class="card tr-card">В выбранных частях нет заданий — включи хотя бы одну часть.</div>`;
  if (TR.i >= n) {
    const pct = Math.round(TR.right / n * 100);
    return `<div class="card tr-card tr-res"><h2>${pct >= 90 ? "Отлично!" : pct >= 70 ? "Хорошо" : "Есть над чем поработать"}</h2><div class="big">${TR.right} / ${n}</div>
      <p class="ru">${TR.miss.length ? "Ошибки — и где повторить правило:" : "Ни одной ошибки."}</p>
      <ul class="tr-miss">${TR.miss.map(m => `<li><p class="q" lang="en">${md(m.it.q).replace(/_{3,}/g, "___")}</p><p class="ru">Ответ: <b lang="en">${esc([].concat(m.it.a).join(" … "))}</b> · <a href="#${m.c.id}">${esc(m.c.title)}</a></p></li>`).join("")}</ul>
      <div class="qctl"><button class="btn primary" type="button" data-tr="new">Новая серия</button></div></div>`;
  }
  const { c, it } = TR.pool[TR.i];
  return `<div class="card tr-card quiz-tr" data-trq="1"><div class="tr-top"><span>Задание <b>${TR.i + 1}</b> из ${n}</span><span>Верно: <b>${TR.right}</b></span></div>
    <div class="tr-prog"><i style="width:${TR.i / n * 100}%"></i></div>
    <div class="tr-item" data-i="0">${itemHTML(it, "tr-" + TR.i)}<div class="qfb" hidden></div></div>
    <div class="qctl">${it.options ? "" : '<button class="btn primary" type="button" data-tr="check">Проверить</button>'}<button class="btn" type="button" data-tr="skip">Не знаю</button>
    <span class="qscore">${esc(c.title)}</span></div></div>`;
}
function trainerAnswered(ok) {
  const { c, it } = TR.pool[TR.i];
  if (ok) TR.right++; else TR.miss.push({ c, it });
  TR.state = "a";
  const box = $("#trBox .tr-card");
  const ctl = box.querySelector(".qctl");
  ctl.innerHTML = `<button class="btn primary" type="button" data-tr="next">Дальше →</button><a class="btn" href="#${c.id}">Правило: ${esc(c.title)}</a><span class="qscore">Верно: ${TR.right}</span>`;
  ctl.querySelector("[data-tr=next]").focus();
}
function trainerCheck() {
  if (TR.state !== "q") return;
  const li = $("#trBox .tr-item"); const { it } = TR.pool[TR.i];
  const r = checkItem(li, it);
  if (r === null) return;
  li.querySelectorAll(".gapin").forEach(i => { i.readOnly = true; });
  trainerAnswered(r);
}
document.addEventListener("click", e => {
  const chip = e.target.closest(".fchip");
  if (chip) {
    const id = chip.dataset.part;
    TR.parts.has(id) ? TR.parts.delete(id) : TR.parts.add(id);
    store.set("trParts", [...TR.parts]);
    chip.setAttribute("aria-pressed", TR.parts.has(id));
    trainerNew(); $("#trBox").innerHTML = trainerCard(); return;
  }
  if (!e.target.closest("#trBox")) return;
  const opt = e.target.closest(".opt");
  if (opt && TR.state === "q") { const li = opt.closest(".tr-item"); trainerAnswered(chooseOption(li, TR.pool[TR.i].it, opt)); return; }
  const t = e.target.closest("[data-tr]");
  if (!t) return;
  const a = t.dataset.tr;
  if (a === "check") trainerCheck();
  if (a === "skip" && TR.state === "q") { revealItem($("#trBox .tr-item"), TR.pool[TR.i].it); trainerAnswered(false); }
  if (a === "next") { TR.i++; TR.state = "q"; $("#trBox").innerHTML = trainerCard(); const f = $("#trBox .gapin"); if (f) f.focus(); }
  if (a === "new") { trainerNew(); $("#trBox").innerHTML = trainerCard(); }
});

/* ---------- router ---------- */
function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  const view = $("#view");
  let mode = "home";
  if (BY[id]) {
    mode = "chapter"; curId = id; store.set("last", id);
    view.innerHTML = chapterView(BY[id]);
    document.title = `${BY[id].title} · Грамматика в клетку`;
  } else if (id === "trainer") {
    mode = "trainer"; curId = null; view.innerHTML = trainerView(); document.title = "Тренажёр · Грамматика в клетку";
  } else if (id === "cheatsheet") {
    mode = "cheatsheet"; curId = null; view.innerHTML = cheatsheetView(); document.title = "Шпаргалка · Грамматика в клетку";
  } else {
    curId = null; view.innerHTML = homeView(); document.title = "Грамматика в клетку";
  }
  document.querySelectorAll(".modes a").forEach(a => a.classList.toggle("on", a.dataset.mode === mode));
  renderToc(); renderMeter();
  window.scrollTo(0, 0);
}
document.addEventListener("click", e => {
  const b = e.target.closest("#learnBtn");
  if (!b || !curId) return;
  learned.has(curId) ? learned.delete(curId) : learned.add(curId);
  saveLearned();
  const done = learned.has(curId);
  b.classList.toggle("done", done);
  b.textContent = done ? "✓ Глава выучена" : "Отметить главу выученной";
  b.nextElementSibling.textContent = done ? "Нажми ещё раз, чтобы снять отметку." : "Отметка сохранится в этом браузере.";
  renderToc(); renderMeter();
});
document.addEventListener("keydown", e => {
  if (!curId || e.altKey || e.ctrlKey || e.metaKey || /input|textarea|select|button/i.test(e.target.tagName)) return;
  const c = BY[curId];
  if (e.key === "ArrowRight" && CH[c.no]) location.hash = CH[c.no].id;
  if (e.key === "ArrowLeft" && CH[c.no - 2]) location.hash = CH[c.no - 2].id;
});
window.addEventListener("hashchange", route);
route();
</script>

</body></html>
