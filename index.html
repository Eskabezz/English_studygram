"note":"Главное правило: вспомогательный глагол встаёт ПЕРЕД подлежащим. Если его нет (Present и Past Simple) — добавляем do / does / did, а смысловой глагол теряет -s и -ed."},{"type":"uses","title":"Пять типов вопросов","items":[{"label":"Общий (Yes / No)","text":"Начинается со вспомогательного глагола; ответ — «да» или «нет».","en":"[[Does]] she [[work]] in a design office? — Yes, she does.","ru":"Она работает в проектном бюро? — Да."},{"label":"Специальный (Wh-)","text":"Начинается с вопросительного слова: what, where, when, why, how, which, whose, how much / many / long.","en":"When [[does]] the lecture [[start]]?","ru":"Когда начинается лекция?"},{"label":"Вопрос к подлежащему","text":"Who / What стоит на месте подлежащего: порядок как в утверждении, без do. После who глагол обычно в ед. ч.: Who lives here? Если множественность выражена явно (which / what + of + мн. ч.), глагол во мн. ч.: Which of you have finished?","en":"Who [[designed]] this bridge?","ru":"Кто спроектировал этот мост?"},{"label":"Альтернативный (… or …?)","text":"Выбор из двух; ответ — один из вариантов, а не yes / no.","en":"[[Is]] the bridge [[made]] of steel or concrete?","ru":"Мост стальной или бетонный?"},{"label":"Разделительный (tag)","text":"Утверждение + короткий «хвост». Подробно — в следующей главе.","en":"It's cold today, [[isn't it]]?","ru":"Сегодня холодно, правда?"}]},{"type":"compare","title":"Кто позвонил? или Кому позвонил?","left":{"title":"К подлежащему","sub":"кто? что? — без do","points":["Who / What + глагол, как в утверждении","В настоящем — глагол с -s: Who lives here?"],"examples":[{"en":"Who [[called]] you?","ru":"Кто тебе звонил?"},{"en":"What [[happened]] at the site?","ru":"Что случилось на объекте?"}]},"right":{"title":"К дополнению","sub":"кого? что? кому? — с do / did","points":["Who / What + do / did + S + V","Подлежащее стоит после do"],"examples":[{"en":"Who [[did]] you [[call]]?","ru":"Кому ты звонил?"},{"en":"What [[did]] you [[see]] at the site?","ru":"Что ты видел на объекте?"}]},"note":"Who called Anna? — «Кто позвонил Анне?» / Who did Anna call? — «Кому позвонила Анна?» Одно did меняет смысл."},{"type":"points","title":"Предлог — в конце вопроса","items":[{"label":"talk to — говорить с","en":"Who [[are]] you [[talking]] to?","ru":"С кем ты разговариваешь?"},{"label":"be made of — быть сделанным из","en":"What [[is]] this pipe [[made]] of?","ru":"Из чего сделана эта труба?"},{"label":"depend on — зависеть от","en":"What [[does]] the price [[depend]] on?","ru":"От чего зависит цена?"},{"label":"look for — искать","en":"What [[are]] you [[looking]] for?","ru":"Что ты ищешь?"},{"label":"be from — быть родом из","en":"Where [[are]] you from?","ru":"Откуда ты?"}],
"note":"В русском предлог стоит в начале («С кем…?», «От чего…?»), в английском — в конце. Предлог впереди (To whom…?) встречается только в очень официальном стиле."},{"type":"points","title":"Отрицательные вопросы","items":[{"label":"Удивление","en":"[[Don't]] you [[know]] him? He's our new engineer.","ru":"Ты что, его не знаешь? Это наш новый инженер."},{"label":"Ждём ответа «да»","en":"[[Isn't]] this your laptop?","ru":"Разве это не твой ноутбук?"},{"label":"Why … not?","en":"Why [[didn't]] you [[call]] me?","ru":"Почему ты мне не позвонил?"},{"label":"Как отвечать","text":"Отвечай по факту: действие есть — Yes, нет — No, как бы ни был задан вопрос.","en":"[[Aren't]] you [[coming]]? — Yes, I am. / No, I'm not.","ru":"Ты разве не идёшь? — Иду. / Нет, не иду."}],
"note":"Русское «да» на «Ты не идёшь?» часто значит «да, не иду». В английском Yes всегда значит, что действие есть: Yes, I am = иду.","noteKind":"warn"},{"type":"uses","title":"Вопрос к подчёркнутому слову: пошагово","items":[{"label":"Найди подчёркнутое и пойми, что это","text":"Подлежащее (кто? что? совершает действие) — или что-то другое: дополнение, место, время, причина, количество. Здесь подчёркнутая часть выделена {{вот так}}."},{"label":"Подбери вопросительное слово","text":"who — кто, what — что, where — где / куда, when — когда, why — почему, how — как, how many / how much — сколько, whose — чей, which — какой (из)."},{"label":"Подлежащее? Просто замени его","text":"Who / What + глагол в той же форме: порядок не меняется, do не нужен. После who в настоящем — форма на -s.","en":"{{The engineers}} check the bridge every year. → Who [[checks]] the bridge every year?","ru":"Кто проверяет мост каждый год?"},{"label":"Не подлежащее? Строй обычный вопрос","text":"Вопросительное слово + вспомогательный + подлежащее + смысловой глагол; подчёркнутую часть убираем.","en":"The engineers check {{the bridge}} every year. → What [[do]] the engineers [[check]] every year?","ru":"Что инженеры проверяют каждый год?"},{"label":"Есть be, have, can, will? Выносим его","text":"Если в предложении уже есть вспомогательный или модальный глагол, do не нужен.","en":"The plan will be ready {{in May}}. → When [[will]] the plan [[be]] ready?","ru":"Когда будет готов план?"},{"label":"Проверь время","text":"Время вопроса = время исходного предложения; -s и -ed «уходят» в does / did.","en":"She measured the plot {{yesterday}}. → When [[did]] she [[measure]] the plot?","ru":"Когда она обмерила участок?"}]},{"type":"table","title":"Разбор: одно предложение — шесть вопросов","head":["Подчёркнуто","Вопрос","Перевод"],"rows":[["{{Anna's team}} measured five plots in Tver last week.","Who [[measured]] five plots in Tver last week?","Кто обмерил пять участков…?"],["{{Anna's}} team measured five plots in Tver last week.","Whose team [[measured]] five plots in Tver last week?","Чья команда обмерила…?"],["Anna's team measured {{five plots}} in Tver last week.","What [[did]] Anna's team [[measure]] in Tver last week?","Что обмерила команда Анны…?"],["Anna's team measured {{five}} plots in Tver last week.","How many plots [[did]] Anna's team [[measure]] in Tver last week?","Сколько участков обмерила…?"],["Anna's team measured five plots {{in Tver}} last week.","Where [[did]] Anna's team [[measure]] five plots last week?","Где команда Анны обмерила…?"],["Anna's team measured five plots in Tver {{last week}}.","When [[did]] Anna's team [[measure]] five plots in Tver?","Когда команда Анны обмерила…?"]],"note":"«Команда Анны обмерила пять участков в Твери на прошлой неделе». Вопросы к подлежащему и к его части (Who…? Whose team…?) — без did, все остальные — с did."},{"type":"note","kind":"tip","title":"Вежливый вопрос через косвенный","text":"Чтобы спросить вежливее, начни с Could you tell me… или Do you know… — тогда вторая часть идёт с прямым порядком слов и без do. Подробнее — в главе про косвенные вопросы.","en":"Where is the dean's office? → Could you tell me where the dean's office [[is]]?","ru":"Где деканат? → Не подскажете, где деканат?"},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"Where ~~you live~~?","right":"Where [[do]] you [[live]]?","why":"В Present Simple вопрос без do не строится — одной интонации мало."},{"wrong":"Why ~~you are~~ late?","right":"Why [[are]] you late?","why":"be встаёт перед подлежащим, как любой вспомогательный."},{"wrong":"Who ~~did call~~ you?","right":"Who [[called]] you?","why":"«Кто тебе звонил?» — вопрос к подлежащему, did не нужен."},{"wrong":"Who ~~live~~ in this house?","right":"Who [[lives]] in this house?","why":"После who-подлежащего глагол в единственном числе: lives."},{"wrong":"~~About what~~ are you talking?","right":"What [[are]] you [[talking]] about?","why":"Предлог уходит в конец вопроса."}]},{"type":"quiz","items":[{"q":"___ you live near the university now?","a":"Do","why":"Present Simple, you → do."},{"q":"(Кто спроектировал этот мост?) Who ___ this bridge?","options":["designed","did designed","does design"],"a":"designed","why":"Вопрос к подлежащему — без did, глагол в Past Simple."},{"q":"(Кому ты звонил?) Who ___ you ___ (call)?","a":["did","call"],"why":"Вопрос к дополнению: did + S + V."},{"q":"(Что ты ищешь?) What are you looking ___?","a":"for","why":"look for — искать; предлог в конце."},{"q":"Вопрос к подчёркнутому: The team measured {{five plots}} last week.","options":["What did the team measure last week?","What measured the team last week?","Who measured five plots last week?"],"a":"What did the team measure last week?","why":"Не подлежащее → what + did + S + V."},{"q":"Вопрос к подчёркнутому: {{The engineers}} check the bridge every year.","options":["Who checks the bridge every year?","Who do check the bridge every year?","Who check the bridge every year?"],"a":"Who checks the bridge every year?","why":"Подлежащее → who + глагол с -s, без do."},{"q":"(Мост стальной или бетонный?) ___ the bridge made of steel or concrete?","a":"Is","why":"Альтернативный вопрос: is + S + made of … or …?"},{"q":"Aren't you coming with us? — ___ I'm staying at home.","options":["Yes, I am.","No, I'm not.","Yes, I'm not."],"a":"No, I'm not.","why":"Не иду → No, как бы ни был задан вопрос."}]},{"type":"summary","points":["Схема: (Wh-) + [[вспомогательный]] + S + [[V]] + ?","Нет вспомогательного — добавь [[do / does / did]].","Вопрос к подлежащему — без do: Who [[called]] you? Who [[lives]] here?","Предлог — в конце: What are you looking for?","К подчёркнутому: подлежащее заменяем на who / what; к остальному — вопросительное слово + обычный вопрос."]}]},{"id":"tag-questions","title":"Question Tags","subtitle":"Разделительные вопросы и краткие ответы","level":"A2–B1","tagline":"«…, не так ли?» по-английски: хвост из вспомогательного глагола и местоимения. Плюс краткие ответы и «я тоже».","formula":"(+) утверждение + [[(−) хвост]] + ?","blocks":[{"type":"formula","title":"Как строится","rows":[{"sign":"+ → −","formula":"(+) утверждение + [[isn't it / don't you…]] + ?","en":"You're a student, [[aren't you]]?","ru":"Ты ведь студент?"},{"sign":"− → +","formula":"(−) утверждение + [[is it / do you…]] + ?","en":"She isn't at work today, [[is she]]?","ru":"Её ведь сегодня нет на работе?"},{"sign":"do","formula":"Present / Past Simple → [[do / does / did]]","en":"He works at a design office, [[doesn't he]]? — They finished the survey, [[didn't they]]?","ru":"Он ведь работает в проектном бюро? — Они ведь закончили съёмку?"}],
"note":"В хвосте — тот же вспомогательный, что в предложении, и местоимение вместо имени: Anna works here, [[doesn't she]]? The bridge is new, [[isn't it]]?"},{"type":"table","title":"Какой глагол берём в хвост","head":["В предложении","Хвост","Пример"],"rows":[["am / is / are","isn't / aren't","It's cold today, [[isn't it]]?"],["was / were","wasn't / weren't","The exam was hard, [[wasn't it]]?"],["Present Simple","don't / doesn't","You live near here, [[don't you]]?"],["Past Simple","didn't","She called you, [[didn't she]]?"],["have / has + V3","haven't / hasn't","They've left, [[haven't they]]?"],["will","won't","You'll help me, [[won't you]]?"],["can / could / should","can't / couldn't / shouldn't","We should go, [[shouldn't we]]?"]],"note":"Если предложение отрицательное, хвост положительный: It isn't cold, [[is it]]? You didn't call, [[did you]]?"},{"type":"points","title":"Особые случаи","items":[{"label":"I am → aren't I","text":"Формы amn't в стандартном английском нет.","en":"I'm late, [[aren't I]]?","ru":"Я опоздал, да?"},{"label":"Let's → shall we","en":"Let's take a break, [[shall we]]?","ru":"Давай сделаем перерыв?"},{"label":"Просьба (повелительное) → will you","text":"Можно и would you / can you / could you. После Don't… — тоже will you.","en":"Close the window, [[will you]]?","ru":"Закрой окно, ладно?"},{"label":"There is / are → isn't there / aren't there","en":"There's a lift in the building, [[isn't there]]?","ru":"В здании ведь есть лифт?"},{"label":"nobody, nothing, never → обычно положительный хвост","text":"Эти слова уже делают предложение отрицательным. После nobody / somebody / everybody в хвосте — they, после nothing / everything — it.","en":"Nobody called, [[did they]]? — Nothing happened, [[did it]]?","ru":"Никто ведь не звонил? — Ничего ведь не случилось?"},{"label":"this / that → it","en":"That's your theodolite, [[isn't it]]?","ru":"Это ведь твой теодолит?"}]},{"type":"compare","title":"Интонация меняет смысл","left":{"title":"↘ Голос вниз","sub":"уверен, жду согласия","points":["Это почти не вопрос — просишь подтвердить","Типично для светской беседы"],"examples":[{"en":"It's a lovely day, [[isn't it]]? ↘","ru":"Чудесный денёк, правда?"}]},"right":{"title":"↗ Голос вверх","sub":"не уверен, правда спрашиваю","points":["Настоящий вопрос: жду ответа «да» или «нет»"],"examples":[{"en":"You've sent the report, [[haven't you]]? ↗","ru":"Ты ведь отправил отчёт? (Я не уверен.)"}]}},{"type":"formula","title":"Краткие ответы","rows":[{"sign":"+","formula":"Yes, + S + [[do / does / did]]","en":"Do you like your job? — Yes, I [[do]].","ru":"Тебе нравится твоя работа? — Да."},{"sign":"-","formula":"No, + S + [[haven't / hasn't…]]","en":"Has she finished the report? — No, she [[hasn't]].","ru":"Она закончила отчёт? — Нет."},{"sign":"+","formula":"Yes, + S + [[can / will / am…]]","en":"Can you drive? — Yes, I [[can]].","ru":"Ты умеешь водить? — Да."},{"sign":"-","formula":"No, + S + [[isn't / wasn't…]]","en":"Was the exam difficult? — No, it [[wasn't]].","ru":"Экзамен был трудный? — Нет."}],
"note":"Повторяем вспомогательный глагол из вопроса, а не смысловой: ~~Yes, I like~~ → Yes, I [[do]]. Утвердительный краткий ответ не сокращаем: ~~Yes, I'm~~ → Yes, I [[am]].","noteKind":"warn"},{"type":"compare","title":"So do I / Neither do I — «я тоже»","left":{"title":"So + вспомогательный + I","sub":"я тоже (в ответ на утверждение)","points":["Вспомогательный — по времени фразы собеседника","Разговорно: Me too."],"examples":[{"en":"I'm tired. — [[So am I]].","ru":"Я устал. — Я тоже."},{"en":"I love this city. — [[So do I]].","ru":"Я люблю этот город. — Я тоже."}]},"right":{"title":"Neither / Nor + вспомогательный + I","sub":"я тоже не (в ответ на отрицание)","points":["Глагол после neither — утвердительный","Разговорно: Me neither."],"examples":[{"en":"I can't swim. — [[Neither can I]].","ru":"Я не умею плавать. — Я тоже."},{"en":"I didn't go to the lecture. — [[Nor did I]].","ru":"Я не ходил на лекцию. — Я тоже."}]},"note":"Порядок обратный: [[So do I]], а не ~~So I do~~. Вспомогательный подстраивается под фразу: I went → So did I, I've been there → So have I."},{"type":"points","title":"I think so / I hope not","items":[{"label":"I think so / I don't think so","en":"Is the office open today? — I [[think so]]. / I [[don't think so]].","ru":"Офис сегодня работает? — Думаю, да. / Думаю, нет."},{"label":"I hope so — надеюсь, да","en":"Will the bridge be ready by May? — I [[hope so]].","ru":"Мост будет готов к маю? — Надеюсь, да."},{"label":"I hope not — надеюсь, нет","en":"Is it going to rain tomorrow? — I [[hope not]].","ru":"Завтра будет дождь? — Надеюсь, нет."},{"label":"I'm afraid so / I'm afraid not — боюсь, что да / нет","en":"Do we have to redo the drawings? — I'm [[afraid so]].","ru":"Нам придётся переделывать чертежи? — Боюсь, что да."}],
"note":"С hope и afraid отрицание — только через not: I [[hope not]], а не ~~I don't hope so~~. С think, expect, suppose обычно говорят I [[don't think so]].","noteKind":"warn"},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"It's cold today, ~~is not it~~?","right":"It's cold today, [[isn't it]]?","why":"В хвосте — краткая форма isn't it. Полная is it not — только в очень книжной речи."},{"wrong":"You live here, ~~isn't it~~?","right":"You live here, [[don't you]]?","why":"isn't it — не универсальное «не так ли»: хвост строится из вспомогательного и подлежащего самого предложения."},{"wrong":"Nobody came, ~~didn't they~~?","right":"Nobody came, [[did they]]?","why":"nobody — уже отрицание, поэтому хвост положительный."},{"wrong":"Do you like it? — Yes, I ~~like~~.","right":"Do you like it? — Yes, I [[do]].","why":"В кратком ответе — вспомогательный глагол из вопроса."},{"wrong":"Will it rain? — I ~~don't hope so~~.","right":"Will it rain? — I [[hope not]].","why":"«Надеюсь, что нет» = I hope not."}]},{"type":"quiz","items":[{"q":"You're an engineer, ___ you?","a":"aren't","why":"(+) → отрицательный хвост: are → aren't."},{"q":"She works at the cadastral office, ___ she?","a":"doesn't","why":"Present Simple, she → doesn't."},{"q":"I'm late, ___?","options":["amn't I","aren't I","isn't I"],"a":"aren't I","why":"I am → aren't I."},{"q":"Let's go by metro, ___?","options":["shall we","don't we","will you"],"a":"shall we","why":"Let's → shall we."},{"q":"Nobody called me, ___ they?","a":"did","why":"nobody — уже отрицание, хвост положительный."},{"q":"Did you check the measurements? — Yes, I ___.","a":"did","why":"Краткий ответ — вспомогательный из вопроса."},{"q":"I can't swim. — ___ can I.","a":"Neither","alt":["Nor"],"why":"На отрицание — Neither / Nor + вспомогательный + I."},{"q":"Will it rain tomorrow? — I hope ___.","options":["not","no","don't"],"a":"not","why":"«Надеюсь, что нет» = I hope not."}]},{"type":"summary","points":["(+) утверждение → (−) хвост, и наоборот: It's cold, [[isn't it]]? It isn't cold, [[is it]]?","В хвосте — вспомогательный из предложения + местоимение; нет вспомогательного — [[do / does / did]].","Особые: I'm → [[aren't I]], Let's → [[shall we]], nobody → положительный хвост.","Краткий ответ: Yes, I [[do]]. / No, she [[hasn't]].","«Я тоже»: [[So do I]] / [[Neither do I]]; «надеюсь, нет» — I [[hope not]]."]}]}]},{"id":"verbals","roman":"X","title":"Герундий, инфинитив, причастия","chapters":[{"id":"gerund-infinitive","title":"Gerund or Infinitive?","subtitle":"Глагол + -ing или глагол + to V","level":"A2–B1","tagline":"После одних глаголов второй глагол идёт с -ing, после других — с to. Выбор зависит от первого глагола, поэтому списки надо просто выучить.","formula":"S + V + [[V-ing / to V]]","blocks":[{"type":"formula","title":"Как строится","rows":[{"sign":"-ing","formula":"S + enjoy / finish / avoid… + [[V-ing]]","en":"I {{enjoy}} [[working]] outdoors.","ru":"Мне нравится работать на открытом воздухе."},{"sign":"to","formula":"S + want / decide / hope… + [[to V]]","en":"She {{decided}} [[to become]] a surveyor.","ru":"Она решила стать геодезистом."},{"sign":"-","formula":"S + V + [[not to V / not V-ing]]","en":"They {{decided}} [[not to build]] a second floor.","ru":"Они решили не строить второй этаж."}],
"note":"По-русски после глагола почти всегда инфинитив: «люблю работать», «бросил курить». Отсюда главная ошибка — ставить to V везде. Частица not стоит перед to или перед -ing."},{"type":"table","title":"Глаголы + V-ing","head":["Глагол","Перевод","Пример"],"rows":[["enjoy","нравиться, получать удовольствие","I enjoy [[drawing]] plans."],["finish","закончить","Have you finished [[writing]] the report?"],["avoid","избегать","He avoids [[answering]] my questions."],["mind","возражать (в вопросах и отрицаниях)","I don't mind [[working]] late."],["suggest","предлагать (идею)","She suggested [[going]] by train."],["keep (on)","продолжать, всё время","He keeps [[making]] the same mistake."],["give up","бросить, перестать","I gave up [[smoking]] last year."],["practise","тренироваться","You need to practise [[speaking]]."],["deny","отрицать","He denied [[damaging]] the equipment."],["consider","обдумывать вариант","We're considering [[buying]] a drone."],["can't stand","терпеть не могу","I can't stand [[waiting]] in queues."],["put off","откладывать","Don't put off [[checking]] the data."]],"note":"Сюда же: imagine, miss (скучать по), risk, admit, postpone, recommend. Глагол practise в британском варианте пишется через s."},{"type":"table","title":"Глаголы + to V","head":["Глагол","Перевод","Пример"],"rows":[["want","хотеть","I want [[to learn]] English properly."],["decide","решить","We decided [[to use]] a drone."],["hope","надеяться","I hope [[to pass]] the exam."],["plan","планировать","They plan [[to open]] a new office."],["promise","обещать","He promised [[to call]] me."],["refuse","отказаться","She refused [[to sign]] the contract."],["agree","согласиться","They agreed [[to help]] us."],["manage","суметь, справиться","I managed [[to finish]] on time."],["learn","научиться","Where did you learn [[to swim]]?"],["offer","предложить (сделать самому)","He offered [[to drive]] me home."],["afford","позволить себе (по деньгам)","We can't afford [[to buy]] a car."],["seem","казаться","She seems [[to be]] tired."],["expect","ожидать, рассчитывать","I expect [[to finish]] by Friday."]],"note":"Подсказка: многие из этих глаголов смотрят в будущее — хочу, планирую, обещаю. Но это не закон, список всё равно учим. Если между глаголами стоит человек (want [[you to help]]), это сложное дополнение — подробнее в главе про Complex Object."},{"type":"table","title":"Оба варианта — смысл тот же","head":["Глагол","Перевод","С -ing","С to V"],"rows":[["like","нравиться, любить","I like [[working]] in a team.","I like [[to work]] in a team."],["love","очень любить","She loves [[travelling]].","She loves [[to travel]]."],["hate","ненавидеть","I hate [[getting up]] early.","I hate [[to get up]] early."],["prefer","предпочитать","He prefers [[working]] alone.","He prefers [[to work]] alone."],["start / begin","начать","It started [[raining]].","It started [[to rain]]."],["continue","продолжать","They continued [[working]].","They continued [[to work]]."]],"note":"Два -ing подряд обычно не ставят: It's starting [[to rain]], а не starting raining. В британском варианте бывает разница: like doing — «нравится», like to do — «считаю, что так правильно» (даже если не в радость): I like [[to check]] the data twice."},{"type":"compare","title":"like или would like?","left":{"title":"like / love / hate","sub":"нравится вообще","points":["Общее отношение к занятию.","Можно и -ing, и to V."],"examples":[{"en":"I {{like}} [[flying]].","ru":"Я люблю летать."},{"en":"She {{hates}} [[waiting]].","ru":"Она терпеть не может ждать."}]},"right":{"title":"would like / love / prefer","sub":"хотел бы (сейчас, в конкретном случае)","points":["Вежливое «хочу».","Только to V."],"examples":[{"en":"I {{would like}} [[to fly]] to Baikal next summer.","ru":"Я бы хотел полететь на Байкал следующим летом."},{"en":"{{Would}} you {{like}} [[to join]] us?","ru":"Не хочешь присоединиться к нам?"}]},"note":"I'd like = I would like. После would like -ing не бывает.","noteKind":"warn"},{"type":"points","title":"Прилагательные и too / enough + to V","items":[{"label":"It's + прилагательное + to V","text":"Оценка действия: легко, трудно, важно, опасно.","en":"It's {{important}} [[to check]] the level before work.","ru":"Важно проверить нивелир перед началом работы.","examples":[{"en":"This map is {{easy}} [[to read]].","ru":"Эту карту легко читать."}]},{"label":"Чувства: glad, sorry, surprised + to V","en":"I'm {{glad}} [[to see]] you.","ru":"Рад тебя видеть."},{"label":"too + прилагательное + to V — слишком, чтобы","en":"The box is {{too heavy}} [[to lift]].","ru":"Ящик слишком тяжёлый, его не поднять."},{"label":"прилагательное + enough + to V — достаточно, чтобы","en":"He's {{old enough}} [[to drive]].","ru":"Он уже достаточно взрослый, чтобы водить машину.","examples":[{"en":"We don't have {{enough}} time [[to finish]] the survey.","ru":"У нас не хватает времени, чтобы закончить съёмку."}]}],
"note":"Кто делает — через for: It's hard for me [[to explain]]. Подробнее про too и enough — в главе про too / enough / so / such."},{"type":"note","kind":"warn","title":"После предлога — только -ing","text":"Если перед глаголом стоит предлог (in, at, of, about, without, before…), глагол идёт с -ing. Инфинитива после предлога не бывает. Помни: в look forward to / be used to / object to слово to — предлог, поэтому дальше V-ing: I look forward to hearing from you. Подробнее — в главе про функции герундия.","en":"She's {{interested in}} [[learning]] Spanish. He left {{without}} [[saying]] goodbye.","ru":"Ей интересно учить испанский. Он ушёл, не попрощавшись."},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"I enjoy ~~to work~~ with maps.","right":"I enjoy [[working]] with maps.","why":"После enjoy — только -ing, хотя по-русски «люблю работать»."},{"wrong":"She suggested ~~to go~~ by train.","right":"She suggested [[going]] by train.","why":"suggest + -ing (или suggest that…), но никогда не to V."},{"wrong":"I want ~~go~~ home.","right":"I want [[to go]] home.","why":"Без to — только после модальных (can, must, should). want — обычный глагол."},{"wrong":"I'd like ~~going~~ to Baikal.","right":"I'd like [[to go]] to Baikal.","why":"would like — только to V, в отличие от просто like."},{"wrong":"Do you mind ~~to open~~ the window?","right":"Do you mind [[opening]] the window?","why":"mind + -ing."}]},{"type":"quiz","items":[{"q":"I finally finished ___ (write) my course project.","a":"writing","why":"finish + -ing."},{"q":"We can't afford ___ (buy) new equipment this year.","a":"to buy","why":"afford + to V."},{"q":"Would you mind ___ (close) the door?","a":"closing","why":"mind + -ing."},{"q":"I love ___ (travel) by train.","a":"travelling","alt":["to travel","traveling"],"why":"После love подходят оба варианта."},{"q":"I'd like ___ an engineer one day.","options":["becoming","to become","become"],"a":"to become","why":"would like — только to V."},{"q":"The instructions are easy ___ (follow).","a":"to follow","why":"Прилагательное + to V."},{"q":"She ___ going to the site together.","options":["offered","suggested","wanted"],"a":"suggested","why":"Из этих глаголов только suggest идёт с -ing."},{"q":"My laptop keeps ___ (freeze).","a":"freezing","why":"keep + -ing = «всё время, постоянно»."}]},{"type":"summary","points":["enjoy, finish, avoid, mind, suggest, keep, give up, can't stand + [[V-ing]].","want, decide, hope, plan, promise, refuse, agree, manage, afford + [[to V]].","like, love, hate, prefer, start, begin, continue — можно оба; would like — только [[to V]].","It's easy / too heavy / old enough + [[to V]].","После предлога — всегда [[V-ing]]."]}]},{"id":"verb-meaning-change","title":"Stop doing or stop to do?","subtitle":"Глаголы, у которых меняется смысл; make, let, help + V","level":"B1","tagline":"У нескольких глаголов -ing и to V дают разный смысл: stop smoking — бросить курить, stop to smoke — остановиться, чтобы покурить.","blocks":[{"type":"compare","title":"stop","left":{"title":"stop + V-ing","sub":"перестать, прекратить","points":["Само действие прекращается."],"examples":[{"en":"He {{stopped}} [[smoking]] two years ago.","ru":"Он бросил курить два года назад."},{"en":"{{Stop}} [[talking]], please!","ru":"Перестаньте разговаривать, пожалуйста!"}]},"right":{"title":"stop + to V","sub":"остановиться, чтобы…","points":["Прерываем одно дело ради другого; to V = «чтобы»."],"examples":[{"en":"On the way we {{stopped}} [[to buy]] some water.","ru":"По дороге мы остановились, чтобы купить воды."},{"en":"The surveyor {{stopped}} [[to check]] his notes.","ru":"Геодезист остановился, чтобы свериться с записями."}]},"note":"Проверка: если по-русски можно вставить «чтобы», нужен to V."},{"type":"compare","title":"remember / forget","left":{"title":"remember / forget + V-ing","sub":"помнить / забыть, что уже было","points":["Сначала действие, потом воспоминание о нём.","forget doing чаще всего в I'll never forget…"],"examples":[{"en":"I {{remember}} [[locking]] the door.","ru":"Я точно помню, что запер дверь."},{"en":"I'll never {{forget}} [[seeing]] Baikal for the first time.","ru":"Никогда не забуду, как впервые увидел Байкал."}]},"right":{"title":"remember / forget + to V","sub":"не забыть / забыть сделать","points":["Сначала вспоминаешь, потом делаешь: дело ещё впереди."],"examples":[{"en":"{{Remember}} [[to save]] the file!","ru":"Не забудь сохранить файл!"},{"en":"I {{forgot}} [[to charge]] the GPS receiver.","ru":"Я забыл зарядить GPS-приёмник."}]},"note":"Remember to… переводим «не забудь…», а не «помни…»."},{"type":"compare","title":"try","left":{"title":"try + V-ing","sub":"попробовать (как способ)","points":["Сделать нетрудно; проверяем, поможет ли."],"examples":[{"en":"The printer isn't working. {{Try}} [[restarting]] it.","ru":"Принтер не работает. Попробуй его перезагрузить."},{"en":"If you can't sleep, {{try}} [[drinking]] warm milk.","ru":"Если не спится, попробуй выпить тёплого молока."}]},"right":{"title":"try + to V","sub":"стараться, пытаться","points":["Сделать трудно, успех не гарантирован."],"examples":[{"en":"I {{tried}} [[to lift]] the box, but it was too heavy.","ru":"Я пытался поднять ящик, но он был слишком тяжёлый."},{"en":"{{Try}} [[not to be]] late.","ru":"Постарайся не опаздывать."}]}},{"type":"points","title":"regret, need, go on","items":[{"label":"regret + V-ing — жалеть о сделанном","en":"I {{regret}} [[not taking]] that job.","ru":"Жалею, что не согласился на ту работу."},{"label":"regret + to say / tell / inform — с сожалением сообщаем","text":"Официальная формула плохих новостей.","en":"We {{regret}} [[to inform]] you that your application has been rejected.","ru":"С сожалением сообщаем, что ваша заявка отклонена."},{"label":"need + to V — нужно сделать самому","en":"I {{need}} [[to check]] these figures.","ru":"Мне нужно проверить эти цифры."},{"label":"need + V-ing — нужно, чтобы с этим что-то сделали","text":"Подлежащее — вещь, над которой надо поработать. Смысл пассивный: = need to be done.","en":"The roof {{needs}} [[repairing]]. = The roof {{needs}} [[to be repaired]].","ru":"Крышу нужно отремонтировать."},{"label":"go on + V-ing — продолжать то же самое","en":"She {{went on}} [[talking]] after the bell.","ru":"Она продолжала говорить и после звонка."},{"label":"go on + to V — перейти к следующему","en":"After the introduction, the lecturer {{went on}} [[to explain]] the method.","ru":"После вступления лектор перешёл к объяснению метода."}]},{"type":"note","kind":"tip","title":"Как запомнить","text":"-ing обычно смотрит назад или на само действие (уже было, идёт, прекращается). to V смотрит вперёд, на цель: то, что ещё предстоит сделать.","en":"I {{remember}} [[meeting]] him. — {{Remember}} [[to meet]] him at six.","ru":"Помню, что встречал его. — Не забудь встретить его в шесть."},{"type":"table","title":"Сводная таблица","head":["Глагол","+ V-ing","+ to V"],"rows":[["stop","перестать","остановиться, чтобы"],["remember","помнить, что делал","не забыть сделать"],["forget","забыть, что делал","забыть сделать"],["try","попробовать как способ","стараться, пытаться"],["regret","жалеть, что сделал","с сожалением сообщать"],["need","с вещью нужно что-то сделать","нужно сделать самому"],["go on","продолжать то же","перейти к другому"]]},{"type":"formula","title":"make, let, help — без to","rows":[{"sign":"make","formula":"make + O + [[V]]","en":"Our teacher {{makes}} us [[rewrite]] bad reports.","ru":"Преподаватель заставляет нас переписывать плохие отчёты."},{"sign":"let","formula":"let + O + [[V]]","en":"My parents {{let}} me [[drive]] their car.","ru":"Родители разрешают мне водить их машину."},{"sign":"help","formula":"help + O + [[V / to V]]","en":"She {{helped}} me [[find]] the error. = She {{helped}} me [[to find]] the error.","ru":"Она помогла мне найти ошибку."},{"sign":"Пассив","formula":"be made + [[to V]]","en":"We {{were made}} [[to rewrite]] the report.","ru":"Нас заставили переписать отчёт."}],
"note":"В активе после make и let to не ставим: ~~made me to do~~. В пассиве to появляется: was made [[to wait]]. А let в пассиве не используют — говорят be allowed to: I was allowed [[to leave]] early.","noteKind":"warn"},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"I stopped ~~to smoke~~ last year. (= бросил)","right":"I stopped [[smoking]] last year.","why":"Бросить, перестать — stop + -ing. Stop to smoke — остановиться, чтобы покурить."},{"wrong":"Don't forget ~~locking~~ the door.","right":"Don't forget [[to lock]] the door.","why":"Не забыть сделать (дело впереди) — forget / remember + to V."},{"wrong":"I remember ~~to meet~~ him in 2019.","right":"I remember [[meeting]] him in 2019.","why":"Помню то, что уже было, — remember + -ing."},{"wrong":"The teacher made us ~~to rewrite~~ the test.","right":"The teacher made us [[rewrite]] the test.","why":"make + дополнение + V без to."},{"wrong":"The car needs ~~to wash~~.","right":"The car needs [[washing]].","why":"Машина сама себя не моет: need + -ing или need to be done."}]},{"type":"quiz","items":[{"q":"I'm sure I've met him before. I remember ___ (see) him at the conference.","a":"seeing","why":"Помню то, что уже было, — -ing."},{"q":"Please remember ___ (send) the drawings to the client tomorrow.","a":"to send","why":"Не забыть сделать в будущем — to V."},{"q":"We were tired, so we stopped ___ a rest.","options":["having","to have","have"],"a":"to have","why":"Остановились, чтобы отдохнуть, — stop + to V."},{"q":"I tried ___ (move) the cabinet, but it was too heavy.","a":"to move","why":"Пытался, но не вышло — try + to V."},{"q":"The walls need ___ (paint).","a":"painting","alt":["to be painted"],"why":"Стены красят другие: need + -ing = need to be done."},{"q":"They made me ___ the whole report again.","options":["write","to write","writing"],"a":"write","why":"make + дополнение + V без to."},{"q":"He was made ___ (pay) a fine.","a":"to pay","why":"В пассиве после be made появляется to."},{"q":"After graduating, she went on ___ a successful engineer.","options":["becoming","to become","become"],"a":"to become","why":"Переход к следующему этапу — go on + to V."}]},{"type":"summary","points":["stop [[doing]] — перестать; stop [[to do]] — остановиться, чтобы.","remember / forget [[doing]] — о том, что было; [[to do]] — не забыть сделать.","try [[doing]] — попробовать способ; try [[to do]] — стараться.","The roof needs [[repairing]] = needs [[to be repaired]].","make / let + O + [[V]] без to; но be made [[to do]]; help + O + (to) V."]}]},{"id":"gerund-functions","title":"The Gerund","subtitle":"Герундий: функции в предложении и перевод","level":"B1","tagline":"Глагол с -ing в роли существительного: подлежащее, дополнение, слово после предлога. Главное — узнать его в техническом тексте и перевести нормальным русским.","formula":"{{by / without / after}} + [[V-ing]]","blocks":[{"type":"formula","title":"Где стоит герундий","rows":[{"sign":"Подлежащее","formula":"[[V-ing]] + V","en":"[[Building]] skyscrapers requires careful planning.","ru":"Строительство небоскрёбов требует тщательного планирования."},{"sign":"Дополнение","formula":"V + [[V-ing]]","en":"The crew finished [[pouring]] the concrete.","ru":"Бригада закончила заливать бетон."},{"sign":"После предлога","formula":"предлог + [[V-ing]]","en":"You can reduce costs {{by}} [[using]] prefabricated panels.","ru":"Можно снизить затраты, используя сборные панели."},{"sign":"Определение","formula":"сущ. + of + [[V-ing]]","en":"There are several methods {{of}} [[determining]] the area of a plot.","ru":"Существует несколько способов определения площади участка."},{"sign":"После be","formula":"S + be + [[V-ing]]","en":"His job is [[checking]] the drawings.","ru":"Его работа — проверять чертежи."}],
"note":"Герундий — глагол в роли существительного: отвечает на вопрос «что?». При этом он остаётся глаголом: у него может быть своё дополнение (building skyscrapers) и наречие (checking carefully)."},{"type":"markers","title":"После этих слов — герундий","groups":[{"label":"Предлоги","chips":["by|путём, с помощью","without|без, не сделав","instead of|вместо того чтобы","before|перед тем как","after|после того как","on|по (прибытии), сразу после","in|при, в процессе","besides|кроме того, что","for|для, за то, что"]},{"label":"Составные предлоги","chips":["due to|из-за, вследствие (причина)","because of|из-за","in spite of / despite|несмотря на","apart from|помимо"]},{"label":"Глагол / прилагательное + предлог","chips":["result in|приводить к","depend on|зависеть от","be based on|основываться на","be interested in|интересоваться","succeed in|суметь, преуспеть в","insist on|настаивать на","be good at|хорошо уметь"]},{"label":"Ловушка: to — предлог","chips":["look forward to|ждать с нетерпением","be used to|привыкнуть к","object to|возражать против"]}],
"note":"В look forward to, be used to, object to частица to — это предлог, поэтому после неё -ing: I look forward to [[hearing]] from you.","noteKind":"warn","en":"Accuracy {{depends on}} [[choosing]] the right instrument.","ru":"Точность зависит от правильного выбора прибора."},{"type":"uses","title":"Как переводить на русский","items":[{"label":"Существительным","text":"Самый частый способ в технических текстах.","en":"[[Surveying]] the site took two days.","ru":"Съёмка участка заняла два дня.","examples":[{"en":"The use of new tools resulted {{in}} [[developing]] better methods.","ru":"Применение новых инструментов привело к разработке более совершенных методов."}]},{"label":"Инфинитивом","en":"[[Checking]] the data twice is a good habit.","ru":"Проверять данные дважды — хорошая привычка.","examples":[{"en":"Engineers began [[using]] drones about ten years ago.","ru":"Инженеры начали использовать дроны лет десять назад."}]},{"label":"Деепричастием","text":"Обычно после by (используя) и without (не проверив).","en":"{{By}} [[using]] industrial methods, we can build much faster.","ru":"Используя индустриальные методы, мы можем строить гораздо быстрее.","examples":[{"en":"Never leave the site {{without}} [[checking]] the equipment.","ru":"Никогда не уходи с объекта, не проверив оборудование."}]},{"label":"Придаточным предложением","text":"Когда нужен союз («вместо того чтобы», «после того как») или у герундия свой исполнитель.","en":"{{Instead of}} [[repairing]] the old bridge, the city built a new one.","ru":"Вместо того чтобы ремонтировать старый мост, город построил новый.","examples":[{"en":"The engineer insisted {{on}} our [[checking]] the calculations again.","ru":"Инженер настоял на том, чтобы мы ещё раз проверили расчёты."}]}]},{"type":"table","title":"Формы герундия","head":["Форма","Строится","Пример","Перевод"],"rows":[["Простая, актив","[[V-ing]]","I don't like [[interrupting]] people.","Не люблю перебивать людей."],["Простая, пассив","[[being V3]]","I don't like [[being interrupted]].","Не люблю, когда меня перебивают."],["Перфектная, актив","[[having V3]]","He denied [[having damaged]] the instrument.","Он отрицал, что повредил прибор."],["Перфектная, пассив","[[having been V3]]","She was proud of [[having been chosen]].","Она гордилась тем, что её выбрали."]],"note":"Пассив — когда действие совершают над подлежащим. Перфектная форма подчёркивает, что действие было раньше; в живой речи её часто заменяют простой: He denied [[damaging]] the instrument."},{"type":"compare","title":"Герундий или причастие I?","left":{"title":"Герундий","sub":"как существительное","points":["Отвечает на «что?».","Подлежащее, дополнение, слово после предлога.","Можно заменить существительным: using → использование."],"examples":[{"en":"[[Reading]] technical texts is not easy.","ru":"Читать технические тексты непросто."},{"en":"He is good {{at}} [[drawing]] plans.","ru":"Он хорошо чертит планы."}]},"right":{"title":"Причастие I","sub":"как прилагательное или деепричастие","points":["Отвечает на «какой?» (…ющий) или «делая что?» (…я).","Стоит при существительном или отделено запятой."],"examples":[{"en":"The woman [[checking]] the drawings is our engineer.","ru":"Женщина, которая проверяет чертежи, — наш инженер."},{"en":"[[Reading]] the text, I found three mistakes.","ru":"Читая текст, я нашёл три ошибки."}]},"note":"Форма одна и та же — различаем по функции. Подробнее о причастиях — в главе про причастия."},{"type":"points","title":"Три ловушки при переводе","items":[{"label":"V-ing в начале: подлежащее или обстоятельство?","text":"Если сразу за -ing-группой идёт сказуемое — это герундий-подлежащее. Если стоит запятая и новое подлежащее — это причастие.","en":"[[Using]] GNSS saves time. / [[Using]] GNSS, the surveyor saves time.","ru":"Использование GNSS экономит время. / Используя GNSS, геодезист экономит время."},{"label":"be + V-ing: время или герундий?","text":"Если подлежащее — «задача, цель, работа», а V-ing объясняет, в чём она состоит, это герундий.","en":"Our task is [[checking]] the data. / We are [[checking]] the data.","ru":"Наша задача — проверка данных. / Мы проверяем данные."},{"label":"V-ing перед существительным: для чего или какой?","text":"Предмет для этого действия — герундий; предмет сам это делает — причастие.","en":"a [[measuring]] tape / a [[developing]] country","ru":"рулетка (лента для измерений) / развивающаяся страна"}]},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"I'm looking forward to ~~see~~ you.","right":"I'm looking forward to [[seeing]] you.","why":"to в look forward to — предлог, после него -ing."},{"wrong":"~~Build~~ bridges requires experience.","right":"[[Building]] bridges requires experience.","why":"Действие в роли подлежащего — герундий; голый глагол подлежащим не бывает."},{"wrong":"He left without ~~to say~~ goodbye.","right":"He left without [[saying]] goodbye.","why":"После предлога — только -ing."},{"wrong":"Instead ~~to use~~ a tape, we used a laser rangefinder.","right":"Instead of [[using]] a tape, we used a laser rangefinder.","why":"instead of — предлог (с of!), после него -ing."},{"wrong":"Thank you for ~~help~~ me.","right":"Thank you for [[helping]] me.","why":"for — предлог; если за ним глагол, то с -ing."}]},{"type":"quiz","items":[{"q":"The engineer is used to ___ (work) at night.","a":"working","why":"be used to — to здесь предлог, дальше -ing."},{"q":"You can save time by ___ (use) a laser rangefinder.","a":"using","why":"После предлога by — герундий."},{"q":"___ (check) the calculations took us an hour.","a":"Checking","why":"Действие в роли подлежащего — герундий."},{"q":"Как перевести: «He left the site without checking the equipment.»","options":["Он ушёл с объекта, не проверив оборудование.","Он ушёл с объекта, проверив оборудование.","Он ушёл с объекта без оборудования."],"a":"Он ушёл с объекта, не проверив оборудование.","why":"without + V-ing = «не» + деепричастие: не проверив."},{"q":"В каком предложении -ing-форма — герундий?","options":["Using a drone saves a lot of time.","Using a drone, we mapped the area in a day.","We are using a drone this week."],"a":"Using a drone saves a lot of time.","why":"Using a drone — подлежащее, сразу за ним сказуемое saves."},{"q":"I object to ___ (treat) like a child.","a":"being treated","why":"Со мной так обращаются — пассив being + V3; to здесь предлог."},{"q":"Как перевести: «The use of new materials resulted in reducing costs.»","options":["Применение новых материалов привело к снижению затрат.","Применение новых материалов было вызвано снижением затрат.","Применение новых материалов зависело от снижения затрат."],"a":"Применение новых материалов привело к снижению затрат.","why":"result in — «приводить к»; герундий переводим существительным."},{"q":"After ___ (graduate) from university, she became a surveyor.","a":"graduating","alt":["having graduated"],"why":"После предлога after — герундий."}]},{"type":"summary","points":["Герундий = [[V-ing]] в роли существительного: подлежащее, дополнение, слово после предлога.","После любого предлога (by, without, instead of, after, in, on) — только [[V-ing]]; look forward to / be used to тоже.","Переводим существительным, инфинитивом, деепричастием (by using — используя) или придаточным.","Формы: [[being V3]] — пассив, [[having V3]] — действие раньше.","Герундий отвечает на «что?», причастие — на «какой?» или «делая что?»."]}]},{"id":"complex-object","title":"Complex Object","subtitle":"Сложное дополнение: I want you to help me","level":"B1","tagline":"Когда хочешь, чтобы действие сделал кто-то другой: I want you to help — «я хочу, чтобы ты помог». Без that и без придаточного.","formula":"S + want + O + [[to V]]","blocks":[{"type":"formula","title":"Как строится","rows":[{"sign":"+","formula":"S + want / would like / expect + O + [[to V]]","en":"I {{want}} [[you to help]] me.","ru":"Я хочу, чтобы ты мне помог."},{"sign":"+","formula":"S + make / let + O + [[V]]","en":"The boss {{made}} [[us stay]] late.","ru":"Начальник заставил нас задержаться."},{"sign":"+","formula":"S + see / hear / watch + O + [[V / V-ing]]","en":"I {{saw}} [[him leave]] the building.","ru":"Я видел, как он вышел из здания."},{"sign":"-","formula":"S + ask / tell + O + [[not to V]]","en":"She {{asked}} [[me not to tell]] anyone.","ru":"Она попросила меня никому не говорить."},{"sign":"?","formula":"Do + S + want + O + [[to V]] + ?","en":"Do you {{want}} [[me to call]] a taxi?","ru":"Вызвать тебе такси?"}],
"note":"После want никогда не бывает that: ~~I want that you help me~~. Русское «хочу, чтобы ты…» по-английски — want + you + to V.","noteKind":"warn"},{"type":"table","title":"Местоимение — в объектной форме","head":["Кто","Форма после глагола","Пример"],"rows":[["I","me","Mum wants [[me to call]] her."],["you","you","I'd like [[you to meet]] my brother."],["he","him","We expect [[him to arrive]] at five."],["she","her","Ask [[her to wait]]."],["it","it","I want [[it to be]] ready by Monday."],["we","us","They told [[us to wait]]."],["they","them","Let [[them decide]]."]],"note":"Не ~~he to call~~, а [[him to call]]: после глагола местоимение всегда в форме дополнения."},{"type":"uses","title":"После каких глаголов","items":[{"label":"Хотеть и ожидать: want, would like, expect, need","text":"Перевод — «хочу, чтобы…», «ожидаю, что…».","en":"We {{expect}} [[the work to be finished]] by May.","ru":"Мы ожидаем, что работы будут закончены к маю.","examples":[{"en":"I {{would like}} [[you to check]] these figures.","ru":"Я бы хотел, чтобы ты проверил эти цифры."}]},{"label":"Просить, велеть, советовать, разрешать: ask, tell, advise, allow","text":"Перевод — «попросил, чтобы…», «велел…», «разрешил…».","en":"The foreman {{told}} [[the workers to wear]] helmets.","ru":"Прораб велел рабочим надеть каски.","examples":[{"en":"The teacher {{allowed}} [[us to use]] calculators.","ru":"Преподаватель разрешил нам пользоваться калькуляторами."}]},{"label":"Заставлять и разрешать: make, let — без to","text":"Подробнее про make, let и help — в главе про stop doing / stop to do.","en":"Don't {{make}} [[me laugh]]!","ru":"Не смеши меня!","examples":[{"en":"{{Let}} [[me explain]].","ru":"Дай я объясню."}]},{"label":"Восприятие: see, hear, watch, feel, notice — без to","en":"I {{heard}} [[someone call]] my name.","ru":"Я услышал, как кто-то окликнул меня."},{"label":"Мнение: consider, find, believe + (to be)","text":"Книжный стиль. После consider и find to be часто опускают.","en":"Engineers {{consider}} [[this method to be]] the most reliable.","ru":"Инженеры считают этот метод самым надёжным.","examples":[{"en":"I {{found}} [[the task difficult]].","ru":"Задание показалось мне трудным."}]}]},{"type":"compare","title":"see him cross или see him crossing?","left":{"title":"see / hear + O + V","sub":"действие целиком","points":["Видел или слышал всё действие от начала до конца."],"examples":[{"en":"I {{saw}} [[the crane lift]] the beam.","ru":"Я видел, как кран поднял балку."},{"en":"We {{heard}} [[her close]] the door.","ru":"Мы слышали, как она закрыла дверь."}]},"right":{"title":"see / hear + O + V-ing","sub":"часть процесса","points":["Застал действие в середине; чем кончилось — неважно."],"examples":[{"en":"I {{saw}} [[the crane lifting]] the beam.","ru":"Я видел, как кран поднимал балку."},{"en":"I {{heard}} [[them arguing]] in the corridor.","ru":"Я слышал, как они спорили в коридоре."}]},"note":"Часто подсказывает русский вид: «поднял» (всё действие) — V, «поднимал» (процесс) — V-ing."},{"type":"note","kind":"tip","title":"Как переводить на русский","text":"Сложное дополнение почти всегда переводим придаточным: want / expect — «чтобы…», «что…»; see / hear — «как…»; consider / believe — «что…». Дополнение (me, the workers) становится подлежащим придаточного, а to V — его сказуемым.","en":"The client {{wants}} [[the house to be built]] by autumn.","ru":"Заказчик хочет, чтобы дом построили к осени."},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"I want ~~that you help~~ me.","right":"I want [[you to help]] me.","why":"После want не бывает that-придаточного: дополнение + to V."},{"wrong":"She wants ~~he to call~~ her.","right":"She wants [[him to call]] her.","why":"Нужна объектная форма: me, him, her, us, them."},{"wrong":"They made us ~~to wait~~.","right":"They made [[us wait]].","why":"make / let + дополнение + V без to."},{"wrong":"I saw him ~~to cross~~ the road.","right":"I saw [[him cross]] the road.","why":"После see / hear / watch — V без to или V-ing."}]},{"type":"quiz","items":[{"q":"I'd like ___ (you / meet) my supervisor.","a":"you to meet","why":"would like + дополнение + to V."},{"q":"The foreman told ___ (we / wait) for the crane.","a":"us to wait","why":"we → us; tell + дополнение + to V."},{"q":"Don't make me ___ it again.","options":["repeat","to repeat","repeating"],"a":"repeat","why":"make + дополнение + V без to."},{"q":"Как перевести: «We want the drawings to be ready by Monday.»","options":["Мы хотим, чтобы чертежи были готовы к понедельнику.","Мы хотим быть готовыми к чертежам в понедельник.","Мы хотели, чтобы чертежи были готовы к понедельнику."],"a":"Мы хотим, чтобы чертежи были готовы к понедельнику.","why":"want + дополнение + to V = «хотим, чтобы…»; want — настоящее время."},{"q":"She wants ___ to the conference.","options":["me to go","that I go","I go"],"a":"me to go","why":"want + me + to V; that после want не ставится."},{"q":"My parents never let me ___ (stay) out after midnight.","a":"stay","why":"let + дополнение + V без to."},{"q":"I heard somebody ___ (call) my name, so I turned round.","a":"call","alt":["calling"],"why":"После hear — V (всё действие) или V-ing (процесс); здесь подходят оба."},{"q":"The client expects the bridge ___ by 2027.","options":["to be completed","to complete","be completed"],"a":"to be completed","why":"Мост достраивают другие — пассивный инфинитив to be + V3."}]},{"type":"summary","points":["«Хочу, чтобы ты…» = want / would like / expect + [[you to V]].","Никакого that после want; местоимение — me, him, her, us, them.","make / let / see / hear + O + [[V]] без to.","see him [[cross]] — всё действие; see him [[crossing]] — процесс.","Переводим придаточным: «чтобы…», «как…», «что…»."]}]},{"id":"complex-subject","title":"Complex Subject","subtitle":"Сложное подлежащее: He is said to…","level":"B1–B2","tagline":"«Говорят, что…», «считается, что…», «по-видимому…» — в научных и технических текстах это чаще пишут так: подлежащее + is said / seems + to V.","formula":"S + [[is said / seems]] + [[to V]]","blocks":[{"type":"formula","title":"Как строится","rows":[{"sign":"Пассив","formula":"S + [[is said / known / believed]] + [[to V]]","en":"This bridge [[is said to be]] the oldest in the city.","ru":"Говорят, этот мост — самый старый в городе."},{"sign":"Актив","formula":"S + [[seems / appears / happens]] + [[to V]]","en":"The instrument [[seems to work]] properly.","ru":"Прибор, кажется, работает исправно."},{"sign":"be + прил.","formula":"S + [[is likely / sure]] + [[to V]]","en":"The project [[is likely to be finished]] in May.","ru":"Проект, вероятно, завершат в мае."},{"sign":"-","formula":"S + [[doesn't seem]] + [[to V]]","en":"The engineer [[doesn't seem to understand]] the problem.","ru":"Инженер, похоже, не понимает проблемы."}],
"note":"Подлежащее английского предложения по-русски обычно уходит в придаточное: He is said to live… → Говорят, что он живёт…"},{"type":"compare","title":"It is said that… = He is said to…","left":{"title":"It is said that…","sub":"безличная конструкция","points":["It + is + V3 + that + обычное предложение."],"examples":[{"en":"It {{is known}} that he designed the bridge.","ru":"Известно, что он спроектировал этот мост."}]},"right":{"title":"He is said to…","sub":"сложное подлежащее","points":["Подлежащее придаточного выходит вперёд, глагол превращается в to V."],"examples":[{"en":"He [[is known to have designed]] the bridge.","ru":"Известно, что он спроектировал этот мост."}]},"note":"Смысл и перевод одинаковые. Вторая конструкция короче, поэтому её любят в научных текстах."},{"type":"markers","title":"Какие глаголы так работают","groups":[{"label":"Пассив: be + V3","chips":["is said|говорят","is known|известно","is believed|полагают","is considered|считается","is thought|считается, думают","is expected|ожидается","is reported|сообщается","is supposed|предполагается, должен"]},{"label":"Актив","chips":["seems|кажется","appears|по-видимому","happens|случайно","turns out / proves|оказывается"]},{"label":"be + прилагательное","chips":["is likely|вероятно","is unlikely|вряд ли","is sure / certain|наверняка, обязательно"]}],
"en":"She [[happened to be]] on site when the inspection started.","ru":"Она случайно оказалась на объекте, когда началась проверка."},{"type":"table","title":"Какой инфинитив — когда","head":["Инфинитив","Когда","Пример","Перевод"],"rows":[["[[to V]]","одновременно, обычно","He [[is said to live]] in Omsk.","Говорят, что он живёт в Омске."],["[[to be V-ing]]","процесс прямо сейчас","He [[seems to be working]] on a new project.","Похоже, он сейчас работает над новым проектом."],["[[to have V3]]","раньше, в прошлом","He [[is known to have designed]] the bridge.","Известно, что он спроектировал этот мост."],["[[to be V3]]","пассив: сейчас или в будущем","The work [[is expected to be finished]] by May.","Ожидается, что работу закончат к маю."],["[[to have been V3]]","пассив в прошлом","The church [[is believed to have been built]] in 1650.","Считается, что церковь построили в 1650 году."]],"note":"Главный вопрос: действие одновременно с is said / seems или раньше? Раньше — нужен to have V3."},{"type":"uses","title":"Как переводить на русский","items":[{"label":"is said / is reported → говорят, сообщается, что…","en":"The new material [[is reported to be]] very strong.","ru":"Сообщается, что новый материал очень прочный.","examples":[{"en":"The company [[is said to be planning]] a new residential district.","ru":"Говорят, что компания планирует построить новый жилой район."}]},{"label":"is known / believed / considered → известно, полагают, считается","en":"Granite [[is known to be]] very durable.","ru":"Известно, что гранит очень долговечен.","examples":[{"en":"This method [[is considered to be]] the most accurate.","ru":"Этот метод считается самым точным."}]},{"label":"is expected → ожидается, что…","en":"The bridge [[is expected to open]] next year.","ru":"Ожидается, что мост откроют в следующем году."},{"label":"seems / appears → кажется, по-видимому","en":"The soil [[appears to be]] too wet for building.","ru":"Грунт, по-видимому, слишком влажный для строительства.","examples":[{"en":"You [[seem to know]] a lot about maps.","ru":"Ты, кажется, много знаешь о картах."}]},{"label":"turns out / happens → оказывается, случайно","en":"The old map [[turned out to be]] wrong.","ru":"Старая карта оказалась неверной.","examples":[{"en":"I [[happened to meet]] our teacher at the station.","ru":"Я случайно встретил нашего преподавателя на вокзале."}]},{"label":"is likely / unlikely / certain → вероятно, вряд ли, наверняка","en":"The work [[is unlikely to be finished]] on time.","ru":"Работу вряд ли закончат вовремя.","examples":[{"en":"The new ring road [[is certain to reduce]] traffic in the centre.","ru":"Новая кольцевая дорога наверняка разгрузит центр."}]}]},{"type":"note","kind":"tip","title":"Алгоритм перевода","text":"1) Найди сказуемое: is said, is believed, seems. 2) Переведи его первым: «говорят, что», «считается, что», «кажется». 3) Подлежащее + to V переведи придаточным, время — по форме инфинитива.","en":"The castle [[is believed to have been built]] in the 12th century.","ru":"Считается, что замок был построен в XII веке."},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"He ~~is said that he lives~~ in London.","right":"He [[is said to live]] in London.","why":"Либо It is said that he lives…, либо He is said to live…; смешивать нельзя."},{"wrong":"He is believed ~~to leave~~ the country last year.","right":"He [[is believed to have left]] the country last year.","why":"Действие было раньше (last year) — нужен to have V3."},{"wrong":"He ~~seems knowing~~ the answer.","right":"He [[seems to know]] the answer.","why":"seem + to V."},{"wrong":"~~They say him to be~~ a good engineer.","right":"He [[is said to be]] a good engineer.","why":"С say в активе такой конструкции нет: только He is said to be… или They say (that) he is…"},{"wrong":"He is said to be an expert. — ~~Он сказал, что он эксперт.~~","right":"He [[is said to be]] an expert. — Говорят, что он эксперт.","why":"is said — пассив: говорит не он, говорят о нём."}]},{"type":"quiz","items":[{"q":"Как перевести: «The tunnel is expected to be completed in 2028.»","options":["Ожидается, что тоннель будет завершён в 2028 году.","Тоннель ожидает завершения в 2028 году.","Тоннель ожидали завершить в 2028 году."],"a":"Ожидается, что тоннель будет завершён в 2028 году.","why":"is expected → «ожидается, что…»; to be completed — пассив в будущем."},{"q":"He is said ___ (work) for a big construction company now.","a":"to work","alt":["to be working"],"why":"Одновременно с is said — to V; с now можно и to be V-ing."},{"q":"The house is believed ___ (build) in the 18th century.","a":"to have been built","why":"Дом строили (пассив) и раньше (прошлое) — to have been V3."},{"q":"Как перевести: «He seems to know the answer.»","options":["Он, кажется, знает ответ.","Ему кажется, что он знает ответ.","Он хочет узнать ответ."],"a":"Он, кажется, знает ответ.","why":"seems to — «кажется» как вводное слово; кажется говорящему, а не ему."},{"q":"The results ___ to be accurate.","options":["are considered","consider","are considering"],"a":"are considered","why":"Результаты считают точными — нужен пассив be + V3."},{"q":"The price of steel is likely ___ (rise) next year.","a":"to rise","why":"be likely + to V."},{"q":"The plan turned out ___ wrong.","options":["to be","being","be"],"a":"to be","why":"turn out + to V."},{"q":"The engineer is known ___ (design) three bridges in this city.","a":"to have designed","why":"Он уже спроектировал их раньше — to have V3."}]},{"type":"summary","points":["S + [[is said / known / believed / expected to V]] = «говорят / известно / полагают / ожидается, что…».","S + [[seems / appears / turns out / happens to V]] = «кажется», «по-видимому», «оказывается», «случайно».","S + [[is likely / unlikely / sure to V]] = «вероятно», «вряд ли», «наверняка».","Раньше — [[to have V3]]; пассив — [[to be V3]]; процесс — [[to be V-ing]].","Переводим с глагола: сначала «говорят, что», потом подлежащее и его действие."]}]},{"id":"participles","title":"Participles","subtitle":"Причастия: Participle I, Participle II, Perfect Participle","level":"B1–B2","tagline":"Формы на -ing и V3, которые работают как прилагательное («строящийся», «построенный») или как деепричастие («используя», «закончив»). В технических текстах — на каждой строчке.","blocks":[{"type":"table","title":"Формы причастий (глагол build)","head":["Форма","Актив (сам делает)","Пассив (с ним делают)"],"rows":[["Participle I — одновременно","[[building]] — строящий; строя","[[being built]] — строящийся (сейчас)"],["Participle II","—","[[built]] — построенный"],["Perfect Participle — раньше","[[having built]] — построив","[[having been built]] — после того как был построен"]],"note":"Participle I = Present Participle, Participle II = Past Participle (третья форма, V3). Participle II переходных глаголов имеет пассивный смысл; у некоторых непереходных — активный: [[fallen]] leaves (опавшие листья), a [[retired]] engineer (инженер на пенсии)."},{"type":"uses","title":"Функция 1: определение (какой?)","items":[{"label":"Participle I — «…щий», «…щийся»","text":"Одно причастие обычно стоит перед существительным, причастие с пояснениями — после.","en":"a [[developing]] country; the [[rising]] water level","ru":"развивающаяся страна; поднимающийся уровень воды","examples":[{"en":"The engineer [[working]] on this project is from Tomsk.","ru":"Инженер, работающий над этим проектом, из Томска."},{"en":"The cadastre provides information [[identifying]] the owners of land.","ru":"Кадастр даёт информацию, позволяющую установить владельцев земли."}]},{"label":"Participle II — «…нный», «…тый», «…мый»","text":"Времени не показывает: the method used — «используемый» или «использованный», решает контекст.","en":"the method [[used]]; the [[measured]] distance","ru":"используемый (использованный) метод; измеренное расстояние","examples":[{"en":"Mining surveyors measure the volumes [[mined]] each month.","ru":"Маркшейдеры каждый месяц замеряют объёмы добычи."},{"en":"One of the instruments [[used]] back then was the dial.","ru":"Одним из применявшихся тогда приборов был лимб (круг со шкалой)."}]},{"label":"Participle II с пояснениями — после существительного","en":"Modern theodolites offer an accuracy beyond the dreams of the early surveyor [[armed]] only with a dial and a measuring chain.","ru":"Современные теодолиты дают точность, о которой и не мечтал геодезист прошлого, вооружённый лишь горным компасом и мерной цепью."},{"label":"Пассивное Participle I — «…щийся» прямо сейчас","en":"The bridge [[being built]] across the river will be 2 km long.","ru":"Мост, который сейчас строят через реку, будет длиной 2 км.","examples":[{"en":"the problems [[being discussed]] at the meeting","ru":"проблемы, которые обсуждаются на совещании"}]}]},{"type":"uses","title":"Функция 2: обстоятельство (как? когда? почему?)","items":[{"label":"Participle I — «делая» (одновременно)","en":"[[Using]] GNSS, the surveyor measures the coordinates of each point.","ru":"Используя GNSS, геодезист измеряет координаты каждой точки.","examples":[{"en":"The theodolites were equipped with vertical circles, [[enabling]] the measurement of vertical angles.","ru":"Теодолиты были оснащены вертикальными кругами, что позволяло измерять вертикальные углы."}]},{"label":"Perfect Participle — «сделав» (раньше)","en":"[[Having finished]] the survey, the team returned to the camp.","ru":"Закончив съёмку, бригада вернулась в лагерь."},{"label":"when / if / unless / once + V3 — «при…», «если…»","text":"Сокращённое пассивное придаточное: when (it is) heated.","en":"{{When}} [[heated]], the metal expands.","ru":"При нагревании металл расширяется.","examples":[{"en":"{{Unless}} [[protected]], steel rusts quickly.","ru":"Если сталь не защитить, она быстро ржавеет."}]},{"label":"Participle II без союза — причина, условие","en":"[[Made]] of reinforced concrete, the structure is very strong.","ru":"Конструкция выполнена из железобетона, поэтому она очень прочная."},{"label":"Пассивное Perfect Participle — «после того как был…»","en":"[[Having been tested]] in the laboratory, the new concrete mix was used on site.","ru":"После лабораторных испытаний новую бетонную смесь применили на объекте."}],
"note":"Причастие-обстоятельство относится к подлежащему главного предложения: [[Using]] GNSS, the surveyor… — использует GNSS именно геодезист.","noteKind":"warn"},{"type":"compare","title":"Participle I или Participle II?","left":{"title":"Participle I (V-ing)","sub":"активное: сам делает","points":["Предмет или человек сам выполняет действие.","Перевод: «…ющий», «…ящий», «делая»."],"examples":[{"en":"the engineer [[testing]] the samples","ru":"инженер, испытывающий образцы"},{"en":"a [[developing]] country","ru":"развивающаяся страна"}]},"right":{"title":"Participle II (V3)","sub":"пассивное: с ним сделали","points":["Действие совершили над предметом.","Перевод: «…нный», «…тый», «…мый»."],"examples":[{"en":"the samples [[tested]] by the engineer","ru":"образцы, испытанные инженером"},{"en":"a [[developed]] country","ru":"развитая страна"}]},"note":"Спроси себя: предмет сам делает или с ним делают? Сам — V-ing, с ним — V3. Про boring / bored — в главе про прилагательные и наречия."},{"type":"points","title":"Как переводить на русский","items":[{"label":"Причастием","en":"the [[rising]] water level / the [[measured]] angle","ru":"поднимающийся уровень воды / измеренный угол"},{"label":"Придаточным «который…»","text":"Когда при причастии много слов — так звучит естественнее.","en":"The workers [[building]] the road are from Kazan.","ru":"Рабочие, которые строят дорогу, — из Казани."},{"label":"Деепричастием","en":"[[Having checked]] the level, the surveyor started work.","ru":"Проверив нивелир, геодезист начал работу."},{"label":"Придаточным «так как…», «когда…»","en":"[[Being]] a student, he can't afford a car.","ru":"Так как он студент, он не может позволить себе машину."},{"label":"Существительным: «при…», «после…»","en":"{{Once}} [[completed]], the tunnel will connect two districts.","ru":"После завершения тоннель соединит два района."},{"label":"Вторым сказуемым: «и…», «что…»","en":"The river flooded the valley, [[destroying]] several bridges.","ru":"Река затопила долину и разрушила несколько мостов."}]},{"type":"points","title":"Причастие, время или герундий?","items":[{"label":"be + V-ing — это время (Continuous)","text":"Если перед V-ing стоит am / is / are / was / were, это сказуемое, а не причастие.","en":"The crane [[is lifting]] the beam.","ru":"Кран поднимает балку."},{"label":"be + V3 — это пассив","text":"Без be та же форма — причастие-определение.","en":"The bridge [[was built]] in 1990. / the bridge [[built]] in 1990","ru":"Мост был построен в 1990 году. / мост, построенный в 1990 году"},{"label":"-ed: Past Simple или Participle II?","text":"Если у предложения уже есть сказуемое дальше, а -ed стоит сразу после существительного, это причастие.","en":"The engineer [[tested]] the samples. / The samples [[tested]] yesterday were good.","ru":"Инженер испытал образцы. / Образцы, испытанные вчера, оказались хорошими."},{"label":"Герундий отвечает на «что?»","text":"Стоит после предлога или сам является подлежащим. Подробнее — в главе про герундий.","en":"[[Using]] GNSS saves time. / [[Using]] GNSS, we save time.","ru":"Использование GNSS экономит время. / Используя GNSS, мы экономим время."}]},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"The ~~using~~ method is very accurate.","right":"The method [[used]] is very accurate.","why":"«Используемый» — метод используют (пассив) → V3. Одно used перед существительным значит «подержанный»: a used car."},{"wrong":"The bridge ~~building~~ across the river is huge.","right":"The bridge [[being built]] across the river is huge.","why":"Мост не строит сам — его строят: нужен пассив being + V3."},{"wrong":"~~Finished~~ the work, we went home.","right":"[[Having finished]] the work, we went home.","why":"«Закончив» = having + V3. Одно finished — пассивное «законченный»."},{"wrong":"The instruments used have changed. — ~~Приборы использовали и изменились.~~","right":"The instruments [[used]] have changed. — Используемые приборы изменились.","why":"Сказуемое здесь have changed, значит used — причастие, а не Past Simple."},{"wrong":"~~Walking to the site, a car nearly hit me.~~","right":"[[Walking]] to the site, I was nearly hit by a car.","why":"Причастие относится к подлежащему: шёл я, а не машина."}]},{"type":"quiz","items":[{"q":"The house ___ (build) in our street now will have ten floors.","a":"being built","why":"Дом строят прямо сейчас (пассив, процесс) — being + V3."},{"q":"___ the survey, the team packed up the equipment.","options":["Finishing","Having finished","Finished"],"a":"Having finished","why":"Сначала закончили, потом собрались — having + V3."},{"q":"Как перевести: «When heated, water turns into steam.»","options":["При нагревании вода превращается в пар.","Нагревая, вода превращается в пар.","Когда вода нагревает, она превращается в пар."],"a":"При нагревании вода превращается в пар.","why":"When + V3 — пассив: воду нагревают, она сама не нагревает."},{"q":"The results ___ (obtain) in the laboratory were checked twice.","a":"obtained","why":"Результаты получили (пассив) — Participle II."},{"q":"В каком предложении -ing-форма — причастие I?","options":["Designing tunnels is difficult.","The engineer designing the tunnel is from Omsk.","She is good at designing tunnels."],"a":"The engineer designing the tunnel is from Omsk.","why":"designing описывает engineer: «проектирующий»."},{"q":"___ (use) a laser scanner, we created a 3D model of the building.","a":"Using","why":"Одновременное действие того же подлежащего — V-ing («используя»)."},{"q":"___ in 1990, the bridge now needs repairs.","options":["Built","Building","Having built"],"a":"Built","why":"Мост построили (пассив) — Participle II."},{"q":"Как перевести: «The instruments used have changed a lot.»","options":["Используемые приборы сильно изменились.","Приборы использовали и сильно изменили.","Приборы, которые используют, сильно изменят."],"a":"Используемые приборы сильно изменились.","why":"used — определение, сказуемое — have changed."}]},{"type":"summary","points":["Participle I [[V-ing]] — «…щий», «делая»; Participle II [[V3]] — «…нный», «…тый».","[[Having V3]] — «сделав», раньше главного действия; [[being V3]] — «…щийся» прямо сейчас.","Сам делает — V-ing; с ним делают — V3: the method [[used]], the bridge [[being built]].","Переводим причастием, деепричастием, придаточным («который», «когда», «так как») или «при…».","Перед V-ing / V3 стоит be — это время или пассив, а не причастие."]}]}]},{"id":"adjectives","roman":"XI","title":"Прилагательные и наречия","chapters":[{"id":"adjectives-adverbs","title":"Adjectives and Adverbs","subtitle":"Прилагательные и наречия","level":"A2–B1","tagline":"Прилагательное говорит, какой предмет, наречие — как происходит действие.","formula":"adj + [[-ly]]","blocks":[{"type":"compare","title":"Прилагательное или наречие?","left":{"title":"Прилагательное","sub":"какой? — описывает предмет","points":["Стоит перед существительным: a [[careful]] driver.","Или после be и глаголов-связок: He is [[careful]]."],"examples":[{"en":"She is a [[careful]] driver.","ru":"Она осторожный водитель."}]},"right":{"title":"Наречие","sub":"как? — описывает действие","points":["Описывает глагол: drive [[carefully]].","Может уточнять прилагательное: [[extremely]] careful — крайне осторожный."],"examples":[{"en":"She drives [[carefully]].","ru":"Она осторожно водит машину."}]},"note":"Задай вопрос: «какой?» — прилагательное, «как?» — наречие. Большинство наречий = прилагательное + -ly."},{"type":"table","title":"Как образовать наречие","head":["Прилагательное оканчивается на","Что делаем","Пример"],"rows":[["почти любую букву","+ ly","quick → [[quickly]], careful → [[carefully]]"],["согласная + y","y → ily","easy → [[easily]], heavy → [[heavily]]"],["-le","e → y","possible → [[possibly]], simple → [[simply]]"],["-ic","+ ally","automatic → [[automatically]], basic → [[basically]]"],["good","особая форма","good → [[well]]"],["fast, hard, late, early","форма не меняется","a fast car → drive [[fast]]"]],"note":"Не всё на -ly — наречие: friendly, lovely, lonely, silly — прилагательные. «Дружелюбно» — in a friendly way."},{"type":"points","title":"Одинаковые формы и ловушки","items":[{"label":"fast, hard, late, early — одна форма","text":"Эти слова — и прилагательные, и наречия: -ly не добавляем.","en":"We work [[hard]] and often finish [[late]].","ru":"Мы много работаем и часто заканчиваем поздно."},{"label":"hard ≠ hardly","text":"hardly = «почти не, едва». Отрицание not с ним не нужно.","en":"I [[hardly]] know him.","ru":"Я его почти не знаю.","examples":[{"en":"She works [[hard]].","ru":"Она усердно работает."},{"en":"She [[hardly]] works.","ru":"Она почти не работает."}]},{"label":"late ≠ lately","text":"lately = «в последнее время», обычно с Present Perfect.","en":"Have you seen Oleg [[lately]]?","ru":"Ты видел Олега в последнее время?","examples":[{"en":"The bus arrived [[late]].","ru":"Автобус пришёл с опозданием."}]},{"label":"good и well","text":"good — «хороший», well — «хорошо». Но well бывает и прилагательным: «здоров».","en":"She speaks English [[well]]. — Her English is [[good]].","ru":"Она хорошо говорит по-английски. — У неё хороший английский.","examples":[{"en":"I don't feel [[well]] today.","ru":"Мне сегодня нездоровится."}]}]},{"type":"formula","title":"После look, feel, sound — прилагательное","rows":[{"sign":"look","formula":"S + look + [[adj]]","en":"You look [[tired]].","ru":"Ты выглядишь усталым."},{"sign":"sound","formula":"S + sound + [[adj]]","en":"Your plan sounds [[good]].","ru":"Твой план звучит хорошо."},{"sign":"feel","formula":"S + feel + [[adj]]","en":"I feel [[fine]] now.","ru":"Сейчас я чувствую себя нормально."},{"sign":"taste","formula":"S + taste / smell + [[adj]]","en":"This soup tastes [[delicious]].","ru":"Этот суп очень вкусный."},{"sign":"seem","formula":"S + seem / become / get + [[adj]]","en":"The task seems [[easy]].","ru":"Задача кажется лёгкой."}],
"note":"Здесь глагол описывает, «каким» кто-то кажется. Если же это действие — нужно наречие: He looked [[angry]]. — Он выглядел сердитым. He looked at me [[angrily]]. — Он сердито посмотрел на меня.","noteKind":"warn"},{"type":"compare","title":"-ed или -ing: bored или boring?","left":{"title":"-ed","sub":"что человек чувствует","points":["bored — мне скучно","interested — мне интересно","tired — я устал","confused — я запутался"],"examples":[{"en":"I'm [[interested]] in geodesy.","ru":"Мне интересна геодезия."},{"en":"We were [[tired]] after the trip.","ru":"Мы устали после поездки."}]},"right":{"title":"-ing","sub":"что вызывает это чувство","points":["boring — скучный","interesting — интересный","tiring — утомительный","confusing — запутанный"],"examples":[{"en":"Geodesy is [[interesting]].","ru":"Геодезия — интересная наука."},{"en":"The trip was [[tiring]].","ru":"Поездка была утомительной."}]},"note":"«Мне скучно» — I'm [[bored]]. А ~~I'm boring~~ значит «я скучный человек».","noteKind":"warn"},{"type":"table","title":"Порядок прилагательных перед существительным","head":["№","Что описывает","Примеры"],"rows":[["1","мнение, оценка","nice, beautiful, useful"],["2","размер","big, small, tall"],["3","возраст","old, new, modern"],["4","форма","round, square, flat"],["5","цвет","red, grey, white"],["6","происхождение","Russian, Italian, German"],["7","материал","wooden, metal, concrete"]],"note":"Мнение — первым, материал — последним: a [[beautiful old wooden]] house — красивый старый деревянный дом. Больше трёх прилагательных подряд почти не ставят."},{"type":"points","title":"Где стоит наречие","items":[{"label":"Как? — после глагола и дополнения","text":"Обычное место наречия образа действия — после дополнения: He checked the drawings carefully.","en":"He checked the drawings [[carefully]].","ru":"Он внимательно проверил чертежи."},{"label":"Как часто? — перед смысловым глаголом","text":"Но после am / is / are и после первого вспомогательного глагола.","en":"We [[usually]] start at eight.","ru":"Мы обычно начинаем в восемь.","examples":[{"en":"He is [[always]] on time.","ru":"Он всегда приходит вовремя."},{"en":"I have [[never]] used this program.","ru":"Я никогда не пользовался этой программой."}]},{"label":"Насколько? — перед прилагательным или наречием","text":"very, really, extremely, quite, rather, a bit. quite ставится перед a / an: quite a long way.","en":"The exam was [[really]] difficult.","ru":"Экзамен был действительно трудным.","examples":[{"en":"It's [[quite]] a long way.","ru":"Это довольно далеко."},{"en":"It's [[rather]] cold today.","ru":"Сегодня довольно холодно."}]}],
"note":"quite = «довольно» (скорее неплохо): quite good — неплохой. С «абсолютными» словами quite = «совершенно»: quite sure, quite right. rather — «довольно», чаще о неприятном. В американском quite good ближе к «очень хороший»."},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"She speaks ~~well English~~.","right":"She speaks English [[well]].","why":"Наречие не ставим между глаголом и дополнением: сначала что, потом как."},{"wrong":"I'm often ~~boring~~ at lectures.","right":"I'm often [[bored]] at lectures.","why":"«Мне скучно» — bored; boring — «скучный, занудный»."},{"wrong":"He drives ~~careful~~.","right":"He drives [[carefully]].","why":"Как водит? — нужно наречие с -ly."},{"wrong":"She plays the piano ~~good~~.","right":"She plays the piano [[well]].","why":"good — «хороший»; «хорошо» при глаголе — well."},{"wrong":"I ~~hardly work~~ to pass the exam.","right":"I work [[hard]] to pass the exam.","why":"hard — «усердно», hardly — «почти не»: смысл противоположный."}]},{"type":"quiz","items":[{"q":"Please drive ___ (careful). The road is icy.","a":"carefully","why":"Как вести машину? — наречие: careful + ly."},{"q":"The excursion was really ___ (interest).","a":"interesting","why":"Экскурсия вызывает интерес — форма на -ing."},{"q":"He speaks English very ___.","options":["good","well"],"a":"well","why":"Как говорит? — наречие well."},{"q":"You look ___. Did you sleep badly?","options":["tired","tiredly"],"a":"tired","why":"После look в значении «выглядеть» — прилагательное."},{"q":"I haven't seen Anton ___ (в последнее время).","a":"lately","alt":["recently"],"why":"«В последнее время» — lately (или recently), не late."},{"q":"I can ___ (почти не) understand this text without a dictionary.","a":"hardly","alt":["barely","scarcely"],"why":"hardly = «почти не»; not с ним не нужно."},{"q":"They live in a ___ house.","options":["wooden beautiful old","beautiful old wooden","beautiful wooden old"],"a":"beautiful old wooden","why":"Порядок: мнение — возраст — материал."},{"q":"Выбери правильный порядок слов.","options":["He checked carefully the plan.","He checked the plan carefully."],"a":"He checked the plan carefully.","why":"Наречие образа действия — после дополнения, не между глаголом и дополнением."}]},{"type":"summary","points":["Прилагательное — какой? (a careful driver); наречие — как? (drive [[carefully]]).","good → [[well]]; fast, hard, late, early — без -ly.","[[hardly]] = почти не, [[lately]] = в последнее время.","После look / feel / sound / seem / taste — прилагательное: You look [[tired]].","-ed — что чувствую (I'm [[bored]]), -ing — что вызывает чувство (It's [[boring]])."]}]},{"id":"comparison","title":"Comparison of Adjectives","subtitle":"Степени сравнения прилагательных и наречий","level":"A2–B1","tagline":"Выше, дешевле, самый точный: как сравнивать предметы, людей и действия.","formula":"[[adj-er / more adj]] + than","blocks":[{"type":"formula","title":"Как строится","rows":[{"sign":"Короткие","formula":"[[adj-er]] + than","en":"This road is [[shorter]] {{than}} that one.","ru":"Эта дорога короче, чем та."},{"sign":"Короткие","formula":"the + [[adj-est]]","en":"It's [[the tallest]] building in the city.","ru":"Это самое высокое здание в городе."},{"sign":"Длинные","formula":"[[more]] + adj + than","en":"This method is [[more accurate]] {{than}} the old one.","ru":"Этот метод точнее старого."},{"sign":"Длинные","formula":"the + [[most]] + adj","en":"It was [[the most difficult]] exam of the year.","ru":"Это был самый трудный экзамен за год."}],
