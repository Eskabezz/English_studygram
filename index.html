"note":"could здесь — не прошедшее время, а вежливость: Could you…? мягче, чем Can you…? please ставь в конец или после you: Could you please…?"},{"type":"table","title":"Шкала вежливости","head":["Тон","Попросить (you)","Спросить разрешения (I)"],"rows":[["просто, с друзьями","[[Can]] you [[help]] me?","[[Can]] I [[use]] your phone?"],["вежливо","[[Could]] you [[help]] me?","[[Could]] I [[use]] your phone?"],["вежливо","[[Would]] you [[help]] me?","[[May]] I [[use]] your phone? (официально)"],["очень вежливо","[[Would you mind helping]] me?","[[Do you mind]] {{if}} I [[use]] your phone?"],["максимально вежливо","[[Do you think you could help]] me?","[[Would you mind]] {{if}} I [[used]] your phone?"]],"note":"May I…? — с преподавателем, на собеседовании, в официальной обстановке. После Would you mind if I… обычно Past Simple (used), после Do you mind if I… — Present (use)."},{"type":"note","kind":"warn","title":"Как ответить на Would you mind…?","text":"mind = «возражать». Поэтому согласие звучит как «нет»: No, not at all / Of course not / No problem. Ответ Yes значит «да, возражаю» — это отказ.","en":"[[Would you mind waiting]] a minute? — No, not at all.","ru":"Подождёте минутку? — Да, конечно."},{"type":"markers","title":"Как ответить на просьбу или идею","groups":[{"label":"Согласиться","chips":["Sure|конечно","Of course|конечно","No problem|без проблем","Go ahead|да, пожалуйста"]},{"label":"Вежливо отказать","chips":["I'm afraid I can't|боюсь, не смогу","Sorry, but…|извини, но…","I'd rather you didn't|лучше не надо"]},{"label":"Ответить на идею","chips":["Good idea!|отличная мысль","Sounds good|звучит неплохо","I'd rather not|я бы не стал"]}],
"note":"На Could you…? не отвечают Yes, I could — это звучит как «теоретически мог бы». Говори Sure или Of course.","en":"[[Could]] you [[lend]] me your notes? — Sure, here you are.","ru":"Не одолжишь мне свои конспекты? — Конечно, держи."},{"type":"formula","title":"Предложить помощь или угощение","rows":[{"sign":"?","formula":"[[Shall I]] + V + ?","en":"[[Shall]] I [[carry]] your bag?","ru":"Давай я понесу твою сумку?"},{"sign":"?","formula":"[[Do you want me to]] + V + ?","en":"[[Do you want me to call]] a taxi?","ru":"Вызвать тебе такси?"},{"sign":"?","formula":"[[Would you like]] + O + ?","en":"[[Would you like]] some tea?","ru":"Хотите чаю?"},{"sign":"?","formula":"[[Would you like]] + [[to V]] + ?","en":"[[Would you like to join]] us?","ru":"Не хотите присоединиться к нам?"},{"sign":"?","formula":"[[Can I]] + V + ?","en":"[[Can]] I [[help]] you?","ru":"Вам помочь?"}],
"note":"Would you like…? — вежливое «хотите?», Do you want…? — проще, между друзьями. Помощь можно предложить и утверждением: I'll help you (про will — в главе о будущем)."},{"type":"compare","title":"Shall I…? или Would you…?","left":{"title":"Shall I…?","sub":"предлагаю сделать сам","points":["«Мне сделать…?», «Давай я…»","в американском чаще Should I…? или Do you want me to…?"],"examples":[{"en":"[[Shall]] I [[open]] the window?","ru":"Открыть окно?"}]},"right":{"title":"Will / Would you…?","sub":"прошу сделать тебя","points":["«Сделай, пожалуйста…»","Will you…? звучит почти как приказ, Would you…? — мягче"],"examples":[{"en":"[[Would]] you [[open]] the window?","ru":"Откройте, пожалуйста, окно."}]},"note":"Русское «Открыть окно?» — это предложение (Shall I…?), а «Откроешь окно?» — просьба (Could / Would you…?)."},{"type":"table","title":"Предложить идею: сделаем вместе","head":["Форма","После неё","Пример","Перевод"],"rows":[["Let's","V","[[Let's take]] a break.","Давай сделаем перерыв."],["Let's not","V","[[Let's not wait]] for them.","Давай не будем их ждать."],["Shall we…?","V","[[Shall]] we [[order]] pizza?","Закажем пиццу?"],["Why don't we…?","V","[[Why don't we ask]] the teacher?","Может, спросим преподавателя?"],["How about / What about…?","V-ing или сущ.","[[How about going]] by train?","Может, поедем на поезде?"]],"note":"How about Friday? How about meeting at six? — после about существительное или V-ing. А Why don't you…? — совет другому: Why don't you ask him? — Почему бы тебе его не спросить?"},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"Would you mind ~~to help~~ me?","right":"[[Would you mind helping]] me?","why":"После mind — только V-ing."},{"wrong":"— Would you mind waiting? — ~~Yes.~~","right":"— [[Would you mind waiting]]? — No, not at all.","why":"mind = возражать: Yes прозвучит как «да, против». Согласие — через no."},{"wrong":"~~Do you like~~ a cup of tea?","right":"[[Would you like]] a cup of tea?","why":"Предложение «хотите?» — Would you like. Do you like…? = «вам вообще нравится?»"},{"wrong":"~~Do you want I help~~ you?","right":"[[Do you want me to help]] you?","why":"Калька с «Хочешь, я помогу?»: нужно want me to + V."},{"wrong":"~~How about go~~ to the park?","right":"[[How about going]] to the park?","why":"После How about — V-ing."}]},{"type":"quiz","items":[{"q":"Would you mind ___ (close) the window?","a":"closing","why":"После mind — V-ing."},{"q":"— Would you mind if I sat here? — ___","options":["Yes, please.","No, not at all.","Yes, I would like."],"a":"No, not at all.","why":"Не возражаю = No, not at all."},{"q":"It's cold in here. ___ I close the window?","options":["Shall","Will","Would"],"a":"Shall","why":"Предлагаешь сделать сам — Shall I…?"},{"q":"How about ___ (go) to the new café after class?","a":"going","why":"После How about — V-ing."},{"q":"___ you like some coffee?","options":["Do","Would","Will"],"a":"Would","why":"Предложение-угощение — Would you like…?"},{"q":"Do you want me ___ (help) you with the drawings?","a":"to help","why":"want me to + V."},{"q":"Let's ___ a taxi — it's raining.","options":["take","to take","taking"],"a":"take","why":"После Let's — V без to."},{"q":"Excuse me, professor. ___ I ask a question?","options":["May","Would","Will"],"a":"May","why":"Официальная просьба о разрешении — May I…?"}]},{"type":"summary","points":["Просьба: [[Can / Could / Would]] you + V? Очень вежливо — [[Would you mind]] + V-ing?","На Would you mind…? согласие — No, not at all.","Разрешение: [[Can / Could / May]] I + V? May — официально.","Помощь: [[Shall I]]…? [[Do you want me to]]…? Угощение: [[Would you like]]…?","Идея вместе: [[Let's]] V, [[Shall we]]…?, [[Why don't we]]…?, [[How about]] V-ing?"]}]}]},{"id":"conditionals","roman":"VI","title":"Условные предложения","chapters":[{"id":"conditionals-0-1","title":"Zero & First Conditional","subtitle":"Условные предложения 0 и 1 типа","level":"A2–B1","tagline":"Реальные условия: что происходит всегда и что случится, если…","formula":"{{If}} + [[Present Simple]] + [[will]] + V","blocks":[{"type":"formula","title":"Zero Conditional: так бывает всегда","rows":[{"sign":"+","formula":"{{If / When}} + [[Present Simple]] + [[Present Simple]]","en":"{{If}} you [[heat]] ice, it [[melts]].","ru":"Если нагреть лёд, он тает."},{"sign":"+","formula":"{{If / When}} + [[Present Simple]] + [[Present Simple]]","en":"{{If}} you [[mix]] cement with water, it [[hardens]].","ru":"Если смешать цемент с водой, он затвердевает."},{"sign":"-","formula":"{{If}} + [[don't / doesn't V]] + [[Present Simple]]","en":"{{If}} plants [[don't get]] enough light, they [[die]].","ru":"Если растениям не хватает света, они погибают."}],
"note":"Здесь if можно заменить на when («всегда, когда»): {{When}} you [[heat]] ice, it [[melts]]. Так звучат законы природы, правила и инструкции."},{"type":"formula","title":"First Conditional: реальное будущее","rows":[{"sign":"+","formula":"{{If}} + [[Present Simple]] + [[will]] + V","en":"{{If}} it [[rains]] tomorrow, we [[will stay]] at home.","ru":"Если завтра будет дождь, мы останемся дома."},{"sign":"-","formula":"{{If}} + [[Present Simple]] + [[won't]] + V","en":"{{If}} we [[don't leave]] now, we [[won't catch]] the train.","ru":"Если мы сейчас не выйдем, то не успеем на поезд."},{"sign":"?","formula":"What + [[will]] + S + V + {{if}} + … + ?","en":"What [[will]] you [[do]] {{if}} you [[fail]] the exam?","ru":"Что ты будешь делать, если не сдашь экзамен?"},{"sign":"Вместо will","formula":"{{If}} + [[Present Simple]] + [[can / may / should]] + V","en":"{{If}} you [[need]] help, you [[can call]] me.","ru":"Если нужна помощь, можешь мне позвонить."}],
"note":"Главное правило: после if НЕ ставим will, даже если по-русски будущее. «Если пойдёт дождь» → {{if}} it [[rains]], а не ~~if it will rain~~.","noteKind":"warn"},{"type":"points","title":"Порядок частей и запятая","items":[{"label":"if-часть в начале → запятая","en":"{{If}} you [[see]] Anna, [[tell]] her to call me.","ru":"Если увидишь Анну, скажи ей, чтобы позвонила мне."},{"label":"if-часть в конце → без запятой","en":"[[Tell]] Anna to call me {{if}} you [[see]] her.","ru":"Скажи Анне, чтобы позвонила мне, если увидишь её."}],
"note":"В русском запятая перед «если» нужна всегда, в английском — только когда if-часть стоит первой. Вместо главной части может быть просьба или приказ (tell, call, don't…)."},{"type":"points","title":"Другие слова условия","items":[{"label":"unless = if … not («если не»)","text":"После unless глагол в утвердительной форме: «не» уже внутри unless.","en":"{{Unless}} you [[hurry]], you [[will miss]] the bus.","ru":"Если не поторопишься, опоздаешь на автобус.","examples":[{"en":"= {{If}} you [[don't hurry]], you [[will miss]] the bus.","ru":"Смысл тот же: если не поторопишься, опоздаешь."}]},{"label":"as long as / provided (that) — «при условии, что», «только если»","text":"Подчёркивают, что без этого условия ничего не выйдет. provided — официальнее, частое в технических и юридических текстах.","en":"You [[can borrow]] my laptop {{as long as}} you [[are]] careful with it.","ru":"Можешь взять мой ноутбук, если будешь с ним аккуратен.","examples":[{"en":"The structure [[will remain]] stable {{provided}} the load [[does not exceed]] 5 tonnes.","ru":"Конструкция останется устойчивой при условии, что нагрузка не превысит 5 тонн."}]},{"label":"in case — «на случай, если»","text":"Это не «если»: делаем что-то заранее, потому что что-то может случиться.","en":"Take a torch {{in case}} it [[gets]] dark.","ru":"Возьми фонарик на случай, если стемнеет."}],
"note":"После unless, as long as, provided и in case тоже нет will: {{unless}} it [[rains]], {{in case}} it [[gets]] dark."},{"type":"compare","title":"if или in case?","left":{"title":"if","sub":"сделаем, только если это случится","points":["сначала событие, потом действие","не случится — не сделаем"],"examples":[{"en":"We [[will buy]] more cement {{if}} we [[run]] out.","ru":"Докупим цемент, если он закончится."}]},"right":{"title":"in case","sub":"делаем заранее, на всякий случай","points":["действие — сейчас, до события","после in case тоже без will"],"examples":[{"en":"Let's buy more cement {{in case}} we [[run]] out.","ru":"Давай купим ещё цемента на случай, если он закончится."}]},"note":"Подходит «на всякий случай» — значит in case. Но in case of + существительное = «в случае»: {{In case of}} fire, do not use the lift. — При пожаре не пользуйтесь лифтом."},{"type":"compare","title":"Zero или First?","left":{"title":"Zero Conditional","sub":"всегда так: закон, факт, правило","points":["{{If}} + Present, Present","if ≈ when («всегда, когда»)"],"examples":[{"en":"{{If}} water [[freezes]], it [[expands]].","ru":"Когда вода замерзает, она расширяется."}]},"right":{"title":"First Conditional","sub":"один конкретный случай в будущем","points":["{{If}} + Present, [[will]] + V","может случиться, а может и нет"],"examples":[{"en":"{{If}} the temperature [[drops]] tonight, the pipes [[will freeze]].","ru":"Если ночью похолодает, трубы замёрзнут."}]},"note":"Спроси себя: это верно всегда или речь об одном случае в будущем?"},{"type":"points","title":"Когда will после if всё-таки возможен","items":[{"label":"if = «ли» (косвенный вопрос)","text":"Это не условие, а вопрос «придёт ли?». Проверка: if можно заменить на whether.","en":"I don't know {{if}} he [[will come]].","ru":"Не знаю, придёт ли он."},{"label":"Вежливая просьба: if you will / would…","text":"Здесь will — не будущее, а «будьте добры».","en":"{{If}} you [[will wait]] here, I'll tell the manager you've arrived.","ru":"Подождите здесь, пожалуйста, — я сообщу менеджеру, что вы пришли."}],
"note":"С when, as soon as, until, before, after — то же правило «без will»: подробнее в главе про придаточные времени."},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"If it ~~will rain~~, we'll stay at home.","right":"{{If}} it [[rains]], we'll stay at home.","why":"После if будущее выражаем Present Simple; will — только в главной части."},{"wrong":"If he ~~come~~ late, we'll start without him.","right":"{{If}} he [[comes]] late, we'll start without him.","why":"После if — обычный Present Simple: he → окончание -s."},{"wrong":"~~If heat~~ ice, it melts.","right":"{{If}} you [[heat]] ice, it [[melts]].","why":"Калька с «если нагреть»: в английском нужно подлежащее — you (= любой человек)."},{"wrong":"~~Unless you don't hurry~~, you'll be late.","right":"{{Unless}} you [[hurry]], you'll be late.","why":"unless уже значит «если не»: второе отрицание лишнее."},{"wrong":"I'll take a map ~~if~~ I get lost.","right":"I'll take a map {{in case}} I [[get]] lost.","why":"Берёшь заранее, на всякий случай — in case. С if вышло бы «возьму, когда уже заблужусь»."}]},{"type":"quiz","items":[{"q":"If it ___ (rain) tomorrow, we will postpone the fieldwork.","a":"rains","why":"После if — Present Simple, даже про будущее."},{"q":"If you ___ (not / hurry), you'll miss the train.","a":"don't hurry","why":"Отрицание в if-части — don't + V, без will."},{"q":"If you heat water to 100 °C, it ___.","options":["boils","boiled","would boil"],"a":"boils","why":"Закон природы — Zero Conditional: Present + Present."},{"q":"Take your phone ___ you need to call me.","options":["in case","unless","as long as"],"a":"in case","why":"Берёшь заранее, на всякий случай — in case."},{"q":"We won't start the concrete work ___ the weather improves.","options":["unless","if","in case"],"a":"unless","why":"«Не начнём, если погода НЕ улучшится» — unless."},{"q":"I ___ (call) you if I have any questions.","a":"will call","why":"Главная часть First Conditional — will + V.","alt":["shall call","can call"]},{"q":"You can borrow my car ___ you drive carefully.","options":["as long as","in case","unless"],"a":"as long as","why":"«При условии, что будешь ездить аккуратно» — as long as."},{"q":"If he ___ (come) late again, the teacher won't let him in.","a":"comes","why":"if + Present Simple; he → -s."}]},{"type":"summary","points":["Zero: {{If}} + Present, Present — всегда так (законы, факты, инструкции).","First: {{If}} + Present Simple, [[will]] + V — реальное будущее.","После if, unless, as long as, in case — без will.","{{unless}} = if not; {{in case}} = на случай, если (делаем заранее).","if-часть в начале — запятая; в конце — без запятой."]}]},{"id":"conditional-2","title":"Second Conditional","subtitle":"Условные предложения 2 типа","level":"B1","tagline":"Нереальное сейчас или маловероятное в будущем: «если бы…, то…».","formula":"{{If}} + [[Past Simple]] + [[would]] + V","blocks":[{"type":"formula","title":"Как строится","rows":[{"sign":"+","formula":"{{If}} + [[Past Simple]] + [[would]] + V","en":"{{If}} I [[had]] more time, I [[would learn]] Chinese.","ru":"Если бы у меня было больше времени, я бы учил китайский."},{"sign":"-","formula":"{{If}} + [[didn't]] + V + [[wouldn't]] + V","en":"{{If}} he [[didn't work]] so much, he [[wouldn't be]] so tired.","ru":"Если бы он столько не работал, он бы так не уставал."},{"sign":"?","formula":"What + [[would]] + S + V + {{if}} + … + ?","en":"What [[would]] you [[do]] {{if}} you [[won]] the lottery?","ru":"Что бы ты сделал, если бы выиграл в лотерею?"}],
"note":"would ставим только в главную часть; в if-части — Past Simple: {{If}} I [[had]]…, а не ~~If I would have~~… Сокращения: I would → I'd, would not → wouldn't.","noteKind":"warn"},{"type":"note","kind":"tip","title":"Прошедшая форма — не прошлое","text":"В if-части Past Simple говорит не о прошлом, а о нереальности: «если бы сейчас» или «если бы когда-нибудь». По-русски эту роль играет частица «бы».","en":"{{If}} I [[knew]] her number, I [[would call]] her.","ru":"Если бы я знал её номер, я бы ей позвонил. (Но я его не знаю.)"},{"type":"uses","title":"Когда используем","items":[{"label":"Нереальная ситуация сейчас","text":"На самом деле всё наоборот.","en":"{{If}} I [[lived]] closer, I [[would walk]] to university.","ru":"Если бы я жил поближе, я бы ходил в университет пешком."},{"label":"Маловероятное будущее","text":"Представляем то, что вряд ли случится.","en":"{{If}} I [[won]] a million, I [[would buy]] a house by the sea.","ru":"Если бы я выиграл миллион, я бы купил дом у моря."},{"label":"Совет: If I were you","en":"{{If}} I [[were]] you, I [[would take]] the job.","ru":"На твоём месте я бы согласился на эту работу."},{"label":"Вежливая просьба","text":"would и could смягчают фразу.","en":"It [[would be]] great {{if}} you [[could help]] us.","ru":"Было бы здорово, если бы ты смог нам помочь."}]},{"type":"note","kind":"tip","title":"were для всех лиц","text":"В if-части у to be форма were для всех лиц: I / he / she / it were. Was тоже встречается, но это разговорный вариант. В совете почти всегда говорят If I were you.","en":"{{If}} it [[were]] cheaper, more people [[would use]] it.","ru":"Если бы это было дешевле, этим пользовалось бы больше людей."},{"type":"points","title":"Вместо would — could или might","items":[{"label":"could + V = мог бы, смог бы","en":"{{If}} I [[had]] a car, I [[could drive]] you home.","ru":"Если бы у меня была машина, я мог бы отвезти тебя домой."},{"label":"might + V = возможно, …бы","en":"{{If}} you [[asked]] him, he [[might agree]].","ru":"Если бы ты его попросил, он, может, и согласился бы."},{"label":"could в if-части = если бы мог / умел","en":"{{If}} I [[could swim]], I [[would join]] you.","ru":"Если бы я умел плавать, я бы к вам присоединился."}]},{"type":"compare","title":"First или Second?","left":{"title":"First Conditional","sub":"реально, вполне может быть","points":["{{If}} + Present Simple, [[will]] + V","шанс есть"],"examples":[{"en":"{{If}} I [[get]] the grant, I [[will go]] to Germany.","ru":"Если я получу грант, я поеду в Германию."}]},"right":{"title":"Second Conditional","sub":"нереально или маловероятно","points":["{{If}} + Past Simple, [[would]] + V","шанс мал или его нет"],"examples":[{"en":"{{If}} I [[got]] the grant, I [[would go]] to Germany.","ru":"Если бы я получил грант, я бы поехал в Германию."}]},"note":"Ситуация может быть одна и та же — выбор зависит от того, насколько ты веришь, что это случится."},{"type":"table","title":"Как переводить «бы»","head":["По-русски","По-английски"],"rows":[["Если бы я знал…","{{If}} I [[knew]]…"],["…я бы помог.","…I [[would help]]."],["На твоём месте я бы…","{{If}} I [[were]] you, I [[would]]…"],["Я мог бы… / Я смог бы…","I [[could]] + V"],["Если бы не дождь…","{{If}} it [[weren't]] for the rain…"]],"note":"В русском «бы» стоит в обеих частях, в английском would — только в главной. Если речь о прошлом («если бы я тогда знал»), это уже Third Conditional — в следующей главе."},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"If I ~~would have~~ more money, I would travel.","right":"{{If}} I [[had]] more money, I [[would travel]].","why":"would — только в главной части; в if-части — Past Simple."},{"wrong":"If I ~~would be~~ you, I would apologise.","right":"{{If}} I [[were]] you, I [[would apologise]].","why":"В if-части — were, без would."},{"wrong":"If I had a car, I ~~will drive~~ you home.","right":"{{If}} I [[had]] a car, I [[would drive]] you home.","why":"Нереальное условие → в главной части would, а не will."},{"wrong":"If I knew his address, I ~~would wrote~~ to him.","right":"{{If}} I [[knew]] his address, I [[would write]] to him.","why":"После would — V без окончаний."},{"wrong":"I would help you if I ~~would can~~.","right":"I [[would help]] you {{if}} I [[could]].","why":"could уже значит «мог бы»; would can не бывает."}]},{"type":"quiz","items":[{"q":"If I ___ (have) a car, I would drive you to the station.","a":"had","why":"В if-части Second Conditional — Past Simple."},{"q":"If she knew the answer, she ___ (would / tell) us.","a":"would tell","why":"Главная часть — would + V."},{"q":"If I ___ you, I would talk to the professor.","options":["am","were","would be"],"a":"were","why":"Совет: If I were you."},{"q":"I'm sure I'll pass. If I ___ the exam, I'll have a party.","options":["pass","passed","will pass"],"a":"pass","why":"Уверен, что сдашь, и в главной части will — это First Conditional."},{"q":"I don't know the answer. If I ___ it, I would tell you.","options":["know","knew","will know"],"a":"knew","why":"Нереально сейчас — Past Simple в if-части."},{"q":"What ___ you do if you lost your passport abroad?","a":"would","why":"Воображаемая ситуация: What would you do if…?","alt":["could","might"]},{"q":"If the road ___ (not / be) so narrow, there wouldn't be traffic jams every morning.","a":"weren't","alt":["wasn't"],"why":"to be в if-части — were (was — разговорно)."},{"q":"If I had more free time, I ___ learn to drive.","options":["could","can","will"],"a":"could","why":"Нереальное условие → could (мог бы)."}]},{"type":"summary","points":["{{If}} + [[Past Simple]], [[would]] + V — нереальное сейчас или маловероятное будущее.","Прошедшая форма здесь = «бы», а не прошлое.","would — только в главной части; в if-части его нет.","{{If}} I [[were]] you… — совет; were для всех лиц (was — разговорно).","Вместо would: [[could]] (мог бы), [[might]] (возможно, …бы)."]}]},{"id":"conditional-3-mixed","title":"Third & Mixed Conditionals","subtitle":"Условные 3 типа и смешанные","level":"B1–B2","tagline":"«Если бы тогда…» — о прошлом, которое уже не изменить, и о том, как прошлое влияет на сейчас.","formula":"{{If}} + [[had]] + [[V3]] + [[would have]] + [[V3]]","blocks":[{"type":"formula","title":"Third Conditional: как строится","rows":[{"sign":"+","formula":"{{If}} + [[had]] + [[V3]] + [[would have]] + [[V3]]","en":"{{If}} I [[had studied]], I [[would have passed]] the exam.","ru":"Если бы я занимался, я бы сдал экзамен."},{"sign":"-","formula":"{{If}} + [[hadn't]] + [[V3]] + [[wouldn't have]] + [[V3]]","en":"{{If}} we [[hadn't taken]] a taxi, we [[wouldn't have caught]] the train.","ru":"Если бы мы не взяли такси, мы бы не успели на поезд."},{"sign":"?","formula":"What + [[would]] + S + [[have]] + [[V3]] + {{if}} + … + ?","en":"What [[would]] you [[have done]] {{if}} you [[had missed]] the flight?","ru":"Что бы ты делал, если бы опоздал на самолёт?"},{"sign":"Пассив","formula":"{{If}} + [[had been]] + [[V3]] + [[would have]] + [[V3]]","en":"{{If}} the beams [[had been checked]], the roof [[wouldn't have collapsed]].","ru":"Если бы балки проверили, крыша бы не обрушилась."}],
"note":"would have — только в главной части: ~~If I would have known~~ нельзя. 'd бывает и had, и would: If I'd known (= had known), I'd have come (= would have come).","noteKind":"warn"},{"type":"timeline","title":"Как это выглядит на оси времени","events":[{"kind":"dot","at":-0.65,"label":"не занимался"},{"kind":"dot","at":-0.3,"label":"не сдал экзамен"}],
"caption":"Обе части — в прошлом, и обе нереальны: всё уже случилось иначе. Мы только представляем другой вариант.","en":"{{If}} I [[had studied]], I [[would have passed]].","ru":"Если бы я тогда занимался, я бы сдал."},{"type":"uses","title":"Когда используем","items":[{"label":"Сожаление о прошлом","en":"{{If}} I [[had left]] earlier, I [[wouldn't have missed]] the train.","ru":"Если бы я вышел раньше, я бы не опоздал на поезд."},{"label":"Упрёк","en":"{{If}} you [[had listened]] to me, this [[wouldn't have happened]].","ru":"Если бы ты меня послушал, этого бы не случилось."},{"label":"Разбор причин в отчётах","text":"Что пошло бы иначе, если бы…","en":"{{If}} the soil [[had been tested]], the cracks [[could have been avoided]].","ru":"Если бы грунт исследовали, трещин можно было бы избежать."},{"label":"could have / might have вместо would have","text":"could have = мог бы; might have = возможно, …бы.","en":"{{If}} you [[had asked]] me, I [[could have helped]] you.","ru":"Если бы ты меня попросил, я мог бы тебе помочь."}]},{"type":"compare","title":"«Если бы» — второй или третий тип?","left":{"title":"Second Conditional","sub":"про сейчас","points":["{{If}} + V2, [[would]] + V","сейчас всё не так"],"examples":[{"en":"{{If}} I [[knew]] her address, I [[would write]] to her.","ru":"Если бы я знал её адрес, я бы ей написал. (Сейчас не знаю.)"}]},"right":{"title":"Third Conditional","sub":"про тогда","points":["{{If}} + had V3, [[would have]] + V3","тогда было не так"],"examples":[{"en":"{{If}} I [[had known]] her address, I [[would have written]] to her.","ru":"Если бы я тогда знал её адрес, я бы ей написал."}]},"note":"По-русски «если бы» одно на все времена, а по-английски время решает всё. Спроси себя: про сейчас или про тогда? В переводе помогают слова «тогда», «уже», «ещё»."},{"type":"compare","title":"Смешанные условные","left":{"title":"Прошлое → сейчас","sub":"условие было тогда, результат — сейчас","points":["{{If}} + [[had V3]], [[would]] + V","в главной части часто now, today"],"examples":[{"en":"{{If}} I [[had taken]] that job, I [[would be]] rich now.","ru":"Если бы я тогда согласился на ту работу, я бы сейчас был богат."},{"en":"{{If}} she [[hadn't missed]] the bus, she [[would be]] here now.","ru":"Если бы она не опоздала на автобус, она была бы уже здесь."}]},"right":{"title":"Сейчас → прошлое","sub":"условие верно всегда, результат — тогда","points":["{{If}} + [[V2]], [[would have]] + V3","условие — черта характера или постоянный факт"],"examples":[{"en":"{{If}} I [[weren't]] so lazy, I [[would have finished]] the project last week.","ru":"Если бы я не был таким ленивым, я бы закончил проект ещё на прошлой неделе."},{"en":"{{If}} he [[spoke]] English, he [[would have got]] the job.","ru":"Если бы он говорил по-английски, его бы взяли на эту работу."}]},"note":"Смотри на подсказки времени в каждой части: {{now, today}} → would + V; {{yesterday, last year, then}} → would have + V3."},{"type":"table","title":"Инверсия: условие без if","head":["С if","Без if (книжно)","Перевод"],"rows":[["{{If}} I [[had known]]…","[[Had]] I [[known]]…","Если бы я знал… / Знай я…"],["{{If}} the materials [[had not been used]]…","[[Had]] the materials [[not been used]]…","Если бы эти материалы не применялись…"],["{{If}} it [[had not been]] for…","[[Had]] it [[not been]] for…","Если бы не…"],["{{If}} I [[were]] you…","[[Were]] I you…","На твоём месте…"],["{{If}} you [[should need]] help…","[[Should]] you [[need]] help…","Если вам понадобится помощь…"]],"note":"if исчезает, а had / were / should встают перед подлежащим. not — после подлежащего и без сокращения: Had it not been…, а не ~~Hadn't it been~~…","noteKind":"warn"},{"type":"points","title":"Инверсия в текстах: примеры с переводом","items":[{"label":"Had + S + V3 → Third Conditional","en":"[[Had]] I [[known]] about the meeting, I [[would have come]].","ru":"Если бы я знал о встрече, я бы пришёл."},{"label":"Had + S + not + V3","en":"[[Had]] the new materials [[not been used]], the costs [[would have been]] much higher.","ru":"Если бы не новые материалы, затраты оказались бы гораздо выше."},{"label":"Had it not been for + сущ. = «если бы не…»","en":"[[Had]] it [[not been]] for the drainage system, the road [[would have been flooded]].","ru":"Если бы не дренажная система, дорогу бы затопило."},{"label":"Were + S… → Second Conditional","en":"[[Were]] I you, I [[would check]] the calculations again.","ru":"На твоём месте я бы ещё раз проверил расчёты."},{"label":"Should + S + V → реальное будущее, «если вдруг»","text":"Здесь should — не «должен», а вежливое «если». Типично для писем и инструкций.","en":"[[Should]] you [[need]] any further information, please contact us.","ru":"Если вам понадобится дополнительная информация, свяжитесь с нами."}]},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"If I ~~would have known~~, I would have come.","right":"{{If}} I [[had known]], I [[would have come]].","why":"В if-части — Past Perfect; would have — только в главной."},{"wrong":"If I had studied, I ~~would pass~~ the exam last year.","right":"{{If}} I [[had studied]], I [[would have passed]] the exam last year.","why":"Результат тоже в прошлом (last year) → would have + V3."},{"wrong":"If you had told me, I would have ~~came~~.","right":"{{If}} you [[had told]] me, I [[would have come]].","why":"После have — V3: come, а не came."},{"wrong":"If I ~~didn't miss~~ the bus this morning, I would be at work now.","right":"{{If}} I [[hadn't missed]] the bus this morning, I [[would be]] at work now.","why":"Условие в прошлом (this morning) → Past Perfect, даже если результат сейчас."},{"wrong":"~~Hadn't it been~~ for your help, we would have failed.","right":"[[Had]] it [[not been]] for your help, we would have failed.","why":"При инверсии not ставим после подлежащего, без сокращения."}]},{"type":"quiz","items":[{"q":"If I ___ (know) about the test, I would have prepared for it.","a":"had known","why":"В if-части Third Conditional — had + V3."},{"q":"If you had asked me, I ___ (help) you.","a":"would have helped","why":"Главная часть — would have + V3.","alt":["could have helped","might have helped"]},{"q":"If I had slept well last night, I ___ so tired now.","options":["wouldn't be","wouldn't have been","won't be"],"a":"wouldn't be","why":"Смешанный: условие вчера, результат сейчас (now) → would + V."},{"q":"___ I known about the traffic, I would have left earlier.","options":["Had","Have","Did"],"a":"Had","why":"Инверсия: Had I known = If I had known."},{"q":"___ you need any help, please call the site office.","options":["Should","Would","Had"],"a":"Should","why":"Should you need… = если вам понадобится."},{"q":"If the engineers ___ (check) the design properly, the bridge wouldn't have collapsed.","a":"had checked","why":"Нереальное прошлое → Past Perfect в if-части."},{"q":"We ___ (not / miss) the train if we had left on time.","a":"wouldn't have missed","why":"Главная часть — wouldn't have + V3."},{"q":"If the materials ___ properly, the walls wouldn't have cracked.","options":["had been tested","would have been tested","have been tested"],"a":"had been tested","why":"Пассив в if-части: had been + V3; would have туда не ставим."}]},{"type":"summary","points":["Third: {{If}} + [[had V3]], [[would have V3]] — прошлое, которое не изменить.","would have — только в главной части; в if-части [[had]] + V3.","Смешанный: прошлое → сейчас: {{If}} + had V3, [[would]] + V; сейчас → прошлое: {{If}} + V2, [[would have]] + V3.","Инверсия без if: [[Had]] I known…, [[Were]] I you…, [[Should]] you need… — «если (бы)…».","«Если бы» по-русски одно — по-английски смотри, про сейчас это или про тогда."]}]},{"id":"wish","title":"I wish / If only","subtitle":"Сожаления и желания: «жаль, что…», «вот бы…»","level":"B1–B2","tagline":"Как сказать «жаль, что…» и «вот бы…» — о настоящем, о прошлом и о чужом поведении.","formula":"I + {{wish}} + S + [[V2 / had V3 / would V]]","blocks":[{"type":"formula","title":"Как строится","rows":[{"sign":"Сейчас","formula":"S + {{wish}} + S + [[V2]]","en":"I {{wish}} I [[had]] more free time.","ru":"Жаль, что у меня так мало свободного времени."},{"sign":"Прошлое","formula":"S + {{wish}} + S + [[had]] + [[V3]]","en":"I {{wish}} I [[had started]] earlier.","ru":"Жаль, что я не начал раньше."},{"sign":"Поведение","formula":"S + {{wish}} + S + [[would]] + V","en":"I {{wish}} the neighbours [[would turn]] the music down.","ru":"Хоть бы соседи сделали музыку потише."},{"sign":"could","formula":"S + {{wish}} + S + [[could]] + V","en":"I {{wish}} I [[could come]] with you.","ru":"Жаль, что я не могу пойти с тобой."}],
"note":"Тот же «шаг назад», что в условных: о настоящем — прошедшая форма (как в Second Conditional), о прошлом — had V3 (как в Third). If only… значит то же, но эмоциональнее."},{"type":"note","kind":"warn","title":"Главная ловушка: отрицание переворачивается","text":"«Жаль, что НЕ…» → по-английски без not: жаль, что я не знаю → I {{wish}} I [[knew]]. «Жаль, что…» без «не» → по-английски с not:","en":"I {{wish}} I [[didn't live]] so far from the university.","ru":"Жаль, что я живу так далеко от университета."},{"type":"table","title":"Как переводить","head":["По-русски","По-английски"],"rows":[["Жаль, что я не знаю…","I {{wish}} I [[knew]]…"],["Вот бы у меня был…","I {{wish}} I [[had]]…"],["Зря я сказал… / Жаль, что я сказал…","I {{wish}} I [[hadn't said]]…"],["Надо было мне пойти… / Жаль, что я не пошёл…","I {{wish}} I [[had gone]]…"],["Хоть бы ты перестал…","I {{wish}} you [[would stop]]…"],["Жаль, что я не умею… / не могу…","I {{wish}} I [[could]]…"]],"note":"I wish I had done ≈ I should have done: «надо было». Подробнее о should have — в главе про модальные с have + V3."},{"type":"points","title":"Важные детали","items":[{"label":"were для всех лиц","text":"После wish у to be — were (was — разговорно).","en":"I {{wish}} it [[were]] Friday.","ru":"Вот бы сегодня была пятница."},{"label":"wish + would — про других, а не про себя","text":"~~I wish I would…~~ не говорят. О себе — could или Past Simple.","en":"I {{wish}} I [[could stop]] eating sweets.","ru":"Хотел бы я перестать есть сладкое."},{"label":"would — про действия и перемены, а не про состояния","text":"Про состояние — Past Simple: не ~~I wish he would be here~~, а так:","en":"I {{wish}} he [[were]] here now.","ru":"Жаль, что его сейчас здесь нет."},{"label":"If only — то же, но сильнее","en":"{{If only}} I [[had listened]] to you!","ru":"Эх, послушал бы я тебя тогда!"}]},{"type":"compare","title":"I hope или I wish?","left":{"title":"I hope","sub":"реально, может сбыться","points":["обычное время: Present или will","«надеюсь»"],"examples":[{"en":"I {{hope}} you [[get]] the job.","ru":"Надеюсь, ты получишь эту работу."}]},"right":{"title":"I wish","sub":"нереально: сожаление или мечта","points":["шаг назад: V2, had V3, would","«жаль, что…», «вот бы…»"],"examples":[{"en":"I {{wish}} I [[had]] a better job.","ru":"Вот бы мне работу получше."}]},"note":"wish + человек + существительное — просто пожелание: I {{wish}} you luck. — Желаю тебе удачи."},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"I wish I ~~am~~ taller.","right":"I {{wish}} I [[were]] taller.","why":"О настоящем после wish — прошедшая форма; to be → were."},{"wrong":"I wish I ~~didn't go~~ to that party yesterday.","right":"I {{wish}} I [[hadn't gone]] to that party yesterday.","why":"О прошлом — Past Perfect: had + V3."},{"wrong":"«Жаль, что я не знаю ответа» → I wish I ~~didn't know~~ the answer.","right":"I {{wish}} I [[knew]] the answer.","why":"«Жаль, что НЕ знаю» → без not. I wish I didn't know = «лучше бы я не знал»."},{"wrong":"I wish I ~~would have~~ a car.","right":"I {{wish}} I [[had]] a car.","why":"would не про себя и не про состояния — нужен Past Simple."},{"wrong":"I wish ~~I will pass~~ the exam tomorrow.","right":"I {{hope}} I [[pass]] the exam tomorrow.","why":"Реальное желание на будущее — hope, а не wish."}]},{"type":"quiz","items":[{"q":"I don't have a car. I wish I ___ (have) one.","a":"had","why":"О настоящем — Past Simple."},{"q":"I didn't go to the lecture. Now I wish I ___ (go).","a":"had gone","why":"О прошлом — had + V3."},{"q":"It's raining again. I wish it ___ raining.","options":["stops","would stop","will stop"],"a":"would stop","why":"Хотим, чтобы ситуация изменилась, — wish + would."},{"q":"I wish I ___ taller.","options":["am","were","would be"],"a":"were","why":"to be после wish — were."},{"q":"I ___ you enjoy your holiday!","options":["wish","hope","want"],"a":"hope","why":"Реальное желание — hope + обычное время."},{"q":"I wish I ___ swim. (Жаль, что я не умею плавать.)","a":"could","why":"Умение — wish + could; «не» уходит."},{"q":"I said something stupid. I wish I ___ (not / say) it.","a":"hadn't said","why":"Сожаление о прошлом — hadn't + V3."},{"q":"If only I ___ your advice last year!","options":["followed","had followed","would follow"],"a":"had followed","why":"Прошлое (last year) — had + V3."}]},{"type":"summary","points":["Настоящее: {{wish}} + [[V2]] (I wish I [[knew]]); to be → [[were]].","Прошлое: {{wish}} + [[had V3]] (I wish I [[had gone]]).","Чужое поведение: {{wish}} + S + [[would]] V; о своём умении — [[could]].","«Жаль, что НЕ…» → без not, и наоборот.","{{If only}} = I wish, только эмоциональнее; реальное желание — hope."]}]},{"id":"conditionals-review","title":"Conditionals: Review","subtitle":"Все условные предложения — сводка","level":"B1–B2","tagline":"Все типы условных предложений на одной странице — и как быстро выбрать нужный.","blocks":[{"type":"table","title":"Все типы в одной таблице","head":["Тип","if-часть","Главная часть","Смысл","Пример"],"rows":[["Zero","Present Simple","Present Simple","всегда так, факт","{{If}} you [[heat]] ice, it [[melts]]."],["First","Present Simple","will + V","реально в будущем","{{If}} it [[rains]], we [[will stay]] at home."],["Second","Past Simple (were)","would + V","нереально сейчас, маловероятно в будущем","{{If}} I [[had]] time, I [[would help]] you."],["Third","Past Perfect (had V3)","would have + V3","нереально в прошлом","{{If}} I [[had known]], I [[would have come]]."],["Mixed","Past Perfect","would + V","прошлое → сейчас","{{If}} I [[had slept]] more, I [[wouldn't be]] tired now."],["Mixed","Past Simple","would have + V3","сейчас → прошлое","{{If}} I [[spoke]] French, I [[would have understood]] him."]],"note":"Замены: will → can / may / must / просьба; would → could / might; if → unless / as long as / provided (в 0 и 1 типе)."},{"type":"table","title":"I wish — та же логика","head":["О чём","Форма","Пример","Как в…"],"rows":[["сейчас","wish + V2 (were)","I {{wish}} I [[knew]] the answer.","Second"],["прошлое","wish + had V3","I {{wish}} I [[had known]] earlier.","Third"],["чужое поведение","wish + would V","I {{wish}} you [[would listen]].","—"]],"note":"Перевод: «жаль, что…», «вот бы…», «хоть бы…». Отрицание переворачивается: «жаль, что не знаю» → I wish I knew."},{"type":"uses","title":"Алгоритм выбора","items":[{"label":"Условие реальное?","text":"Может случиться или так бывает всегда → Zero / First. Нереально, в русском есть «бы» → Second / Third / Mixed."},{"label":"Реальное: закон или один случай?","text":"Всегда так (законы, правила, инструкции) → Zero. Конкретный случай в будущем → First.","en":"{{If}} you [[press]] this button, the machine [[stops]].","ru":"Если нажать эту кнопку, станок останавливается."},{"label":"«Бы»: о каком времени каждая часть?","text":"Обе про сейчас или будущее → Second. Обе про прошлое → Third. Разное время → Mixed.","en":"{{If}} I [[had taken]] that job, I [[would be]] in Moscow now.","ru":"Если бы я тогда согласился на ту работу, я бы сейчас был в Москве."},{"label":"Проверь if-часть","text":"В ней нет will и would — только Present, Past или Past Perfect (кроме вежливого if you will / would…)."}]},{"type":"points","title":"Одна ситуация — три типа","items":[{"label":"First — вполне возможно","en":"{{If}} I [[see]] Oleg, I [[will tell]] him.","ru":"Если увижу Олега, скажу ему."},{"label":"Second — вряд ли","en":"{{If}} I [[saw]] Oleg, I [[would tell]] him.","ru":"Если бы я увидел Олега, я бы ему сказал."},{"label":"Third — уже поздно: не увидел","en":"{{If}} I [[had seen]] Oleg, I [[would have told]] him.","ru":"Если бы я тогда увидел Олега, я бы ему сказал."}],
"note":"Русский перевод второго и третьего типа часто одинаковый — время подсказывает контекст."},{"type":"markers","title":"Слова-сигналы","groups":[{"label":"Реальное условие","chips":["if|если","unless|если не","as long as|при условии, что","provided (that)|при условии, что","in case|на случай, если"]},{"label":"Книжная инверсия","chips":["Should you…|если вдруг вы…","Were I…|будь я…","Had I known…|знай я…","Had it not been for…|если бы не…"]},{"label":"Сожаление","chips":["I wish|жаль, что; вот бы","If only|если бы только"]}],
"note":"После if, unless, as long as, provided, in case — без will.","en":"{{Unless}} we [[get]] the permit, we [[can't start]] building.","ru":"Если не получим разрешение, начать строительство не сможем."},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"If I ~~will have~~ time, I'll help you.","right":"{{If}} I [[have]] time, I'll help you.","why":"First: в if-части Present Simple, will — только в главной."},{"wrong":"If I ~~would know~~ the answer, I would tell you.","right":"{{If}} I [[knew]] the answer, I would tell you.","why":"Second: в if-части Past Simple, would — только в главной."},{"wrong":"If I ~~would have known~~, I would have come.","right":"{{If}} I [[had known]], I would have come.","why":"Third: в if-части had + V3."},{"wrong":"If I had more time, I ~~will learn~~ Chinese.","right":"{{If}} I had more time, I [[would learn]] Chinese.","why":"Нереальное условие → would, а не will."},{"wrong":"I wish I ~~have~~ a car.","right":"I {{wish}} I [[had]] a car.","why":"wish о настоящем — шаг назад: Past Simple."}]},{"type":"quiz","items":[{"q":"If you mix blue and yellow, you ___ green.","options":["get","would get","got"],"a":"get","why":"Zero: так бывает всегда — Present Simple."},{"q":"If it ___ tomorrow, the fieldwork will be postponed.","options":["rains","will rain","rained"],"a":"rains","why":"First: после if — Present Simple, без will."},{"q":"Hurry up! If we don't leave now, we ___ the train.","options":["will miss","would miss","would have missed"],"a":"will miss","why":"First: реальное будущее → will."},{"q":"I don't have a laptop. If I ___ one, I would work from home.","options":["have","had","would have"],"a":"had","why":"Second: нереально сейчас → Past Simple."},{"q":"If I ___ you, I would apologise to her.","options":["am","were","had been"],"a":"were","why":"Second, совет: If I were you."},{"q":"I didn't know you were ill. If I ___ (know), I would have visited you.","a":"had known","why":"Third: нереальное прошлое → had + V3."},{"q":"We got lost because we didn't have a map. If we had had a map, we ___ lost.","options":["wouldn't get","wouldn't have got","won't get"],"a":"wouldn't have got","why":"Third: результат в прошлом → would have + V3."},{"q":"I missed breakfast this morning. If I ___ breakfast, I wouldn't be hungry now.","options":["had","had had","have had"],"a":"had had","why":"Mixed: условие утром (прошлое) → had + V3; результат сейчас."},{"q":"Anna doesn't speak German, so she didn't understand yesterday's lecture. If she ___ German, she would have understood it.","options":["spoke","speaks","would speak"],"a":"spoke","why":"Mixed: условие верно всегда (не говорит) → V2; результат в прошлом."},{"q":"You won't pass the exam ___ you start working harder.","options":["if","unless","in case"],"a":"unless","why":"«Не сдашь, если НЕ начнёшь» — unless."},{"q":"The printer is broken again. I wish I ___ how to fix it.","options":["know","knew","will know"],"a":"knew","why":"wish о настоящем → Past Simple."},{"q":"I failed the test. I wish I ___ (study) harder.","a":"had studied","why":"wish о прошлом → had + V3."}]},{"type":"summary","points":["Реально → Zero (всегда так) или First (будущее, [[will]] в главной части).","Нереально, «бы» → Second (сейчас: V2 → [[would]] V) или Third (прошлое: had V3 → [[would have]] V3).","Части про разное время → Mixed.","В if-части нет will и would.","{{wish}} — тот же шаг назад: [[V2]] о сейчас, [[had V3]] о прошлом, [[would]] о чужом поведении."]}]}]},{"id":"passive","roman":"VII","title":"Пассивный залог","chapters":[{"id":"passive","title":"The Passive","subtitle":"Пассивный (страдательный) залог","level":"B1","tagline":"Когда важно не кто сделал, а что сделано: мост построен, карта обновлена, данные сохранены.","formula":"S + [[be]] + [[V3]] + (by …)","blocks":[{"type":"compare","title":"Актив или пассив?","left":{"title":"Active","sub":"действительный залог: кто делает","points":["Подлежащее — исполнитель действия","Предмет действия стоит после глагола"],"examples":[{"en":"A French company [[built]] the bridge in 1990.","ru":"Французская компания построила мост в 1990 году."}]},"right":{"title":"Passive","sub":"страдательный залог: что с ним делают","points":["Подлежащее — предмет, над которым совершают действие","Исполнитель — через by или вообще не называется"],"examples":[{"en":"The bridge [[was built]] by a French company in 1990.","ru":"Мост был построен французской компанией в 1990 году."}]},"note":"Дополнение из актива становится подлежащим пассива, а время «переезжает» в be: built (Past Simple) → was built."},{"type":"formula","title":"Как строится","rows":[{"sign":"+","formula":"S + [[am / is / are]] + [[V3]]","en":"Cadastral maps [[are updated]] every year.","ru":"Кадастровые карты обновляются каждый год."},{"sign":"+","formula":"S + [[was / were]] + [[V3]]","en":"The old station [[was closed]] in 2019.","ru":"Старую станцию закрыли в 2019 году."},{"sign":"-","formula":"S + [[isn't / aren't / wasn't…]] + [[V3]]","en":"Personal data [[isn't stored]] on this server.","ru":"Персональные данные не хранятся на этом сервере."},{"sign":"?","formula":"[[Is / Was…]] + S + [[V3]] + ?","en":"[[Was]] the house [[built]] before the war? — Yes, it was.","ru":"Этот дом построили до войны? — Да."},{"sign":"?","formula":"Wh- + [[is / was…]] + S + [[V3]] + ?","en":"When [[was]] the tunnel [[opened]]?","ru":"Когда открыли тоннель?"},{"sign":"?","formula":"[[Have / Has]] + S + [[been V3]] + ?","en":"[[Has]] the report [[been checked]]? — No, it hasn't.","ru":"Отчёт уже проверили? — Нет, ещё нет."}],
"note":"V3 не меняется никогда — время и число показывает только be. В вопросе вперёд выходит лишь первый вспомогательный глагол: [[Has]] the plan [[been approved]]?"},{"type":"uses","title":"Когда используем","items":[{"label":"Исполнитель неизвестен","en":"My bike [[was stolen]] last night.","ru":"Вчера ночью у меня украли велосипед."},{"label":"Исполнитель неважен или и так понятен","en":"The streets [[are cleaned]] every morning.","ru":"Улицы убирают каждое утро."},{"label":"Важен процесс или результат — технические тексты","text":"В инструкциях, отчётах и учебниках по специальности пассив встречается постоянно.","en":"Sand [[is used]] to make concrete and mortar.","ru":"Песок используется для приготовления бетона и строительного раствора."},{"label":"Правила и официальные объявления","en":"Smoking [[is not allowed]] on the construction site.","ru":"Курение на стройплощадке запрещено."},{"label":"Рассказ о предмете, а не о людях","text":"Тема — объект, и мы продолжаем говорить о нём.","en":"The Eiffel Tower [[was completed]] in 1889. At first, it [[was criticised]] by many artists.","ru":"Эйфелеву башню достроили в 1889 году. Поначалу её критиковали многие художники."}]},{"type":"table","title":"Пассив во всех употребительных временах","head":["Время","Пассив","Пример","Перевод"],"rows":[["Present Simple","am / is / are + V3","Hundreds of houses [[are built]] here every year.","Здесь каждый год строят сотни домов."],["Present Continuous","am / is / are being + V3","A new bridge [[is being built]] across the river.","Через реку строится новый мост."],["Past Simple","was / were + V3","The dam [[was built]] in 1965.","Плотину построили в 1965 году."],["Past Continuous","was / were being + V3","The road [[was being repaired]] when I moved here.","Когда я сюда переехал, дорогу как раз ремонтировали."],["Present Perfect","have / has been + V3","A new metro station [[has been opened]] near my house.","Рядом с моим домом открыли новую станцию метро."],["Past Perfect","had been + V3","When we arrived, the foundation [[had]] {{already}} [[been laid]].","Когда мы приехали, фундамент уже был заложен."],["Future Simple","will be + V3","The school [[will be built]] next year.","Школу построят в следующем году."],["be going to","am / is / are going to be + V3","A car park [[is going to be built]] here.","Здесь собираются построить парковку."],["Future Perfect","will have been + V3","The bridge [[will have been built]] by the end of 2027.","К концу 2027 года мост будет построен."]],"note":"by + время = «к» (by 2027 — к 2027 году), by + кто = «кем». В Perfect Continuous и Future Continuous пассив почти не используют. Пассив с модальными (can be done) — в следующей главе."},{"type":"points","title":"Кем и чем: by и with","items":[{"label":"by + исполнитель","text":"Добавляем, только если исполнитель важен или это новая информация.","en":"This bridge [[was designed]] {{by}} a young engineer from Kazan.","ru":"Этот мост спроектировал молодой инженер из Казани."},{"label":"with + инструмент","text":"Чем пользовались при действии.","en":"The distance [[was measured]] {{with}} a laser rangefinder.","ru":"Расстояние измерили лазерным дальномером."},{"label":"Исполнитель не нужен","text":"Если исполнитель — «кто-то», «люди», «они», by не пишем: ~~by somebody~~, ~~by people~~.","en":"The documents [[were signed]] yesterday.","ru":"Документы подписали вчера."}]},{"type":"points","title":"Как переводить на русский","items":[{"label":"«был / будет» + краткое причастие","en":"The bridge [[was built]] in 1990.","ru":"Мост был построен в 1990 году."},{"label":"Глагол на -ся","text":"Особенно для Present Simple и Present Continuous.","en":"A new school [[is being built]] in our district.","ru":"В нашем районе строится новая школа."},{"label":"Без подлежащего: «построили», «строят»","text":"Самый разговорный вариант: глагол во множественном числе, исполнителя нет.","en":"The bridge [[was built]] in 1990.","ru":"Мост построили в 1990 году."},{"label":"С by — активом","text":"Исполнитель становится подлежащим, часто в конце русского предложения.","en":"The project [[was approved]] by the city council.","ru":"Проект утвердил городской совет."}],
"note":"Выбирай то, что естественнее звучит по-русски: в разговоре — «построили», в тексте по специальности — «был построен» или «строится»."},{"type":"note","kind":"warn","title":"Не у каждого глагола есть пассив","text":"Пассив возможен, только если у глагола есть дополнение (build something, check something). У happen, arrive, die, appear, occur, disappear дополнения нет — и пассива тоже: ~~was happened~~. Зато «родиться» — всегда пассив: [[was born]].","en":"The accident [[happened]] at night. — I [[was born]] in 2006.","ru":"Авария произошла ночью. — Я родился в 2006 году."},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"The bridge ~~was build~~ in 1990.","right":"The bridge [[was built]] in 1990.","why":"После be нужна третья форма (V3), а не начальная."},{"wrong":"A new school ~~is building~~ in our district.","right":"A new school [[is being built]] in our district.","why":"Школа сама не строит — её строят. Русское «строится» здесь — пассив: is being built."},{"wrong":"When ~~was built the bridge~~?","right":"When [[was]] the bridge [[built]]?","why":"Русский порядок «когда был построен мост» не работает: be + подлежащее + V3."},{"wrong":"The accident ~~was happened~~ at night.","right":"The accident [[happened]] at night.","why":"У happen нет дополнения, поэтому нет и пассива."},{"wrong":"I ~~born~~ in 2006.","right":"I [[was born]] in 2006.","why":"«Родился» по-английски — только пассив: was born."}]},{"type":"quiz","items":[{"q":"This bridge ___ (build) in 1965.","a":"was built","why":"Прошлое, точная дата: was + V3."},{"q":"A new metro station ___ (build) near the park right now.","a":"is being built","why":"Процесс прямо сейчас: is being + V3."},{"q":"Cadastral maps ___ (update) every year.","a":"are updated","why":"Регулярное действие, maps — мн. ч.: are + V3."},{"q":"The accident ___ at 5 pm yesterday.","options":["happened","was happened","has happened"],"a":"happened","why":"У happen нет пассива; yesterday — Past Simple."},{"q":"The results ___ (not / check) yet, so don't use them.","a":"haven't been checked","why":"yet → Present Perfect: have not been + V3."},{"q":"When ___?","options":["was built the tower","was the tower built","the tower was built"],"a":"was the tower built","why":"Вопрос: be + подлежащее + V3."},{"q":"Hundreds of new flats ___ in our city every year.","options":["build","are built","are building"],"a":"are built","why":"Квартиры сами не строят — их строят: are + V3."},{"q":"I ___ in Novosibirsk in 2006. (родился)","a":"was born","why":"«Родился» — только пассив: was born."}]},{"type":"summary","points":["Пассив = [[be]] в нужном времени + [[V3]]: is built, was built, has been built, will be built.","Используем, когда важно действие или результат, а исполнитель неизвестен или неважен.","Исполнитель — через by, инструмент — через with.","В вопросе вперёд выходит первый вспомогательный: [[Was]] the bridge [[built]]…?","Переводим: «был построен», «строится» или «построили»."]}]},{"id":"passive-advanced","title":"Passive: Advanced","subtitle":"Пассив: модальные глаголы, «мне дали», каузатив","level":"B1–B2","tagline":"Пассив после модальных, конструкции «мне дали» и «мне починили», предлог в конце.","formula":"[[can / must / should…]] + [[be]] + [[V3]]","blocks":[{"type":"formula","title":"Пассив с модальными глаголами","rows":[{"sign":"+","formula":"S + [[can / must / should…]] + [[be]] + [[V3]]","en":"All measurements [[must be checked]] twice.","ru":"Все измерения нужно проверять дважды."},{"sign":"-","formula":"S + [[can't / mustn't…]] + [[be]] + [[V3]]","en":"This door [[mustn't be left]] open.","ru":"Эту дверь нельзя оставлять открытой."},{"sign":"?","formula":"[[Can / Should…]] + S + [[be V3]] + ?","en":"[[Can]] this wall [[be removed]]? — No, it's load-bearing.","ru":"Эту стену можно снести? — Нет, она несущая."},{"sign":"Прошлое","formula":"S + [[should / could…]] + [[have been]] + [[V3]]","en":"The plans [[should have been checked]] earlier.","ru":"Чертежи надо было проверить раньше."}],
"note":"После модального — всегда голое be, без is / are / was: ~~must is checked~~ → [[must be checked]]. Если речь о прошлом — have been + V3.","noteKind":"warn"},{"type":"table","title":"Что значат и как переводятся","head":["Форма","Смысл","Пример","Перевод"],"rows":[["can be + V3","можно","The file [[can be opened]] in any GIS program.","Файл можно открыть в любой ГИС-программе."],["must be + V3","необходимо, обязательно","Safety rules [[must be followed]].","Правила техники безопасности необходимо соблюдать."],["should be + V3","следует, стоит","The soil [[should be tested]] before construction.","Грунт следует исследовать до начала строительства."],["may / might be + V3","может быть, возможно","Some data [[may be lost]].","Часть данных может быть потеряна."],["has to be + V3","нужно, приходится","The road [[has to be closed]] for repairs.","Дорогу нужно закрыть на ремонт."],["should have been + V3","надо было (а не сделали)","This [[should have been done]] yesterday.","Это надо было сделать вчера."],["could have been + V3","можно было (но не сделали)","The accident [[could have been avoided]].","Аварии можно было избежать."],["must have been + V3","наверняка (вывод о прошлом)","The documents [[must have been lost]].","Документы, должно быть, потерялись."]],"note":"В технических текстах постоянно встречается must be taken into account — «необходимо учитывать»."},{"type":"compare","title":"Два дополнения: «мне дали карту»","left":{"title":"Подлежащее — человек","sub":"так говорят чаще","points":["Глаголы give, send, show, offer, tell, teach, pay, promise","Русское «мне дали» → I was given"],"examples":[{"en":"I [[was given]] a map of the city.","ru":"Мне дали карту города."},{"en":"She [[was offered]] a job at a design office.","ru":"Ей предложили работу в проектном бюро."}]},"right":{"title":"Подлежащее — предмет","sub":"когда важнее вещь","points":["Перед человеком нужен предлог to","С explain, describe, suggest — только так: The rule was explained to me"],"examples":[{"en":"The keys [[were given]] to the site manager.","ru":"Ключи отдали начальнику участка."},{"en":"The results [[were sent]] to all the students.","ru":"Результаты разослали всем студентам."}]},"note":"Актив: They gave me a map. Из него два пассива: I [[was given]] a map / A map [[was given]] to me."},{"type":"note","kind":"tip","title":"get + V3 — разговорный пассив","text":"В разговоре вместо be иногда ставят get — обычно о том, что случилось внезапно или неприятно. В технических и официальных текстах — только be. Устойчивые выражения: get married, get dressed, get lost.","en":"My phone [[got stolen]] on the metro. — He [[got injured]] at work.","ru":"У меня в метро украли телефон. — Он получил травму на работе."},{"type":"points","title":"It is said that… / He is said to…","items":[{"label":"It + is said / believed / known + that…","text":"«Говорят, что…», «считается, что…», «известно, что…».","en":"[[It is believed]] that the castle was built in the 12th century.","ru":"Считается, что замок был построен в XII веке."},{"label":"S + is said / believed + to V","text":"То же самое, но подлежащее — сам человек или предмет.","en":"He [[is said to be]] the best surveyor in the city.","ru":"Говорят, он лучший геодезист в городе."}],
"note":"Обе конструкции часто встречаются в научно-технических текстах. Подробнее — в главе про сложное подлежащее (Complex Subject)."},{"type":"formula","title":"Каузатив: have / get something done","rows":[{"sign":"+","formula":"S + [[have]] + O + [[V3]]","en":"I [[had]] my laptop [[repaired]] last week.","ru":"На прошлой неделе мне починили ноутбук."},{"sign":"+","formula":"S + [[get]] + O + [[V3]]","en":"I [[get]] my hair [[cut]] once a month.","ru":"Я стригусь раз в месяц."},{"sign":"+","formula":"S + [[am / is / are having]] + O + [[V3]]","en":"We [[are having]] our flat [[renovated]].","ru":"У нас в квартире делают ремонт."},{"sign":"?","formula":"[[Did]] + S + [[have]] + O + [[V3]] + ?","en":"[[Did]] you [[have]] the plot [[surveyed]]?","ru":"Вы заказывали межевание участка?"}],
"note":"Каузатив = делаешь не сам, а для тебя делает мастер или сервис; get — разговорнее. Порядок строгий: have + ЧТО + V3. I had repaired my car — это уже Past Perfect: «я сам починил машину (раньше чего-то)».","noteKind":"warn"},{"type":"points","title":"Предлог остаётся после глагола","items":[{"label":"look after — присматривать за","en":"The children [[were looked after]] by their grandmother.","ru":"За детьми присматривала бабушка."},{"label":"refer to — ссылаться на","en":"This standard [[is referred to]] in the contract.","ru":"На этот стандарт ссылаются в договоре."},{"label":"deal with — заниматься, решать","en":"The problem [[will be dealt with]] tomorrow.","ru":"Этой проблемой займутся завтра."},{"label":"rely on — полагаться на","en":"These measurements [[can't be relied on]].","ru":"На эти измерения нельзя полагаться."},{"label":"laugh at — смеяться над","en":"He [[was laughed at]] by everyone.","ru":"Над ним все смеялись."}],
"note":"По-русски предлог уходит вперёд: «за детьми присматривала», «на стандарт ссылаются». По-английски он остаётся сразу после V3 — не теряй его."},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"The results ~~must checked~~ again.","right":"The results [[must be checked]] again.","why":"В пассиве после модального нужно be: must + be + V3."},{"wrong":"~~Me was given~~ a new laptop.","right":"I [[was given]] a new laptop.","why":"«Мне дали» → подлежащее I, а не me."},{"wrong":"~~I was explained~~ the rule.","right":"The rule [[was explained]] to me.","why":"С explain, describe, suggest подлежащим может быть только предмет."},{"wrong":"I ~~repaired my laptop~~ at a service centre.","right":"I [[had]] my laptop [[repaired]] at a service centre.","why":"Калька «я починил ноутбук в сервисе»: repaired = чинил сам. Чинил мастер — have + что + V3."},{"wrong":"This standard ~~is referred~~ in the contract.","right":"This standard [[is referred to]] in the contract.","why":"Предлог глагола (refer to) в пассиве сохраняется после V3."}]},{"type":"quiz","items":[{"q":"All measurements ___ (must / check) twice.","a":"must be checked","why":"Модальный + be + V3."},{"q":"The meeting ___ (should / cancel) — nobody came.","a":"should have been cancelled","alt":["should've been cancelled","should have been canceled"],"why":"Упрёк о прошлом: should have been + V3."},{"q":"Yesterday ___ a new laptop at work.","options":["I was given","me was given","was given me"],"a":"I was given","why":"«Мне дали» → I was given."},{"q":"We ___ (have) our flat ___ (renovate) at the moment, so we're living with my parents.","a":["are having","renovated"],"why":"Каузатив в Present Continuous: are having + что + V3."},{"q":"The teacher explained the rule to us. → The rule ___.","options":["was explained to us","was explained us","explained to us"],"a":"was explained to us","why":"С explain: предмет + was explained to + человек."},{"q":"When I was a child, I ___ (look after) by my grandmother.","a":"was looked after","why":"Предлог after остаётся сразу после V3."},{"q":"Nowadays it ___ (believe) that the castle was built in the 12th century.","a":"is believed","why":"«Считается, что…» — It is believed that…"},{"q":"Where's your car? — At the service centre. I ___.","options":["am repairing it","am having it repaired","have it repairing"],"a":"am having it repaired","why":"Чинит мастер, а не я: have + что + V3."}]},{"type":"summary","points":["Модальный + [[be]] + [[V3]]: can be done, must be checked.","О прошлом: [[should have been done]] — надо было, [[could have been done]] — можно было.","«Мне дали» → I [[was given]]; но The rule [[was explained]] to me.","Каузатив: [[have]] + что + [[V3]] — сделал не сам: I had my laptop repaired.","Предлог остаётся после V3: [[was looked after]], [[is referred to]]."]}]}]},{"id":"reported","roman":"VIII","title":"Косвенная речь","chapters":[{"id":"reported-statements","title":"Reported Speech: Statements","subtitle":"Косвенная речь: утверждения","level":"B1","tagline":"Как пересказать чужие слова: said или told, сдвиг времён и слова-указатели.","formula":"S + {{said / told sb}} + (that) + [[время на шаг назад]]","blocks":[{"type":"formula","title":"Как строится","rows":[{"sign":"Прямая","formula":"S + said + “…”","en":"Oleg said, “I [[will send]] you the plan tomorrow.”","ru":"Олег сказал: «Я пришлю тебе план завтра»."},{"sign":"Косвенная","formula":"S + {{said / told sb}} + (that) + [[шаг назад]]","en":"Oleg told me that he [[would send]] me the plan {{the next day}}.","ru":"Олег сказал, что пришлёт мне план на следующий день."}],
"note":"Меняются три вещи: время — на шаг в прошлое (will → would), местоимения — по смыслу (I → he, you → me), слова-указатели (tomorrow → the next day). that в разговоре часто опускают."},{"type":"note","kind":"warn","title":"Главная ловушка для русскоязычных","text":"В русском время в пересказе не меняется: «сказал, что пришлёт», «сказал, что занят». В английском после said глагол обычно сдвигается на шаг в прошлое.","en":"He said he [[was]] busy.","ru":"Он сказал, что занят."},{"type":"compare","title":"say или tell?","left":{"title":"say","sub":"сказать (что-то)","points":["say + (that) …","Если нужен слушатель — say something to somebody"],"examples":[{"en":"He [[said]] that he was busy.","ru":"Он сказал, что занят."},{"en":"What did she [[say]] to you?","ru":"Что она тебе сказала?"}]},"right":{"title":"tell","sub":"сказать кому-то","points":["tell + кому (без to) + (that) …","Устойчивые: tell the truth, tell a lie, tell a story"],"examples":[{"en":"He [[told]] me that he was busy.","ru":"Он сказал мне, что занят."},{"en":"Always [[tell]] the truth.","ru":"Всегда говори правду."}]},"note":"Назван слушатель — tell me / tell us. Не назван — say. ~~He said me~~ и ~~He told that~~ — ошибки.","noteKind":"warn"},{"type":"table","title":"Сдвиг времён: шаг в прошлое","head":["Прямая речь","Косвенная речь","Пример"],"rows":[["am / is / are","was / were","“I'm busy.” → She said she [[was]] busy."],["Present Simple: work(s)","Past Simple: worked","“I live in Omsk.” → He said he [[lived]] in Omsk."],["Present Continuous: am doing","Past Continuous: was doing","“I'm working.” → She said she [[was working]]."],["Present Perfect: have done","Past Perfect: had done","“I've finished.” → She said she [[had finished]]."],["Past Simple: did","Past Perfect: had done","“I lost my key.” → He said he [[had lost]] his key."],["will","would","“I'll call you.” → He said he [[would call]] me."],["can","could","“I can help.” → She said she [[could help]]."],["may","might","“It may rain.” → He said it [[might rain]]."],["must","had to (или must)","“I must go.” → She said she [[had to go]]."],["could, would, should, might, had done","не меняются","“You should rest.” → He said I [[should rest]]."]],"note":"Past Simple в разговоре часто оставляют как есть: He said he [[lost]] his key / He said he [[had lost]] his key — оба варианта верны."},{"type":"points","title":"Когда время можно не сдвигать","items":[{"label":"Вводный глагол в настоящем","text":"says, has said, will say — сдвига нет.","en":"Anna {{says}} she [[is]] tired.","ru":"Анна говорит, что устала."},{"label":"Сказанное всё ещё верно","text":"Можно оставить настоящее; сдвиг тоже не ошибка.","en":"Tom said he [[lives]] in Kazan. / Tom said he [[lived]] in Kazan.","ru":"Том сказал, что живёт в Казани."},{"label":"Общеизвестные факты","en":"The teacher said that water [[boils]] at 100 degrees Celsius.","ru":"Учитель сказал, что вода кипит при 100 градусах Цельсия."},{"label":"Но если это уже неправда — сдвиг обязателен","text":"Ты видишь, что сказанное не подтвердилось или изменилось.","en":"Oh, you're here! Oleg said you [[were]] ill.","ru":"О, ты здесь! А Олег сказал, что ты был болен."}]},{"type":"table","title":"Слова-указатели","head":["Прямая речь","Косвенная речь","По-русски"],"rows":[["now","then, at that time","тогда, в тот момент"],["today","that day","в тот день"],["tonight","that night","в тот вечер, в ту ночь"],["yesterday","the day before, the previous day","накануне"],["tomorrow","the next day, the following day","на следующий день"],["last week","the week before, the previous week","на предыдущей неделе"],["next week","the following week, the week after","на следующей неделе"],["two days ago","two days before, two days earlier","за два дня до этого"],["here","there","там"],["this (this week)","that (that week)","тот (на той неделе)"]],"note":"Указатели меняем, только если пересказываем в другой день или в другом месте. Если в тот же день — today так и остаётся today."},{"type":"table","title":"Согласование времён: не только said","head":["Действие придаточного","Форма","Пример","Перевод"],"rows":[["одновременно с главным","Past Simple / Past Continuous","I knew he [[was]] busy.","Я знал, что он занят."],["раньше главного","Past Perfect","I knew he [[had left]].","Я знал, что он уехал."],["позже главного","would + V","I knew he [[would help]].","Я знал, что он поможет."]],"note":"Правило работает после любого глагола в прошедшем: thought, knew, hoped, was sure. I thought you [[were]] at home — «Я думал, что ты дома»."},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"He ~~said me~~ that he was busy.","right":"He [[told]] me that he was busy.","why":"Со слушателем — tell somebody. said to me тоже возможно, но звучит реже."},{"wrong":"She ~~told that~~ she was tired.","right":"She [[said]] that she was tired.","why":"После tell нужен слушатель: told me, told us. Без слушателя — said."},{"wrong":"He ~~said, that~~ he would come.","right":"He [[said that]] he would come.","why":"Перед that запятая не ставится — в отличие от русского «сказал, что»."},{"wrong":"I thought you ~~are~~ at home.","right":"I thought you [[were]] at home.","why":"После thought / knew / said — сдвиг времени, хотя по-русски «думал, что ты дома»."},{"wrong":"Last week Anna said she would call me ~~tomorrow~~.","right":"Last week Anna said she would call me [[the next day]].","why":"Пересказываешь в другой день — tomorrow превращается в the next day."}]},{"type":"quiz","items":[{"q":"She ___ me that she was busy.","options":["said","told","spoke"],"a":"told","why":"Назван слушатель (me) → told."},{"q":"“I'm tired,” Anna said last night. → Anna said that she ___ tired.","a":"was","why":"Сказано вчера о тогдашнем состоянии: am → was."},{"q":"“I've just finished the report,” Max said yesterday. → Max said that he ___ just ___ the report.","a":["had","finished"],"why":"Present Perfect → Past Perfect: had + V3."},{"q":"“I'll send the drawings tomorrow,” the engineer said last week. → The engineer said he ___ the drawings the next day.","a":"would send","why":"will → would: сказано неделю назад."},{"q":"“I'm busy today,” Kate said on Monday. On Friday you say: Kate said she was busy ___.","options":["today","that day","yesterday"],"a":"that day","why":"Пересказ в другой день: today → that day."},{"q":"Oh, you're here! Oleg said you ___ ill.","options":["are","were","will be"],"a":"were","why":"Сказанное не подтвердилось — сдвиг обязателен."},{"q":"Anna often says that she ___ (like) her job.","a":"likes","why":"Вводный глагол в настоящем (says) — сдвига нет."},{"q":"Why are you in the office? I thought you ___ (be) at the site.","a":"were","why":"После thought — сдвиг: одновременное действие → Past Simple."}]},{"type":"summary","points":["Слушатель назван — [[told]] me; не назван — [[said]] (that).","Сдвиг на шаг назад: am → [[was]], will → [[would]], have done → [[had done]], can → [[could]].","Не сдвигаем после says и если сказанное всё ещё верно; сдвигаем обязательно, если это уже неправда.","Указатели: today → that day, tomorrow → the next day, here → there.","Согласование времён работает и после thought, knew, hoped."]}]},{"id":"reported-questions","title":"Reported Questions and Requests","subtitle":"Косвенные вопросы, просьбы и приказы","level":"B1","tagline":"«Он спросил, где я живу»: без do, без вопросительного знака и с прямым порядком слов.","formula":"S + {{asked}} + [[wh- / if]] + S + V","blocks":[{"type":"formula","title":"Как строится косвенный вопрос","rows":[{"sign":"Прямой","formula":"Wh- + do / did + S + V + ?","en":"“Where [[do]] you [[live]]?” he asked.","ru":"«Где ты живёшь?» — спросил он."},{"sign":"Косвенный","formula":"asked + [[wh-]] + S + V","en":"He asked [[where]] I [[lived]].","ru":"Он спросил, где я живу."},{"sign":"Прямой","formula":"Be (Am / Is / Are) + S + …? · Do / Does + S + V? · Can / Will… + S + V?","en":"“[[Are]] you a student?” she asked.","ru":"«Ты студент?» — спросила она."},{"sign":"Косвенный","formula":"asked + [[if / whether]] + S + V","en":"She asked [[if]] I [[was]] a student.","ru":"Она спросила, студент ли я."}],
"note":"Косвенный вопрос — уже не вопрос: нет do / did, нет инверсии, нет знака «?». Время сдвигается так же, как в утверждениях (live → lived, am → was)."},{"type":"points","title":"Что происходит с вопросом","items":[{"label":"Подлежащее встаёт перед глаголом","text":"Как в обычном утверждении.","en":"“Where is the station?” → She asked where the station [[was]].","ru":"Она спросила, где вокзал."},{"label":"do / does / did исчезают","en":"“What time does the lecture start?” → He asked what time the lecture [[started]].","ru":"Он спросил, во сколько начинается лекция."},{"label":"will → would, can → could","en":"“When will the work be finished?” → They asked when the work [[would be finished]].","ru":"Они спросили, когда закончат работу."},{"label":"Вопрос к подлежащему — порядок не меняется","text":"Who / what и так стоит на месте подлежащего.","en":"“Who designed the bridge?” → She asked who [[had designed]] the bridge.","ru":"Она спросила, кто спроектировал мост."}]},{"type":"compare","title":"if или whether?","left":{"title":"if","sub":"обычный, разговорный","points":["Для общих вопросов (Yes / No)","Переводится частицей «ли»"],"examples":[{"en":"I asked [[if]] the office was open.","ru":"Я спросил, открыт ли офис."}]},"right":{"title":"whether","sub":"чуть формальнее","points":["Особенно с or not и после предлогов","Перед to V — только whether"],"examples":[{"en":"We discussed [[whether]] to build a tunnel or a bridge.","ru":"Мы обсуждали, строить тоннель или мост."}]},"note":"Это if = «ли», а не условное «если». Поэтому will после него возможен: I don't know {{if}} he [[will come]] — «Не знаю, придёт ли он»."},{"type":"formula","title":"Просьбы и приказы: ask / tell somebody to do","rows":[{"sign":"Просьба","formula":"asked + кого + [[to V]]","en":"“Please check the drawings.” → She asked me [[to check]] the drawings.","ru":"Она попросила меня проверить чертежи."},{"sign":"Приказ","formula":"told + кого + [[to V]]","en":"“Wear a helmet!” → The foreman told us [[to wear]] helmets.","ru":"Прораб велел нам надеть каски."},{"sign":"-","formula":"told / asked + кого + [[not to V]]","en":"“Don't touch the equipment.” → He told us [[not to touch]] the equipment.","ru":"Он сказал нам не трогать оборудование."}],
"note":"Отрицание — not to, а не don't: ~~told us don't touch~~. «Попросил, чтобы я…» — тоже через to V: asked me to…","noteKind":"warn"},{"type":"table","title":"Другие глаголы для пересказа","head":["Глагол","Конструкция","Пример","Перевод"],"rows":[["advise","advise sb to V","He [[advised]] me [[to take]] a taxi.","Он посоветовал мне взять такси."],["remind","remind sb to V","She [[reminded]] me [[to call]] the client.","Она напомнила мне позвонить клиенту."],["offer","offer to V","She [[offered to help]] us.","Она предложила нам свою помощь."],["promise","promise to V","He [[promised to send]] the report.","Он пообещал прислать отчёт."],["refuse","refuse to V","They [[refused to sign]] the contract.","Они отказались подписывать договор."],["suggest","suggest + V-ing","She [[suggested going]] by train.","Она предложила поехать поездом."],["suggest","suggest (that) + S + (should) V","He [[suggested]] that we [[should check]] the data again.","Он предложил ещё раз проверить данные."]],"note":"offer — предлагаешь сделать что-то сам (offered to help); suggest — предлагаешь идею (suggested going). Нельзя: ~~suggested us to go~~, ~~offered me to help~~.","noteKind":"warn"},{"type":"points","title":"Вежливые вопросы в настоящем","items":[{"label":"Could you tell me…?","en":"Could you tell me where the station [[is]]?","ru":"Не подскажете, где вокзал?"},{"label":"Do you know…?","en":"Do you know what time the office [[opens]]?","ru":"Вы не знаете, во сколько открывается офис?"},{"label":"I'd like to know…","en":"I'd like to know how much a land survey [[costs]].","ru":"Я хотел бы узнать, сколько стоит межевание участка."},{"label":"Общий вопрос — через if","en":"Can you tell me [[if]] the lift is working?","ru":"Не подскажете, работает ли лифт?"}],
"note":"Вводная часть уже задаёт вопрос, а вторая идёт с прямым порядком слов и без do. Время не сдвигаем: вводная часть в настоящем. Подробнее о вопросах — в главе «Вопросы»."},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"He asked where ~~did I live~~.","right":"He asked where I [[lived]].","why":"В косвенном вопросе нет did и порядок прямой: подлежащее + глагол."},{"wrong":"Can you tell me where ~~is the station~~?","right":"Can you tell me where the station [[is]]?","why":"Вторая часть вежливого вопроса — с прямым порядком слов."},{"wrong":"She asked me ~~do I like~~ my job.","right":"She asked me [[if]] I [[liked]] my job.","why":"Общий вопрос → if / whether («ли»), без do, со сдвигом времени."},{"wrong":"He ~~suggested us to go~~ by train.","right":"He [[suggested]] that we [[should go]] by train.","why":"После suggest — V-ing или that + S + (should) V, но не «кого + to V»."},{"wrong":"The foreman told us ~~don't be~~ late.","right":"The foreman told us [[not to be]] late.","why":"Отрицательный приказ в косвенной речи — not to V."}]},{"type":"quiz","items":[{"q":"He asked me where ___.","options":["did I work","I worked","do I work"],"a":"I worked","why":"Косвенный вопрос: прямой порядок, без do / did."},{"q":"“Are you ready?” → She asked ___ I was ready.","a":"if","alt":["whether"],"why":"Общий вопрос → if / whether."},{"q":"“Please close the window.” → She asked me ___ (close) the window.","a":"to close","why":"Просьба: ask sb to V."},{"q":"“Don't park here!” → The guard told us ___ (not / park) there.","a":"not to park","why":"Отрицательный приказ: not to V."},{"q":"Could you tell me where ___?","options":["is the bank","the bank is","does the bank"],"a":"the bank is","why":"После Could you tell me — прямой порядок."},{"q":"He suggested ___ a break.","options":["to take","taking","us to take"],"a":"taking","why":"suggest + V-ing."},{"q":"In 2015 journalists asked: “When will the bridge be finished?” → They asked when the bridge ___ (finish).","a":"would be finished","why":"Вопрос из прошлого: will → would, плюс пассив."},{"q":"He promised ___ the documents by Monday.","options":["sending","to send","me to send"],"a":"to send","why":"promise + to V."}]},{"type":"summary","points":["Косвенный вопрос — прямой порядок и без do: He asked where I [[lived]].","Общий вопрос → [[if / whether]] («ли»).","Просьба и приказ: asked / told sb [[to V]], [[not to V]].","suggest + [[V-ing]]; offer / promise / refuse + [[to V]]; advise / remind sb + [[to V]].","Вежливо: Could you tell me where the station [[is]]? — без сдвига времени."]}]}]},{"id":"questions","roman":"IX","title":"Вопросы","chapters":[{"id":"questions","title":"Questions","subtitle":"Вопросительные предложения","level":"A2–B1","tagline":"Одна схема для всех времён: вопросительное слово, вспомогательный глагол, подлежащее, смысловой глагол.","formula":"(Wh-) + [[вспомогательный]] + S + [[V]] + ?","blocks":[{"type":"formula","title":"Схема вопроса","rows":[{"sign":"?","formula":"[[Do / Does / Did]] + S + [[V]] + ?","en":"[[Did]] you [[finish]] the drawing?","ru":"Ты закончил чертёж?"},{"sign":"?","formula":"[[Am / Is / Are…]] + S + [[V-ing]] + ?","en":"[[Are]] they [[working]] today?","ru":"Они сегодня работают?"},{"sign":"?","formula":"[[Have / Has]] + S + [[V3]] + ?","en":"[[Have]] you {{ever}} [[been]] to Kazan?","ru":"Ты когда-нибудь был в Казани?"},{"sign":"?","formula":"[[Can / Will / Should…]] + S + [[V]] + ?","en":"[[Will]] you [[help]] me with the report?","ru":"Поможешь мне с отчётом?"},{"sign":"Wh-","formula":"Wh- + [[вспомогательный]] + S + [[V]] + ?","en":"Where [[did]] you [[put]] the tape measure?","ru":"Куда ты положил рулетку?"}],
