{"q":"I ___ (use to / play) the piano, but I gave it up at fifteen.","a":"used to play","why":"Утверждение: used to (с -d) + V."},{"q":"When we were kids, we ___ in the river every summer.","options":["would swim","were used to swim","are used to swimming"],"a":"would swim","why":"Повторяющееся действие в прошлом → would (или used to)."},{"q":"I've lived in Norilsk for years, so I ___ the cold.","options":["used to","am used to","use to"],"a":"am used to","why":"«Привык» — be used to + существительное."},{"q":"I ___ (not / use to / like) vegetables, but now I love them.","a":"didn't use to like","why":"После did — use без -d."},{"q":"It was hard at first, but now I'm used to ___ (work) at night.","a":"working","why":"be used to + V-ing."},{"q":"My grandfather ___ a beard, but he shaved it off.","options":["would have","used to have","was used to have"],"a":"used to have","why":"have (= иметь) — состояние: только used to, не would."},{"q":"I moved to London a month ago, and I'm still ___ to the traffic.","options":["using","getting used","used"],"a":"getting used","why":"Привыкание ещё идёт — getting used to."},{"q":"A theodolite ___ to measure angles.","options":["is used","is using","uses"],"a":"is used","why":"be used to + V = «используется для» (пассив)."}]},{"type":"summary","points":["[[used to + V]] — раньше было, а теперь нет (и действия, и состояния).","[[didn't use to]], [[Did]] you [[use to]]…? — после did без -d.","[[would + V]] — «бывало», только повторяющиеся действия.","[[be used to + V-ing]] — привык; [[get used to + V-ing]] — привыкать.","is used to + V без -ing — «используется для», это пассив."]}]}]},{"id":"future","roman":"IV","title":"Будущее и все времена","chapters":[{"id":"future-forms","title":"Future Forms","subtitle":"Будущее: will, be going to, Present Continuous и Present Simple","level":"A2–B1","tagline":"В английском нет одного «будущего времени»: форму выбирают по тому, когда принято решение и есть ли договорённость.","formula":"S + [[will / be going to]] + [[V]]","blocks":[{"type":"timeline","title":"will и going to на оси времени","events":[{"kind":"mark","at":-0.4,"label":"решил вчера → going to"},{"kind":"mark","at":0,"label":"решаю сейчас → will"},{"kind":"dot","at":0.5,"label":"само действие"}],
"caption":"Действие в обоих случаях в будущем. Разница — когда принято решение: заранее (going to) или прямо в момент речи (will).","en":"I[['m going to paint]] the fence on Saturday. — Oh, I[['ll help]] you!","ru":"В субботу я собираюсь покрасить забор. — О, я тебе помогу!"},{"type":"formula","title":"Как строятся will и be going to","rows":[{"sign":"+","formula":"S + [[will]] + [[V]]","en":"I[['ll call]] you tonight.","ru":"Я позвоню тебе вечером."},{"sign":"-","formula":"S + [[won't]] + [[V]]","en":"Don't worry, I [[won't tell]] anyone.","ru":"Не волнуйся, я никому не скажу."},{"sign":"?","formula":"[[Will]] + S + [[V]] + ?","en":"[[Will]] you [[be]] at the lecture tomorrow?","ru":"Ты будешь завтра на лекции?"},{"sign":"+","formula":"S + [[am / is / are going to]] + [[V]]","en":"I[['m going to buy]] a new laptop.","ru":"Я собираюсь купить новый ноутбук."},{"sign":"-","formula":"S + [[am not / isn't / aren't going to]] + [[V]]","en":"We [[aren't going to move]] this year.","ru":"В этом году мы не собираемся переезжать."},{"sign":"?","formula":"[[Am / Is / Are]] + S + [[going to]] + [[V]] + ?","en":"[[Are]] you [[going to apply]] for a master's degree?","ru":"Ты собираешься поступать в магистратуру?"}],
"note":"won't = will not. will одинаков для всех лиц; в be going to меняется только am / is / are."},{"type":"uses","title":"Когда will","items":[{"label":"Решение в момент речи","en":"— I'm cold. — I[['ll close]] the window.","ru":"— Мне холодно. — Сейчас закрою окно."},{"label":"Мнение, прогноз","text":"Часто с I think, I'm sure, probably, I don't think.","en":"I {{think}} the exam [[will be]] difficult.","ru":"Думаю, экзамен будет трудным.","examples":[{"en":"He[['ll]] {{probably}} [[be]] late.","ru":"Он, наверное, опоздает."}]},{"label":"Обещание","en":"I [[won't be]] late, I promise.","ru":"Я не опоздаю, обещаю."},{"label":"Предложение помощи, просьба","en":"That bag looks heavy. I[['ll help]] you.","ru":"Сумка, кажется, тяжёлая. Давай помогу.","examples":[{"en":"[[Will]] you [[help]] me with the drawings?","ru":"Поможешь мне с чертежами?"}]},{"label":"Просто факт о будущем","en":"I[['ll be]] twenty next month.","ru":"В следующем месяце мне будет двадцать."}],
"note":"I think I'll… = «пожалуй, я…»: I {{think}} I[['ll stay]] at home tonight. В отрицании обычно I don't think…: I {{don't think}} it[['ll rain]]. А won't ещё значит «не хочет, отказывается»: The car [[won't start]]."},{"type":"uses","title":"Когда be going to","items":[{"label":"Намерение: уже решил","text":"Решение принято заранее, до разговора.","en":"— Why have you bought paint? — I[['m going to paint]] my room.","ru":"— Зачем ты купил краску? — Собираюсь покрасить комнату."},{"label":"Прогноз по признакам","text":"Уже сейчас видно, что вот-вот случится.","en":"Look at those clouds! It[['s going to rain]].","ru":"Посмотри, какие тучи! Сейчас пойдёт дождь.","examples":[{"en":"Watch out! You[['re going to fall]]!","ru":"Осторожно! Ты сейчас упадёшь!"}]}]},{"type":"compare","title":"will или going to?","left":{"title":"will","sub":"решаю сейчас / думаю","points":["Решение — прямо в момент речи.","Прогноз — моё мнение (I think, probably).","Обещания и предложения помощи."],"examples":[{"en":"— We've run out of milk. — Oh, I[['ll buy]] some.","ru":"— Молоко закончилось. — А, я куплю."}]},"right":{"title":"be going to","sub":"решил заранее / вижу признаки","points":["Решение принято до разговора.","Прогноз по тому, что видно сейчас."],"examples":[{"en":"— We've run out of milk. — I know. I[['m going to buy]] some.","ru":"— Молоко закончилось. — Знаю, как раз собираюсь купить."}]},"note":"Спроси себя: решил только что — will; решил раньше — going to. В прогнозах-мнениях часто подходят оба: I think it[['ll be]] / it[['s going to be]] a hot summer."},{"type":"points","title":"Present Continuous и Present Simple о будущем","items":[{"label":"Present Continuous — договорились","text":"Встречи, билеты, запись к врачу — то, о чём уже договорились. Обычно есть время или место.","en":"I[['m meeting]] Anna {{at six}}.","ru":"Я встречаюсь с Анной в шесть.","examples":[{"en":"We[['re flying]] to Sochi {{on Friday}}.","ru":"В пятницу мы летим в Сочи."}]},{"label":"Present Simple — расписание","text":"Поезда, пары, экзамены, фильмы — то, что стоит в расписании.","en":"The exam [[starts]] at 9:00 {{on Monday}}.","ru":"Экзамен начинается в понедельник в 9:00."},{"label":"going to или Continuous?","text":"Часто подходят оба. Continuous — когда уже договорились, going to — когда просто решил.","en":"I[['m seeing]] / I[['m going to see]] the dentist {{tomorrow}}.","ru":"Завтра я иду к стоматологу."}],
"note":"После when, if, as soon as, until про будущее — Present Simple, а не will: I'll call you {{when}} I [[arrive]]. Подробнее — в главе про придаточные времени.","noteKind":"warn"},{"type":"note","kind":"tip","title":"Shall I…? Shall we…?","text":"Так предлагают помощь или спрашивают совета: Shall I…? — «Мне…?», Shall we…? — «Давай…?». Это британский вариант; американцы чаще говорят Should I…? или Do you want me to…? Как обычное будущее shall сейчас почти не используют.","en":"[[Shall]] I [[open]] the window? / What time [[shall]] we [[meet]]?","ru":"Открыть окно? / Во сколько встретимся?"},{"type":"table","title":"Как выбрать форму","head":["Ситуация","Форма","Пример"],"rows":[["Решил прямо сейчас","will","I[['ll have]] the fish, please."],["Обещаю, предлагаю помощь","will","I[['ll send]] you the plans tonight."],["Думаю, что будет (мнение)","will","I {{think}} prices [[will go]] up."],["Уже решил, собираюсь","be going to","I[['m going to take]] the exam in June."],["Вижу признаки сейчас","be going to","The sky's black. It[['s going to rain]]."],["Договорился (время, место)","Present Continuous","We[['re meeting]] the client at 3."],["Расписание","Present Simple","The bus [[leaves]] at 7:15."],["Предлагаю: сделать ли мне…?","Shall I / Shall we","[[Shall]] I [[bring]] the drawings?"]]},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"— I'm cold. — ~~I close~~ the window.","right":"— I'm cold. — I[['ll close]] the window.","why":"Решение в момент речи — will; Present Simple здесь будущее не выражает."},{"wrong":"We agreed yesterday: I ~~will meet~~ Anna at six tomorrow.","right":"We agreed yesterday: I[['m meeting]] Anna at six {{tomorrow}}.","why":"Договорённость — Present Continuous (или going to), а не will."},{"wrong":"I'll call you when I ~~will arrive~~.","right":"I'll call you {{when}} I [[arrive]].","why":"После when / if про будущее — Present Simple."},{"wrong":"~~Will I open~~ the window?","right":"[[Shall]] I [[open]] the window?","why":"Предлагаешь что-то сделать — Shall I…? (BrE)."},{"wrong":"Look at the sky! It ~~will rain~~.","right":"Look at the sky! It[['s going to rain]].","why":"Прогноз по тому, что видно сейчас, — going to."}]},{"type":"quiz","items":[{"q":"— I haven't got any money. — Don't worry, I ___ you some.","options":["lend","will lend","am lending"],"a":"will lend","why":"Предложение помощи, решение в момент речи — will."},{"q":"— Why have you bought so much flour? — I ___ a cake for Mum's birthday.","options":["will bake","am going to bake","bake"],"a":"am going to bake","why":"Решил заранее (мука уже куплена) — going to."},{"q":"Look at those black clouds! It ___ (rain).","a":"is going to rain","why":"Прогноз по признакам — going to."},{"q":"I ___ the dentist at 10 tomorrow — I made an appointment last week.","options":["see","will see","am seeing"],"a":"am seeing","why":"Договорённость (записался) — Present Continuous."},{"q":"___ I carry your bag? It looks heavy.","options":["Shall","Will","Do"],"a":"Shall","why":"Предлагаешь помощь — Shall I…?"},{"q":"— Please don't tell anyone. — I ___ anyone, I promise.","options":["won't tell","don't tell","didn't tell"],"a":"won't tell","why":"Обещание — will / won't."},{"q":"I'll tell you everything when I ___ (see) you.","a":"see","why":"После when про будущее — Present Simple."},{"q":"— The printer isn't working. — Oh, I ___ (have) a look at it.","a":"will have","why":"Решение прямо сейчас — will."}]},{"type":"summary","points":["[[will]] — решаю сейчас, обещаю, предлагаю помощь, думаю (I think…).","[[be going to]] — уже решил; или вижу признаки: It[['s going to rain]].","Договорённость — Present Continuous: I[['m meeting]] Anna at six.","Расписание — Present Simple: The train [[leaves]] at 7.","[[Shall]] I / we…? — предложение (BrE); после when / if — без will."]}]},{"id":"future-continuous-perfect","title":"Future Continuous и Future Perfect","subtitle":"Будущее длительное и будущее совершенное время","level":"B1–B2","tagline":"Что будет происходить в определённый момент будущего — и что уже будет сделано к нему.","blocks":[{"type":"timeline","title":"Future Continuous на оси времени","events":[{"kind":"span","from":0.3,"to":0.7,"label":"лечу в самолёте"},{"kind":"mark","at":0.5,"label":"завтра в это время"}],
"caption":"В определённый момент будущего действие будет в процессе: начнётся раньше и к этому моменту ещё не закончится.","en":"{{This time tomorrow}} I[['ll be flying]] to Irkutsk.","ru":"Завтра в это время я буду лететь в Иркутск."},{"type":"formula","title":"Future Continuous: как строится","rows":[{"sign":"+","formula":"S + [[will be]] + [[V-ing]]","en":"{{At nine tomorrow}} I[['ll be taking]] an exam.","ru":"Завтра в девять я буду сдавать экзамен."},{"sign":"-","formula":"S + [[won't be]] + [[V-ing]]","en":"Call me after six — I [[won't be working]] then.","ru":"Звони после шести — тогда я уже не буду на работе."},{"sign":"?","formula":"[[Will]] + S + [[be]] + [[V-ing]] + ?","en":"[[Will]] you [[be using]] the car tonight?","ru":"Тебе сегодня вечером нужна машина?"}],
"note":"will be одинаково для всех лиц: I / she / they [[will be working]]."},{"type":"uses","title":"Когда используем Future Continuous","items":[{"label":"Процесс в момент будущего","en":"Don't phone at eight — we[['ll be having]] dinner.","ru":"Не звони в восемь — мы будем ужинать."},{"label":"Вежливый вопрос о планах","text":"Спрашиваем, не давя: «ты и так это будешь делать?». Часто — перед просьбой.","en":"[[Will]] you [[be going]] to the library later? Could you return my book?","ru":"Ты потом пойдёшь в библиотеку? Не вернёшь мою книгу?"},{"label":"Само собой, по ходу дел","text":"Действие и так произойдёт в обычном порядке.","en":"I[['ll be seeing]] Oleg at work tomorrow, so I can give him the drawings.","ru":"Завтра я всё равно увижу Олега на работе, так что могу передать ему чертежи."}]},{"type":"timeline","title":"Future Perfect на оси времени","events":[{"kind":"dot","at":0.25,"label":"закончим"},{"kind":"mark","at":0.55,"label":"пятница"}],
"caption":"Смотрим из момента в будущем назад: к этому моменту действие уже будет сделано. По-русски — обычно будущее совершенного вида, часто с «уже» или «успеть».","en":"We[['ll have finished]] the project {{by Friday}}.","ru":"К пятнице мы уже закончим проект."},{"type":"formula","title":"Future Perfect: как строится","rows":[{"sign":"+","formula":"S + [[will have]] + [[V3]]","en":"{{By the end of the year}} they[['ll have built]] the bridge.","ru":"К концу года они построят мост."},{"sign":"-","formula":"S + [[won't have]] + [[V3]]","en":"I [[won't have finished]] the drawings {{by Monday}}.","ru":"К понедельнику я не успею закончить чертежи."},{"sign":"?","formula":"[[Will]] + S + [[have]] + [[V3]] + ?","en":"[[Will]] you [[have finished]] the report {{by five}}?","ru":"Ты закончишь отчёт к пяти?"}],
"note":"Пассив — will have been + V3, частый в технических текстах и планах работ: The bridge [[will have been built]] {{by next year}} — «К следующему году мост будет построен»."},{"type":"markers","title":"Слова-подсказки","groups":[{"label":"Future Perfect: «к» моменту","chips":["by Friday|к пятнице","by then|к тому времени","by the time…|к тому времени, как…","by the end of the month|к концу месяца","by 2030|к 2030 году"]},{"label":"Future Continuous: «в» момент","chips":["this time tomorrow|завтра в это время","at 5 pm tomorrow|завтра в 17:00","this time next week|через неделю в это же время","when you arrive|когда ты приедешь"]}],
"note":"После by the time и when про будущее — Present Simple, will ставим только в главную часть.","noteKind":"warn","en":"{{By the time}} you get home, I[['ll have cooked]] dinner.","ru":"К твоему возвращению я уже приготовлю ужин."},{"type":"compare","title":"Future Continuous или Future Perfect?","left":{"title":"Future Continuous","sub":"будет в процессе","points":["Момент: at 6, this time tomorrow.","Действие в этот момент ещё идёт."],"examples":[{"en":"{{At 6 pm}} I[['ll be writing]] my essay.","ru":"В шесть вечера я буду писать эссе."}]},"right":{"title":"Future Perfect","sub":"уже будет сделано","points":["Срок: by 6, by Friday.","К этому моменту действие уже завершено."],"examples":[{"en":"{{By 6 pm}} I[['ll have written]] my essay.","ru":"К шести вечера я уже напишу эссе."}]},"note":"at + момент — ещё в процессе; by + момент — уже готово. С by можно и простое will: I[['ll finish]] it {{by}} Friday (обещание). Future Perfect подчёркивает, что к сроку всё уже будет позади."},{"type":"note","kind":"tip","title":"Future Perfect Continuous (B2)","text":"will have been + V-ing — сколько времени что-то будет длиться к моменту в будущем. Встречается редко, обычно с for.","en":"{{By June}} I[['ll have been working]] here {{for}} two years.","ru":"В июне будет два года, как я здесь работаю."},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"This time tomorrow I ~~will lie~~ on the beach.","right":"{{This time tomorrow}} I[['ll be lying]] on the beach.","why":"Процесс в момент будущего — will be V-ing, а не просто will."},{"wrong":"I ~~will working~~ at ten tomorrow.","right":"I[['ll be working]] at ten tomorrow.","why":"Не пропускай be: will + be + V-ing."},{"wrong":"By next year they ~~will have build~~ the bridge.","right":"{{By next year}} they [[will have built]] the bridge.","why":"После have — третья форма (V3): built."},{"wrong":"When you ~~will arrive~~, I'll be waiting at the station.","right":"{{When}} you [[arrive]], I'll be waiting at the station.","why":"После when про будущее — Present Simple."},{"wrong":"By Friday I ~~finish~~ the project.","right":"{{By}} Friday I[['ll have finished]] the project.","why":"Про будущее нужен will: I'll have finished (к сроку уже готово) или просто I'll finish."}]},{"type":"quiz","items":[{"q":"This time next week I ___ (lie) on a beach in Sochi.","a":"will be lying","why":"Процесс в момент будущего → will be V-ing."},{"q":"Don't call me at eight — I ___ dinner with my parents.","options":["will have","will be having","will have had"],"a":"will be having","why":"В восемь ужин будет в процессе."},{"q":"Don't worry, by Friday I ___ the report, so you can read it at the weekend.","options":["am finishing","will have finished","have finished"],"a":"will have finished","why":"by Friday — к сроку уже будет сделано."},{"q":"___ the car this evening? If not, can I borrow it?","options":["Will you be using","Do you use","Will you have used"],"a":"Will you be using","why":"Вежливый вопрос о планах — Future Continuous."},{"q":"I'm sorry, I ___ the drawings by Monday — I need two more days.","options":["haven't finished","won't have finished","don't finish"],"a":"won't have finished","why":"К понедельнику не будет сделано → won't have + V3."},{"q":"By the end of the month, we ___ (work) on this project for a whole year.","a":"will have been working","alt":["will have worked"],"why":"Сколько длится к моменту в будущем — will have been V-ing (с work можно и will have worked)."},{"q":"At 6 pm tomorrow I ___ (write) my essay, so I can't meet you.","a":"will be writing","why":"В 6 вечера процесс будет идти."},{"q":"Hurry up! By the time we get to the cinema, the film ___ (start).","a":"will have started","why":"К моменту нашего прихода фильм уже начнётся."}]},{"type":"summary","points":["[[will be + V-ing]] — будет в процессе в момент будущего (this time tomorrow, at 6).","[[Will]] you [[be V-ing]]…? — вежливый вопрос о планах.","[[will have + V3]] — будет сделано к моменту (by Friday, by the end of the year).","Пассив: [[will have been + V3]]; длительность к моменту: [[will have been + V-ing]].","После when / by the time про будущее — Present Simple."]}]},{"id":"time-clauses","title":"Time Clauses","subtitle":"Придаточные времени: when, as soon as, until + Present","level":"A2–B1","tagline":"Про будущее после when, as soon as, until, before, after говорим в Present, а не через will.","formula":"S + will + V + {{when}} + S + [[V / V-s]]","blocks":[{"type":"timeline","title":"Как это выглядит на оси времени","events":[{"kind":"mark","at":0,"label":"сейчас"},{"kind":"dot","at":0.45,"label":"приеду"},{"kind":"dot","at":0.7,"label":"позвоню"}],
"caption":"Оба действия в будущем. Но будущее уже видно из главной части (will), поэтому в части с when ставим Present Simple.","en":"I'll call you {{when}} I [[arrive]].","ru":"Я позвоню тебе, когда приеду."},{"type":"formula","title":"Как строится","rows":[{"sign":"+","formula":"S + will + V + {{when}} + S + [[V / V-s]]","en":"I'll send you the drawing {{when}} it [[is]] ready.","ru":"Пришлю тебе чертёж, когда он будет готов."},{"sign":"+","formula":"{{When}} + S + [[V / V-s]] + S + will + V","en":"{{When}} it [[is]] ready, I'll send it to you.","ru":"Когда будет готово, пришлю тебе."},{"sign":"-","formula":"S + won't + V + {{until}} + S + [[V / V-s]]","en":"We won't start {{until}} everyone [[arrives]].","ru":"Мы не начнём, пока все не соберутся."},{"sign":"Perfect","formula":"{{after / when / once}} + S + [[have / has + V3]]","en":"{{Once}} you [[have signed]] the contract, we can start.","ru":"Как только подпишешь договор, можно начинать."}],
"note":"Если придаточное стоит первым, после него ставим запятую: When it [[is]] ready, I'll send it. Если вторым — запятая не нужна."},{"type":"markers","title":"Союзы, после которых не ставим will","groups":[{"label":"Время","chips":["when|когда","as soon as|как только","until / till|пока не, до тех пор пока","before|перед тем как, до того как","after|после того как","while|пока, в то время как","by the time|к тому времени, как","once|как только, после того как"]},{"label":"Условие (подробно — в главах про условные)","chips":["if|если","unless|если не","as long as|при условии, что","in case|на случай, если"]}],
"note":"till = until, только разговорнее. После by the time в главной части часто Future Perfect: By the time you [[get]] here, we'll have finished.","en":"Wait here {{until}} I [[come]] back.","ru":"Подожди здесь, пока я не вернусь."},{"type":"points","title":"Какое настоящее ставить в придаточном","items":[{"label":"Present Simple — обычный вариант","en":"I'll phone you {{as soon as}} I [[get]] home.","ru":"Позвоню, как только доберусь до дома."},{"label":"Present Perfect — «сначала закончу, потом…»","text":"Подчёркивает, что действие в придаточном завершится раньше главного. Часто подходят оба варианта: after I finish = after I've finished.","en":"You can go {{after}} you [[have finished]] the test.","ru":"Можешь идти, после того как закончишь тест.","examples":[{"en":"{{When}} I [[see]] Oleg, I'll tell him the news.","ru":"Когда увижу Олега, расскажу ему новость (действия одновременны — только Present Simple)."}]},{"label":"Present Continuous — если это процесс","en":"I'll check the drawings {{while}} you [[are having]] lunch.","ru":"Я проверю чертежи, пока ты будешь обедать."},{"label":"В главной части — не только will","text":"Там может быть повелительное наклонение, can, be going to.","en":"Call me {{as soon as}} you [[land]].","ru":"Позвони мне, как только приземлишься."}]},{"type":"table","title":"Один и тот же when — три разные ситуации","head":["Что это","Пример","Перевод"],"rows":[["Прямой вопрос","{{When}} [[will]] the results [[be]] ready?","Когда будут готовы результаты?"],["Косвенный вопрос (не знаю / спроси, когда…)","I don't know {{when}} the results [[will be]] ready.","Не знаю, когда будут готовы результаты."],["Придаточное времени","I'll send them {{when}} they [[are]] ready.","Пришлю, когда будут готовы."]],"note":"Проверка: если к части с when подходит вопрос «что?» (не знаю — что? когда будут готовы) — это косвенный вопрос, will там нормален. Если она отвечает на «когда?» (пришлю — когда?) — это время, will нельзя."},{"type":"compare","title":"if: «если» или «ли»?","left":{"title":"if = если","sub":"условие → Present","points":["Отвечает на вопрос «при каком условии?»","Будущее выражаем Present Simple — как после when"],"examples":[{"en":"I'll help you {{if}} I [[have]] time.","ru":"Я помогу тебе, если будет время."}]},"right":{"title":"if = ли","sub":"косвенный вопрос → will","points":["Стоит после know, ask, wonder, not sure","Можно заменить на whether","Будущее — обычное, через will"],"examples":[{"en":"I don't know {{if}} I [[will have]] time.","ru":"Не знаю, будет ли у меня время."}]},"note":"Переведи if: «если» → Present, «ли» → will. То же с when: «когда» в значении времени → Present, «когда» в косвенном вопросе → will."},{"type":"note","kind":"warn","title":"Ловушка перевода с русского","text":"По-русски будущее стоит в обеих частях: «Когда приеду, позвоню». По-английски — только в главной. Не переводи слово в слово: «как только закончу» — as soon as I finish, «пока не вернусь» — until I come back (без not).","en":"{{As soon as}} I [[finish]], I'll call you.","ru":"Как только закончу, позвоню тебе."},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"I'll call you when I ~~will arrive~~.","right":"I'll call you {{when}} I [[arrive]].","why":"Калька с «когда приеду». После when в значении будущего — Present Simple."},{"wrong":"Wait until I ~~don't come~~ back.","right":"Wait {{until}} I [[come]] back.","why":"«Пока не» = until. Отрицание уже внутри until, not не нужен."},{"wrong":"After he ~~will finish~~ the drawing, he'll send it.","right":"{{After}} he [[finishes]] the drawing, he'll send it.","why":"after + Present (не забудь -es у he) или Present Perfect: after he has finished."},{"wrong":"I'll check the plan while you ~~will sleep~~.","right":"I'll check the plan {{while}} you [[are sleeping]].","why":"После while про будущее — Present; процесс — Present Continuous."},{"wrong":"I wonder if it ~~rains~~ tomorrow.","right":"I wonder {{if}} it [[will rain]] tomorrow.","why":"Здесь if = «ли» (косвенный вопрос), а не «если». Будущее — через will."}]},{"type":"quiz","items":[{"q":"I'll phone you when I ___ (get) to the hotel.","a":"get","why":"when про будущее → Present Simple."},{"q":"We won't start the survey until the rain ___ (stop).","a":"stops","why":"until + Present Simple; the rain = it → -s."},{"q":"After I ___ (finish) this report, I'll take a break.","a":"finish","alt":["have finished"],"why":"После after — Present Simple или Present Perfect («сначала закончу»)."},{"q":"I'll check the drawings while you ___ lunch.","options":["will have","are having","will be having"],"a":"are having","why":"while про будущее → Present; процесс → Present Continuous."},{"q":"I wonder if it ___ tomorrow.","options":["rains","will rain","rained"],"a":"will rain","why":"if = «ли» (интересно, пойдёт ли дождь) — косвенный вопрос, будущее через will."},{"q":"___ the exam results? — Next week, I think.","options":["When will you know","When you will know","When you know"],"a":"When will you know","why":"Прямой вопрос о будущем: When + will + S + V."},{"q":"Wait here ___ I come back.","options":["until","when","by the time"],"a":"until","why":"«Пока не вернусь» = until I come back."},{"q":"By the time we get there, the lecture ___.","options":["has started","will have started","starts"],"a":"will have started","why":"В придаточном — Present (get), в главной части к моменту в будущем — Future Perfect."}]},{"type":"summary","points":["После {{when, as soon as, until, before, after, while, by the time, once}} про будущее — Present, не will.","will — только в главной части: I'll call you {{when}} I [[arrive]].","«Сначала закончу» — Present Perfect: {{after}} I [[have finished]].","Прямой и косвенный вопрос — will возможен: I don't know {{if}} he [[will come]].","{{until}} = «пока не», но без not: {{until}} you [[come]] back."]}]},{"id":"tenses-review","title":"Tenses Review","subtitle":"Все 12 времён: сводка и выбор нужного","level":"B1","tagline":"Вся система времён на одной странице и простой алгоритм, как выбрать нужное.","blocks":[{"type":"table","title":"Present — настоящее","head":["Время и смысл","Формула","Пример","Маркеры"],"rows":[["Present Simple\nфакт, привычка, расписание","[[V / V-s]]","She [[checks]] her email {{every morning}}.","{{always, usually, often, every day}}"],["Present Continuous\nпроцесс сейчас, временное","[[am / is / are + V-ing]]","They [[are pouring]] concrete {{at the moment}}.","{{now, at the moment, Look!, this week}}"],["Present Perfect\nрезультат к «сейчас», опыт","[[have / has + V3]]","I [[have]] {{already}} [[sent]] the report.","{{just, already, yet, ever, never}}"],["Present Perfect Continuous\nдлится до «сейчас»","[[have / has been + V-ing]]","She [[has been studying]] English {{for}} three years.","{{for, since, how long, all day}}"]],"note":"Глаголы состояния (know, want, like, need…) в Continuous обычно не употребляются: I [[know]], а не ~~I am knowing~~; I [[have known]] him for years, а не ~~have been knowing~~. Но с for / since / how long они идут в Present Perfect: I have had this car since 2019. Некоторые в Continuous меняют значение: I'm loving this book, He's being difficult.","noteKind":"warn"},{"type":"table","title":"Past — прошедшее","head":["Время и смысл","Формула","Пример","Маркеры"],"rows":[["Past Simple\nзакончилось в прошлом","[[V2]]","We [[visited]] the site {{yesterday}}.","{{yesterday, ago, last week, in 2020}}"],["Past Continuous\nпроцесс в момент в прошлом","[[was / were + V-ing]]","I [[was driving]] {{when}} you called.","{{at 5 yesterday, while, when}}"],["Past Perfect\nраньше другого прошлого","[[had + V3]]","The train [[had]] {{already}} [[left]] when we arrived.","{{by the time, before, already}}"],["Past Perfect Continuous\nдлилось до момента в прошлом","[[had been + V-ing]]","He was tired: he [[had been working]] {{all day}}.","{{for, since, all day}} + момент в прошлом"]],"note":"Past Perfect нужен, только когда важно, что одно прошлое действие случилось раньше другого. Просто цепочка событий по порядку — Past Simple."},{"type":"table","title":"Future — будущее","head":["Время и смысл","Формула","Пример","Маркеры"],"rows":[["Future Simple\nрешение, прогноз, обещание","[[will + V]]","I think she [[will pass]] the exam.","{{tomorrow, next week, I think, probably}}"],["Future Continuous\nпроцесс в момент в будущем","[[will be + V-ing]]","{{This time tomorrow}} I [[will be flying]] to Omsk.","{{this time tomorrow, at 8 tomorrow}}"],["Future Perfect\nбудет сделано к моменту","[[will have + V3]]","They [[will have finished]] the bridge {{by 2027}}.","{{by Friday, by the end of}}"],["Future Perfect Continuous\nбудет длиться к моменту (редко)","[[will have been + V-ing]]","{{By June}} I [[will have been working]] here {{for}} a year.","{{by … for …}}"]],"note":"will — не единственный способ говорить о будущем: план — be going to, договорённость — Present Continuous, расписание — Present Simple. Подробнее — в главе про способы выразить будущее."},{"type":"uses","title":"Как выбрать время: вопросы себе по порядку","items":[{"label":"Когда? Прошлое, настоящее или будущее","text":"yesterday, ago → Past; now, usually → Present; tomorrow, next → Future. Если прошлое связано с «сейчас» (результат, опыт, «уже») — это Present Perfect.","en":"I [[lost]] my phone {{yesterday}}. — I [[have lost]] my phone.","ru":"Я потерял телефон вчера. — Я потерял телефон (и сейчас его нет)."},{"label":"Факт или процесс?","text":"Факт, привычка, действие целиком → Simple. Действие было или будет «в разгаре» в определённый момент → Continuous.","en":"{{When}} Anna arrived, we [[had]] dinner.","ru":"Когда пришла Анна, мы поужинали (сели ужинать после её прихода).","examples":[{"en":"{{When}} Anna arrived, we [[were having]] dinner.","ru":"Когда пришла Анна, мы ужинали (уже сидели за столом)."}]},{"label":"Важен результат к моменту?","text":"Не когда, а что уже сделано к «сейчас», к моменту в прошлом или в будущем → Perfect. Точное время в прошлом — это Past Simple, не Perfect.","en":"The surveyors [[have]] {{already}} [[marked]] the boundaries.","ru":"Геодезисты уже разметили границы."},{"label":"Важно, как долго длится?","text":"Процесс длится до момента, и важна длительность (how long, for, since) → Perfect Continuous. Глаголы состояния — просто Perfect.","en":"We [[have been waiting]] {{for}} an hour.","ru":"Мы ждём уже час.","examples":[{"en":"I [[have known]] him {{for}} years.","ru":"Я знаю его много лет."}]},{"label":"Проверь особые случаи","text":"После when, if, as soon as про будущее — Present, не will. После said, knew, thought в прошлом будущее превращается в would.","en":"I'll call you {{as soon as}} I [[land]].","ru":"Позвоню, как только приземлюсь."}]},{"type":"points","title":"Perfect: взгляд назад от опорного момента","items":[{"label":"От «сейчас» — Present Perfect","en":"The builders [[have]] {{just}} [[finished]] the bridge.","ru":"Строители только что достроили мост."},{"label":"От момента в прошлом — Past Perfect","en":"{{By 2020}} the builders [[had finished]] the bridge.","ru":"К 2020 году строители уже достроили мост."},{"label":"От момента в будущем — Future Perfect","en":"{{By 2030}} the builders [[will have finished]] the bridge.","ru":"К 2030 году строители уже достроят мост."}],
"note":"Схема одна: have / had / will have + V3. Меняется только момент, от которого смотрим назад."},{"type":"formula","title":"Future in the Past: будущее, увиденное из прошлого","rows":[{"sign":"+","formula":"S + [[would + V]]","en":"He said he [[would come]] {{the next day}}.","ru":"Он сказал, что придёт на следующий день."},{"sign":"-","formula":"S + [[wouldn't + V]]","en":"I knew she [[wouldn't agree]].","ru":"Я знал, что она не согласится."},{"sign":"Намерение","formula":"S + [[was / were going to + V]]","en":"I [[was going to call]] you, but I forgot.","ru":"Я собирался тебе позвонить, но забыл."}],
"note":"would здесь не «бы»: He said he [[would help]] — Он сказал, что поможет. Нужен после глагола в прошедшем (said, knew, thought, promised). Подробнее — в главе про косвенную речь.","noteKind":"warn"},{"type":"note","kind":"tip","title":"Маркер — подсказка, а не закон","text":"Решает смысл, а не слово. today, this week — Present Perfect, если период ещё идёт, и Past Simple, если уже закончился. always обычно с Present Simple, но с Continuous означает раздражение.","en":"He [[is]] {{always}} [[losing]] his keys!","ru":"Он вечно теряет ключи!"},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"I ~~am living~~ here since 2019.","right":"I [[have lived]] here {{since}} 2019.","why":"«Живу с 2019 года» — действие длится до сих пор: Present Perfect (или have been living), не Present."},{"wrong":"How long ~~are you learning~~ English?","right":"How long [[have]] you [[been learning]] English?","why":"How long + до сих пор → Present Perfect Continuous."},{"wrong":"I ~~have seen~~ him yesterday.","right":"I [[saw]] him {{yesterday}}.","why":"Точное время в прошлом (yesterday, ago, in 2020) — только Past Simple."},{"wrong":"When I ~~will finish~~, I'll call you.","right":"{{When}} I [[finish]], I'll call you.","why":"После when про будущее — Present Simple."},{"wrong":"I ~~am knowing~~ the answer.","right":"I [[know]] the answer.","why":"know — глагол состояния, в Continuous не бывает."}]},{"type":"quiz","items":[{"q":"Don't call Anna now — she ___ an exam.","options":["takes","is taking","has taken","took"],"a":"is taking","why":"Прямо сейчас, процесс → Present Continuous."},{"q":"I'll call you as soon as I ___ the results.","options":["get","will get","got","am getting"],"a":"get","why":"as soon as про будущее → Present Simple, не will."},{"q":"We ___ (know) each other since our first year at university.","a":"have known","why":"since + до сих пор → Present Perfect; know — глагол состояния, поэтому не Continuous."},{"q":"It ___ since this morning. Take an umbrella.","options":["rains","is raining","has been raining","rained"],"a":"has been raining","why":"Процесс начался утром и длится до сих пор (since) → Present Perfect Continuous."},{"q":"— When did you check the measurements? — I ___ them on Monday.","options":["have checked","checked","had checked"],"a":"checked","why":"Вопрос When…? и точное время (on Monday) → Past Simple."},{"q":"I ___ a shower when the lights suddenly went out, so I had to finish in the dark.","options":["had","was having","have had","had had"],"a":"was having","why":"Процесс был в разгаре, когда его прервало другое действие → Past Continuous."},{"q":"By the time I got to the lecture hall, the lecture ___, so I went to the library.","options":["finished","has finished","had finished"],"a":"had finished","why":"Раньше другого прошлого действия (got) → Past Perfect."},{"q":"When I finally arrived, Anna was angry: she ___ for me for over an hour.","options":["was waiting","has been waiting","had been waiting","is waiting"],"a":"had been waiting","why":"Длилось больше часа до момента в прошлом → Past Perfect Continuous."},{"q":"— This bag is so heavy! — Give it to me. I ___ it for you.","options":["carry","will carry","am going to carry","am carrying"],"a":"will carry","why":"Решение и предложение помощи в момент речи → will."},{"q":"This time tomorrow we ___ over the Urals on our way to Novosibirsk.","options":["will fly","will be flying","will have flown"],"a":"will be flying","why":"Процесс в определённый момент в будущем → Future Continuous."},{"q":"The exam starts at 9 and lasts three hours, so at 12:30 it ___.","options":["will finish","will be finishing","will have finished"],"a":"will have finished","why":"Экзамен закончится в 12:00, к 12:30 уже будет завершён → Future Perfect."},{"q":"Olga promised that she ___ (send) me the drawings the next day.","a":"would send","alt":["was going to send"],"why":"Будущее с точки зрения прошлого (promised, the next day) → would + V."}]},{"type":"summary","points":["Время = когда (Present / Past / Future) + вид (Simple / Continuous / Perfect / Perfect Continuous).","Simple — факт; Continuous — процесс в момент; Perfect — результат к моменту; Perfect Continuous — как долго до момента.","Точное прошлое ({{yesterday, ago}}) → Past Simple; связь с «сейчас» → Present Perfect.","После {{when, if, as soon as}} про будущее — Present, не will.","После said, knew в прошлом: will → [[would]] (Future in the Past)."]}]}]},{"id":"modals","roman":"V","title":"Модальные глаголы","chapters":[{"id":"can-could","title":"Can, could, be able to","subtitle":"Умение, возможность, разрешение","level":"A2–B1","tagline":"«Умею», «могу», «можно» — как сказать это в настоящем, прошлом и будущем.","formula":"S + [[can / could]] + V","blocks":[{"type":"points","title":"Общие свойства модальных глаголов","items":[{"label":"Нет окончания -s у he / she / it","en":"She [[can speak]] Chinese.","ru":"Она говорит по-китайски."},{"label":"Вопрос и отрицание — без do","en":"[[Can]] you [[drive]]? — No, I [[can't]].","ru":"Ты умеешь водить машину? — Нет."},{"label":"После модального — глагол без to","en":"We [[can start]] now.","ru":"Можем начинать."},{"label":"Нет форм will can, to can, canning","text":"Поэтому в других временах и после других глаголов нужна замена — be able to.","en":"I'd like [[to be able to read]] technical texts.","ru":"Я хотел бы уметь читать технические тексты."}],
"note":"Так же ведут себя другие модальные глаголы: must, may, might, should, will, would."},{"type":"formula","title":"Как строится","rows":[{"sign":"+","formula":"S + [[can]] + V","en":"I [[can read]] technical drawings.","ru":"Я умею читать технические чертежи."},{"sign":"-","formula":"S + [[can't / cannot]] + V","en":"He [[can't swim]].","ru":"Он не умеет плавать."},{"sign":"?","formula":"[[Can]] + S + V + ?","en":"[[Can]] you [[hear]] me? — Yes, I can.","ru":"Ты меня слышишь? — Да."},{"sign":"Прошлое","formula":"S + [[could / couldn't]] + V","en":"I [[couldn't sleep]] last night.","ru":"Я не мог уснуть этой ночью."}],
"note":"cannot пишется слитно. В британском can't звучит [kɑːnt], а can в утверждении — коротко [kən]: на слух их различаешь по гласному."},{"type":"uses","title":"can: когда используем","items":[{"label":"Умение","en":"I [[can use]] AutoCAD.","ru":"Я умею работать в AutoCAD."},{"label":"Возможность: обстоятельства позволяют","en":"I [[can meet]] you {{tomorrow}} after class.","ru":"Я могу встретиться с тобой завтра после пар."},{"label":"Разрешение и запрет","en":"You [[can use]] my calculator.","ru":"Можешь взять мой калькулятор.","examples":[{"en":"You [[can't park]] here.","ru":"Здесь нельзя парковаться."}]},{"label":"Просьба (по-дружески)","text":"Вежливее — could (см. ниже); подробнее — в главе про просьбы и предложения.","en":"[[Can]] you [[open]] the window?","ru":"Можешь открыть окно?"},{"label":"«Бывает»: возможность в принципе","text":"Не про конкретный случай, а про то, что вообще случается. Про конкретную ситуацию — could / might (см. главу про вероятность).","en":"Winter roads [[can be]] dangerous.","ru":"Зимой дороги бывают опасными."}],
"note":"С see, hear, smell, understand, remember в английском обычно добавляют can: I [[can see]] the tower — Я вижу башню."},{"type":"points","title":"could: когда используем","items":[{"label":"Умел в прошлом (вообще, не в одном случае)","en":"My grandfather [[could speak]] three languages.","ru":"Мой дед говорил на трёх языках."},{"label":"Не смог — couldn't (в любой ситуации)","en":"I [[couldn't open]] the file.","ru":"Я не смог открыть файл."},{"label":"Вежливая просьба","en":"[[Could]] you [[send]] me the file, please?","ru":"Не могли бы вы прислать мне файл?"},{"label":"Вариант, предложение: «можно было бы»","en":"We [[could take]] a taxi.","ru":"Мы могли бы взять такси."},{"label":"Разрешение в прошлом","en":"At school we [[couldn't use]] phones in class.","ru":"В школе нам нельзя было пользоваться телефонами на уроках."}],
"note":"could + have + V3 («мог бы, но не сделал») — в главе про модальные с перфектом; could в значении «возможно» — в главе про вероятность."},{"type":"table","title":"be able to — во всех временах","head":["Время","Форма","Пример","Перевод"],"rows":[["Present","am / is / are able to","He [[is able to work]] under pressure.","Он способен работать в условиях стресса."],["Past","was / were able to","They [[were able to finish]] on time.","Им удалось закончить вовремя."],["Future","will be able to","You [[will be able to use]] the lab next term.","Со следующего семестра сможешь пользоваться лабораторией."],["Present Perfect","have / has been able to","I [[haven't been able to sleep]] recently.","В последнее время я не могу нормально спать."],["После модального","might / should + be able to","I [[might be able to help]] you.","Возможно, я смогу тебе помочь."],["После to и -ing","to be able to / being able to","I love [[being able to work]] from home.","Мне нравится, что я могу работать из дома."]],"note":"В настоящем проще сказать can: is able to звучит официальнее. А с will can не сочетается: ~~will can~~ → [[will be able to]].","noteKind":"warn"},{"type":"compare","title":"could или was able to?","left":{"title":"could","sub":"умел вообще","points":["Общее умение в прошлом","С see, hear, smell, understand — и в конкретной ситуации","couldn't — в отрицании подходит всегда"],"examples":[{"en":"He [[could run]] very fast when he was young.","ru":"В молодости он очень быстро бегал."},{"en":"From our hotel we [[could see]] the sea.","ru":"Из нашего отеля было видно море."}]},"right":{"title":"was able to / managed to","sub":"смог в конкретной ситуации","points":["Одноразовый успех: получилось один раз, в определённый момент","managed to — «удалось», часто с трудом"],"examples":[{"en":"The fire spread quickly, but everyone [[was able to escape]].","ru":"Огонь быстро распространялся, но всем удалось выбраться."},{"en":"After two hours we [[managed to find]] the error.","ru":"Через два часа нам удалось найти ошибку."}]},"note":"Про один конкретный успех could в утверждении не ставим: ~~everyone could escape~~ → everyone [[was able to escape]]. В отрицании couldn't подходит всегда: They [[couldn't escape]]."},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"She ~~cans~~ swim.","right":"She [[can swim]].","why":"У модальных глаголов нет окончания -s."},{"wrong":"I ~~can to help~~ you.","right":"I [[can help]] you.","why":"После can — глагол без to."},{"wrong":"~~Do you can~~ drive?","right":"[[Can]] you [[drive]]?","why":"Вопрос с can строится без do: can сам встаёт перед подлежащим."},{"wrong":"I ~~will can~~ come tomorrow.","right":"I [[will be able to come]] tomorrow.","why":"will и can вместе не ставят. Либо will be able to, либо просто I can come tomorrow, если решаешь сейчас."},{"wrong":"After a long search, he ~~could find~~ the key.","right":"After a long search, he [[managed to find]] the key.","why":"Одноразовый успех в прошлом — managed to / was able to, а не could."}]},{"type":"quiz","items":[{"q":"He's only two, so he ___ (can / not / read) yet.","a":"can't read","alt":["cannot read"],"why":"Отрицание: can't + глагол без to."},{"q":"I'd like ___ speak English fluently.","options":["can","to can","to be able to"],"a":"to be able to","why":"После would like нужен инфинитив с to, а у can его нет → to be able to."},{"q":"The fire spread quickly, but everyone ___ get out of the building.","options":["could","was able to","can"],"a":"was able to","why":"Одноразовый успех в конкретной ситуации → was able to."},{"q":"Sorry, I ___ (not / be able to / come) to the meeting tomorrow.","a":"won't be able to come","alt":["will not be able to come"],"why":"Будущее: will be able to; отрицание — won't."},{"q":"I ___ (not / be able to) sleep well for two weeks — the neighbours are renovating their flat.","a":"haven't been able to","alt":["have not been able to"],"why":"for two weeks, до сих пор → Present Perfect: have been able to."},{"q":"Excuse me, ___ you tell me where the dean's office is?","options":["could","must","should"],"a":"could","why":"Вежливая просьба → Could you…?"},{"q":"When she was young, she ___ run 10 km without stopping.","options":["can","could","will be able to"],"a":"could","why":"Общее умение в прошлом → could."},{"q":"You ___ smoke here — it's a hospital.","options":["can't","don't can","couldn't"],"a":"can't","why":"Запрет в настоящем → can't; do с can не используют."}]},{"type":"summary","points":["Модальные: без -s, без do, глагол без to — She [[can swim]].","can — умею / могу / можно; could — умел, вежливая просьба, «можно было бы».","Другие времена — через be able to: [[will be able to]], [[have been able to]].","Один конкретный успех в прошлом — [[was able to]] / [[managed to]], не could; couldn't — всегда можно."]}]},{"id":"must-have-to","title":"Must, have to, need","subtitle":"Долженствование: «должен», «надо», «нельзя», «не обязательно»","level":"A2–B1","tagline":"Как сказать «должен» и «надо» — и чем «нельзя» отличается от «не обязательно».","formula":"S + [[must / have to]] + V","blocks":[{"type":"formula","title":"Как строится","rows":[{"sign":"+","formula":"S + [[must]] + V","en":"You [[must wear]] a helmet on site.","ru":"На стройплощадке нужно носить каску."},{"sign":"+","formula":"S + [[have to / has to]] + V","en":"She [[has to get up]] at six.","ru":"Ей приходится вставать в шесть."},{"sign":"-","formula":"S + [[mustn't]] + V","en":"You [[mustn't touch]] the wires.","ru":"Провода трогать нельзя."},{"sign":"-","formula":"S + [[don't / doesn't have to]] + V","en":"You [[don't have to come]] early.","ru":"Приходить рано не обязательно."},{"sign":"?","formula":"[[Do / Does]] + S + [[have to]] + V + ?","en":"[[Do]] I [[have to pay]] for the course?","ru":"Мне нужно платить за курс?"}],
"note":"must — модальный: без -s, без do, глагол без to. have to — обычный глагол: he [[has to]], вопрос и отрицание через do / does / did."},{"type":"compare","title":"must или have to?","left":{"title":"must","sub":"я сам считаю, что нужно","points":["Мнение говорящего, внутренняя необходимость","Правила, инструкции, объявления (часто письменные)","Формы прошедшего у must нет — в прошлом только had to"],"examples":[{"en":"I [[must call]] my mum — I haven't spoken to her for a week.","ru":"Надо позвонить маме — я неделю с ней не разговаривал."},{"en":"Visitors [[must report]] to reception.","ru":"Посетители должны обратиться на ресепшен."}]},"right":{"title":"have to","sub":"так сложились обстоятельства","points":["Необходимость извне: правила, расписание, чужое решение","Есть все времена: had to, will have to, have had to"],"examples":[{"en":"I [[have to wear]] glasses for reading.","ru":"Мне приходится носить очки для чтения."},{"en":"We [[had to wait]] two hours for the inspector.","ru":"Нам пришлось ждать инспектора два часа."}]},"note":"Часто подходят оба, разница в оттенке: must — «я так считаю», have to — «так надо, выбора нет». В американском английском must звучит официально, в речи чаще have to."},{"type":"table","title":"have to — во всех временах","head":["Время","Форма","Пример","Перевод"],"rows":[["Present","have / has to","He [[has to work]] on Saturdays.","Ему приходится работать по субботам."],["Past","had to","We [[had to redo]] the calculations.","Нам пришлось переделать расчёты."],["Future","will have to","You [[will have to show]] your passport.","Нужно будет показать паспорт."],["Present Perfect","have / has had to","I [[have had to change]] my plans.","Мне пришлось изменить планы."],["После модального","might / may have to","We [[might have to cancel]] the trip.","Возможно, придётся отменить поездку."]],"note":"Прошедшее от must — тоже had to: ~~I must go there yesterday~~ → I [[had to go]] there {{yesterday}}.","noteKind":"warn"},{"type":"compare","title":"mustn't или don't have to?","left":{"title":"mustn't","sub":"нельзя, запрещено","points":["Не делай этого: запрещено или опасно"],"examples":[{"en":"You [[mustn't use]] your phone during the exam.","ru":"На экзамене нельзя пользоваться телефоном."}]},"right":{"title":"don't have to","sub":"не обязательно","points":["Необходимости нет, но если хочешь — можно"],"examples":[{"en":"You [[don't have to print]] the report — email is fine.","ru":"Отчёт можно не распечатывать — достаточно прислать по почте."}]},"note":"Самая частая ловушка: mustn't — это не «не обязан», а «нельзя». «Не обязан, не нужно» — don't have to.","noteKind":"warn"},{"type":"points","title":"need to, needn't, have got to","items":[{"label":"need to — нужно","text":"Обычный глагол: he needs to, do you need to…?","en":"I [[need to renew]] my student card.","ru":"Мне нужно продлить студенческий билет."},{"label":"don't need to / needn't — не нужно","text":"То же, что don't have to. needn't — модальный: без -s и без to; чаще в британском.","en":"You [[needn't bring]] anything.","ru":"Ничего приносить не нужно.","examples":[{"en":"You [[don't need to bring]] anything.","ru":"Ничего приносить не нужно."}]},{"label":"have got to — разговорное «надо» (BrE)","text":"Только про настоящее и будущее; в прошлом — had to. Вопрос: Have you got to…?","en":"We [[have got to finish]] this today.","ru":"Нам надо закончить это сегодня."},{"label":"didn't need to — не нужно было","text":"Подробнее о разнице с needn't have — в главе про модальные с перфектом.","en":"I [[didn't need to take]] a taxi — Oleg gave me a lift.","ru":"Мне не нужно было брать такси — Олег меня подвёз."}]},{"type":"formula","title":"be to — должен по плану","rows":[{"sign":"+","formula":"S + [[am / is / are to]] + V","en":"The meeting [[is to start]] at 10.","ru":"Совещание должно начаться в 10."},{"sign":"Пассив","formula":"S + [[am / is / are to be]] + [[V3]]","en":"All samples [[are to be tested]] in the lab.","ru":"Все образцы должны пройти испытания в лаборатории."},{"sign":"Прошлое","formula":"S + [[was / were to]] + V","en":"The bridge [[was to open]] in May.","ru":"Мост должны были открыть в мае."}],
"note":"be to — «должен по плану, договорённости или инструкции». Часто встречается в официальных и технических текстах, в разговоре — редко. Подробнее — в главе про функции be и have."},{"type":"table","title":"Русское «должен» — какой английский вариант?","head":["Форма","Значение","Пример"],"rows":[["must","должен (я так считаю); правило","I [[must study]] harder."],["have to","приходится (обстоятельства)","I [[have to work]] on Sundays."],["have got to","надо (разговорно, BrE)","I [[have got to go]]."],["need to","нужно","You [[need to sign]] here."],["be to","должен по плану","We [[are to meet]] at five."],["should","следует, стоит (совет)","You [[should rest]]."],["mustn't","нельзя","You [[mustn't smoke]] here."],["don't have to / needn't","не обязательно","You [[don't have to wait]]."]],"note":"Выбирай по смыслу, а не по русскому слову: «ты должен отдохнуть» — это совет (should), а не обязанность (must)."},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"I ~~must~~ go to the dentist yesterday.","right":"I [[had to go]] to the dentist {{yesterday}}.","why":"У must нет прошедшего времени — используй had to."},{"wrong":"You ~~mustn't~~ come tomorrow — the lecture is cancelled.","right":"You [[don't have to come]] tomorrow — the lecture is cancelled.","why":"«Не обязательно» — don't have to; mustn't = «нельзя»."},{"wrong":"~~Do you must~~ wear a uniform?","right":"[[Do]] you [[have to wear]] a uniform?","why":"С must do не используют. О правилах обычно спрашивают через Do you have to…?"},{"wrong":"He ~~have to~~ work on Saturdays.","right":"He [[has to work]] on Saturdays.","why":"have to — обычный глагол: he / she / it → has to."},{"wrong":"We ~~must to finish~~ it today.","right":"We [[must finish]] it today.","why":"После must — глагол без to (а после have — с to)."}]},{"type":"quiz","items":[{"q":"You ___ smoke inside the building — it's forbidden.","options":["mustn't","don't have to","needn't"],"a":"mustn't","why":"Запрет → mustn't."},{"q":"It's Saturday tomorrow, so I ___ get up early.","options":["mustn't","don't have to","must"],"a":"don't have to","why":"Нет необходимости, но не запрещено → don't have to."},{"q":"Yesterday I ___ (have to / stay) at the office until 9.","a":"had to stay","why":"Прошлое → had to (у must прошедшего нет)."},{"q":"___ she ___ (have to) wear a uniform at work?","a":["Does","have to"],"why":"have to — обычный глагол: вопрос через does."},{"q":"We're not sure yet, but we ___ cancel the trip.","options":["might have to","must have to","might must"],"a":"might have to","why":"Два модальных подряд нельзя; после might — have to."},{"q":"The new bridge ___ (be to / open) next spring.","a":"is to open","why":"be to = «должен по плану»; the bridge = it → is."},{"q":"You ___ (need / not) bring your laptop — we'll use the lab computers.","a":"needn't","alt":["don't need to","need not"],"why":"Не нужно, не обязательно → needn't / don't need to."},{"q":"He ___ (not / have to / work) on Sundays — the office is closed.","a":"doesn't have to work","alt":["does not have to work"],"why":"Не обязательно → doesn't have to; he → does."}]},{"type":"summary","points":["must — «я считаю нужным», правило; have to — «так сложились обстоятельства».","Прошедшее — только [[had to]]; будущее — [[will have to]].","[[mustn't]] = нельзя; [[don't have to]] / [[needn't]] = не обязательно.","have to — через do: [[Do]] you [[have to]]…? He [[doesn't have to]]…","be to = «должен по плану»: The work [[is to be finished]] by May."]}]},{"id":"should","title":"Should, ought to, had better","subtitle":"Совет и мнение: «следует», «стоит», «лучше бы»","level":"A2–B1","tagline":"Как дать совет, высказать мнение и предупредить о последствиях.","formula":"S + [[should]] + V","blocks":[{"type":"formula","title":"Как строится","rows":[{"sign":"+","formula":"S + [[should]] + V","en":"You [[should see]] a doctor.","ru":"Тебе стоит сходить к врачу."},{"sign":"-","formula":"S + [[shouldn't]] + V","en":"You [[shouldn't work]] so late.","ru":"Тебе не стоит работать так допоздна."},{"sign":"?","formula":"[[Should]] + S + V + ?","en":"[[Should]] I [[call]] him?","ru":"Мне ему позвонить?"},{"sign":"?","formula":"Wh- + [[should]] + S + V + ?","en":"What [[should]] I [[do]]?","ru":"Что мне делать?"}],
"note":"should — модальный глагол: без -s (he should), без do, глагол после него — без to."},{"type":"uses","title":"Когда используем","items":[{"label":"Совет","en":"You [[should take]] an umbrella.","ru":"Тебе стоит взять зонт."},{"label":"Мнение: как правильно","en":"The city [[should build]] more cycle lanes.","ru":"Городу следует строить больше велодорожек."},{"label":"Спросить совета","en":"[[Should]] I [[apply]] for this job?","ru":"Стоит ли мне подаваться на эту вакансию?"},{"label":"Ожидание: так должно быть","text":"Говорящий ожидает, что так и будет.","en":"The parcel [[should arrive]] {{tomorrow}}.","ru":"Посылка должна прийти завтра."},{"label":"Что-то не так, как должно быть","en":"The plan [[should show]] the boundaries of the plot, but it doesn't.","ru":"На плане должны быть показаны границы участка, а их нет."}]},{"type":"points","title":"I think you should / I don't think you should","items":[{"label":"Мягкий совет","en":"I think you [[should talk]] to the dean.","ru":"Думаю, тебе стоит поговорить с деканом."},{"label":"Совет «не делать»","text":"Отрицание обычно ставят в think, а не в should.","en":"I don't think you [[should buy]] this laptop.","ru":"Думаю, тебе не стоит покупать этот ноутбук."},{"label":"Спросить мнения","en":"Do you think I [[should take]] the job?","ru":"Как думаешь, мне стоит соглашаться на эту работу?"}],
"note":"I think you shouldn't… — не ошибка, но I don't think you should… звучит естественнее."},{"type":"note","kind":"tip","title":"ought to = should","text":"ought to значит то же, что should, но встречается реже и звучит чуть официальнее. После ought обязательно to; отрицание — ought not to. В вопросах вместо ought обычно берут should.","en":"You [[ought to apologise]] to her.","ru":"Тебе следует извиниться перед ней."},{"type":"formula","title":"had better — «лучше бы, а то…»","rows":[{"sign":"+","formula":"S + [[had better]] + V","en":"You [[had better hurry]], or you'll miss the bus.","ru":"Лучше поторопись, а то опоздаешь на автобус."},{"sign":"-","formula":"S + [[had better not]] + V","en":"We [[had better not be]] late for the exam.","ru":"Нам лучше не опаздывать на экзамен."}],
"note":"had better — про настоящее и будущее, хотя в нём had. В речи почти всегда сокращают: You'd better go. Глагол без to; отрицание — had better not, а не ~~hadn't better~~.","noteKind":"warn"},{"type":"compare","title":"should или had better?","left":{"title":"should","sub":"совет, мнение","points":["Любой совет — и общий, и в конкретной ситуации","Просто «так правильно», без угрозы"],"examples":[{"en":"You [[should read]] more in English.","ru":"Тебе стоит больше читать по-английски."}]},"right":{"title":"had better","sub":"лучше бы, а то будут проблемы","points":["Только конкретная ситуация, не «вообще»","Если не сделать — будет плохо (часто с or / otherwise)"],"examples":[{"en":"You [[had better save]] the file, or you'll lose everything.","ru":"Лучше сохрани файл, а то всё потеряешь."}]},"note":"had better — не вежливая форма should, а скорее предупреждение. Со старшими и незнакомыми осторожнее."},{"type":"table","title":"Совет: с русского на английский","head":["По-русски","По-английски"],"rows":[["Тебе стоит / следует…","You [[should]] + V"],["Тебе не стоит…","You [[shouldn't]] + V / I don't think you [[should]] + V"],["Мне позвонить? Стоит ли мне…?","[[Should]] I + V?"],["Лучше сделай (а то…)","You [[had better]] + V"],["Лучше не надо (а то…)","You [[had better not]] + V"],["Надо было… (упрёк)","You [[should have]] + V3 — см. главу про модальные с перфектом"]],"note":"Не путай с must: «должен» в смысле «обязан» — must / have to; «стоит, советую» — should."},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"You ~~should to rest~~.","right":"You [[should rest]].","why":"После should — глагол без to (to нужен только после ought)."},{"wrong":"You ~~had better to leave~~ now.","right":"You [[had better leave]] now.","why":"had better + глагол без to."},{"wrong":"~~Do I should~~ call him?","right":"[[Should]] I [[call]] him?","why":"Вопрос с should — без do: should встаёт перед подлежащим."},{"wrong":"You ~~would better~~ go.","right":"You [[had better]] go.","why":"В You'd better сокращено had, а не would."},{"wrong":"People ~~had better~~ eat less sugar.","right":"People [[should eat]] less sugar.","why":"Общий совет «вообще» — should; had better — только про конкретную ситуацию."}]},{"type":"quiz","items":[{"q":"You look tired. You ___ (go) to bed early tonight.","a":"should go","alt":["ought to go","had better go"],"why":"Совет → should + V."},{"q":"___ I take the job? What do you think?","options":["Should","Do","Had"],"a":"Should","why":"Спросить совета → Should I…?"},{"q":"I don't think you ___ buy that car — it's too old.","options":["should","shouldn't","had better"],"a":"should","why":"Отрицание уже в don't think, поэтому дальше should без not."},{"q":"You ___ touch that cable — it could be live.","options":["had better not","hadn't better","had not better"],"a":"had better not","why":"Отрицание: had better not + V."},{"q":"You ___ (should / not / eat) so much fast food.","a":"shouldn't eat","alt":["should not eat"],"why":"Совет «не делать» → shouldn't + V."},{"q":"The meeting ___ finish by five, so I'll be home by six.","options":["should","had better","ought"],"a":"should","why":"Ожидание «так должно быть» → should; после ought нужен to."},{"q":"We ___ (had better / leave) now, or we'll miss the train.","a":"had better leave","why":"Предупреждение о последствиях (or…) → had better + V без to."},{"q":"You ___ apologise to her. You were really rude.","options":["ought to","ought","should to"],"a":"ought to","why":"ought всегда с to, should — без to."}]},{"type":"summary","points":["[[should]] / [[shouldn't]] + V — совет и мнение: You [[should rest]].","Спросить совета: [[Should]] I…? What [[should]] I [[do]]?","«Думаю, не стоит» — I don't think you [[should]]…","[[ought to]] = should, только реже; [[had better]] — «лучше бы, а то будет хуже».","После should и had better глагол без to; to — только в ought to."]}]},{"id":"possibility","title":"Must, may, might, can't","subtitle":"Вероятность и логический вывод","level":"B1","tagline":"Как сказать «наверняка», «возможно» и «не может быть» — о настоящем и будущем.","formula":"S + [[must / may / might / can't]] + V","blocks":[{"type":"table","title":"Шкала уверенности","head":["Уверенность","Модальный","Пример","Перевод"],"rows":[["почти 100% «да»","[[must]]","She [[must be]] tired.","Она, должно быть, устала."],["возможно","[[may / might / could]]","He [[might be]] in the library.","Может быть, он в библиотеке."],["возможно, нет","[[may not / might not]]","She [[may not know]] about it.","Возможно, она об этом не знает."],["почти 100% «нет»","[[can't / couldn't]]","That [[can't be]] true.","Этого не может быть."]],"note":"Здесь речь не об обязанности и не об умении: must = «наверняка», can't = «не может быть»."},{"type":"formula","title":"Как строится","rows":[{"sign":"+","formula":"S + [[must / may / might / could]] + V","en":"You [[must know]] him.","ru":"Ты наверняка его знаешь."},{"sign":"Процесс","formula":"S + [[must / might]] + [[be + V-ing]]","en":"She isn't answering. She [[might be driving]].","ru":"Она не отвечает. Может, она за рулём."},{"sign":"-","formula":"S + [[can't / might not]] + V","en":"He [[can't be]] hungry — he's just had lunch.","ru":"Не может быть, что он голоден, — он только что пообедал."},{"sign":"Прошлое","formula":"S + [[must / might / can't]] + [[have + V3]]","en":"She [[must have forgotten]].","ru":"Она, наверное, забыла."}],
"note":"Выводы о прошлом (must have done, can't have done) подробно разобраны в главе про модальные с перфектом."},{"type":"uses","title":"Логический вывод о настоящем","items":[{"label":"must — наверняка","text":"Ты делаешь вывод из фактов: другого объяснения не видишь.","en":"You've been travelling all day. You [[must be]] exhausted.","ru":"Ты весь день в дороге. Ты, наверное, без сил."},{"label":"can't — не может быть","text":"Ты уверен, что это невозможно. Это противоположность must.","en":"That [[can't be]] Oleg — he's on a plane right now.","ru":"Это не может быть Олег — он сейчас в самолёте."},{"label":"may / might / could — возможно","text":"Не знаешь наверняка, допускаешь вариант. Здесь все три почти синонимы.","en":"Where's Pavel? — He [[may be]] in the lab.","ru":"Где Павел? — Возможно, он в лаборатории."},{"label":"may not / might not — возможно, нет","text":"can't и couldn't здесь не подходят: они значат «точно нет».","en":"She [[might not be]] at home.","ru":"Может быть, её нет дома."}]},{"type":"compare","title":"mustn't или can't?","left":{"title":"mustn't","sub":"запрет: нельзя","points":["Правило или приказ: этого делать нельзя","К выводам и вероятности отношения не имеет"],"examples":[{"en":"You [[mustn't park]] here.","ru":"Здесь нельзя парковаться."}]},"right":{"title":"can't","sub":"вывод: не может быть","points":["Ты уверен, что это неправда","Противоположность must = «наверняка»"],"examples":[{"en":"He [[can't be]] at work — his office is closed today.","ru":"Он не может быть на работе — его офис сегодня закрыт."}]},"note":"В британском противоположность must в выводах — can't: ~~He mustn't be at home~~ → He [[can't be]] at home. В американском в выводах встречается must not (He must not be home — видимо, его нет дома).","noteKind":"warn"},{"type":"note","kind":"warn","title":"can или could?","text":"can — про то, что «вообще бывает». Про конкретную ситуацию сейчас или в будущем говорим could / may / might. Русское «может пойти дождь» — it might rain, а не it can rain.","en":"The road [[could be]] icy today.","ru":"Сегодня на дороге может быть гололёд."},{"type":"markers","title":"Будущее: шкала уверенности","groups":[{"label":"Почти точно","chips":["will|точно будет","will definitely|обязательно будет","will probably|вероятно, будет"]},{"label":"Возможно","chips":["may|возможно","might|может быть","could|не исключено"]},{"label":"Скорее нет","chips":["probably won't|вероятно, не будет","may not / might not|возможно, не будет","definitely won't|точно не будет"]}],
"note":"Порядок слов: will {{probably}} — после will, но {{probably}} won't — перед won't. Так же с definitely.","en":"It [[might rain]] {{later}}, so take an umbrella.","ru":"Позже может пойти дождь, так что возьми зонт."},{"type":"points","title":"Про будущее: примеры","items":[{"label":"may / might + V — возможно, будет","en":"I [[might go]] to Kazan at the weekend.","ru":"Может, съезжу в Казань на выходных."},{"label":"could — тоже возможность","text":"Часто про то, что может случиться, в том числе плохое.","en":"Be careful — the ice [[could break]].","ru":"Осторожно — лёд может проломиться."},{"label":"might not / may not — возможно, не…","en":"We [[might not finish]] the project on time.","ru":"Возможно, мы не успеем закончить проект вовремя."},{"label":"will probably / probably won't — вероятно","en":"The results [[will]] {{probably}} [[be]] ready on Monday.","ru":"Результаты, вероятно, будут готовы в понедельник."},{"label":"Как спросить о вероятности","text":"С may о вероятности не спрашивают: May I…? — это просьба о разрешении. Обычный вопрос — Do you think…?","en":"Do you think it [[will rain]]?","ru":"Как думаешь, будет дождь?"}]},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"It ~~can~~ rain tomorrow.","right":"It [[might rain]] {{tomorrow}}.","why":"Конкретная возможность в будущем — might / may / could; can — только «вообще бывает»."},{"wrong":"He ~~mustn't be~~ at home — his car isn't there.","right":"He [[can't be]] at home — his car isn't there.","why":"«Не может быть» — can't; mustn't = «нельзя»."},{"wrong":"I'm not sure, but he ~~can't know~~ the answer.","right":"I'm not sure, but he [[might not know]] the answer.","why":"Не уверен → might not / may not; can't = «точно нет»."},{"wrong":"~~May be~~ he is at home.","right":"{{Maybe}} he is at home. = He [[may be]] at home.","why":"maybe (слитно) — наречие «может быть», обычно в начале; may be (раздельно) — глагол после подлежащего."},{"wrong":"He ~~won't probably~~ come.","right":"He {{probably}} [[won't come]].","why":"probably ставим перед won't, но после will."}]},{"type":"quiz","items":[{"q":"You've been working for twelve hours. You ___ (наверняка / be) exhausted.","a":"must be","why":"Уверенный вывод из фактов → must be."},{"q":"That ___ be Anna's car — she sold it last year.","options":["must","can't","mustn't"],"a":"can't","why":"Уверен, что это невозможно → can't (mustn't — это запрет)."},{"q":"I'm not sure where Igor is. He ___ be in the library.","options":["must","might","can't"],"a":"might","why":"Не уверен, допускаешь вариант → might."},{"q":"Take an umbrella — it ___ rain later. (возможно)","a":"might","alt":["may","could"],"why":"Возможность в будущем → might / may / could, но не can."},{"q":"He ___ come to the party — he isn't feeling well.","options":["probably won't","won't probably","can't probably"],"a":"probably won't","why":"probably стоит перед won't."},{"q":"She isn't answering the phone. She ___ (might / drive).","a":"might be driving","why":"Возможный процесс прямо сейчас → might be + V-ing."},{"q":"The forecast says it ___ snow tomorrow.","options":["can","could","must"],"a":"could","why":"Конкретная возможность в будущем → could; can — только «вообще бывает»."},{"q":"I'm not sure, but they ___ know about the changes yet.","options":["can't","might not","mustn't"],"a":"might not","why":"Не уверен → might not; can't = «точно нет», mustn't = «нельзя»."}]},{"type":"summary","points":["Шкала: [[must]] (наверняка) → [[may / might / could]] (возможно) → [[can't]] (не может быть).","Противоположность must в выводах — [[can't]], а не mustn't.","«Возможно, нет» — [[might not]] / [[may not]].","Будущее: [[might]] / [[may]] / [[could]] + V; will {{probably}}, но {{probably}} won't.","can — «вообще бывает»; про конкретный случай — could / might."]}]},{"id":"modal-perfect","title":"Modal + have + V3","subtitle":"Модальные глаголы о прошлом: must have done, should have done","level":"B1–B2","tagline":"Как сказать о прошлом «наверняка сделал», «не мог сделать», «надо было сделать» и «мог бы сделать».","formula":"S + [[must / may / might / could / should]] + [[have]] + [[V3]]","blocks":[{"type":"formula","title":"Как строится","rows":[{"sign":"+","formula":"S + [[modal]] + [[have]] + [[V3]]","en":"She [[must have forgotten]] about the meeting.","ru":"Она, должно быть, забыла о встрече."},{"sign":"-","formula":"S + [[can't / shouldn't / might not]] + [[have]] + [[V3]]","en":"He [[can't have seen]] us.","ru":"Не может быть, чтобы он нас видел."},{"sign":"?","formula":"[[Could / Should]] + S + [[have]] + [[V3]] + ?","en":"[[Could]] he [[have taken]] the wrong bus?","ru":"Может, он сел не на тот автобус?"},{"sign":"Пассив","formula":"S + [[modal]] + [[have been]] + [[V3]]","en":"The report [[should have been sent]] yesterday.","ru":"Отчёт надо было отправить ещё вчера."}],
"note":"have не меняется: he [[must have left]], а не ~~he must has left~~ и не ~~he must had left~~. В речи have звучит слабо: must've, should've, could've.","noteKind":"warn"},{"type":"compare","title":"Две задачи: гадаем или оцениваем","left":{"title":"Догадка о прошлом","sub":"что, скорее всего, случилось","points":["[[must have]] — наверняка","[[may / might / could have]] — возможно","[[can't / couldn't have]] — не может быть"],"examples":[{"en":"The ground is wet. It [[must have rained]] during the night.","ru":"Земля мокрая — ночью, должно быть, шёл дождь."}]},"right":{"title":"Оценка прошлого","sub":"как надо было поступить","points":["[[should have]] — надо было (но не сделал)","[[shouldn't have]] — не надо было (а сделал)","[[could have]] — мог бы (но не сделал)"],"examples":[{"en":"You [[should have checked]] the figures.","ru":"Надо было проверить цифры."}]},"note":"Сначала спроси себя: я предполагаю, что было, или оцениваю, как кто-то поступил?"},{"type":"table","title":"Шкала уверенности о прошлом","head":["Форма","Смысл","Пример","Перевод"],"rows":[["must have V3","почти уверен: да","He [[must have left]] already.","Он, должно быть, уже ушёл."],["may / might have V3","возможно","She [[might have missed]] the bus.","Может быть, она опоздала на автобус."],["could have V3","возможно (одна из версий)","They [[could have taken]] a taxi.","Возможно, они взяли такси."],["may not / might not have V3","возможно, нет","He [[might not have got]] my message.","Возможно, он не получил моё сообщение."],["can't / couldn't have V3","почти уверен: нет","You [[can't have finished]] already!","Не может быть, чтобы ты уже закончил!"]],"note":"Противоположность must have — can't have, а не ~~mustn't have~~ (mustn't — запрет). В утверждении can have не бывает: «он мог уйти» → He [[could have left]]. Про настоящее — в главе о вероятности.","noteKind":"warn"},{"type":"uses","title":"Оценка прошлого: упрёк, сожаление, упущенный шанс","items":[{"label":"should have V3 — надо было","text":"Правильно было сделать, но этого не сделали. Упрёк себе или другому.","en":"I [[should have saved]] the file before closing the program.","ru":"Надо было сохранить файл, прежде чем закрывать программу.","examples":[{"en":"You [[should have told]] me earlier!","ru":"Надо было сказать мне раньше!"}]},{"label":"shouldn't have V3 — не надо было","text":"Сделали, а зря.","en":"We [[shouldn't have started]] so late.","ru":"Не надо было начинать так поздно."},{"label":"could have V3 — мог бы","text":"Была возможность, но её не использовали. Часто с упрёком или с облегчением: хорошо, что обошлось.","en":"We [[could have walked]] — it was only ten minutes away.","ru":"Мы могли бы дойти пешком — идти было всего десять минут.","examples":[{"en":"Be careful! You [[could have fallen]]!","ru":"Осторожно! Ты же мог упасть!"}]}],
"note":"ought to have V3 = should have V3, только официальнее: You [[ought to have asked]] first. Похожий смысл у I wish I had… — подробнее в главе про I wish."},{"type":"note","kind":"tip","title":"could have: догадка или упущенный шанс?","text":"Решает контекст. Не знаем, что было, — это догадка («возможно, сделал»). Знаем, что не сделал, — упущенная возможность («мог бы»). А couldn't have ещё значит «не смог бы»:","en":"I [[couldn't have done]] it without you.","ru":"Без тебя я бы не справился."},{"type":"compare","title":"needn't have done или didn't need to do?","left":{"title":"needn't have + V3","sub":"сделал, а оказалось — зря","points":["действие было","потом выяснилось, что оно не требовалось"],"examples":[{"en":"I [[needn't have taken]] an umbrella — it didn't rain.","ru":"Зря я брал зонт — дождя так и не было."}]},"right":{"title":"didn't need to + V","sub":"не было нужды","points":["просто не требовалось","обычно человек этого и не делал"],"examples":[{"en":"It was sunny, so I [[didn't need to take]] an umbrella.","ru":"Было солнечно, так что брать зонт было не нужно."}]},"note":"didn't have to = didn't need to. Проверка: действие было и оказалось лишним — needn't have done."},{"type":"points","title":"В технических текстах: пассив have been + V3","items":[{"label":"must have been V3 — по-видимому, было","en":"The cracks [[must have been caused]] by settlement of the foundation.","ru":"Трещины, по-видимому, вызваны осадкой фундамента."},{"label":"may / might have been V3 — возможно, было","en":"Some of the data [[may have been lost]] during the transfer.","ru":"Часть данных, возможно, потеряна при передаче."},{"label":"should have been V3 — надо было сделать","en":"The soil [[should have been tested]] before construction.","ru":"Грунт следовало исследовать до начала строительства."},{"label":"could have been V3 — можно было бы","en":"The accident [[could have been avoided]].","ru":"Аварии можно было избежать."}]},{"type":"mistakes","title":"Типичные ошибки","items":[{"wrong":"She ~~must forgot~~ about it.","right":"She [[must have forgotten]] about it.","why":"О прошлом: модальный + have + V3, а не модальный + V2."},{"wrong":"You should ~~have went~~ with us.","right":"You [[should have gone]] with us.","why":"После have — третья форма: gone, а не went."},{"wrong":"He ~~mustn't have seen~~ us.","right":"He [[can't have seen]] us.","why":"«Не может быть, чтобы…» — can't / couldn't have; mustn't значит запрет."},{"wrong":"I ~~had to check~~ the figures, but I didn't.","right":"I [[should have checked]] the figures.","why":"«Надо было, но не сделал» — should have. had to = «пришлось» (и сделал)."},{"wrong":"It was Sunday, so I ~~needn't have gone~~ to work. I stayed in bed.","right":"It was Sunday, so I [[didn't have to go]] to work. I stayed in bed.","why":"Не ходил вовсе — didn't have to / didn't need to. needn't have gone = сходил зря."}]},{"type":"quiz","items":[{"q":"The ground is wet. It ___ (must / rain) during the night.","a":"must have rained","why":"Уверенный вывод о прошлом — must have + V3.","alt":["must have been raining"]},{"q":"She ___ (can't / see) us — she had her back to us.","a":"can't have seen","alt":["cannot have seen","couldn't have seen"],"why":"«Не может быть, чтобы видела» — can't have + V3."},{"q":"I failed the test. I didn't do much work. I ___ harder.","options":["must have studied","should have studied","had to study"],"a":"should have studied","why":"Надо было, но не сделал — should have."},{"q":"Oleg isn't answering. He ___ (might / fall) asleep.","a":"might have fallen","why":"Возможно, это уже случилось — might have + V3."},{"q":"Why did you buy so much bread? You ___ it — we already had two loaves.","options":["needn't have bought","mustn't have bought","couldn't have bought"],"a":"needn't have bought","why":"Купил, а оказалось — зря: needn't have + V3."},{"q":"Ask Oleg where the keys are. He was the last to leave, so he ___ them.","options":["must have taken","can't have taken","needn't have taken"],"a":"must have taken","why":"Логичный вывод «наверняка взял» — must have."},{"q":"The cracks in the wall appeared last year. They ___ (must / cause) by settlement of the foundation.","a":"must have been caused","why":"Пассив о прошлом: must have been + V3."},{"q":"We ___ the match, but our goalkeeper made a silly mistake.","options":["could have won","must have won","can't have won"],"a":"could have won","why":"Была возможность, но не использовали — could have."}]},{"type":"summary","points":["Модальный + [[have]] + [[V3]] — о прошлом; have не меняется (не has, не had).","Догадка: [[must have]] (наверняка) → [[may / might / could have]] (возможно) → [[can't have]] (не может быть).","Оценка: [[should have]] — надо было; [[shouldn't have]] — не надо было; [[could have]] — мог бы.","[[needn't have]] V3 — сделал зря; [[didn't need to]] V — не было нужды.","Пассив: [[must have been]] V3, [[should have been]] V3."]}]},{"id":"requests-offers","title":"Requests, Offers, Suggestions","subtitle":"Просьбы, разрешение, предложения","level":"A2–B1","tagline":"Как вежливо попросить, спросить разрешения, предложить помощь или идею.","formula":"[[Could]] + you + V + ?","blocks":[{"type":"formula","title":"Попросить кого-то что-то сделать","rows":[{"sign":"?","formula":"[[Can / Could]] + you + V + ?","en":"[[Could]] you [[open]] the window, please?","ru":"Не могли бы вы открыть окно?"},{"sign":"?","formula":"[[Would]] + you + V + ?","en":"[[Would]] you [[help]] me with this box?","ru":"Не поможете мне с этой коробкой?"},{"sign":"?","formula":"[[Would you mind]] + [[V-ing]] + ?","en":"[[Would you mind closing]] the door?","ru":"Вас не затруднит закрыть дверь?"},{"sign":"?","formula":"[[Do you think you could]] + V + ?","en":"[[Do you think you could check]] my drawings?","ru":"Вы не могли бы проверить мои чертежи?"}],
